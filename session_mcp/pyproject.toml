[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session-mcp"
version = "0.1.0"
description = "FastMCP server and JSONL client for Session Viewer (backed by session-viewer-cli)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
session-mcp = "session_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/session_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
