name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            script: ./bash/minitest.sh
          - os: macos-15
            script: ./bash/minitest.sh
          - os: macos-15-intel
            script: ./bash/minitest.sh
          - os: windows-latest
            script: call bash\minitest.bat

    runs-on: ${{ matrix.os }}
    env:
      MINITEST_JOBS: "4"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ============ CACHING ============

    - name: Cache Rust Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          session_rust/target/
        key: rust-${{ matrix.os }}-${{ hashFiles('session_rust/Cargo.lock') }}
        restore-keys: rust-${{ matrix.os }}-

    # ============ SETUP ============

    - name: Install protoc (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install protoc (macOS)
      if: runner.os == 'macOS'
      run: brew install protobuf

    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      run: choco install protoc -y

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: session_tests/package-lock.json

    - name: Install npm dependencies (including Firebase)
      working-directory: session_tests
      run: npm ci || npm install

    # ============ RUN TESTS ============

    - name: Run mini tests (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        chmod +x bash/minitest.sh
        ./bash/minitest.sh

    - name: Run mini tests (Windows)
      if: runner.os == 'Windows'
      shell: cmd
      run: call bash\minitest.bat

    - name: Upload mini-test website as artifact
      uses: actions/upload-artifact@v4
      with:
        name: session-mini-tests-website-${{ matrix.os }}
        path: session_tests/dist

  deploy:
    needs: [minitest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download Ubuntu artifact
      uses: actions/download-artifact@v4
      with:
        name: session-mini-tests-website-ubuntu-22.04
        path: dist

    - name: Deploy mini-test website to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
