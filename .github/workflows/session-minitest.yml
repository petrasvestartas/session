name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    runs-on: ubuntu-latest
    env:
      MINITEST_JOBS: "4"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ============ CACHING (saves ~12+ minutes) ============
    
    # Cache C++ FetchContent dependencies (abseil + protobuf) - BIGGEST time saver
    - name: Cache C++ Dependencies (abseil + protobuf)
      uses: actions/cache@v4
      id: cache-cpp
      with:
        path: session_cpp/build/_deps
        key: cpp-deps-${{ runner.os }}-v2
        restore-keys: cpp-deps-${{ runner.os }}-

    # Cache Rust cargo
    - name: Cache Rust Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          session_rust/target/
        key: rust-${{ runner.os }}-${{ hashFiles('session_rust/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    # Cache Python pip
    - name: Cache Python pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: pip-${{ runner.os }}-${{ hashFiles('session_py/pyproject.toml') }}
        restore-keys: pip-${{ runner.os }}-

    # ============ SETUP ============

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies for RAG/embeddings
      run: |
        pip install sentence-transformers numpy

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: session_tests/package-lock.json

    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Install npm dependencies (including Firebase)
      working-directory: session_tests
      run: npm ci || npm install

    # ============ PRE-CONFIGURE C++ (FetchContent downloads deps) ============

    - name: Configure C++ (downloads deps if not cached)
      if: steps.cache-cpp.outputs.cache-hit != 'true'
      working-directory: session_cpp
      run: |
        echo "Cache miss - FetchContent will download abseil and protobuf..."
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_PROTOBUF=ON
        echo "C++ dependencies downloaded and will be cached."

    # ============ RUN TESTS ============

    - name: Run mini tests (Python + C++ + Rust)
      shell: bash
      run: |
        chmod +x minitest.sh
        ./minitest.sh

    - name: Upload mini-test website as artifact
      uses: actions/upload-artifact@v4
      with:
        name: session-mini-tests-website
        path: session_tests/dist

    - name: Deploy mini-test website to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./session_tests/dist
        publish_branch: gh-pages
        force_orphan: true
