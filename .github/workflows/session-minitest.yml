name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
        language: [py, rust, cpp]
        include:
          # One full integration run on Linux that produces the viewer dist
          # artifact and runs the proto freshness check.
          - os: ubuntu-22.04
            language: full

    runs-on: ${{ matrix.os }}
    name: minitest-${{ matrix.language }} (${{ matrix.os }})
    env:
      MINITEST_JOBS: "4"
      # mupdf-sys invokes `make libs` with no -j; without this the MuPDF C compile is
      # single-threaded on cold cargo cache. Runners have 4 cores. Ignored by msbuild.
      MAKEFLAGS: "--jobs=4"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    # ============ C++ BUILD TOOLS ============

    - name: Install C++ build tools (Ubuntu)
      if: runner.os == 'Linux' && matrix.language != 'py'
      # libclang is for mupdf-sys's bindgen (the Rust job builds --features pdf on every OS,
      # see SESSION_PDF below). macOS runners find libclang via the Xcode CLT and Windows via
      # the preinstalled C:\Program Files\LLVM, so only Ubuntu needs a package here.
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake libclang-dev

    # Prebuilt protoc — only needed on Linux for the 'Check committed proto
    # bindings are fresh' step. Generated code is platform-independent, so
    # all OSes read the committed artefacts without installing protoc.
    - name: Set up protoc (Linux — for freshness check)
      if: runner.os == 'Linux' && matrix.language == 'full'
      uses: arduino/setup-protoc@v3
      with:
        version: '33.6'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # ============ CACHING ============

    - name: Cache Rust Cargo
      if: matrix.language == 'rust' || matrix.language == 'full'
      # rust-cache instead of hand-rolled actions/cache: the old Cargo.lock-keyed entries were
      # first-writer-wins, and a 5 MB dud saved by an early partial run poisoned every later
      # run ("hit on primary key, not saving") - the intel job recompiled the world each push.
      # rust-cache prunes unused deps (much smaller entries) and re-saves on change.
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ matrix.os }}
        workspaces: |
          session_rust
          session_viewer

    # CMake configures into session_cpp/build and FetchContent builds protobuf there; uncached
    # this is 8-17 min per cpp job (the critical path). test_cpp.sh skips configure and does an
    # incremental build when build/ exists, so restoring it turns a cold build into a warm one.
    # Keyed on the sources, never on build/ itself.
    - name: Cache C++ build dir
      if: matrix.language == 'cpp' || matrix.language == 'full'
      uses: actions/cache@v5
      with:
        path: session_cpp/build/
        # runner.arch is part of the key because a build/ dir bakes ABSOLUTE toolchain paths into
        # CMakeCache.txt and the generated Makefiles. The `macos-15` label migrated from Intel to
        # Apple Silicon, so a cache made under the old image points make at Intel Homebrew's
        # /usr/local/bin/cmake, which does not exist on arm64:
        #     make: /usr/local/bin/cmake: No such file or directory
        #     make: *** [cmake_check_build_system] Error 1
        # The os label alone could not tell those two machines apart, and `restore-keys` then
        # cheerfully restored the wrong one.
        key: cpp-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('session_cpp/CMakeLists.txt', 'session_cpp/src/**', 'session_cpp/generated/**', 'session_cpp/main*.cpp', 'session_cpp/*.h', 'session_cpp/session_proto/**') }}
        restore-keys: cpp-${{ matrix.os }}-${{ runner.arch }}-

    # Belt and braces for the same class of failure: any restored build/ whose recorded cmake is
    # gone (a runner image moving its toolchain, not just the arch flip above) is discarded rather
    # than handed to make. Cheap - it only reads one line of CMakeCache.txt.
    - name: Discard a C++ build dir from a different toolchain
      if: (matrix.language == 'cpp' || matrix.language == 'full') && runner.os != 'Windows'
      shell: bash
      run: |
        cache="session_cpp/build/CMakeCache.txt"
        [ -f "$cache" ] || exit 0
        cm=$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$cache" | head -1)
        if [ -n "$cm" ] && [ ! -x "$cm" ]; then
          echo "cached build/ records cmake at '$cm', which is not executable here - discarding"
          rm -rf session_cpp/build
        else
          echo "cached build/ toolchain looks valid (cmake: ${cm:-none recorded})"
        fi

    # ============ SETUP ============

    - name: Set up Rust (Unix)
      if: runner.os != 'Windows' && (matrix.language == 'rust' || matrix.language == 'full')
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Set up Rust (Windows)
      if: runner.os == 'Windows' && (matrix.language == 'rust' || matrix.language == 'full')
      # dtolnay/rust-toolchain is ~30s; the previous choco install took 2.5-4.5 min.
      uses: dtolnay/rust-toolchain@stable

    # setup-python is for the py tests; the class-summary/consolidate scripts in the other
    # jobs fall back to the runner image's system python3, which is enough for stdlib json work.
    - name: Set up Python
      if: matrix.language == 'py' || matrix.language == 'full'
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: session_tests/package-lock.json

    - name: Install npm dependencies
      working-directory: session_tests
      run: npm ci || npm install

    # ============ RUN TESTS ============

    - name: Run mini tests
      shell: bash
      env:
        MSYS_NO_PATHCONV: 1
        # Build session_rust --features pdf on every OS. mupdf-sys compiles MuPDF's C sources
        # with make (macOS arm/intel) or MSBuild+VS toolset (Windows x64), and bindgen finds
        # libclang on the stock runners (Xcode CLT on macOS, LLVM on Windows). Upstream
        # mupdf-rs CI tests exactly these runner families with no extra installs.
        SESSION_PDF: "1"
      run: |
        chmod +x bash/*.sh bash/lib/*.sh
        case "${{ matrix.language }}" in
          py)   ./bash/minitest.sh --py   --no-web ;;
          rust) ./bash/minitest.sh --rust --no-web ;;
          cpp)  ./bash/minitest.sh --cpp  --no-web ;;
          full) ./bash/minitest.sh ;;
          *)    echo "unknown language: ${{ matrix.language }}" >&2; exit 1 ;;
        esac

    # Fails if anyone edited a .proto file without committing the refreshed
    # Python/C++/Rust generated output. Runs only on the full Linux job
    # (generated output is platform-independent, one OS check suffices).
    - name: Check committed proto bindings are fresh
      if: matrix.language == 'full'
      shell: bash
      run: ./bash/gen_proto.sh --check

    - name: Verify dist exists
      if: matrix.language == 'full'
      shell: bash
      run: |
        if [ ! -d "session_tests/dist" ]; then
          echo "ERROR: session_tests/dist directory not found!"
          exit 1
        fi
        ls -la session_tests/dist

    - name: Upload mini-test website as artifact
      if: matrix.language == 'full'
      uses: actions/upload-artifact@v6
      with:
        name: session-mini-tests-website-${{ matrix.os }}
        path: session_tests/dist
        if-no-files-found: error

  api-check:
    needs: [minitest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'

    - name: Check Python API for breaking changes
      run: |
        pip install griffe
        latest=$(pip index versions session-py 2>/dev/null | grep -oP '[\d.]+' | head -1 || echo "")
        if [ -n "$latest" ]; then
          pip install "session-py==$latest" --target /tmp/session_py_baseline
          griffe check session_py \
            --against /tmp/session_py_baseline \
            --search session_py/src || true
        else
          echo "No published version found, skipping API diff"
        fi

  deploy:
    needs: [minitest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
    - name: Download Ubuntu artifact
      uses: actions/download-artifact@v8
      with:
        name: session-mini-tests-website-ubuntu-22.04
        path: dist

    - name: Deploy mini-test website to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true
