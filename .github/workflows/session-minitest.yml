name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-latest]
        language: [py, rust, cpp]
        include:
          # One full integration run on Linux that produces the viewer dist
          # artifact and runs the proto freshness check.
          - os: ubuntu-22.04
            language: full

    runs-on: ${{ matrix.os }}
    name: minitest-${{ matrix.language }} (${{ matrix.os }})
    env:
      MINITEST_JOBS: "4"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    # ============ C++ BUILD TOOLS ============

    - name: Install C++ build tools (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y build-essential cmake

    # Prebuilt protoc — only needed on Linux for the 'Check committed proto
    # bindings are fresh' step. Generated code is platform-independent, so
    # all OSes read the committed artefacts without installing protoc.
    - name: Set up protoc (Linux — for freshness check)
      if: runner.os == 'Linux'
      uses: arduino/setup-protoc@v3
      with:
        version: '33.6'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    # ============ CACHING ============

    - name: Cache Rust Cargo
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          session_rust/target/
          session_viewer/target/
        key: rust-${{ matrix.os }}-${{ hashFiles('session_rust/Cargo.lock') }}
        restore-keys: rust-${{ matrix.os }}-

    # ============ SETUP ============

    - name: Set up Rust (Unix)
      if: runner.os != 'Windows'
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Set up Rust (Windows)
      if: runner.os == 'Windows'
      run: |
        choco install rustup.install -y
        rustup default stable
        echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: session_tests/package-lock.json

    - name: Install npm dependencies
      working-directory: session_tests
      run: npm ci || npm install

    # ============ VIEWER (wasm) ============
    # Compile the viewer fresh (release) and copy it into session_tests/public/viewer so the site
    # build below embeds the latest. Only the 'full' job builds the deployable site, so guard to it.
    - name: Install trunk + wasm target (full job)
      if: matrix.language == 'full'
      shell: bash
      run: |
        rustup target add wasm32-unknown-unknown
        curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
          | tar -xzf - -C "$HOME/.cargo/bin"
        trunk --version

    - name: Build viewer (wasm, release) into the docs site
      if: matrix.language == 'full'
      shell: bash
      run: bash ./bash/build_viewer.sh

    # ============ RUN TESTS ============

    - name: Run mini tests
      shell: bash
      env:
        MSYS_NO_PATHCONV: 1
      run: |
        chmod +x bash/*.sh bash/lib/*.sh
        case "${{ matrix.language }}" in
          py)   ./bash/minitest.sh --py   --no-web ;;
          rust) ./bash/minitest.sh --rust --no-web ;;
          cpp)  ./bash/minitest.sh --cpp  --no-web ;;
          full) ./bash/minitest.sh ;;
          *)    echo "unknown language: ${{ matrix.language }}" >&2; exit 1 ;;
        esac

    # Fails if anyone edited a .proto file without committing the refreshed
    # Python/C++/Rust generated output. Runs only on the full Linux job
    # (generated output is platform-independent, one OS check suffices).
    - name: Check committed proto bindings are fresh
      if: matrix.language == 'full'
      shell: bash
      run: ./bash/gen_proto.sh --check

    - name: Verify dist exists
      if: matrix.language == 'full'
      shell: bash
      run: |
        if [ ! -d "session_tests/dist" ]; then
          echo "ERROR: session_tests/dist directory not found!"
          exit 1
        fi
        ls -la session_tests/dist

    - name: Upload mini-test website as artifact
      if: matrix.language == 'full'
      uses: actions/upload-artifact@v6
      with:
        name: session-mini-tests-website-${{ matrix.os }}
        path: session_tests/dist
        if-no-files-found: error

  api-check:
    needs: [minitest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Check Python API for breaking changes
      run: |
        pip install griffe
        latest=$(pip index versions session-py 2>/dev/null | grep -oP '[\d.]+' | head -1 || echo "")
        if [ -n "$latest" ]; then
          pip install "session-py==$latest" --target /tmp/session_py_baseline
          griffe check session_py \
            --against /tmp/session_py_baseline \
            --search session_py/src || true
        else
          echo "No published version found, skipping API diff"
        fi

  deploy:
    needs: [minitest]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
    - name: Download Ubuntu artifact
      uses: actions/download-artifact@v8
      with:
        name: session-mini-tests-website-ubuntu-22.04
        path: dist

    - name: Deploy mini-test website to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        publish_branch: gh-pages
        force_orphan: true

  dispatch:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Trigger downstream CI
      env:
        GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
      run: |
        version=$(pip index versions session-py 2>/dev/null | grep -oP '[\d.]+' | head -1 || echo "unknown")
        python - "$version" <<'EOF'
        import json, subprocess, sys
        version = sys.argv[1]
        deps = json.load(open("dependents.json"))["repos"]
        for d in deps:
            result = subprocess.run([
                "gh", "api",
                f"repos/{d['owner']}/{d['repo']}/dispatches",
                "-f", "event_type=session-py-updated",
                "-f", f"client_payload[version]={version}"
            ], capture_output=True, text=True)
            if result.returncode != 0:
                print(f"Warning: failed to dispatch to {d['repo']}: {result.stderr}")
        EOF
