name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    runs-on: ubuntu-latest
    env:
      MINITEST_JOBS: "4"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # ============ CACHING ============

    # Cache Rust cargo
    - name: Cache Rust Cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          session_rust/target/
        key: rust-${{ runner.os }}-${{ hashFiles('session_rust/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    # ============ SETUP ============

    - name: Install protobuf compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: session_tests/package-lock.json

    - name: Install npm dependencies (including Firebase)
      working-directory: session_tests
      run: npm ci || npm install

    # ============ RUN TESTS ============

    - name: Run mini tests (Python + C++ + Rust)
      shell: bash
      run: |
        chmod +x bash/minitest.sh
        ./bash/minitest.sh

    - name: Upload mini-test website as artifact
      uses: actions/upload-artifact@v4
      with:
        name: session-mini-tests-website
        path: session_tests/dist

    - name: Deploy mini-test website to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./session_tests/dist
        publish_branch: gh-pages
        force_orphan: true
