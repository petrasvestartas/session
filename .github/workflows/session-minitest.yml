name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  minitest:
    runs-on: ubuntu-latest
    env:
      MINITEST_JOBS: "2"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Protobuf Compiler
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    - name: Run mini tests (C++ + Rust, optional Python)
      shell: bash
      run: |
        chmod +x minitest.sh
        ./minitest.sh

    - name: Upload mini-test website as artifact
      uses: actions/upload-artifact@v4
      with:
        name: session-mini-tests-website
        path: session_tests/dist

    - name: Deploy mini-test website to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./session_tests/dist
        publish_branch: gh-pages
        force_orphan: true
