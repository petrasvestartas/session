name: Session mini tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  minitest:
    runs-on: ubuntu-latest
    env:
      MINITEST_JOBS: "2"

    steps:
    - name: Checkout repo with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Run mini tests (C++ + Rust, optional Python)
      shell: bash
      run: |
        chmod +x session_tests/minitest.sh
        ./session_tests/minitest.sh

    - name: Upload mini-test website as artifact
      uses: actions/upload-artifact@v4
      with:
        name: session-mini-tests-website
        path: session_tests/website
