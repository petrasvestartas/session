# Weekly kernel audit + fix: every Thursday a randomly chosen geometry-kernel data structure
# gets a cross-language review (session_cpp / session_py / session_rust) covering performance,
# memory, tests, readability, minimal verbosity, and 3-language alignment — and the safe,
# test-verifiable findings get FIXED, not just filed. Fixes land as PRs on the submodule repos
# when the KERNEL_AUDIT_PUSH_TOKEN secret exists (a fine-grained PAT with contents+pull-requests
# write on session_cpp/py/rust); without it, verified patches are attached to the report issue.
# Manual runs: Actions → kernel-audit → Run workflow (optionally naming a class).
name: kernel-audit

on:
  schedule:
    # Thursday 14:01 Europe/Zurich summer time (12:01 UTC). GitHub cron is UTC-only, so in
    # winter (CET) this fires at 13:01 local — accepted drift, same as every UTC cron.
    - cron: '1 12 * * 4'
  workflow_dispatch:
    inputs:
      class:
        description: 'Class to audit (empty = random pick)'
        required: false
        default: ''

permissions:
  contents: write        # parent-repo pointer bump PR after submodule merges
  pull-requests: write
  issues: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout kernel submodules
        run: git submodule update --init --depth 50 session_cpp session_py session_rust

      - name: Configure git identity and push credentials
        env:
          PUSH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN }}
        run: |
          git config --global user.name "petrasvestartas"
          git config --global user.email "petrasvestartas@gmail.com"
          if [ -n "$PUSH_TOKEN" ]; then
            git config --global url."https://x-access-token:${PUSH_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "CAN_PUSH=1" >> "$GITHUB_ENV"
          else
            echo "CAN_PUSH=0" >> "$GITHUB_ENV"
          fi

      - name: Pick the class
        id: pick
        run: |
          # Candidates = Rust kernel modules that exist in ALL THREE languages, minus
          # infrastructure files.
          CANDIDATES=""
          for f in session_rust/src/*.rs; do
            c=$(basename "$f" .rs)
            case "$c" in
              *_test|lib|main|mini_test|mc_tritable|guid_serde|tolerance) continue ;;
            esac
            if [ -f "session_cpp/src/$c.cpp" ] && [ -f "session_py/src/session_py/$c.py" ]; then
              CANDIDATES="$CANDIDATES $c"
            fi
          done
          set -- $CANDIDATES
          echo "pool ($#):$CANDIDATES"
          PICK="${{ github.event.inputs.class }}"
          if [ -z "$PICK" ]; then
            IDX=$(( (GITHUB_RUN_ID + $(date +%s)) % $# + 1 ))
            eval "PICK=\${$IDX}"
          fi
          echo "picked: $PICK"
          echo "class=$PICK" >> "$GITHUB_OUTPUT"

      - name: Ensure the audit label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create kernel-audit --color 5319e7 --description "Weekly cross-language kernel audit" --force -R "$GITHUB_REPOSITORY"

      - name: Audit and fix
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-fable-5 --allowed-tools "Bash(git:*),Bash(gh pr:*),Bash(gh issue create:*),Bash(gh label:*),Bash(cargo:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(cmake:*),Bash(make:*),Bash(./bash/minitest.sh:*),Bash(bash bash/minitest.sh:*),Bash(chmod:*),Bash(wc:*),Bash(ls:*),Bash(diff:*),Bash(sleep:*)"'
          prompt: |
            You are the weekly kernel auditor AND fixer for this multi-language geometry
            kernel (C++ is ground truth; Python and Rust are ports that must mirror it — see
            CLAUDE.md: identical APIs, variable names, test logic and line counts across
            languages; least verbose style; NEVER add Claude/AI as a git author or co-author).

            Today's class: **${{ steps.pick.outputs.class }}**

            Its six files:
            - session_cpp/src/${{ steps.pick.outputs.class }}.h and .cpp (+ ${{ steps.pick.outputs.class }}_test.cpp)
            - session_py/src/session_py/${{ steps.pick.outputs.class }}.py (+ ${{ steps.pick.outputs.class }}_test.py)
            - session_rust/src/${{ steps.pick.outputs.class }}.rs (+ ${{ steps.pick.outputs.class }}_test.rs)

            PHASE 1 — AUDIT. Read all six files completely, then audit these dimensions:
            1. PERFORMANCE — complexity of hot methods, avoidable allocations/clones in
               loops, missed early-outs. Cite file:line for every claim.
            2. MEMORY — struct layout, redundant cached state, String/Vec bloat, clone-happy
               APIs.
            3. TESTS — untested public methods, cross-language test parity, missing edge
               cases (degenerate inputs, tolerance boundaries).
            4. READABILITY — naming, function length, comments that state constraints rather
               than narrate code.
            5. MINIMAL VERBOSITY — dead code, redundant branches, logic that should be one
               helper.
            6. ALIGNMENT — public API deltas, behavioral drift, naming drift across the
               three languages, as a table. The most valuable section.
            Rank findings by impact. A clean dimension gets one line, no padding.

            PHASE 2 — FIX. From the ranked findings, implement the ones that are SAFE and
            TEST-VERIFIABLE: real bugs, quadratic algorithms with linear equivalents,
            behavioral drift between languages (align Python/Rust to the C++ ground truth
            unless C++ itself is the bug — then fix all three), and missing edge-case tests
            for what you fixed. Keep three-language parity: a shared defect is fixed in all
            three, identically. Skip anything subjective, risky, or API-breaking — leave
            those in the report as recommendations.

            VERIFY: run the affected languages' suites — `./bash/minitest.sh --rust --no-web`,
            `--py --no-web`, `--cpp --no-web` (chmod +x bash scripts first if needed). Every
            suite you touched must end green. REVERT any fix whose tests you cannot make
            pass; a reverted fix goes back into the report as a recommendation with what you
            learned.

            PHASE 3 — DELIVER. Commit discipline throughout Phase 2: ONE commit per
            logical adjustment per repo (plain descriptive messages; repo rule: no AI
            co-author line). The environment variable CAN_PUSH tells you which mode:
            - CAN_PUSH=1: deliver EACH adjustment as its own PR, and MERGE IT YOURSELF once
              its tests pass. Sequentially, per adjustment, per changed submodule repo
              (session_cpp / session_py / session_rust — authenticated checkouts):
                1. branch `kernel-audit/${{ steps.pick.outputs.class }}-${{ github.run_id }}-<n>-<slug>`
                   from origin/main carrying only that adjustment's commit;
                2. push it and `gh pr create -R petrasvestartas/<submodule>` — body: what
                   changed, why, and the minitest evidence from Phase 2;
                3. `gh pr review --approve -R ...` (tolerate failure — GitHub rejects
                   self-approval when the PR author is the same identity; the merge below is
                   the approval that counts, backed by the green suites);
                4. wait for the repo's own CI with `gh pr checks <num> -R ... --watch`
                   (skip the wait if the repo has no checks), then
                   `gh pr merge <num> -R ... --squash --delete-branch`. Merge ONLY on green
                   checks; a red PR stays open and is reported in the issue instead.
                   AFTER the merge, also watch the workflows the push to main triggers
                   (`gh run list -R ... --branch main` + `gh run watch`) — some jobs run
                   only on main (session_py's publish job tests Python 3.10 there and
                   nowhere else). If a post-merge main workflow goes red from your merge,
                   fix forward with another PR in the same run if the cause is clear,
                   otherwise open a revert PR, merge it, and report loudly in the issue.
                   ALL sub-repo workflows must end green.
                5. before the next adjustment's branch, refresh local main
                   (`git fetch origin && git rebase origin/main` or re-branch) so PRs stack
                   cleanly.
              NEVER push to main directly. After ALL submodule merges: in the parent repo,
              branch `kernel-audit/${{ steps.pick.outputs.class }}-${{ github.run_id }}-pointers`,
              update the merged submodules' pointers to the new origin/main SHAs, push,
              open the parent PR, approve-or-tolerate, and merge it the same way.
            - CAN_PUSH=0: run `git diff` in each changed submodule and embed each diff in
              the issue body as a fenced ```diff block titled by repo, ready for `git apply`.
              Note in the issue that adding the KERNEL_AUDIT_PUSH_TOKEN secret upgrades
              these to automatic per-adjustment PRs merged on green.

            Finally create EXACTLY ONE GitHub issue — never split across several issues.
            Budget the body under ~55k characters; keep every file:line citation, trim prose
            first. Create with:
            gh issue create -R ${{ github.repository }} --label kernel-audit
            --title "Kernel audit: ${{ steps.pick.outputs.class }} (${{ github.run_id }})"
            --body-file <report file>
            Body: one-paragraph executive summary; the six audit sections; WHAT WAS FIXED —
            one line per adjustment with its merged PR links (or diffs in CAN_PUSH=0 mode)
            and the test evidence; any PR left unmerged (red checks) flagged loudly at the
            top; remaining recommendations ranked.
