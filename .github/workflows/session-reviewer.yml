# Weekly session review: every Monday one randomly picked geometry-kernel class is run through
# the session-reviewer agent (wood_research/.claude/agents/session-reviewer.md, fetched at run
# time): parity, identical tests and house style across session_cpp / session_py / session_rust,
# fixed and verified green. Fixes land as ONE review-ready PR per submodule repo when the
# KERNEL_AUDIT_PUSH_TOKEN secret exists; without it, verified patches are attached to the
# report issue. Each PR is merged by the run once all its checks are green; a red PR stays
# open. The owner bumps the parent submodule pointers.
# Manual runs: Actions → session-reviewer → Run workflow (optionally naming a class).
name: session-reviewer

on:
  schedule:
    # Monday 05:00 Europe/Zurich summer time (03:00 UTC). GitHub cron is UTC-only, so in
    # winter (CET) this fires at 04:00 local — accepted drift, same as every UTC cron.
    - cron: '0 3 * * 1'
    # Backup fire 2h later: GitHub silently drops scheduled events under load (it dropped the
    # 2026-08-27 fire); the dedup job below skips it whenever a run already started today.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      class:
        description: 'Class to review (empty = random pick)'
        required: false
        default: ''

permissions:
  actions: read          # dedup job lists this workflow's runs
  contents: write        # parent-repo pointer bump PR after submodule merges
  pull-requests: write
  issues: write
  id-token: write

jobs:
  dedup:
    # Scheduled fires only: skip when another session-reviewer run (scheduled or manual)
    # already started today, so the 05:00 backup — or a late-delivered 03:00 — never
    # double-reviews.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check for an earlier run today
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROCEED=1
          if [ "${{ github.event_name }}" = "schedule" ]; then
            TODAY=$(date -u +%Y-%m-%d)
            N=$(gh run list -R "$GITHUB_REPOSITORY" --workflow=session-reviewer \
                  --created "$TODAY" --json databaseId \
                  --jq "map(select(.databaseId != ${{ github.run_id }})) | length")
            echo "other session-reviewer runs today: $N"
            if [ "$N" -gt 0 ]; then PROCEED=0; fi
          fi
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"

  review:
    needs: dedup
    if: needs.dedup.outputs.proceed == '1'
    runs-on: ubuntu-latest
    # Deep-review budget: most of GitHub's 6h hosted-runner job cap. The prompt tells the
    # model it has hours; an early finish means the class is clean, not that time ran out.
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout kernel submodules
        run: git submodule update --init --depth 50 session_cpp session_py session_rust

      - name: Configure git identity and push credentials
        env:
          PUSH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN }}
        run: |
          git config --global user.name "petrasvestartas"
          git config --global user.email "petrasvestartas@gmail.com"
          if [ -n "$PUSH_TOKEN" ]; then
            git config --global url."https://x-access-token:${PUSH_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "CAN_PUSH=1" >> "$GITHUB_ENV"
          else
            echo "CAN_PUSH=0" >> "$GITHUB_ENV"
          fi

      - name: Pick the class
        id: pick
        run: |
          # Candidates = Rust kernel modules that exist in ALL THREE languages, minus
          # infrastructure files.
          CANDIDATES=""
          for f in session_rust/src/*.rs; do
            c=$(basename "$f" .rs)
            case "$c" in
              *_test|lib|main|mini_test|mc_tritable|guid_serde|tolerance) continue ;;
            esac
            if [ -f "session_cpp/src/$c.cpp" ] && [ -f "session_py/src/session_py/$c.py" ]; then
              CANDIDATES="$CANDIDATES $c"
            fi
          done
          set -- $CANDIDATES
          echo "pool ($#):$CANDIDATES"
          PICK="${{ github.event.inputs.class }}"
          if [ -z "$PICK" ]; then
            # Weekly cadence: one random class from the pool, seeded by the run id.
            IDX=$(( GITHUB_RUN_ID % $# + 1 ))
            eval "PICK=\${$IDX}"
          fi
          echo "picked: $PICK"
          echo "class=$PICK" >> "$GITHUB_OUTPUT"

      - name: Install the session-reviewer agent
        env:
          GH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN || github.token }}
        run: |
          # The agent is maintained in wood_research/.claude/agents (public); this repo runs it.
          mkdir -p .claude/agents .claude/skills
          curl -fsSL https://raw.githubusercontent.com/petrasvestartas/wood_research/main/.claude/agents/session-reviewer.md \
            -o .claude/agents/session-reviewer.md
          # Its house-style skills live in the private petrasvestartas/skills repo; load them when the
          # token can read it, otherwise the agent runs on its own text.
          for s in session-format session-comments; do
            mkdir -p ".claude/skills/$s"
            gh api "repos/petrasvestartas/skills/contents/$s/SKILL.md" -H "Accept: application/vnd.github.raw" \
              > ".claude/skills/$s/SKILL.md" 2>/dev/null || { rm -rf ".claude/skills/$s"; echo "skill $s not readable"; }
          done
          head -5 .claude/agents/session-reviewer.md

      - name: Ensure the review label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create session-reviewer --color 5319e7 --description "Weekly cross-language kernel review" --force -R "$GITHUB_REPOSITORY"

      - name: Review and fix
        uses: anthropics/claude-code-action@v1
        env:
          # gh CLI must act cross-repo (PRs/merges on session_cpp/py/rust, issue on parent),
          # which github.token cannot — use the PAT when it exists, else fall back.
          GH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN || github.token }}
          PUSH_TOKEN: ${{ secrets.KERNEL_AUDIT_PUSH_TOKEN }}
          # Long-run headroom: full minitest suites and `gh pr checks --watch` block for a
          # while (default bash cap is 10 min), and deep audits read long tool output.
          BASH_DEFAULT_TIMEOUT_MS: "600000"
          BASH_MAX_TIMEOUT_MS: "1800000"
          BASH_MAX_OUTPUT_LENGTH: "150000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-opus-5 --fallback-model claude-opus-4-8 --effort max --allowed-tools "Task,Agent,Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(gh run:*),Bash(gh issue create:*),Bash(gh label:*),Bash(cargo:*),Bash(python3:*),Bash(pip:*),Bash(pip3:*),Bash(cmake:*),Bash(make:*),Bash(./bash/minitest.sh:*),Bash(bash bash/minitest.sh:*),Bash(./bash/quicktest.sh:*),Bash(bash bash/quicktest.sh:*),Bash(chmod:*),Bash(wc:*),Bash(ls:*),Bash(diff:*),Bash(sleep:*)"'
          prompt: |
            ultrathink

            You are the weekly session reviewer for this multi-language geometry kernel.
            NEVER add Claude/AI as a git author or co-author.

            This week's class: **${{ steps.pick.outputs.class }}**

            PHASE 1+2 — REVIEW AND FIX. Hand the class to the `session-reviewer` subagent
            (.claude/agents/session-reviewer.md) with exactly this task:
            `fix ${{ steps.pick.outputs.class }}`
            That agent defines the review: cross-language parity (C++ is ground truth),
            identical test sets, and the house style, for this one class in all three kernels,
            ending with its quicktest green in cpp, py and rust. Tell it these CI facts:
            - The checkout is `session/` itself: drop the `session/` prefix from its paths.
            - Its machine-local build limits (flock, systemd-run, MemoryMax, ~/.cache,
              MINITEST_JOBS) do not exist here; run `./bash/quicktest.sh <class> --cpp|--py|--rust`
              and `./bash/minitest.sh --<lang> --no-web` (chmod +x bash/*.sh first).
            - Never edit session_viewer, wood or any other project; never delete code under a
              `// WOOD:` banner; wood classes never belong in the kernel.
            Wait for its report. If it left a suite red, revert that change and list it as a
            recommendation. Every suite you touched must end green before delivery.

            WRITING RULES (apply to every PR title, PR body, commit message and the
            report issue). The audit is read by a human in a PR list, so keep it scannable:
            - PR title: `<class>: <what changed>`, <= 60 characters, no suffix or tag.
            - PR body: EXACTLY these three lines, nothing else — no headings, no bullet
              lists, no "Why" section, no cross-repo narration:
                **What:** <the defect or gap, one sentence>
                **Fix:** <what you changed, one sentence, with the `file:line` you touched>
                **Tests:** `<minitest command>` <N/N> (<class> <n/n>)
              Hard cap 600 characters. A parity PR in another repo is referenced by one
              trailing `(parity: <repo>#<n>)` inside the Fix line, never a paragraph.
            - Never restate what the diff already shows, never explain the algorithm, never
              quote code in a PR body. One sentence per line means one sentence.
            - No emoji anywhere. No praise, no summary of your own process.

            PHASE 3 — DELIVER. Commit discipline throughout Phase 2: ONE commit per
            logical adjustment per repo (plain descriptive messages; repo rule: no AI
            co-author line). The environment variable CAN_PUSH tells you which mode:
            - CAN_PUSH=1: open ONE pull request per changed submodule repo — never more —
              carrying every adjustment you made to that repo as separate commits, and merge
              it yourself once every one of its checks is green. Per changed repo
              (session_cpp / session_py / session_rust — authenticated checkouts):
                1. branch `session-reviewer/${{ steps.pick.outputs.class }}-${{ github.run_id }}`
                   from origin/main carrying that repo's audit commits;
                2. push it and `gh pr create -R petrasvestartas/<submodule>` with a title
                   and body in the three-line form above (`--body-file`, never a heredoc
                   that grows extra sections). A PR touching several adjustments gets one
                   `**Fix:**` line per adjustment and keeps the 600-character cap;
                3. wait for that repo's CI with `gh pr checks <num> -R ... --watch` (skip the
                   wait if the repo has no checks) and record the outcome for the report;
                4. if EVERY check passed, merge it: `gh pr merge <num> -R petrasvestartas/<submodule>
                   --rebase --delete-branch` (rebase keeps one commit per adjustment on main).
                   Then watch the main-branch runs that the merge triggered (`gh run list`,
                   `gh run watch --exit-status`) and record them.
              Merge only green PRs. A red or pending PR stays OPEN: say so in the report.
              Never `gh pr review --approve`, never push to main directly, never force-push,
              and never open a parent-repo pointer-bump PR: the owner bumps the parent
              submodule pointers.
            - CAN_PUSH=0: run `git diff` in each changed submodule and embed each diff in
              the issue body as a fenced ```diff block titled by repo, ready for `git apply`.
              Note in the issue that adding the KERNEL_AUDIT_PUSH_TOKEN secret upgrades
              these to one review-ready PR per repo.

            Finally create EXACTLY ONE GitHub issue — never split across several issues.
            Create with:
            gh issue create -R ${{ github.repository }} --label session-reviewer
            --title "Session review: ${{ steps.pick.outputs.class }} (${{ github.run_id }})"
            --body-file <report file>
            The body is a short report, hard cap 6000 characters, in exactly this order:
            - a `RED: <what is broken>` line FIRST if any PR's checks are red; omit the
              line entirely when every PR is green.
            - one line: `Proposed: <n> | Recommendations: <n> | Suites: cpp <N/N>, py <N/N>, rust <N/N>`
            - `## Proposed` — one line per adjustment: `- <one sentence> — <repo>#<n>`,
              then a final line `Merged: <repo>#<n>, ... | Open (red): <repo>#<n>, ...`
              followed by `then bump the parent submodule pointers.`
              In CAN_PUSH=0 mode this section instead carries one ```diff block per repo.
            - `## Recommendations` — what the agent left, ranked, one line each, with `file:line`.
            - `## Report` — the session-reviewer agent's report (parity / safety / tests /
              style / ran / left), `file:line` for every claim.
            Citations survive the cap; prose does not. If it does not fit, cut sentences,
            never findings.
