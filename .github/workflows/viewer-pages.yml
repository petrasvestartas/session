# The one GitHub Pages deploy: the session_viewer wasm app at https://petrasvestartas.github.io/session/
# and the docs site (session_tests: course, Kernel API, install) at /session/docs/.
# The viewer dist is fully relative (Trunk.toml public_url = "./"), so it serves from /session/ as is.
name: viewer-pages

on:
  push:
    branches: [main]
    paths:
      - 'session_viewer/**'
      - 'session_tests/**'
      - '.github/workflows/viewer-pages.yml'
  # Fresh kernel test results reach the Kernel API page without a docs push.
  workflow_run:
    workflows: ["Session mini tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

# One Pages deploy at a time; a queued deploy waits rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # `needs:` only reaches jobs in this file, so viewer-check runs here as a
  # reusable workflow: a compartment that does not compile or does not pass
  # `cargo xtest` never reaches the deploy.
  check:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    uses: ./.github/workflows/viewer-check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # session_rust is the viewer's build dependency, session_proto holds the one schema
      # lesson 19 includes, session_cpp gives the docs site its kernel class list and
      # descriptions; the other submodules are dead weight for this job.
      - name: Checkout the submodules the site needs
        run: git submodule update --init --depth 1 session_rust session_proto session_cpp
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install trunk
        run: curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C "$HOME/.cargo/bin"
      # The docs site replaces dist/docs below, so Trunk's MkDocs hook (docs/build_site.sh) is
      # skipped: a stamp newer than every source makes it a no-op.
      - name: Skip the MkDocs course build
        run: mkdir -p session_viewer/target/docs/site && touch session_viewer/target/docs/site/index.html
      # `assets/pb` is the LOCAL scene's geometry - untracked, and deliberately not deployed:
      # the published page reads its scene from R2, never from here. index.html still copies the
      # directory, so it has to exist; empty is exactly right.
      # The published page alone gets whole-program LTO in one codegen unit; local builds keep the
      # quick release profile.
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_LTO: fat
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: cd session_viewer && mkdir -p assets/pb && trunk build --release
      # binaryen rewrites the hashed wasm in place, which is safe because Trunk.toml sets no_sri.
      - name: Optimize the wasm
        run: |
          curl -sSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz
          echo "e959f2170af4c20c552e9de3a0253704d6a9d2766e8fdb88e4d6ac4bae9388fe  $RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          for f in session_viewer/dist/*_bg.wasm; do
            "$RUNNER_TEMP/binaryen-version_123/bin/wasm-opt" -O3 --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-mutable-globals "$f" -o "$f"
          done
      # Scene data is NOT deployed with the site. The page reads it from the session-viewer-data
      # bucket on Cloudflare R2 (session_viewer/src/app/live.rs), so publishing geometry is an
      # upload to that bucket and nothing here has to run.
      # THE SHORT URLS NEED THIS. `/session/view_lines` is one page routing on its path, but
      # Pages only serves a file that exists - and for one that does not it serves 404.html.
      # Making that a copy of the built index.html is what turns a 404 into the viewer.
      - name: Serve any path with the app (short scene URLs)
        run: cp session_viewer/dist/index.html session_viewer/dist/404.html
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: session_tests/package-lock.json
      # The Kernel API page reads testData.js, the kernel test results the newest successful
      # "Session mini tests" run on main uploaded. Before the first such run it gets an empty
      # data set and shows an empty state instead of failing the deploy.
      - name: Fetch the newest kernel test results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=session_tests/public/testData.js
          mkdir -p session_tests/public
          run=""
          for id in $(gh run list -R "$GITHUB_REPOSITORY" --workflow session-minitest.yml --branch main --event push --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?name=kernel-test-results" --jq '[.artifacts[] | select(.expired | not)] | length')
            if [ "$n" -gt 0 ]; then
              run=$id
              break
            fi
          done
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n kernel-test-results -D "$RUNNER_TEMP/results"
            cp "$RUNNER_TEMP/results/public/testData.js" "$out"
            echo "kernel test results from run $run"
          else
            echo 'window.TEST_DATA = {};' > "$out"
            echo "::notice::No kernel test results on main yet; the Kernel API page shows an empty state."
          fi
      # Base /session/docs/ (vite.config.ts); it replaces the MkDocs copy Trunk made at dist/docs.
      - name: Build the docs site
        run: |
          cd session_tests
          npm ci
          npm run build
          cd ..
          rm -rf session_viewer/dist/docs
          cp -r session_tests/dist session_viewer/dist/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: session_viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
