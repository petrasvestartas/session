# Build the session_viewer wasm app with trunk and publish it as the repo's GitHub Pages site.
# The dist is fully relative (Trunk.toml public_url = "./"), so it serves cleanly from
# https://petrasvestartas.github.io/session/ without any path rewriting.
name: viewer-pages

on:
  push:
    branches: [main]
    paths:
      - 'session_viewer/**'
      - '.github/workflows/viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; a queued deploy waits rather than being cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # `needs:` only reaches jobs in this file, so viewer-check runs here as a
  # reusable workflow: a compartment that does not compile or does not pass
  # `cargo xtest` never reaches the deploy.
  check:
    uses: ./.github/workflows/viewer-check.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only session_rust is a build dependency of the viewer; the other submodules
      # (C++/Python kernels, data) are dead weight for this job.
      - name: Checkout session_rust submodule
        run: git submodule update --init --depth 1 session_rust
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install trunk
        run: curl -sL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xzf- -C "$HOME/.cargo/bin"
      # `assets/pb` is the LOCAL scene's geometry - untracked, and deliberately not deployed:
      # the published page reads its scene from R2, never from here. index.html still copies the
      # directory, so it has to exist; empty is exactly right.
      - name: Build
        run: cd session_viewer && mkdir -p assets/pb && trunk build --release
      # Scene data is NOT deployed with the site. The page reads it from the session-viewer-data
      # bucket on Cloudflare R2 (session_viewer/src/app/live.rs), so publishing geometry is an
      # upload to that bucket and nothing here has to run.
      # THE SHORT URLS NEED THIS. `/session/view_lines` is one page routing on its path, but
      # Pages only serves a file that exists - and for one that does not it serves 404.html.
      # Making that a copy of the built index.html is what turns a 404 into the viewer.
      - name: Serve any path with the app (short scene URLs)
        run: cp session_viewer/dist/index.html session_viewer/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: session_viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
