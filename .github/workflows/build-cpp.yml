name: Build Session C++

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
        build_type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Configure CMake
      working-directory: ./session_cpp
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      working-directory: ./session_cpp
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run tests
      working-directory: ./session_cpp
      shell: bash
      run: |
        if [ -f "build/tests" ]; then
          ./build/tests -r compact -s -d yes
        elif [ -f "build/Release/tests.exe" ]; then
          ./build/Release/tests.exe -r compact -s -d yes
        elif [ -f "build/Debug/tests.exe" ]; then
          ./build/Debug/tests.exe -r compact -s -d yes
        else
          echo "Tests executable not found!"
          exit 1
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cpp-build-${{ matrix.os }}-${{ matrix.build_type }}
        path: session_cpp/build/
