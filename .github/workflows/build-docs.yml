name: Build and Deploy Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  documentation:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Doxygen
      uses: ssciwr/doxygen-install@v1
      with:
        version: "1.9.4"
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Install Rust (for cargo doc)
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # Build C++ Documentation
    - name: Build C++ Documentation
      working-directory: ./session_cpp/docs
      run: doxygen Doxyfile
      
    # Build Rust Documentation
    - name: Build Rust Documentation
      working-directory: ./session_rust
      run: cargo doc --no-deps
      
    # Build Python Documentation (if sphinx is set up)
    - name: Install Python dependencies
      working-directory: ./session_py
      run: |
        pip install -e .
        
    # Create combined docs directory
    - name: Combine Documentation
      run: |
        mkdir -p combined_docs
        mkdir -p combined_docs/cpp
        mkdir -p combined_docs/rust
        mkdir -p combined_docs/python
        if [ -d "session_cpp/docs/html" ]; then
          cp -r session_cpp/docs/html/* combined_docs/cpp/
        fi
        if [ -d "session_rust/target/doc" ]; then
          cp -r session_rust/target/doc/* combined_docs/rust/
        fi
        echo '<html><body><h1>Session Library Documentation</h1><ul><li><a href="cpp/">C++ Documentation</a></li><li><a href="rust/">Rust Documentation</a></li><li><a href="python/">Python Documentation</a></li></ul></body></html>' > combined_docs/index.html

    # Upload combined documentation artifact
    - name: Upload Combined Documentation
      uses: actions/upload-artifact@v4
      with:
        name: all-documentation
        path: combined_docs/
        
    # Deploy to GitHub Pages (only on main branch)
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./combined_docs
        publish_branch: gh-pages
        force_orphan: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
