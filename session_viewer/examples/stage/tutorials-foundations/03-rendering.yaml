title: '3 · Octahedral Normal Encoding and Cofactor Transform'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [0, 0], size: 4, step: 1, z: -1.2}
camera: {yaw: -42, pitch: 24, fit: [PX, NX, PY, NY, PZ, NZ, N1]}
points:
  O: [0, 0, 0]
  PX: [1.5, 0, 0]
  NX: [-1.5, 0, 0]
  PY: [0, 1.5, 0]
  NY: [0, -1.5, 0]
  PZ: [0, 0, 1.5]
  NZ: [0, 0, -1.1]
  N1: [0.85, 0.55, 1.12]
  NP: [0.49, 0.32, 0.0]
slides:
  - title: 'UNIT OCTAHEDRON TO 32-BIT SNORM PAIR'
    steps:
      - say: 'Unit normals project from the $\ell_1$ octahedron $|x|+|y|+|z|=1$ onto the $[-1,1]^2$ square.'
        add:
          - {id: eqLoop, polyline: [PX, PY, NX, NY, PX], color: '#3057b1', width: 2.8}
          - {id: r1, line: [PZ, PX], color: '#3057b1', width: 2.0}
          - {id: r2, line: [PZ, PY], color: '#3057b1', width: 2.0}
          - {id: r3, line: [PZ, NX], color: '#3057b1', width: 2.0}
          - {id: r4, line: [PZ, NY], color: '#3057b1', width: 2.0}
          - {id: b1, line: [NZ, PX], color: grey, width: 1.5, dash: true}
          - {id: b2, line: [NZ, PY], color: grey, width: 1.5, dash: true}
          - {id: b3, line: [NZ, NX], color: grey, width: 1.5, dash: true}
          - {id: b4, line: [NZ, NY], color: grey, width: 1.5, dash: true}
          - {id: pZ, point: PZ, color: '#3057b1', label: '+z'}
        eq: '\mathbf{e} = \frac{(n_x, n_y)}{|n_x| + |n_y| + |n_z|} \in [-1, 1]^2'
      - say: 'Packing $\mathbf{e}$ into two 16-bit signed norms replaces a 12-byte normal vector with one 4-byte word.'
        add:
          - {id: nVec, arrow: [O, N1], color: pink, width: 3.4, label: '\mathbf{n}'}
          - {id: drop, line: [N1, NP], color: grey, width: 1.6, dash: true}
          - {id: pProj, point: NP, color: pink, label: '\mathbf{e}'}
        eq: '\mathbf{n}\prime = \mathrm{normalize}\!\left(\mathrm{cof}(\mathbf{M})\,\mathbf{n}\cdot\mathrm{sgn}(\det\mathbf{M})\right)'
        text: 'At compile time, build.rs expands WGSL shader includes into OUT_DIR before Naga validation.'
