title: '1 · Startup and Workspace Split'
split: 0.50
slides:
  - title: 'PROJECT AND BROWSER START'
    steps:
      - say: 'Trunk compiles the workspace to WebAssembly and hands the canvas to winit before async GPU setup.'
        add:
          - {id: flow, drawing: [
              {polygon: [[110, 145], [700, 145], [700, 229], [110, 229]], fill: cell, color: ink, width: 2.0},
              {point: [110, 187], color: accent, size: 5.0},
              {arrow: [[405, 233], [405, 306]], color: blue, width: 3.0},
              {polygon: [[110, 310], [700, 310], [700, 394], [110, 394]], fill: blue_band, color: ink, width: 2.0},
              {point: [110, 352], color: accent, size: 5.0},
              {arrow: [[405, 398], [405, 471]], color: blue, width: 3.0},
              {polygon: [[110, 475], [700, 475], [700, 559], [110, 559]], fill: yellow_light, color: ink, width: 2.0},
              {point: [110, 517], color: accent, size: 5.0},
              {arrow: [[405, 563], [405, 636]], color: blue, width: 3.0},
              {polygon: [[110, 640], [700, 640], [700, 724], [110, 724]], fill: pink_band, color: ink, width: 2.0},
              {point: [110, 682], color: accent, size: 5.0}
            ], at: [0, 0]}
          - {id: h0, tex: '\text{index.html + Trunk.toml}', at: [136, 179], size: 21, color: ink}
          - {id: s0, tex: '\text{full-viewport #canvas, data-wasm-opt=0}', at: [136, 209], size: 16, color: navy}
          - {id: h1, tex: '\text{wasm_bindgen(start) -> run_web}', at: [136, 344], size: 21, color: ink}
          - {id: s1, tex: '\text{src/lib.rs + app/launch.rs}', at: [136, 374], size: 16, color: navy}
          - {id: h2, tex: '\text{EventLoopProxy<Msg>}', at: [136, 509], size: 21, color: ink}
          - {id: s2, tex: '\text{cloned before async GPU handshake}', at: [136, 539], size: 16, color: navy}
          - {id: h3, tex: '\text{viewer-core + session_viewer}', at: [136, 674], size: 21, color: ink}
          - {id: s3, tex: '\text{zero UI/GPU crates in viewer-core}', at: [136, 704], size: 16, color: navy}
        eq: {tex: 'W_{\mathrm{px}} = W_{\mathrm{css}} \cdot \mathrm{dpr},\qquad H_{\mathrm{px}} = H_{\mathrm{css}} \cdot \mathrm{dpr}', align: left}
