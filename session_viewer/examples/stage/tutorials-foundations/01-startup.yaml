title: '1 · CSS Viewport to Physical Framebuffer'
split: 0.52
palette: {accent: '#3057b1'}
camera: {view: top, fit: [LO, HI]}
points:
  LO: [-0.9, -0.9, 0]
  HI: [7.1, 4.7, 0]
  O: [0, 0, 0]
  CX: [3.2, 0, 0]
  CY: [0, 2.0, 0]
  CC: [3.2, 2.0, 0]
  PX: [6.0, 0, 0]
  PY: [0, 3.75, 0]
  PC: [6.0, 3.75, 0]
slides:
  - title: 'VIEWPORT SCALING AND WORKSPACE SPLIT'
    steps:
      - say: 'The browser reports the canvas element in CSS layout pixels $(W_{\mathrm{css}}, H_{\mathrm{css}})$.'
        add:
          - {id: css, polyline: [O, CX, CC, CY, O], color: '#3057b1', width: 2.8}
          - {id: pO, point: O, color: ink, label: 'O'}
          - {id: pCC, point: CC, color: '#3057b1', label: 'W_{\mathrm{css}}\times H_{\mathrm{css}}'}
        eq: 'W_{\mathrm{px}} = \mathrm{round}(W_{\mathrm{css}} \cdot \mathrm{dpr}), \qquad H_{\mathrm{px}} = \mathrm{round}(H_{\mathrm{css}} \cdot \mathrm{dpr})'
      - say: 'Multiplying by $\mathrm{dpr}$ expands the WebGPU backing texture without stretching CSS layout.'
        add:
          - {id: phys, polyline: [CX, PX, PC, PY, CY], color: pink, width: 3.2}
          - {id: physBase, polyline: [CY, O, CX], color: '#3057b1', width: 2.8}
          - {id: scaleRay, arrow: [CC, PC], color: pink, width: 3.0, label: '\times\,\mathrm{dpr}'}
          - {id: pPC, point: PC, color: pink, label: 'W_{\mathrm{px}}\times H_{\mathrm{px}}'}
        code: |
          viewer-core     # pure Rust: scene, camera, walk, command, op
          session_viewer  # winit + wgpu + egui + wasm_bindgen shell
        text: 'Clone the typed EventLoopProxy before spawn_app so async WebGPU init wakes the event loop.'
