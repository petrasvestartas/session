title: '5 · Reversed-Z Camera Frustum and Cursor-Pinned Ray'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [1.5, 0], size: 7, step: 1, z: -1.4}
camera: {yaw: -38, pitch: 22, fit: [EYE, EU, F0, F1, F2, F3, TGT]}
points:
  EYE: [-1.8, 0.0, 0.7]
  ER: [-1.8, 1.05, 0.7]
  EU: [-1.8, 0.0, 1.62]
  N0: [0.0, -0.65, 0.32]
  N1: [0.0, 0.65, 0.32]
  N2: [0.0, 0.65, 1.08]
  N3: [0.0, -0.65, 1.08]
  F0: [3.6, -1.95, -0.45]
  F1: [3.6, 1.95, -0.45]
  F2: [3.6, 1.95, 1.85]
  F3: [3.6, -1.95, 1.85]
  TGT: [2.1, 0.0, 0.7]
  CUR: [2.7, 0.75, 1.15]
slides:
  - title: 'REVERSED-Z FRUSTUM AND CURSOR RAY'
    steps:
      - say: 'Reversed-Z maps the near plane to $z_{\mathrm{ndc}}=1$ and the far plane to $z_{\mathrm{ndc}}=0$.'
        add:
          - {id: pE, point: EYE, color: ink, label: '\mathbf{e}'}
          - {id: basisR, arrow: [EYE, ER], color: pink, width: 2.6, label: '\mathbf{r}'}
          - {id: basisU, arrow: [EYE, EU], color: green, width: 2.6, label: '\mathbf{u}'}
          - {id: nearQuad, polyline: [N0, N1, N2, N3, N0], color: pink, width: 3.0}
          - {id: farQuad, polyline: [F0, F1, F2, F3, F0], color: '#3057b1', width: 2.8}
          - {id: r0, line: [EYE, F0], color: grey, width: 1.3, dash: true}
          - {id: r1, line: [EYE, F1], color: grey, width: 1.3, dash: true}
          - {id: r2, line: [EYE, F2], color: grey, width: 1.3, dash: true}
          - {id: r3, line: [EYE, F3], color: grey, width: 1.3, dash: true}
          - {id: lNear, label: N2, tex: 'z=1', color: pink}
          - {id: lFar, label: F2, tex: 'z=0', color: '#3057b1'}
        eq: '\mathbf{M}_{\mathrm{vp}} = \mathbf{T}_{\mathrm{lens}} \cdot \mathbf{P}_{\mathrm{rev\text{-}z}}(z_{\mathrm{far}}, z_{\mathrm{near}}) \cdot \mathbf{V}(\mathbf{e}-\mathbf{a},\,\mathbf{t}-\mathbf{a})'
      - say: 'Cursor-pinned zoom keeps the world point $\mathbf{p}_{\mathrm{cur}}$ stationary under wheel and pinch gestures.'
        add:
          - {id: vAxis, arrow: [EYE, TGT], color: '#3057b1', width: 2.8, label: '\mathbf{t}'}
          - {id: pT, point: TGT, color: '#3057b1'}
          - {id: cRay, arrow: [EYE, CUR], color: pink, width: 3.0}
          - {id: pCur, point: CUR, color: pink, label: '\mathbf{p}_{\mathrm{cur}}'}
        eq: '\mathbf{r}(\lambda) = \mathbf{e} + \lambda\,\mathbf{d}_{\mathrm{cursor}}, \qquad z_{\mathrm{near}} = \max(10^{-3},\,10^{-4} d)'
