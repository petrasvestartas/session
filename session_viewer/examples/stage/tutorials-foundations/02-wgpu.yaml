title: '2 · WebGPU Device and Targets'
split: 0.50
slides:
  - title: 'WGPU INITIALIZATION'
    steps:
      - say: 'Request adapter and 256 MiB storage limits, latch the first GPU error, and allocate frame targets.'
        add:
          - {id: flow, drawing: [
              {polygon: [[110, 145], [700, 145], [700, 229], [110, 229]], fill: blue_band, color: ink, width: 2.0},
              {point: [110, 187], color: accent, size: 5.0},
              {arrow: [[405, 233], [405, 306]], color: blue, width: 3.0},
              {polygon: [[110, 310], [700, 310], [700, 394], [110, 394]], fill: pink_band, color: ink, width: 2.0},
              {point: [110, 352], color: accent, size: 5.0},
              {arrow: [[405, 398], [405, 471]], color: blue, width: 3.0},
              {polygon: [[110, 475], [700, 475], [700, 559], [110, 559]], fill: yellow_light, color: ink, width: 2.0},
              {point: [110, 517], color: accent, size: 5.0},
              {arrow: [[405, 563], [405, 636]], color: blue, width: 3.0},
              {polygon: [[110, 640], [700, 640], [700, 724], [110, 724]], fill: cell, color: ink, width: 2.0},
              {point: [110, 682], color: accent, size: 5.0}
            ], at: [0, 0]}
          - {id: h0, tex: '\text{request_adapter -> request_device}', at: [136, 179], size: 21, color: ink}
          - {id: s0, tex: '\text{engine/gpu/device.rs · 256 MiB cap}', at: [136, 209], size: 16, color: navy}
          - {id: h1, tex: '\text{UncapturedError -> Arc<Mutex>}', at: [136, 344], size: 21, color: ink}
          - {id: s1, tex: '\text{first GPU fault latched once}', at: [136, 374], size: 16, color: navy}
          - {id: h2, tex: '\text{Targets (MSAA + Depth32Float)}', at: [136, 509], size: 21, color: ink}
          - {id: s2, tex: '\text{reverse-Z clear 0.0 + Rg32Uint IDs}', at: [136, 539], size: 16, color: navy}
          - {id: h3, tex: '\text{FramePacing -> Queue::submit}', at: [136, 674], size: 21, color: ink}
          - {id: s3, tex: '\text{atomic in-flight gate (1..=4)}', at: [136, 704], size: 16, color: navy}
        eq: {tex: 'z_{\mathrm{ndc}} \in [0, 1],\qquad z_{\mathrm{near}} = 1,\qquad z_{\mathrm{far}} = 0', align: left}
        text: '**Invariant:** Desktop IntegratedGpu defaults to 1x MSAA while mobile and discrete adapters negotiate 4x MSAA.'
