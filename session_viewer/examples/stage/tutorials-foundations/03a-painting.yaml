title: '3.1 · Tessellated egui Mesh and Scissor Composite'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [2.2, 1.4], size: 7, step: 1, z: -0.4}
camera: {yaw: -42, pitch: 26, fit: [B0, B2, U0, U2, T0]}
points:
  B0: [0, 0, 0]
  B1: [4.4, 0, 0]
  B2: [4.4, 2.8, 0]
  B3: [0, 2.8, 0]
  U0: [0.35, 0.3, 1.25]
  U1: [4.05, 0.3, 1.25]
  U2: [4.05, 2.5, 1.25]
  U3: [0.35, 2.5, 1.25]
  T0: [2.2, 2.25, 1.25]
  T1: [1.15, 0.75, 1.25]
  T2: [3.25, 0.75, 1.25]
  C0: [0.6, 0.5, 1.25]
  C1: [2.3, 0.5, 1.25]
  P_PROJ: [2.2, 1.4, 0]
  P_TOP: [2.2, 1.4, 1.25]
slides:
  - title: 'CLIPPED PRIMITIVES OVER THE 3D SURFACE'
    steps:
      - say: 'The 3D pass resolves into the single-sample swapchain view ($z = 0$) before UI compositing begins.'
        add:
          - {id: baseSurf, polyline: [B0, B1, B2, B3, B0], color: '#3057b1', width: 2.6}
          - {id: lSurf, label: B2, tex: '\mathrm{LoadOp::Load}', color: '#3057b1'}
        eq: 'x_{\mathrm{ndc}} = \frac{2 x_{\mathrm{pt}}}{W_{\mathrm{pt}}} - 1, \qquad y_{\mathrm{ndc}} = 1 - \frac{2 y_{\mathrm{pt}}}{H_{\mathrm{pt}}}'
      - say: 'Tessellation emits indexed $(x, y, u, v, \mathrm{rgba})$ triangles clipped to physical scissor rectangles.'
        add:
          - {id: scis, polyline: [U0, U1, U2, U3, U0], color: grey, width: 1.8, dash: true}
          - {id: tri, polyline: [T0, T1, T2, T0], color: pink, width: 3.4}
          - {id: p0, point: T0, color: pink, label: 'v_0'}
          - {id: p1, point: T1, color: pink, label: 'v_1'}
          - {id: p2, point: T2, color: pink, label: 'v_2'}
      - say: 'Upload font atlas deltas before encoding the pass, and composite alpha-blended glyphs onto the surface.'
        add:
          - {id: baseline, arrow: [C0, C1], color: '#3057b1', width: 2.8, label: '\mathrm{atlas\;UV}'}
          - {id: compDrop, arrow: [P_TOP, P_PROJ], color: green, width: 2.6}
        code: |
          ui.prepare(&device, &queue, &ctx, output, [w, h]);  # upload font deltas
          ui.draw(&mut encoder, &surface_view);               # LoadOp::Load composite
