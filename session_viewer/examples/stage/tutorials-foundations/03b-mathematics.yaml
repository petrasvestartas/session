title: '3.2 · OpenType MATH Axis and Sign-Coloured Matrices'
split: 0.50
palette: {accent: '#3057b1'}
camera: {view: top, fit: [LO, HI]}
points:
  LO: [-0.4, -1.35, 0]
  HI: [6.0, 3.3, 0]
  BL0: [0.2, 0, 0]
  BL1: [5.4, 0, 0]
  AX0: [0.2, 0.9, 0]
  AX1: [5.4, 0.9, 0]
  R0: [1.4, 0.9, 0]
  R1: [4.2, 0.9, 0]
  MID_AX: [2.8, 0.9, 0]
  NUM0: [1.85, 1.35, 0]
  NUM1: [3.75, 1.35, 0]
  NUM2: [3.75, 2.55, 0]
  NUM3: [1.85, 2.55, 0]
  NUM_C: [2.8, 1.95, 0]
  DEN0: [1.85, -0.85, 0]
  DEN1: [3.75, -0.85, 0]
  DEN2: [3.75, 0.35, 0]
  DEN3: [1.85, 0.35, 0]
  DEN_C: [2.8, -0.25, 0]
slides:
  - title: 'OPENTYPE MATH AXIS AND ROUNDED MATRICES'
    steps:
      - say: 'Fraction rules, $+$, and $=$ align on the OpenType MATH axis $y_{\mathrm{axis}}$ above the text baseline.'
        add:
          - {id: baseLine, line: [BL0, BL1], color: grey, width: 1.8, dash: true}
          - {id: axisLine, line: [AX0, AX1], color: '#3057b1', width: 2.0, dash: true}
          - {id: fracRule, line: [R0, R1], color: ink, width: 3.6}
          - {id: numBox, polyline: [NUM0, NUM1, NUM2, NUM3, NUM0], color: pink, width: 2.4}
          - {id: denBox, polyline: [DEN0, DEN1, DEN2, DEN3, DEN0], color: '#3057b1', width: 2.4}
          - {id: pAxis, arrow: [BL0, AX0], color: '#3057b1', width: 2.8, label: 'y_{\mathrm{axis}}'}
          - {id: upGap, arrow: [MID_AX, NUM_C], color: pink, width: 2.4}
          - {id: dnGap, arrow: [MID_AX, DEN_C], color: '#3057b1', width: 2.4}
          - {id: pNum, point: NUM_C, color: pink, label: 'f_k'}
          - {id: pDen, point: DEN_C, color: '#3057b1', label: '\ell_k'}
        eq: '\mathbf{D}_N\,\mathbf{x}_N = \mathbf{p} - \mathbf{D}_F\,\mathbf{x}_F, \qquad q_k = \frac{f_k}{\ell_k}'
      - say: '2D stage matrices tint positive entries pink and negative entries blue with zero 3D scene coupling.'
        matrix:
          id: DN
          signs: true
          rows:
            - ['4', '-1', '-1']
            - ['-1', '4', '-1']
            - ['-1', '-1', '4']
