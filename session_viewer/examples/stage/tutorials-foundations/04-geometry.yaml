title: '4 · Camera-Anchored Placement and 112-Byte Instance Rows'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [1.8, 1.2], size: 6, step: 1, z: 0}
camera: {yaw: -50, pitch: 26, fit: [W0, ANC, TI, MP, C1]}
points:
  W0: [-0.8, -0.8, 0]
  ANC: [1.4, 0.6, 0]
  TI: [3.4, 1.8, 0.9]
  MP: [4.1, 2.3, 2.1]
  C0: [2.9, 1.3, 0.4]
  C1: [4.3, 2.5, 2.2]
slides:
  - title: 'DOUBLE-PRECISION ANCHOR SUBTRACTION'
    steps:
      - say: 'Subtract the double-precision camera anchor $\mathbf{a}$ from every object translation $\mathbf{T}_i$ on the CPU.'
        add:
          - {id: pW, point: W0, color: grey, label: '\mathbf{0}_{\mathrm{world}}'}
          - {id: vA, arrow: [W0, ANC], color: grey, width: 2.2, dash: true, label: '\mathbf{a}\;(f_{64})'}
          - {id: pA, point: ANC, color: '#3057b1', label: '\mathbf{a}'}
          - {id: vRel, arrow: [ANC, TI], color: '#3057b1', width: 3.4, label: '\mathbf{t}_i = \mathbf{T}_i - \mathbf{a}'}
          - {id: pT, point: TI, color: '#3057b1'}
        eq: '\mathrm{place}(i, \mathbf{p}) = \mathbf{M}_i\,\mathbf{p} + (\mathbf{T}_i - \mathbf{a})'
      - say: 'Local 20-byte vertex coordinates stay sharp in $f_{32}$ even kilometres from the world origin.'
        add:
          - {id: bbox, cuboid: [C0, C1], color: grey, width: 1.4}
          - {id: vLoc, arrow: [TI, MP], color: pink, width: 3.2, label: '\mathbf{M}_i\,\mathbf{p}'}
          - {id: pM, point: MP, color: pink, label: '\mathbf{p}_{\mathrm{world}}'}
        code: |
          ArenaVertex:   pos f32x3 (12B) + oct32 normal (4B) + rgba8 (4B) = 20 B
          Instance row:  model 4x4 (64B) + rgba (16B) + flags (16B) + effect (16B) = 112 B
