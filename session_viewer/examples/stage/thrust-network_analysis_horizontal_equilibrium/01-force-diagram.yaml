  - title: READ THE FORCES
    steps:
      - say: 'Side length is thrust, drawn as thickness. Divided by bar length: force density.'
        do:
          - remove: [t0, t1, t2, t3, t4, t5, t6, t7, t8, t9, t10, t11]
          - add:
              - {id: h0, line: [s1, n1], color: ink, width: 5.9}
              - {id: h1, line: [s2, n2], color: ink, width: 6.6}
              - {id: h2, line: [s8, n1], color: ink, width: 5.9}
