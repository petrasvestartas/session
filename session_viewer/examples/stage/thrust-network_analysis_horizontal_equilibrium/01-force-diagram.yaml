              - {id: arcF, polyline: [[3.033, 3.096, 0], [3.062, 3.105, 0], [3.090, 3.115, 0], [3.119, 3.125, 0], [3.147, 3.135, 0], [3.175, 3.145, 0], [3.203, 3.156, 0], [3.230, 3.168, 0], [3.258, 3.179, 0], [3.285, 3.191, 0], [3.313, 3.204, 0]], color: pink, width: 1.4}
              - {id: aF, arrow: [F, vF], color: pink, width: 2.6}
              - {id: vF, point: vF, color: pink, size: 0.7, label: '\mathbf{p}_F'}
          - derive: {from: t8, id: rayH, line: [H, rH], color: blue, width: 1.6, dash: true}
          - add:
              - {id: arcH, polyline: [[3.033, 3.096, 0], [3.021, 3.215, 0], [3.002, 3.332, 0], [2.976, 3.449, 0], [2.944, 3.563, 0], [2.905, 3.676, 0], [2.859, 3.786, 0], [2.808, 3.893, 0], [2.750, 3.998, 0], [2.686, 4.098, 0], [2.616, 4.195, 0]], color: pink, width: 1.4}
              - {id: aH, arrow: [H, vH], color: pink, width: 2.6}
              - {id: vH, point: vH, color: pink, size: 0.7, label: '\mathbf{p}_H'}
          - eq: {tex: '\mathbf{p}_i = \mathbf{x}_i \pm l_i\,\mathbf{t}_i', color: pink, align: left, size: 34}
      - say: 'Corner $E$ goes to the average of the four.'
        do:
          - add:
              - {id: wB, line: [vB, mE], color: pink, width: 1.0, dash: true}
              - {id: wD, line: [vD, mE], color: pink, width: 1.0, dash: true}
              - {id: wF, line: [vF, mE], color: pink, width: 1.0, dash: true}
              - {id: wH, line: [vH, mE], color: pink, width: 1.0, dash: true}
              - {id: step, arrow: [E, mE], color: ink, width: 3.4}
          - eq: {tex: '\mathbf{x}_E \leftarrow \tfrac{1}{4}\,(\mathbf{p}_B + \mathbf{p}_D + \mathbf{p}_F + \mathbf{p}_H)', align: left, size: 30}
      - say: 'Every corner does this at the same time: one iteration.'
        do:
          - camera: {fit: [A, C, G, I, B, D, F, H], dur: 1.2}
          - remove: [step, rayB, arcB, aB, vB, wB, rayD, arcD, aD, vD, wD, rayF, arcF, aF, vF, wF, rayH, arcH, aH, vH, wH]
          - undim: [f0, f1, f2, f5, f7, f9, f10, f11, t0, t1, t2, t5, t7, t9, t10, t11]
          - add:
              - {id: sA, arrow: [A, mA], color: ink, width: 2.2}
              - {id: sB, arrow: [B, mB], color: ink, width: 2.2}
              - {id: sC, arrow: [C, mC], color: ink, width: 2.2}
              - {id: sD, arrow: [D, mD], color: ink, width: 2.2}
              - {id: sE, arrow: [E, mE], color: ink, width: 2.2}
              - {id: sF, arrow: [F, mF], color: ink, width: 2.2}
              - {id: sG, arrow: [G, mG], color: ink, width: 2.2}
              - {id: sH, arrow: [H, mH], color: ink, width: 2.2}
              - {id: sI, arrow: [I, mI], color: ink, width: 2.2}
          - wait: 0.8
          - move: {point: A, to: [5.004, 1.076, 0], dur: 1.4}
          - move: {point: B, to: [4.880, 3.234, 0], dur: 1.4, with: true}
          - move: {point: C, to: [4.578, 5.930, 0], dur: 1.4, with: true}
          - move: {point: D, to: [3.067, 0.943, 0], dur: 1.4, with: true}
          - move: {point: E, to: [3.294, 3.313, 0], dur: 1.4, with: true}
          - move: {point: F, to: [2.436, 4.669, 0], dur: 1.4, with: true}
          - move: {point: G, to: [1.162, 1.438, 0], dur: 1.4, with: true}
          - move: {point: H, to: [1.481, 2.638, 0], dur: 1.4, with: true}
          - move: {point: I, to: [0.563, 4.790, 0], dur: 1.4, with: true}
          - remove: [sA, sB, sC, sD, sE, sF, sG, sH, sI]
          - eq: {tex: '\text{largest miss}\quad 33.2^\circ \to 17.0^\circ', align: left, size: 30}
