title: '14 · Shared Serde Op Layer and FastMCP Parity'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [1.5, 1.5], size: 5, step: 1, z: 0}
camera: {yaw: -46, pitch: 26, fit: [S0, S1, S2, S3, TOP]}
points:
  S0: [0, 0, 0]
  S1: [3.0, 0, 0]
  S2: [3.0, 3.0, 0]
  S3: [0, 3.0, 0]
  TOP: [1.5, 1.5, 2.2]
slides:
  - title: '49-VARIANT OP ENUM AND FASTMCP PARITY'
    steps:
      - say: 'Agents, scripts, and browser messages address every object by stable $(\mathrm{doc}, \mathrm{guid})$ identity.'
        add:
          - {id: p0, point: S0, color: '#3057b1', label: 'n_0'}
          - {id: p1, point: S1, color: '#3057b1', label: 'n_1'}
          - {id: p2, point: S2, color: '#3057b1', label: 'n_2'}
          - {id: p3, point: S3, color: '#3057b1', label: 'n_3'}
          - {id: pT, point: TOP, color: pink, label: 'n_{\mathrm{apex}}'}
          - {id: e0, line: [S0, TOP], color: '#3057b1', width: 3.0}
          - {id: e1, line: [S1, TOP], color: '#3057b1', width: 3.0}
          - {id: e2, line: [S2, TOP], color: '#3057b1', width: 3.0}
          - {id: e3, line: [S3, TOP], color: '#3057b1', width: 3.0}
          - {id: ring, polyline: [S0, S1, S2, S3, S0], color: ink, width: 2.2}
        eq: '\mathrm{bytes}_{\mathrm{cmd}} \equiv \mathrm{bytes}_{\mathrm{cli}} \equiv \mathrm{bytes}_{\mathrm{mcp}}'
      - say: 'Python FastMCP exposes 31 typed tools and 3 scene resources over JSON-line standard I/O.'
        code: |
          viewer_core::op::execute  ->  4,076 ops/s headless
          session_mcp (FastMCP)     ->  zero duplicate Python geometry math
