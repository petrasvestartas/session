title: '14 · Shared Serde Op Layer and FastMCP Parity'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [2.0, 1.0], size: 6, step: 1, z: 0}
camera: {yaw: -44, pitch: 26, fit: [B00, B20, B21, B01, T05, T15]}
points:
  B00: [0.0, 0.0, 0.0]
  B10: [2.0, 0.0, 0.0]
  B20: [4.0, 0.0, 0.0]
  B01: [0.0, 2.0, 0.0]
  B11: [2.0, 2.0, 0.0]
  B21: [4.0, 2.0, 0.0]
  T05: [1.0, 1.0, 1.65]
  T15: [3.0, 1.0, 1.65]
slides:
  - title: '49-VARIANT OP ENUM AND FASTMCP PARITY'
    steps:
      - say: 'Agents, CLI scripts, and browser messages address every object by stable $(\mathrm{doc}, \mathrm{guid})$ identity.'
        add:
          - {id: bPerim, polyline: [B00, B10, B20, B21, B11, B01, B00], color: ink, width: 2.4}
          - {id: bMid, line: [B10, B11], color: ink, width: 2.2}
          - {id: p00, point: B00, color: '#3057b1', label: 'n_0'}
          - {id: p10, point: B10, color: '#3057b1', label: 'n_1'}
          - {id: p20, point: B20, color: '#3057b1', label: 'n_2'}
          - {id: p01, point: B01, color: '#3057b1'}
          - {id: p11, point: B11, color: '#3057b1'}
          - {id: p21, point: B21, color: '#3057b1', label: 'n_5'}
        eq: '\mathrm{bytes}_{\mathrm{cmd}} \equiv \mathrm{bytes}_{\mathrm{cli}} \equiv \mathrm{bytes}_{\mathrm{mcp}}'
      - say: 'Python FastMCP builds parametric 3D space-trusses over JSONL stdio with zero duplicate geometry math.'
        add:
          - {id: tChord, line: [T05, T15], color: '#3057b1', width: 3.6}
          - {id: w0, line: [B00, T05], color: pink, width: 2.6}
          - {id: w1, line: [B10, T05], color: pink, width: 2.6}
          - {id: w2, line: [B11, T05], color: pink, width: 2.6}
          - {id: w3, line: [B01, T05], color: pink, width: 2.6}
          - {id: w4, line: [B10, T15], color: pink, width: 2.6}
          - {id: w5, line: [B20, T15], color: pink, width: 2.6}
          - {id: w6, line: [B21, T15], color: pink, width: 2.6}
          - {id: w7, line: [B11, T15], color: pink, width: 2.6}
          - {id: pT0, point: T05, color: pink, label: 't_0'}
          - {id: pT1, point: T15, color: pink, label: 't_1'}
        code: |
          viewer_core::op::execute  ->  4,076 ops/s headless
          session_mcp (FastMCP)     ->  31 typed tools + 3 scene:// resources
