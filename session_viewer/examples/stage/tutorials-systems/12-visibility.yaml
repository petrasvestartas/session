title: '12 · Section Plane Winding Cap and Tile Depth Bounds'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [0, 0], size: 5, step: 1, z: -1.0}
camera: {yaw: -44, pitch: 25, fit: [B0, B1, PL0, PL2, N_TIP]}
points:
  B0: [-1.4, -1.1, -1.0]
  B1: [1.4, 1.1, 1.4]
  PL0: [-1.9, -1.6, 0.25]
  PL1: [1.9, -1.6, 0.25]
  PL2: [1.9, 1.6, 0.25]
  PL3: [-1.9, 1.6, 0.25]
  CAP0: [-1.4, -1.1, 0.25]
  CAP1: [1.4, -1.1, 0.25]
  CAP2: [1.4, 1.1, 0.25]
  CAP3: [-1.4, 1.1, 0.25]
  PC: [0, 0, 0.25]
  N_TIP: [0, 0, 1.65]
slides:
  - title: 'STENCILED SECTION CAPS AND TILE DEPTH'
    steps:
      - say: 'Up to 6 clipping planes discard fragments with $\mathbf{n}_k\cdot\mathbf{x} + d_k < 0$ across all solid and ink lanes.'
        add:
          - {id: box, cuboid: [B0, B1], color: grey, width: 1.5}
          - {id: plane, polyline: [PL0, PL1, PL2, PL3, PL0], color: '#3057b1', width: 2.2, dash: true}
          - {id: nVec, arrow: [PC, N_TIP], color: '#3057b1', width: 3.4, label: '\mathbf{n}'}
        eq: '\mathbf{n}_k \cdot \mathbf{x} + d_k \ge 0, \qquad k \in \{0,\dots,5\}'
      - say: 'Counting back-face minus front-face crossings behind the plane fills watertight hatched cross-sections.'
        add:
          - {id: capLoop, polyline: [CAP0, CAP1, CAP2, CAP3, CAP0], color: pink, width: 3.6}
          - {id: h1, line: [CAP0, CAP2], color: pink, width: 1.8}
          - {id: h2, line: [CAP1, CAP3], color: pink, width: 1.8}
          - {id: pC, point: PC, color: pink, label: '\Delta w \neq 0'}
        code: |
          triangle_tiles: 16x16 px bins + atomicMax(z_front) early-out (-64% orbit ms)
          Alpha 0..1:     per-object translucency on faces and strokes
