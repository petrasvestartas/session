title: '16 · GPU Pass Timing, Hysteresis Tiers and Edge-Continuity Oracle'
split: 0.52
palette: {accent: '#3057b1'}
camera: {view: top, fit: [LO, HI]}
points:
  LO: [-0.6, -0.8, 0]
  HI: [6.4, 4.2, 0]
  O: [0, 0, 0]
  XMAX: [5.8, 0, 0]
  YMAX: [0, 3.5, 0]
  T14_0: [3.9, 0, 0]
  T14_1: [3.9, 3.3, 0]
  M1_A: [0.4, 2.55, 0]
  M1_B: [5.2, 2.55, 0]
  M2_A: [0.4, 1.25, 0]
  M2_B: [2.35, 1.25, 0]
slides:
  - title: 'MEASURED M1 TO M2 INK SPEEDUP AND HYSTERESIS'
    steps:
      - say: 'GPU timestamp queries isolated $99.4\%$ of frame time inside ink strokes ($17.40\,\mathrm{ms}$ before tile depth bounds).'
        add:
          - {id: axX, arrow: [O, XMAX], color: ink, width: 2.2, label: '\mathrm{ms}'}
          - {id: axY, line: [O, YMAX], color: grey, width: 1.8}
          - {id: budget, line: [T14_0, T14_1], color: pink, width: 1.8, dash: true}
          - {id: lBud, label: T14_1, tex: '14\,\mathrm{ms}', color: pink}
          - {id: barBefore, arrow: [M1_A, M1_B], color: grey, width: 4.2, label: '17.40\,\mathrm{ms}\;(\mathrm{M1})'}
        eq: 't_{\mathrm{ink}}:\; 17.40\,\mathrm{ms} \longrightarrow 7.06\,\mathrm{ms}\;(-59.4\%), \qquad p_{95}^{\mathrm{orbit}}:\; 29.2 \longrightarrow 10.5\,\mathrm{ms}'
      - say: 'Per-tile atomic front-depth culling cut ink cost by $60\%$, keeping orbit smoothly inside full-quality Tier 0.'
        add:
          - {id: barAfter, arrow: [M2_A, M2_B], color: '#3057b1', width: 4.6, label: '7.06\,\mathrm{ms}\;(\mathrm{M2})'}
        code: |
          FrameStats:        600-frame [p50, p95, p99] + AtomicU64 submit->done
          selftest::oracle:  100.0000% visible CAD edge continuity (phone + desktop)
