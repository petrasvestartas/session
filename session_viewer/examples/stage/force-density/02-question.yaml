# Chapter 2: the question and what is given, written as plain numbers on the picture: fixed nodes, load, bars, force densities.
title: The question
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}        # drawn at a guess; its true place is the answer
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: Where does the free node come to rest?
    steps:
      - say: 'Four fixed nodes $n_1,\dots,n_4$ hold one free node $n_0$ on four bars $e_0,\dots,e_3$. A load $p$ hangs on $n_0$.'
        show: net
      - say: 'The question: given how hard each bar pulls, where is $n_0$?'
        tex: 'n_0 = (x_0,\ y_0,\ z_0) = \ ?'
      - say: 'Four things are given. We collect them one by one.'
        text: 'fixed nodes $\quad$ load $\quad$ bars $\quad$ force densities'

  - title: 'Given 1 · the fixed nodes'
    steps:
      - say: 'The coordinates of the four fixed nodes, in metres.'
        do:
          - morph: {target: n1.label, label: n1, tex: 'n_1\,(0,\,0,\,0)', dur: 0.6}
          - morph: {target: n2.label, label: n2, tex: 'n_2\,(5,\,0,\,3)', dur: 0.6, with: true}
          - morph: {target: n3.label, label: n3, tex: 'n_3\,(0,\,7,\,3)', dur: 0.6, with: true}
          - morph: {target: n4.label, label: n4, tex: 'n_4\,(7,\,5,\,0)', dur: 0.6, with: true}
      - say: 'Written down, one line per node.'
        do:
          - eq: 'n_1 = (0,\ 0,\ 0)'
          - eq: 'n_2 = (5,\ 0,\ 3)'
          - eq: 'n_3 = (0,\ 7,\ 3)'
          - eq: 'n_4 = (7,\ 5,\ 0)'
          - morph: {target: n1.label, label: n1, tex: 'n_1', dur: 0.5}
          - morph: {target: n2.label, label: n2, tex: 'n_2', dur: 0.5, with: true}
          - morph: {target: n3.label, label: n3, tex: 'n_3', dur: 0.5, with: true}
          - morph: {target: n4.label, label: n4, tex: 'n_4', dur: 0.5, with: true}

  - title: 'Given 2 · the load'
    steps:
      - say: 'The load on the free node: 5 kN straight down.'
        highlight: [load_n0]
        eq: 'p = (0,\ 0,\ -5)\ \text{kN}'

  - title: 'Given 3 · the bars'
    steps:
      - say: 'Bar $e_0$ joins the free node $n_0$ to the fixed node $n_1$.'
        do:
          - color: {target: e0, color: accent}
          - tex: 'e_0:\quad n_0 \to n_1'
      - say: 'Each other bar joins $n_0$ to one more fixed node.'
        do:
          - color: {target: e0, color: reset}
          - tex: 'e_1:\quad n_0 \to n_2'
          - tex: 'e_2:\quad n_0 \to n_3'
          - tex: 'e_3:\quad n_0 \to n_4'
          - highlight: [e1, e2, e3]

  - title: 'Given 4 · the force densities'
    steps:
      - say: 'For each bar we choose one number: its force divided by its length.'
        eq: 'q = \frac{\text{force in the bar}}{\text{length of the bar}}'
      - say: 'Here every bar gets the same, 1 kN/m. The index is the fixed node the bar goes to.'
        eq: {id: qs, tex: 'q_1 = q_2 = q_3 = q_4 = 1\ \text{kN/m}'}
      - say: 'We do not know the forces and we do not know the lengths. We only fix their ratio. Why that is enough is the trick of this method.'
        highlight: [qs]
