# Chapter 6: the five nodes without load. Force densities are weights that move the free node.
title: Play with the force densities
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
net:
  fixed: {P1: [0, 0, 0], P2: [5, 0, 3], P3: [0, 7, 3], P4: [7, 5, 0]}
  free: {P0: [3.6, 3.4, 1.9]}
  cables: {a: [P0, P1], b: [P0, P2], c: [P0, P3], d: [P0, P4]}
  q: 1
slides:
  - title: The five nodes, no load
    steps:
      - say: 'The five nodes again, this time without a load. Only the force densities decide where $P_0$ rests.'
        show: net
      - say: 'Each coordinate of $P_0$ is the average of the fixed nodes, weighted by the force densities.'
        eq: 'x_0 = \frac{q_a x_1 + q_b x_2 + q_c x_3 + q_d x_4}{q_a + q_b + q_c + q_d}'

  - title: Change one force density
    keep: true
    steps:
      - say: 'With equal force densities the node rests at the plain average of the four fixed nodes.'
        do:
          - solve: {load: {P0: [0, 0, 0]}}
          - eq: 'q = (1,\ 1,\ 1,\ 1):\quad P_0 = (3,\ 3,\ 1.5)'
      - say: 'Give cable $c$ four times the force density. It weighs four times as much in the average and pulls the node toward $P_3$.'
        do:
          - color: {target: c, color: accent}
          - solve: {load: {P0: [0, 0, 0]}, q: {c: 4}}
          - eq: 'q = (1,\ 1,\ 4,\ 1):\quad P_0 = (1.714,\ 4.714,\ 2.143)'
      - say: 'Now cable $a$ instead. The node moves toward $P_1$.'
        do:
          - color: {target: c, color: reset}
          - color: {target: a, color: accent, with: true}
          - solve: {load: {P0: [0, 0, 0]}, q: {a: 4}}
          - eq: 'q = (4,\ 1,\ 1,\ 1):\quad P_0 = (1.714,\ 1.714,\ 0.857)'
      - say: 'A force density is a weight: the denser a cable, the closer the node sits to its other end. No iteration, one solve each time.'
        do:
          - color: {target: a, color: reset}
          - solve: {load: {P0: [0, 0, 0]}}
