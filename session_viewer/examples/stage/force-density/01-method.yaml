# Chapter 1: what the method gives. A net that finds its shape, and the three equations behind it.
title: The force density method
grid: {center: [4.5, 4.5], size: 12, step: 1}
camera: {yaw: -52, pitch: 30}
net:
  grid: [10, 10]
  fixed: boundary
  q: 1
  load: [0, 0, 0.35]
slides:
  - title: The force density method
    steps:
      - say: 'Klaus Linkwitz and Hans-Jörg Schek, Stuttgart, 1971: a way to find the shape of a cable net.'
        show: [cables, fixed]
        row:
          - {id: linkwitz, image: {src: img/linkwitz.png, height: 6.5}}
          - '\quad'
          - {id: schek, image: {src: img/schek.png, height: 6.5}}
        text: '**Klaus Linkwitz** $\qquad\qquad\qquad$ **Hans-Jörg Schek**'
      - say: 'Every free node carries a load, here pointing up like the air in a cushion.'
        show: loads
      - say: 'Give the net its fixed points, its loads and one number per cable. One linear solve returns the shape in which every node is in equilibrium.'
        solve: true
      - say: 'Its best known application is the Multihalle Mannheim of 1975: a timber gridshell whose shape was computed as a hanging net and built upside down.'
        image: {src: img/multihalle.png, height: 8}
        text: '**Multihalle Mannheim**, Herzogenriedpark, 1975'

  - title: The result we are heading for
    steps:
      - say: 'Everything in these three decks leads to three lines, one per coordinate.'
        eq: {tex: '\mathbf{x}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_x - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F)', color: x}
      - say: 'The same line for $y$ and for $z$.'
        do:
          - eq: {tex: '\mathbf{y}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_y - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{y}_F)', color: y}
          - eq: {tex: '\mathbf{z}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_z - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{z}_F)', color: z}
      - say: 'On the right of each line stands what we know. On the left, what we want: the coordinates of the free nodes.'
        do:
          - text: '**known:** $\mathbf{x}_F$ fixed nodes, $\mathbf{p}$ loads, $\mathbf{C}$ connectivity, $\mathbf{Q}$ force densities'
          - text: '**wanted:** $\mathbf{x}_N$, $\mathbf{y}_N$, $\mathbf{z}_N$, the free nodes'

  - title: The way there, in three decks
    steps:
      - say: 'This deck: one free node, plain sums, no matrices yet (Linkwitz 6.2.2).'
        do:
          - {text: '**Deck 1 · the equations of five nodes**', align: left}
          - {text: 'equilibrium of a node, the question and what is given, forces as projections, force over length as one unknown, force density in 1D, playing with force densities', align: left}
      - say: 'The second deck writes the same sums with matrices, derives the Jacobian, and solves any net for its coordinates and its forces (6.4.2, 6.4.3).'
        do:
          - {text: '**Deck 2 · matrices and the Jacobian**: force-density-matrices', align: left}
      - say: 'The third deck turns the solved net into cables: elongations and unstretched lengths (6.5).'
        do:
          - {text: '**Deck 3 · materialization**: force-density-materialization', align: left}
