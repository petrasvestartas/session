  - title: 2 · INDEPENDENT FORCE DENSITIES (BLOCK AND LACHAUER 2014)
    steps:
      - say: 'Row reduction of the equilibrium matrix finds $k = 4$ bars whose force can be chosen freely, drawn pink.'
        do:
          - color: {target: gb5, color: pink}
          - color: {target: gb9, color: pink, with: true}
          - color: {target: gb10, color: pink, with: true}
          - color: {target: gb11, color: pink, with: true}
          - eq: {tex: '\mathbf{A}\,\mathbf{q} = \mathbf{0} \qquad k = m - \text{rank}\,\mathbf{A} = 12 - 8 = 4', align: left, size: 28}
      - say: 'Choose those four; the other eight follow from one small solve, and the diagram is drawn from $q$.'
        do:
          - add:
              - {id: bf0, line: [qb0, qb1], color: ink, width: 2.4}
