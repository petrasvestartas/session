  - title: 1 · LINEAR PROGRAMME (BLOCK 2009)
    steps:
      - say: 'Unknowns: one ratio $t_e = l^*_e / l_e$ per bar. Every node must close; every ratio stays positive.'
        do:
          - eq: {tex: '\min \sum_e t_e', align: left, size: 28}
          - eq: {tex: '\mathbf{C}_i^T\mathbf{U}\,\mathbf{t} = \mathbf{0} \qquad \mathbf{C}_i^T\mathbf{V}\,\mathbf{t} = \mathbf{0}', align: left, size: 28}
          - eq: {tex: 't_e \ge d / l_e', align: left, size: 28}
      - say: 'One solve gives all twelve ratios. Each side is its bar times its ratio, so the diagram can be drawn at once.'
        do:
          - add:
              - {id: af0, line: [qa0, qa1], color: ink, width: 2.4}
              - {id: af1, line: [qa1, qa2], color: ink, width: 2.4}
