# Chapter 2: the one-node question and exact 3D coordinates, plan lengths, dual force lengths and gravity load.
title: QUESTION
grid: {center: [0, 0], size: 6, step: 1, z: 0}
camera: {yaw: -62, pitch: 25}
palette: {free: ink}
points:
  O: [0, 0, 0]
  G1: [2, 0, 0]
  G2: [0, 2, 0]
  G3: [-2, 0, 0]
  G4: [0, -2, 0]
  TOP: [0, 0, 4.8]
net:
  fixed: {n1: [2, 0, 0.5], n2: [0, 2, 0.8], n3: [-2, 0, 0.5], n4: [0, -2, 0.8]}
  free: {n0: [0, 0, 2.0]}
  cables: {e1: [n0, n1], e2: [n0, n2], e3: [n0, n3], e4: [n0, n4]}
  q: {e1: 0.75, e2: 1.0, e3: 0.75, e4: 1.0}
  load: {n0: [0, 0, 10]}
slides:
  - title: WHAT IS THE HEIGHT OF NODE **n0** ?
    steps:
      - say: 'An interior node $n_0$ at plan origin $(0, 0)$ rests on four fixed supports $n_1,\dots,n_4$ under a downward gravity load $P_0 = 10\ \text{kN}$.'
        show: [cables, fixed, free]
        add:
          - {id: g1, line: [O, G1], color: grey, width: 1.6, dash: true}
          - {id: g2, line: [O, G2], color: grey, width: 1.6, dash: true}
          - {id: g3, line: [O, G3], color: grey, width: 1.6, dash: true}
          - {id: g4, line: [O, G4], color: grey, width: 1.6, dash: true}
          - {id: d0, line: [n0, O], color: grey, width: 1.4, dash: true}
          - {id: p, arrow: ['n0 + [0, 0, 1.1]', n0], color: load, width: 3.2, label: 'P_0'}
        tex: 'n_0 = (0,\ 0,\ z_0),\qquad z_0 = \ ?'

  - title: ALL GIVEN VALUES
    steps:
      - say: 'Plan $(x, y)$ and support heights $z$ in m, reciprocal thrusts $l^*_{\mathrm{H}}$ in kN, load $P_0$ in kN, and scale $r = 1$.'
        do:
          - morph: {target: n1.label, label: n1, tex: 'n_1\,(2,\,0,\,0.5)', dur: 0.6}
          - morph: {target: n2.label, label: n2, tex: 'n_2\,(0,\,2,\,0.8)', dur: 0.6, with: true}
          - morph: {target: n3.label, label: n3, tex: 'n_3\,(-2,\,0,\,0.5)', dur: 0.6, with: true}
          - morph: {target: n4.label, label: n4, tex: 'n_4\,(0,\,-2,\,0.8)', dur: 0.6, with: true}
          - eq: {tex: 'n_0 = (0,\ 0,\ z_0)', color: ink, align: left}
          - eq: {tex: 'n_1 = (2,\ 0,\ 0.5),\qquad n_3 = (-2,\ 0,\ 0.5)', color: ink, align: left, gap: 28}
          - eq: {tex: 'n_2 = (0,\ 2,\ 0.8),\qquad n_4 = (0,\ -2,\ 0.8)', color: ink, align: left, gap: 28}
          - highlight: [e1, e2, e3, e4]
          - eq: {tex: 'l_{\mathrm{H},1} = l_{\mathrm{H},2} = l_{\mathrm{H},3} = l_{\mathrm{H},4} = 2\ \text{m}', color: ink, align: left, gap: 32}
          - eq: {tex: 'l^*_{\mathrm{H},1} = l^*_{\mathrm{H},3} = 1.5\ \text{kN},\qquad l^*_{\mathrm{H},2} = l^*_{\mathrm{H},4} = 2.0\ \text{kN}', color: ink, align: left, gap: 28}
          - highlight: [p]
          - eq: {tex: 'P_0 = 10\ \text{kN},\qquad r = 1', color: load, align: left, gap: 32}
