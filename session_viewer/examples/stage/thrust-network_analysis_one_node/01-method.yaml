# Chapter 1: Thrust Network Analysis splits 3D funicular equilibrium into 2D reciprocal horizontal thrusts and linear vertical heights.
title: THRUST NETWORK ANALYSIS
grid: {center: [4.5, 4.5], size: 12, step: 1}
camera: {yaw: -52, pitch: 30}
palette: {free: ink}
net:
  grid: [10, 10]
  fixed: boundary
  q: 1
  load: [0, 0, 0.35]
slides:
  - title: THRUST NETWORK ANALYSIS
    steps:
      - say: 'Thrust Network Analysis was created by Philippe Block to form-find 3D funicular compression vaults under gravity.'
        show: [cables, fixed]
        eq: {tex: '\text{1. Horizontal equilibrium:}\quad \Gamma \;\Longleftrightarrow\; \Gamma^*', align: left}
        do:
          - eq: {tex: '\text{2. Vertical equilibrium:}\quad z_i\ \text{from linear equations}', align: left}
      - say: 'Using 2D branch lengths from the Form Diagram $\Gamma$ and Reciprocal Force Diagram $\Gamma^*$, node heights $z$ solve linearly without 3D square roots.'
        solve: true
      - say: 'Every branch of the thrust network $\mathbf{G}$ carries pure axial compression.'
        show: forces
