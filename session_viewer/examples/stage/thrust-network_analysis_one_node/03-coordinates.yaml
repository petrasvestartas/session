# Chapter 3: numerical coordinates for 3 fixed nodes j, k, l and 1 free node i, solving z_i = 4 m and varying scale r.
title: ONE NODE WITH COORDINATES
grid: {center: [0, 0], size: 10, step: 1, z: 0}
camera: {yaw: -112, pitch: 22}
palette: {free: ink}
points:
  O: [0, 0, 0]
  Gj: [-4, 3, 0]
  Gk: [0, -4, 0]
  Gl: [4, 3, 0]
  TOP: [0, 0, 7.2]
net:
  fixed: {j: [-4, 3, 1], k: [0, -4, 2], l: [4, 3, 1]}
  free: {i: [0, 0, 2.2]}
  cables: {ej: [i, j], ek: [i, k], el: [i, l]}
  q: {ej: 1.0, ek: 1.5, el: 1.0}
  load: {i: [0, 0, 9]}
slides:
  - title: GIVEN COORDINATES IN Γ AND Γ*
    steps:
      - say: 'Free node $i$ lies at plan origin $(0, 0)$ under load $P_i = 9\ \text{kN}$ ($r = 1$), supported by three fixed nodes $j, k, l$:'
        show: [cables, fixed, free]
        add:
          - {id: gj, line: [O, Gj], color: grey, width: 1.6, dash: true}
          - {id: gk, line: [O, Gk], color: grey, width: 1.6, dash: true}
          - {id: gl, line: [O, Gl], color: grey, width: 1.6, dash: true}
          - {id: di, line: [i, O], color: grey, width: 1.4, dash: true}
          - {id: p, arrow: ['i + [0, 0, 1.8]', i], color: load, width: 3.2, label: 'P_i'}
        do:
          - morph: {target: j.label, label: j, tex: 'j\,(-4,\,3,\,1)', dur: 0.6}
          - morph: {target: k.label, label: k, tex: 'k\,(0,\,-4,\,2)', dur: 0.6, with: true}
          - morph: {target: l.label, label: l, tex: 'l\,(4,\,3,\,1)', dur: 0.6, with: true}
          - eq: {tex: 'i = (0,\ 0,\ z_i),\qquad P_i = 9\ \text{kN},\qquad r = 1', color: load, align: left, size: 28}
          - eq: {tex: 'j = (-4,\ 3,\ 1),\qquad k = (0,\ -4,\ 2),\qquad l = (4,\ 3,\ 1)', align: left, size: 28}
          - eq: {tex: 'l_{\mathrm{H},ji} = \sqrt{4^2 + 3^2} = 5\ \text{m},\qquad l_{\mathrm{H},ki} = 4\ \text{m},\qquad l_{\mathrm{H},li} = 5\ \text{m}', align: left, size: 28}
          - eq: {tex: 'l^*_{\mathrm{H},ji} = 5\ \text{kN},\qquad l^*_{\mathrm{H},ki} = 6\ \text{kN},\qquad l^*_{\mathrm{H},li} = 5\ \text{kN}', align: left, size: 28}

  - title: SOLVING FOR HEIGHT zi
    steps:
      - say: 'Compute the branch ratios $d_j, d_k, d_l$, substitute into the equilibrium equation, and solve directly for $z_i$:'
        do:
          - eq: {tex: 'd_j = \frac{5}{5} = 1,\qquad d_k = \frac{6}{4} = 1.5,\qquad d_l = \frac{5}{5} = 1\quad\Longrightarrow\quad d_i = 3.5', align: left, size: 27}
          - eq: {tex: '3.5\,z_i - 1(1) - 1.5(2) - 1(1) - 9(1) = 0', align: left, size: 28}
          - eq: {tex: 'z_i = \frac{9 + 1 + 3 + 1}{3.5} = \frac{14}{3.5} = 4\ \text{m}', color: blue, align: left, size: 30}
          - solve: true
          - morph: {target: i.label, label: i, tex: 'i\,(0,\,0,\,4)', dur: 0.8}
          - highlight: [i]
      - say: 'Check vertical equilibrium using the tangent equation on all three compression bars:'
        do:
          - eq: {tex: 'F_{\mathrm{V},ji} = 5 \cdot \frac{4 - 1}{5} = 3\ \text{kN},\quad F_{\mathrm{V},ki} = 6 \cdot \frac{4 - 2}{4} = 3\ \text{kN},\quad F_{\mathrm{V},li} = 5 \cdot \frac{4 - 1}{5} = 3\ \text{kN}', align: left, size: 25}
          - eq: {tex: 'F_{\mathrm{V},ji} + F_{\mathrm{V},ki} + F_{\mathrm{V},li} = 3 + 3 + 3 = 9\ \text{kN} = P_i', color: blue, align: left, size: 28}

  - title: SCALE r OF THE FORCE DIAGRAM
    steps:
      - say: 'Scaling $\Gamma^*$ by $1/r$ changes horizontal thrusts and node height $z_i$ inversely, while $(x_i, y_i) = (0, 0)$ stays fixed:'
        do:
          - eq: {tex: 'z_i = \frac{P_i \cdot r + d_j z_j + d_k z_k + d_l z_l}{d_i}', color: blue, align: left}
          - eq: {tex: 'r = 1.0:\quad z_i = \frac{9(1.0) + 5}{3.5} = 4.000\ \text{m}', align: left}
          - solve: {load: {i: [0, 0, 4.5]}}
          - eq: {tex: 'r = 0.5\ \text{(double thrust)}:\quad z_i = \frac{9(0.5) + 5}{3.5} = 2.714\ \text{m}', align: left}
          - solve: {load: {i: [0, 0, 13.5]}}
          - eq: {tex: 'r = 1.5\ \text{(lower thrust)}:\quad z_i = \frac{9(1.5) + 5}{3.5} = 5.286\ \text{m}', align: left}
          - solve: {load: {i: [0, 0, 9]}}
