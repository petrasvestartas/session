# Chapter 2: one slide of knowns and unknown, then one slide holding the entire equilibrium derivation together.
title: KNOWNS, UNKNOWN, AND DERIVATION
grid: {center: [0, 0], size: 10, step: 1, z: 0}
camera: {yaw: -112, pitch: 22, fit: [i, j, k, l, P_TOP]}
points:
  i: [0, 0, 4]
  j: [-4, 3, 1]
  k: [0, -4, 2]
  l: [4, 3, 1]
  P_TOP: [0, 0, 6.0]
blocks:
  node3:
    - add:
        - {id: ej, line: [j, i], color: ink, width: 2.2}
        - {id: ek, line: [k, i], color: ink, width: 2.2}
        - {id: el, line: [l, i], color: ink, width: 2.2}
        - {id: fj, arrow: [j, 'lerp(j, i, 0.85)'], color: ink, width: 3.2, label: 'F_{ji}', dir: [-0.2, 1]}
        - {id: fk, arrow: [k, 'lerp(k, i, 0.85)'], color: ink, width: 3.2, label: 'F_{ki}', dir: [1, -0.2]}
        - {id: fl, arrow: [l, 'lerp(l, i, 0.85)'], color: ink, width: 3.2, label: 'F_{li}', dir: [0.4, 1]}
        - {id: pi, arrow: [P_TOP, i], color: load, width: 3.2, label: 'P_i', dir: [1, 0]}
        - {id: jp, point: j, color: fixed, label: 'j', dir: [-1, 0.2]}
        - {id: kp, point: k, color: fixed, label: 'k', dir: [1, -0.4]}
        - {id: lp, point: l, color: fixed, label: 'l', dir: [1, 0.2]}
        - {id: ip, point: i, color: free, label: 'i', dir: [-1, 0.5]}
slides:
  - title: ALL KNOWNS AND THE ONE UNKNOWN
    steps:
      - say: 'Unlike Force Density where $(x, y, z)$ are all unknown, Thrust Network Analysis fixes $(x, y)$ in $\Gamma$ and solves only for height $z_i$:'
        node3: true
        size: 28
        gap: 18
        do:
          - eq: {tex: '\textbf{Unknown:}\quad z_i = \ ?\quad\text{at free node } i\,(x_i,\ y_i,\ z_i)', color: blue, align: left, size: 28}
          - eq: {tex: '\textbf{Known supports:}\quad j\,(x_j, y_j, z_j),\quad k\,(x_k, y_k, z_k),\quad l\,(x_l, y_l, z_l)', align: left, size: 26, gap: 20}
          - eq: {tex: '\textbf{Known in }\Gamma\textbf{:}\quad l_{\mathrm{H},ji} = \sqrt{(x_i - x_j)^2 + (y_i - y_j)^2}', align: left, size: 26, gap: 20}
          - eq: {tex: '\textbf{Known in }\Gamma^*\textbf{:}\quad l^*_{\mathrm{H},ji} = \sqrt{(x^*_i - x^*_j)^2 + (y^*_i - y^*_j)^2},\qquad r', align: left, size: 26, gap: 20}
          - eq: {tex: '\textbf{Known load:}\quad P_i\quad\text{(vertical gravity load at node } i\text{)}', color: load, align: left, size: 26, gap: 20}

  - title: EQUILIBRIUM DERIVATION ON ONE SLIDE
    steps:
      - say: 'Horizontal equilibrium is satisfied by the reciprocal force diagram $\Gamma^*$, scaled by $1/r$:'
        do:
          - eq: {tex: '\boxed{F_{\mathrm{H},ji} + F_{\mathrm{H},ki} + F_{\mathrm{H},li} = 0}\qquad F_{\mathrm{H},ji} = \frac{1}{r} \cdot l^*_{\mathrm{H},ji}', align: left, size: 25, gap: 14}
      - say: 'Vertical equilibrium sums the upward branch thrusts and substitutes the tangent equation $F_{\mathrm{V}} = F_{\mathrm{H}} \cdot \frac{\Delta z}{l_{\mathrm{H}}}$:'
        do:
          - eq: {tex: '\boxed{F_{\mathrm{V},ji} + F_{\mathrm{V},ki} + F_{\mathrm{V},li} = P_i}\qquad \boxed{F_{\mathrm{V}} = F_{\mathrm{H}} \cdot \frac{\Delta z}{l_{\mathrm{H}}}}', align: left, size: 25, gap: 14}
          - eq: {id: vsub, tex: 'F_{\mathrm{H},ji} \cdot \frac{z_i - z_j}{ {{l_{\mathrm{H},ji}}} } + F_{\mathrm{H},ki} \cdot \frac{z_i - z_k}{ {{l_{\mathrm{H},ki}}} } + F_{\mathrm{H},li} \cdot \frac{z_i - z_l}{ {{l_{\mathrm{H},li}}} } = P_i', align: left, size: 25, gap: 14}
          - color: {target: 'vsub{l_{\mathrm{H},ji}}', color: pink}
          - color: {target: 'vsub{l_{\mathrm{H},ki}}', color: pink, with: true}
          - color: {target: 'vsub{l_{\mathrm{H},li}}', color: pink, with: true}
      - say: 'Substitute $F_{\mathrm{H},ji} = \frac{1}{r} \cdot l^*_{\mathrm{H},ji}$ from $\Gamma^*$ and multiply both sides by $r$:'
        do:
          - eq: {tex: 'l^*_{\mathrm{H},ji} \cdot \frac{z_i - z_j}{l_{\mathrm{H},ji}} + l^*_{\mathrm{H},ki} \cdot \frac{z_i - z_k}{l_{\mathrm{H},ki}} + l^*_{\mathrm{H},li} \cdot \frac{z_i - z_l}{l_{\mathrm{H},li}} = P_i \cdot r', align: left, size: 25, gap: 14}
      - say: 'Group the unknown height $z_i$ apart from the known support heights $z_j, z_k, z_l$:'
        do:
          - eq: {tex: '\left(\frac{l^*_{\mathrm{H},ji}}{l_{\mathrm{H},ji}} + \frac{l^*_{\mathrm{H},ki}}{l_{\mathrm{H},ki}} + \frac{l^*_{\mathrm{H},li}}{l_{\mathrm{H},li}}\right) z_i - \frac{l^*_{\mathrm{H},ji}}{l_{\mathrm{H},ji}}\,z_j - \frac{l^*_{\mathrm{H},ki}}{l_{\mathrm{H},ki}}\,z_k - \frac{l^*_{\mathrm{H},li}}{l_{\mathrm{H},li}}\,z_l - P_i \cdot r = 0', align: left, size: 23, gap: 14}
      - say: 'Define the known branch ratios $d_j = l^*_{\mathrm{H},ji} / l_{\mathrm{H},ji}$ and $d_i = d_j + d_k + d_l$ to obtain the linear equation for $z_i$:'
        do:
          - eq: {tex: '\boxed{d_i \cdot z_i - d_j \cdot z_j - d_k \cdot z_k - d_l \cdot z_l - P_i \cdot r = 0}\quad\Longrightarrow\quad z_i = \frac{P_i \cdot r + d_j z_j + d_k z_k + d_l z_l}{d_i}', color: blue, align: left, size: 24, gap: 14}
