# Chapter 5: 3D member lengths, axial compressive thrusts, equilibrium verification, and reciprocal scale r.
title: 3D THRUSTS AND SCALE
grid: {center: [0, 0], size: 6, step: 1, z: 0}
camera: {yaw: -62, pitch: 24}
palette: {free: ink}
points:
  TOP: [0, 0, 6.2]
net:
  fixed: {n1: [2, 0, 0.5], n2: [0, 2, 0.8], n3: [-2, 0, 0.5], n4: [0, -2, 0.8]}
  free: {n0: [0, 0, 3.52857]}
  cables: {e1: [n0, n1], e2: [n0, n2], e3: [n0, n3], e4: [n0, n4]}
  q: {e1: 0.75, e2: 1.0, e3: 0.75, e4: 1.0}
  load: {n0: [0, 0, 10]}
slides:
  - title: 3D FORCES AND VERIFICATION
    steps:
      - say: 'From $z_0 = 3.529\ \text{m}$, each vertical rise $\Delta z_j = z_0 - z_j$ gives the upward vertical thrust $F_{\mathrm{V},j} = q_j\,\Delta z_j$:'
        show: [cables, fixed, free, forces]
        add:
          - {id: p, arrow: ['n0 + [0, 0, 1.1]', n0], color: load, width: 3.2, label: 'P_0'}
        do:
          - eq: {tex: '\Delta z_{1,3} = 3.529 - 0.500 = 3.029\ \text{m},\qquad \Delta z_{2,4} = 3.529 - 0.800 = 2.729\ \text{m}', align: left}
          - eq: {tex: 'F_{\mathrm{V},1} = F_{\mathrm{V},3} = 0.75 \cdot 3.029 = 2.271\ \text{kN}', align: left}
          - eq: {tex: 'F_{\mathrm{V},2} = F_{\mathrm{V},4} = 1.00 \cdot 2.729 = 2.729\ \text{kN}', align: left}
      - say: 'Vertical thrusts balance $P_0 = 10\ \text{kN}$ exactly, and 3D lengths give the compressive axial thrusts:'
        do:
          - eq: {tex: 'L_{1,3} = \sqrt{2^2 + 3.029^2} = 3.629\ \text{m},\qquad F_{1,3} = 2.722\ \text{kN}', align: left}
          - eq: {tex: 'L_{2,4} = \sqrt{2^2 + 2.729^2} = 3.383\ \text{m},\qquad F_{2,4} = 3.383\ \text{kN}', color: pink, align: left}
          - eq: {tex: '\sum F_{\mathrm{V}} = 2.271 + 2.729 + 2.271 + 2.729 = 10.000\ \text{kN} = P_0', color: blue, align: left}

  - title: SCALE OF THE FORCE DIAGRAM
    steps:
      - say: 'Changing the reciprocal scale $r$ adjusts horizontal thrusts and vault height directly, while $(x_0, y_0) = (0, 0)$ stays fixed in plan.'
        do:
          - eq: {tex: 'z_0 = \frac{P_0\,r + \sum d_j z_j}{d_0}', color: blue, align: left}
          - eq: {tex: 'r = 1.0:\quad z_0 = \frac{10(1.0) + 2.35}{3.50} = 3.529\ \text{m}', align: left}
          - solve: {load: {n0: [0, 0, 5]}}
          - eq: {tex: 'r = 0.5\ \text{(double thrust)}:\quad z_0 = \frac{10(0.5) + 2.35}{3.50} = 2.100\ \text{m}', align: left}
          - solve: {load: {n0: [0, 0, 15]}}
          - eq: {tex: 'r = 1.5\ \text{(lower thrust)}:\quad z_0 = \frac{10(1.5) + 2.35}{3.50} = 4.957\ \text{m}', align: left}
          - solve: {load: {n0: [0, 0, 10]}}
