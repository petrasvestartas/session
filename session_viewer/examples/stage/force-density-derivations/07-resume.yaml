# Derivations 7: the résumé. Every step of chapters 1-6 on one slide, then the method as a procedure.
title: Résumé
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
points:
  X: [3.6, 3.4, 1.9]      # the free node, at a guess until the solve
  P0: [3, 3, 0.25]
  P1: [0, 0, 0]
  P2: [5, 0, 3]
  P3: [0, 7, 3]
  P4: [7, 5, 0]
slides:
  - title: From one bar to one linear solve
    steps:
      - say: 'Start from geometry: the length of one bar between the free node and an anchor.'
        do:
          - add:
              - {id: n1, point: P1, color: fixed, label: 'P_1'}
              - {id: n2, point: P2, color: fixed, label: 'P_2'}
              - {id: n3, point: P3, color: fixed, label: 'P_3'}
              - {id: n4, point: P4, color: fixed, label: 'P_4'}
              - {id: a, line: [X, P1]}
              - {id: b, line: [X, P2]}
              - {id: c, line: [X, P3]}
              - {id: d, line: [X, P4]}
              - {id: n0, point: X, color: free, label: 'P_0'}
              - {id: p, arrow: [X, 'X + [0, 0, -1.6]'], color: load, width: 3.6, label: 'p'}
            dur: 0.9
          - add: {id: r1, tex: 'l_k = \sqrt{(x_k - x_0)^2 + (y_k - y_0)^2 + (z_k - z_0)^2}', align: '=', size: 28}
      - say: 'Nudge the node: the length changes by the negative direction cosine.'
        do:
          - dim: [r1]
          - add: {id: r2, tex: '\frac{\partial l_k}{\partial x_0} = \frac{-(x_k - x_0)}{l_k}', align: '=', size: 28}
      - say: 'All bars at once: the transposed Jacobian, written with the branch–node matrix.'
        do:
          - dim: [r2]
          - add: {id: r3, tex: '\Big(\frac{\partial \mathbf{f}}{\partial \mathbf{x}}\Big)^{T} = \mathbf{C}_N^{T}\mathbf{U}\mathbf{L}^{-1}', align: '=', size: 28}
      - say: 'Equilibrium of the free node: the bar forces, projected, balance the load.'
        do:
          - dim: [r3]
          - add: {id: r4, tex: '\mathbf{C}_N^{T}\mathbf{U}\mathbf{L}^{-1}\mathbf{f} = \mathbf{p}', align: '=', size: 28}
      - say: 'Prescribe force densities $\mathbf{q} = \mathbf{L}^{-1}\mathbf{f}$: the lengths drop out.'
        do:
          - dim: [r4]
          - add: {id: r5, tex: '\mathbf{C}_N^{T}\mathbf{U}\mathbf{q} = \mathbf{p}', align: '=', size: 28}
      - say: 'Swap the diagonal, $\mathbf{U}\mathbf{q} = \mathbf{Q}\mathbf{C}\mathbf{x}$, and split free from fixed.'
        do:
          - dim: [r5]
          - add: {id: r6, tex: '\mathbf{D}_N\mathbf{x}_N = \mathbf{p} - \mathbf{D}_F\mathbf{x}_F', align: '=', size: 28}
      - say: 'One linear solve gives the free coordinates: the node moves to equilibrium.'
        do:
          - dim: [r6]
          - add: {id: r7, tex: '\mathbf{x}_N = \mathbf{D}_N^{-1}(\mathbf{p} - \mathbf{D}_F\mathbf{x}_F)', align: '=', size: 28, color: free}
          - move: {point: X, to: P0, dur: 2.0}
          - {indicate: [r7], color: free}
      - say: 'Then the forces, and for a chosen material the lengths to cut.'
        do:
          - add: {id: r8, tex: '\mathbf{f} = \mathbf{L}\mathbf{q}, \qquad l_0 = \frac{l}{1 + \frac{q\,l}{EA}}', align: '=', size: 28}

  - title: The method as a procedure
    steps:
      - say: 'Four things go in. All of them are chosen by the designer.'
        do:
          - add: {id: in1, text: '**In.** Fixed points $\mathbf{x}_F$, topology $\mathbf{C}$, force densities $\mathbf{q}$, loads $\mathbf{p}$.'}
          - indicate: [n1, n2, n3, n4]
      - say: 'Two small matrices and one solve per coordinate direction.'
        do:
          - add: {id: s1, tex: '\mathbf{D}_N = \mathbf{C}_N^{T}\mathbf{Q}\mathbf{C}_N, \qquad \mathbf{D}_F = \mathbf{C}_N^{T}\mathbf{Q}\mathbf{C}_F'}
          - add: {id: s2, tex: '\mathbf{x}_N = \mathbf{D}_N^{-1}(\mathbf{p} - \mathbf{D}_F\mathbf{x}_F)', color: free}
      - say: 'Out comes the equilibrium shape, with its forces and cutting lengths.'
        do:
          - add: {id: out1, text: '**Out.** Free coordinates $\mathbf{x}_N$, forces $\mathbf{f} = \mathbf{L}\mathbf{q}$, cut lengths $\mathbf{l}_0$.'}
          - indicate: [n0]
      - say: 'Not satisfied with the shape? Change $\mathbf{q}$, $\mathbf{p}$, the anchors or the topology, and solve again: each choice gives one unique equilibrium.'
        do:
          - {indicate: [s2], color: free}
