# Equilibrium of one node in 2D: a load on two cables, solved by a force diagram and then by projections.
title: Equilibrium of a node
camera: {view: top}       # all points at z = 0: x to the right, y up
points:
  A: [-4, 3, 0]           # supports
  B: [3, 4, 0]
  n: [0, 0, 0]            # the node that carries the load
  W1: [0, -4, 0]          # forces drawn at 0.4 units per kN
  F1: [-1.92, 1.44, 0]
  F2: [1.92, 2.56, 0]
  Q0: [7, 2.4, 0]         # the force diagram, beside the structure
  Q1: [7, -1.6, 0]
  Q2: [8.92, 0.96, 0]
slides:
  - title: A load on two cables
    steps:
      - say: 'Two cables run from supports $A$ and $B$ to a node $n$. A load of $W = 10$ kN hangs there.'
        add:
          - {id: A, point: A, color: fixed, label: 'A'}
          - {id: B, point: B, color: fixed, label: 'B'}
          - {id: c1, line: [n, A]}
          - {id: c2, line: [n, B]}
          - {id: W, arrow: [n, W1], color: load, width: 3.6, label: 'W'}
          - {id: n, point: n, color: free, label: 'n'}
      - say: 'A cable can only pull, and only along itself. How hard does each cable pull?'
        do:
          - add:
              - {id: f1, arrow: [n, F1], color: accent, width: 3.6, label: 'f_1'}
              - {id: f2, arrow: [n, F2], color: accent, width: 3.6, label: 'f_2'}
          - tex: 'f_1 = \ ?\qquad f_2 = \ ?'
      - say: 'The node does not move, so the three forces cancel. That is **equilibrium**.'
        eq: '\mathbf{f}_1 + \mathbf{f}_2 + \mathbf{W} = \mathbf{0}'

  - title: By drawing · the force diagram
    steps:
      - say: 'Choose a scale of 0.4 units per kN. Draw the load beside the structure: 10 kN is 4 units.'
        do:
          - add:
              - {id: q0, point: Q0, color: dim, width: 1.2}
              - {id: q1, point: Q1, color: dim, width: 1.2}
          - derive: {from: W, id: Wd, line: [Q0, Q1], color: load, width: 2.2}
      - say: 'Through its lower end, draw a line parallel to cable 2. Through its upper end, one parallel to cable 1.'
        do:
          - derive: {from: c2, id: d2, line: [Q1, 'Q1 + 1.35*(Q2 - Q1)'], color: dim, width: 1.4}
          - derive: {from: c1, id: d1, line: [Q0, 'Q0 + 1.45*(Q2 - Q0)'], color: dim, width: 1.4}
      - say: 'The two lines cross at one point. That point closes the triangle.'
        add: {id: q2, point: Q2, color: dim, width: 1.2}
      - say: 'Draw the arrows tip to tail: the load, $f_2$, then $f_1$ back to the start. The polygon is **closed**.'
        do:
          - remove: [Wd, d1, d2]
          - add: {id: Wa, arrow: [Q0, Q1], color: load, width: 3.6, label: 'W'}
          - add: {id: t2, arrow: [Q1, Q2], color: accent, width: 3.6, label: 'f_2'}
          - add: {id: t1, arrow: [Q2, Q0], color: accent, width: 3.6, label: 'f_1'}
      - say: 'Measure the sides and divide by the scale.'
        do:
          - eq: 'f_2 = 3.2 \,/\, 0.4 = 8\ \text{kN}'
          - eq: 'f_1 = 2.4 \,/\, 0.4 = 6\ \text{kN}'

  - title: By computing · the cosines
    steps:
      - say: 'Now the same without a ruler. Cable 1 goes from $n$ to $A$: 4 to the left and 3 up.'
        do:
          - dim: [f1, f2, f1.label, f2.label]
          - project: {of: c1, parts: '\Delta %_1', axes: [x, y]}
          - eq: '\Delta x_1 = -4, \qquad \Delta y_1 = 3'
      - say: 'Pythagoras gives its length.'
        eq: 'l_1 = \sqrt{(-4)^2 + 3^2} = 5'
      - say: 'The **cosine** to an axis is the share of the length along that axis.'
        do:
          - eq: {tex: '\cos\alpha_1 = \frac{\Delta x_1}{l_1} = \frac{-4}{5} = -0.8', color: x}
          - eq: {tex: '\cos\beta_1 = \frac{\Delta y_1}{l_1} = \frac{3}{5} = 0.6', color: y}
      - say: 'Cable 2 works the same way: 3 to the right, 4 up, length 5.'
        do:
          - remove: [c1.box, c1.x, c1.y, c1.x.label, c1.y.label]
          - project: {of: c2, parts: '\Delta %_2', axes: [x, y]}
          - eq: {tex: '\cos\alpha_2 = \frac{3}{5} = 0.6, \qquad \cos\beta_2 = \frac{4}{5} = 0.8'}

  - title: By computing · the projections
    steps:
      - say: 'A force points along its cable, so it splits in the same shares: each part is force times cosine.'
        do:
          - remove: [c2.box, c2.x, c2.y, c2.x.label, c2.y.label]
          - undim: [f1, f2, f1.label, f2.label]
          - project: {of: f1, parts: 'f_{1,%}', axes: [x, y]}
          - project: {of: f2, parts: 'f_{2,%}', axes: [x, y]}
          - eq: 'f_{1,x} = f_1\cos\alpha_1 = -0.8\,f_1, \qquad f_{1,y} = f_1\cos\beta_1 = 0.6\,f_1'
          - eq: 'f_{2,x} = f_2\cos\alpha_2 = 0.6\,f_2, \qquad f_{2,y} = f_2\cos\beta_2 = 0.8\,f_2'
      - say: 'Equilibrium, one axis at a time: the $x$ parts cancel, and the $y$ parts carry the load of 10.'
        do:
          - eq: {tex: 'x:\quad -0.8\, f_1 + 0.6\, f_2 = 0', color: x}
          - eq: {tex: 'y:\quad 0.6\, f_1 + 0.8\, f_2 - 10 = 0', color: y}
      - say: 'Two equations, two unknowns. The first gives $f_1 = 0.75 f_2$. Put that into the second.'
        eq: '0.45\, f_2 + 0.8\, f_2 = 10 \quad\Rightarrow\quad f_2 = 8, \quad f_1 = 6'
      - say: 'Check along $x$: $-4.8 + 4.8 = 0$. Along $y$: $3.6 + 6.4 - 10 = 0$. The drawing gave the same 6 kN and 8 kN.'
        highlight: [t1, t2, Wa]
      - say: 'A closed force polygon and zero sums of projections say the same thing. In space there is a third sum, along $z$: the next presentation.'
        text: '**Next:** Force density 1 · the equations of five nodes'
