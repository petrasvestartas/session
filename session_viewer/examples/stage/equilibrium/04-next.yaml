# Chapter 4: from one node in 2D to many nodes in 3D, where the positions become the unknowns. Leads to the next presentation.
title: What comes next
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: From one node in 2D to a net in 3D
    steps:
      - say: 'In space a node can also move up and down. Each force gets a third part, along $z$, and there is a third sum.'
        do:
          - eq: {tex: 'x:\quad \textstyle\sum_k f_k \cos\alpha_k + p_x = 0', color: x}
          - eq: {tex: 'y:\quad \textstyle\sum_k f_k \cos\beta_k + p_y = 0', color: y}
          - eq: {tex: 'z:\quad \textstyle\sum_k f_k \cos\gamma_k + p_z = 0', color: z}
      - say: 'Here one free node hangs on four cables in 3D. Its place is not given: it is drawn at a guess.'
        show: net
      - say: 'With many nodes the question turns around. The unknowns are no longer the forces in the cables but the positions of the nodes, and the cables decide where the nodes come to rest.'
        solve: true
      - say: 'Finding those positions with one linear solve is the **force density method**: the next presentation.'
        text: '**Next:** Force density 1 · the equations of five nodes'
