# Chapter 3: the same node with numbers. Each force projected onto x and y, one sum per axis, two equations solved.
title: Projections
camera: {view: top}       # all points at z = 0: x to the right, y up
points:
  A: [-4, 3, 0]
  B: [3, 4, 0]
  n: [0, 0, 0]
  W1: [0, -4, 0]          # forces drawn at 0.4 units per kN
  F1: [-1.92, 1.44, 0]
  F2: [1.92, 2.56, 0]
slides:
  - title: Split each force into x and y
    steps:
      - say: 'The same node. Instead of drawing a triangle, split every force into a part along $x$ and a part along $y$.'
        add:
          - {id: A, point: A, color: fixed, label: 'A'}
          - {id: B, point: B, color: fixed, label: 'B'}
          - {id: c1, line: [n, A]}
          - {id: c2, line: [n, B]}
          - {id: n, point: n, color: free, label: 'n'}
          - {id: W, arrow: [n, W1], color: load, width: 3.6, label: 'W'}
          - {id: f1, arrow: [n, F1], color: accent, width: 3.6, label: 'f_1'}
          - {id: f2, arrow: [n, F2], color: accent, width: 3.6, label: 'f_2'}
      - say: 'Walk from the tail of $f_1$ to its tip: first along $x$, then along $y$. The two edges are its parts.'
        project: {of: f1, parts: 'f_{1,%}', axes: [x, y]}
      - say: 'Cable 1 is 5 long and runs 4 to the left and 3 up. The share along each axis is the **direction cosine**, and the force splits in the same shares.'
        do:
          - eq: {tex: 'f_{1,x} = f_1 \cdot \tfrac{-4}{5} = -0.8\,f_1', color: x}
          - eq: {tex: 'f_{1,y} = f_1 \cdot \tfrac{3}{5} = 0.6\,f_1', color: y}
      - say: 'Cable 2 is 5 long and runs 3 to the right and 4 up.'
        do:
          - project: {of: f2, parts: 'f_{2,%}', axes: [x, y]}
          - eq: {tex: 'f_{2,x} = f_2 \cdot \tfrac{3}{5} = 0.6\,f_2', color: x}
          - eq: {tex: 'f_{2,y} = f_2 \cdot \tfrac{4}{5} = 0.8\,f_2', color: y}
      - say: 'The load points straight down: no $x$ part, and $-10$ along $y$.'
        eq: 'W_x = 0, \qquad W_y = -10'

  - title: One sum per axis
    steps:
      - say: 'The node does not move along $x$: the $x$ parts cancel.'
        eq: {tex: 'x:\quad -0.8\,f_1 + 0.6\,f_2 = 0', color: x}
        highlight: [f1.x, f2.x]
      - say: 'It does not move along $y$ either: the $y$ parts and the load cancel.'
        eq: {tex: 'y:\quad 0.6\,f_1 + 0.8\,f_2 - 10 = 0', color: y}
        highlight: [f1.y, f2.y, W]
      - say: 'Two equations for the two unknowns $f_1$ and $f_2$.'
        text: 'No drawing, no scale: only arithmetic.'

  - title: Solve the two equations
    steps:
      - say: 'From the $x$ sum, $f_1$ in terms of $f_2$.'
        eq: 'f_1 = \tfrac{0.6}{0.8}\,f_2 = 0.75\,f_2'
      - say: 'Put it into the $y$ sum.'
        eq: '0.6 \cdot 0.75\,f_2 + 0.8\,f_2 = 10'
      - say: 'Collect $f_2$.'
        becomes: '1.25\,f_2 = 10'
      - say: 'Divide.'
        becomes: 'f_2 = 10 \,/\, 1.25 = 8\ \text{kN}'
      - say: 'And back to $f_1$. The same 6 kN and 8 kN as the drawing.'
        eq: 'f_1 = 0.75 \cdot 8 = 6\ \text{kN}'

  - title: Drawing and arithmetic say the same
    steps:
      - say: 'Draw the force triangle of the last chapter again, beside the node.'
        do:
          - remove: [f1.box, f1.x, f1.y, f1.x.label, f1.y.label, f2.box, f2.x, f2.y, f2.x.label, f2.y.label]
          - camera: {view: top, fit: [A, B, W1, '[10, 2, 0]'], with: true}
          - derive: {from: W, id: Wd, arrow: ['[7, 2, 0]', '[7, -2, 0]'], color: load, width: 3.6}
          - derive: {from: f2, id: t2, arrow: ['[7, -2, 0]', '[8.92, 0.56, 0]'], color: accent, width: 3.6}
          - derive: {from: f1, id: t1, arrow: ['[8.92, 0.56, 0]', '[7, 2, 0]'], color: accent, width: 3.6}
      - say: 'Along $x$: $f_2$ goes 4.8 kN to the right, $f_1$ comes 4.8 kN back. That is the $x$ sum.'
        do:
          - project: {of: t2, axes: [x, y]}
          - project: {of: t1, axes: [y, x]}
          - eq: {tex: 'x:\quad -0.8 \cdot 6 + 0.6 \cdot 8 = -4.8 + 4.8 = 0', color: x}
          - highlight: [t2.x, t1.x]
      - say: 'Along $y$: $f_2$ rises 6.4 kN and $f_1$ 3.6 kN, together exactly the 10 kN of the load. That is the $y$ sum.'
        eq: {tex: 'y:\quad 0.6 \cdot 6 + 0.8 \cdot 8 - 10 = 3.6 + 6.4 - 10 = 0', color: y}
        highlight: [t2.y, t1.y, Wd]
      - say: 'A triangle that closes along $x$ and along $y$ is a closed triangle. Graphic statics and the two sums are the same statement.'
        text: 'closed force polygon $\iff$ every sum of projections is zero'
