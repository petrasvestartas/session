title: '10 · GTAO Horizon Occlusion and Silhouette Outlines'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [0, 0], size: 5, step: 1, z: 0}
camera: {yaw: -42, pitch: 24, fit: [HL, HR, N_TOP, W_TOP]}
points:
  P: [0, 0, 0]
  N_TOP: [0, 0, 2.1]
  HL: [-1.8, 0, 0]
  HL1: [-1.56, 0, 1.0]
  HL2: [-0.9, 0, 1.73]
  HR2: [0.9, 0, 1.73]
  HR1: [1.56, 0, 1.0]
  HR: [1.8, 0, 0]
  W_BASE: [1.35, -0.5, 0]
  W_TOP: [2.15, 0.5, 1.35]
  OCC: [1.35, 0, 1.25]
slides:
  - title: 'ARCTIC HORIZON ANGLES AND SILHOUETTES'
    steps:
      - say: 'Arctic mode integrates unoccluded hemisphere horizon angles around the surface normal $\mathbf{n}$.'
        add:
          - {id: arc, polyline: [HL, HL1, HL2, N_TOP, HR2, HR1, HR], color: '#3057b1', width: 2.4, dash: true}
          - {id: base, line: [HL, HR], color: grey, width: 1.6}
          - {id: nrm, arrow: [P, N_TOP], color: '#3057b1', width: 3.4, label: '\mathbf{n}'}
          - {id: pP, point: P, color: ink, label: '\mathbf{p}'}
        eq: 'A(\mathbf{p}) = \frac{1}{\pi}\int_0^{\pi} \bigl(\sin\theta_1(\phi) + \sin\theta_2(\phi)\bigr)\,d\phi'
      - say: 'Neighbouring geometry raises the horizon ray $\theta_1$, darkening creases and timber joints during orbit.'
        add:
          - {id: wall, cuboid: [W_BASE, W_TOP], color: pink, width: 2.0}
          - {id: hRay, arrow: [P, OCC], color: pink, width: 3.0, label: '\theta_1'}
          - {id: openRay, arrow: [P, HL2], color: green, width: 2.8, label: '\theta_2'}
        text: 'Face coverage feeds continuous selection silhouettes while glyphon shapes crisp 3D scene text.'
