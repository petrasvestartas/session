title: '8 · 13-Handle 3D Gumball and Ray-Axis Projection'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [0, 0], size: 5, step: 1, z: -0.8}
camera: {yaw: -45, pitch: 26, fit: [C, GX, GY, GZ, RO, R1]}
points:
  C: [0, 0, 0]
  GX: [2.2, 0, 0]
  GY: [0, 2.2, 0]
  GZ: [0, 0, 2.2]
  PXY0: [0.55, 0.55, 0]
  PXY1: [1.05, 0.55, 0]
  PXY2: [1.05, 1.05, 0]
  PXY3: [0.55, 1.05, 0]
  RO: [-1.4, -1.5, 1.9]
  R1: [1.45, 0.15, 0.1]
  PROJ: [1.45, 0, 0]
  B0: [-0.7, -0.5, -0.5]
  B1: [0.7, 0.5, 0.5]
slides:
  - title: 'WORLD, OBJECT AND CPLANE BASIS HANDLES'
    steps:
      - say: 'The gumball places 3 axis arrows, 3 planar squares, 3 arcs, and 3 scale boxes at pivot $\mathbf{c}$.'
        add:
          - {id: body, cuboid: [B0, B1], color: grey, width: 1.4}
          - {id: axX, arrow: [C, GX], color: pink, width: 3.6, label: '\mathbf{e}_x'}
          - {id: axY, arrow: [C, GY], color: green, width: 3.6, label: '\mathbf{e}_y'}
          - {id: axZ, arrow: [C, GZ], color: '#3057b1', width: 3.6, label: '\mathbf{e}_z'}
          - {id: sqXY, polyline: [PXY0, PXY1, PXY2, PXY3, PXY0], color: '#3057b1', width: 2.4}
          - {id: pC, point: C, color: ink, label: '\mathbf{c}'}
        eq: '\Delta\mathbf{t} = (s - s_0)\,\mathbf{e}_x, \qquad s = \operatorname{arg}\min_s \|\mathbf{c} + s\,\mathbf{e}_x - (\mathbf{o} + t\,\mathbf{d})\|'
      - say: 'Dragging updates GPU instance matrices in $O(1)$ per frame and commits one undo step on release.'
        add:
          - {id: dragRay, arrow: [RO, R1], color: yellow, width: 2.8, dash: true}
          - {id: dropSeg, line: [R1, PROJ], color: ink, width: 2.0, dash: true}
          - {id: pProj, point: PROJ, color: pink, label: 's\,\mathbf{e}_x'}
        text: 'World, Object, and CPlane modes rotate $(\mathbf{e}_x, \mathbf{e}_y, \mathbf{e}_z)$ while preserving constant pixel size.'
