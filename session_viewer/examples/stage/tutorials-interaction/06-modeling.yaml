title: '6 · Construction Plane Snapping and Undoable Extrusion'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [1.5, 1.5], size: 5, step: 1, z: 0}
camera: {yaw: -48, pitch: 28, fit: [EYE, B0, B1, B2, B3, T2]}
points:
  EYE: [-0.8, -1.0, 2.8]
  B0: [0.4, 0.4, 0]
  B1: [2.8, 0.4, 0]
  B2: [2.8, 2.4, 0]
  B3: [0.4, 2.4, 0]
  MID: [1.6, 0.4, 0]
  T2: [2.8, 2.4, 1.8]
slides:
  - title: 'CPLANE RAY SNAP AND ATOMIC UNDO'
    steps:
      - say: 'Interactive tools intersect the cursor ray with the construction plane and rank OSnap candidates.'
        add:
          - {id: basePoly, polyline: [B0, B1, B2, B3, B0], color: '#3057b1', width: 3.0}
          - {id: ray, arrow: [EYE, B1], color: pink, width: 2.6, dash: true, label: '\mathbf{r}(t)'}
          - {id: pSnap, point: B1, color: pink, label: '\mathrm{End}'}
          - {id: pMid, point: MID, color: '#3057b1', label: '\mathrm{Mid}'}
        eq: 't = \frac{(\mathbf{o}_c - \mathbf{e})\cdot\mathbf{n}_c}{\mathbf{d}\cdot\mathbf{n}_c}, \qquad \mathbf{p}_{\mathrm{hit}} = \mathbf{e} + t\,\mathbf{d}'
      - say: 'Pointer moves mutate the preview row at zero undo cost; pressing Enter commits one atomic Edit step.'
        add:
          - {id: solidBox, cuboid: [B0, T2], color: '#3057b1', width: 1.8}
          - {id: extVec, arrow: [B2, T2], color: '#3057b1', width: 3.4, label: 'h\,\mathbf{n}_c'}
          - {id: pTop, point: T2, color: '#3057b1'}
        code: |
          REGISTRY: 86 typed Specs -> &mut dyn CommandHost
          Preview:  0 undo steps during cursor drag; 1 Edit step on commit
