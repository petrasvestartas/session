title: '9 · Shared Mesh Definition and Instanced Placements'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [1.8, 1.0], size: 6, step: 1, z: 0}
camera: {yaw: -48, pitch: 26, fit: [D0, D1, I1B, I2B, I3B]}
points:
  D0: [-1.2, -0.5, 0]
  D1: [-0.2, 0.5, 1.2]
  DC: [-0.7, 0.0, 0.6]
  I1A: [1.2, -1.2, 0]
  I1B: [2.2, -0.2, 1.2]
  I1C: [1.7, -0.7, 0.6]
  I2A: [1.6, 0.6, 0]
  I2B: [2.6, 1.6, 1.6]
  I2C: [2.1, 1.1, 0.8]
  I3A: [3.2, -0.2, 0]
  I3B: [4.2, 0.8, 1.2]
  I3C: [3.7, 0.3, 0.6]
slides:
  - title: 'SHARED ARENA MESH AND INSTANCE ROWS'
    steps:
      - say: 'An InstanceDefinition uploads its vertex and segment buffers once into the shared GPU arena.'
        add:
          - {id: defBox, cuboid: [D0, D1], color: ink, width: 2.2}
          - {id: pDef, point: DC, color: ink, label: 'D_0'}
        eq: '\mathbf{M}_{\mathrm{world}} = \mathbf{M}_{\mathrm{parent}} \cdot \mathbf{M}_{\mathrm{child}}, \qquad N_{\mathrm{verts}} = O(1)'
      - say: 'Each InstanceRef writes only a 112-byte Instance row with its own matrix, layer visibility, and colour.'
        add:
          - {id: b1, cuboid: [I1A, I1B], color: '#3057b1', width: 2.0}
          - {id: b2, cuboid: [I2A, I2B], color: pink, width: 2.0}
          - {id: b3, cuboid: [I3A, I3B], color: green, width: 2.0}
          - {id: r1, arrow: [DC, I1C], color: '#3057b1', width: 2.4, label: '\mathbf{M}_1'}
          - {id: r2, arrow: [DC, I2C], color: pink, width: 2.4, label: '\mathbf{M}_2'}
          - {id: r3, arrow: [DC, I3C], color: green, width: 2.4, label: '\mathbf{M}_3'}
        text: 'The Layers panel virtualizes row layout; appearance edits make hide, lock, colour, and alpha undoable.'
