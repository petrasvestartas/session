title: '7 · GPU ID Picking and Selection'
split: 0.50
slides:
  - title: 'PICK WINDOW AND SELECTION STATE'
    steps:
      - say: 'Render (row + 1, sub) into Rg32Uint around the cursor, stamp generations, and update SelectionState.'
        add:
          - {id: flow, drawing: [
              {polygon: [[110, 145], [700, 145], [700, 229], [110, 229]], fill: cell, color: ink, width: 2.0},
              {point: [110, 187], color: accent, size: 5.0},
              {arrow: [[405, 233], [405, 306]], color: blue, width: 3.0},
              {polygon: [[110, 310], [700, 310], [700, 394], [110, 394]], fill: blue_band, color: ink, width: 2.0},
              {point: [110, 352], color: accent, size: 5.0},
              {arrow: [[405, 398], [405, 471]], color: blue, width: 3.0},
              {polygon: [[110, 475], [700, 475], [700, 559], [110, 559]], fill: yellow_light, color: ink, width: 2.0},
              {point: [110, 517], color: accent, size: 5.0},
              {arrow: [[405, 563], [405, 636]], color: blue, width: 3.0},
              {polygon: [[110, 640], [700, 640], [700, 724], [110, 724]], fill: pink_band, color: ink, width: 2.0},
              {point: [110, 682], color: accent, size: 5.0}
            ], at: [0, 0]}
          - {id: h0, tex: '\text{Cursor / Hover (>= 50 ms)}', at: [136, 179], size: 21, color: ink}
          - {id: s0, tex: '\text{non-cancelling hover + click pick}', at: [136, 209], size: 16, color: navy}
          - {id: h1, tex: '\text{Rg32Uint ID pass window}', at: [136, 344], size: 21, color: ink}
          - {id: s1, tex: '\text{ink priority first, then nearest solid}', at: [136, 374], size: 16, color: navy}
          - {id: h2, tex: '\text{Generation-stamped map_async}', at: [136, 509], size: 21, color: ink}
          - {id: s2, tex: '\text{stale completions discarded on camera move}', at: [136, 539], size: 16, color: navy}
          - {id: h3, tex: '\text{SelectionState (viewer-core)}', at: [136, 674], size: 21, color: ink}
          - {id: s3, tex: '\text{Object, Face, Edge, Control, Box, Lasso}', at: [136, 704], size: 16, color: navy}
        eq: {tex: '\mathrm{id}_0 = \mathrm{row} + 1,\qquad \mathrm{id}_1 = \mathrm{sub}\ \ (\text{edge bit } 2^{31})', align: left}
        text: '**Invariant:** All selection fields live in one SelectionState struct so HeadlessHost and browser State share identical rules.'
