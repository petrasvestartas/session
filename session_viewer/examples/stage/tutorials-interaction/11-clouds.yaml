title: '11 · Frustum-Culled Octree LOD and Eye-Dome Lighting'
split: 0.52
palette: {accent: '#3057b1'}
grid: {center: [0, 0], size: 5, step: 1, z: 0}
camera: {yaw: -46, pitch: 26, fit: [EYE, R0, R1]}
points:
  EYE: [-2.2, -1.8, 2.2]
  R0: [0, 0, 0]
  R1: [2.4, 2.4, 2.4]
  M0: [0, 0, 0]
  M1: [1.2, 1.2, 1.2]
  S0: [0, 0, 0]
  S1: [0.6, 0.6, 0.6]
  FAR_C: [1.8, 1.8, 1.8]
  NEAR_C: [0.3, 0.3, 0.3]
slides:
  - title: 'ADAPTIVE OCTREE LOD AND EDL SHADING'
    steps:
      - say: 'Coarse octree nodes stay unsplit in the distance and reject early when all 8 corners miss the frustum.'
        add:
          - {id: rootBox, cuboid: [R0, R1], color: grey, width: 1.6}
          - {id: pEye, point: EYE, color: ink, label: '\mathbf{e}'}
          - {id: pFar, point: FAR_C, color: grey, label: 'd_{\mathrm{far}}'}
        eq: '\varepsilon_{\mathrm{px}} = \frac{s_{\mathrm{node}} \cdot f_{\mathrm{px}}}{\|\mathbf{c}_{\mathrm{node}} - \mathbf{e}\|} > \tau_{\mathrm{lod}} \quad (\tau_{\mathrm{lod}} = 2.0\,\mathrm{px})'
      - say: 'Near octants split recursively until projected spacing drops below $2\,\mathrm{px}$; EDL shades log-depth silhouettes.'
        add:
          - {id: midBox, cuboid: [M0, M1], color: '#3057b1', width: 2.2}
          - {id: leafBox, cuboid: [S0, S1], color: pink, width: 2.8}
          - {id: rayNear, arrow: [EYE, NEAR_C], color: '#3057b1', width: 2.8}
          - {id: pNear, point: NEAR_C, color: pink, label: '\varepsilon \le 2\,\mathrm{px}'}
        eq: 'S_{\mathrm{EDL}}(p) = \exp\!\left(-k \sum_{q \in N_4(p)} \max\bigl(0,\,\log_2 z_p - \log_2 z_q\bigr)\right)'
