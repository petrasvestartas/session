# Chapter 1: applying the cable force and cut-length formulas to the solved net.
title: MATERIALIZATION
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: pink}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3, 3, 0.25]}
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: MATERIALIZATION
    steps:
      - say: 'From solved coordinates to cable forces and cut lengths.'
        show: net
        do:
          - row:
              - {id: linkwitz, image: {src: ../force-density/img/linkwitz.png, height: 6.5}}
              - '\quad'
              - {id: schek, image: {src: ../force-density/img/schek.png, height: 6.5}}
          - row:
              - {id: linkwitz.name, text: '**Klaus Linkwitz**', width: 7.7580645161}
              - '\quad'
              - {id: schek.name, text: '**Hans-Jörg Schek**', width: 7.5483870968}
          - eq: {tex: 'f_k = q_k\,l_k, \qquad l_{0,k} = \frac{l_k}{1 + \dfrac{f_k}{EA}}', size: 28, gap: 24}

  - title: LENGTHS AND FORCES
    steps:
      - say: 'Measure stretched lengths $l_k$ and compute forces $f_k = q_k\,l_k$.'
        do:
          - row:
              - {id: lv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], rowlabels: [e_0, e_1, e_2, e_3], name: '\mathbf{l}\text{ (m)}'}}
              - '\qquad'
              - {id: fv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], name: '\mathbf{f} = \mathbf{q}\cdot\mathbf{l}\text{ (kN)}'}}
            size: 26
          - eq: {tex: 'l_{0,k} = \frac{l_k}{1 + \dfrac{f_k}{EA}}', size: 26, gap: 22, color: yellow}

  - title: EXAMPLE CABLE $e_0$
    steps:
      - say: 'Cut cable $e_0$ $36\text{ mm}$ shorter so it stretches into equilibrium.'
        do:
          - color: {target: e0, color: yellow}
          - camera: {fit: [n0, n1], yaw: -52, pitch: 22, with: true}
          - eq: {tex: 'l_{0,1} &= \frac{4.250}{1 + \dfrac{4.250}{500}} = \textcolor{pos}{4.214\text{ m}}', size: 26, gap: 20}
          - eq: {tex: '\Delta l_1 &= 4.250 - 4.214 = \textcolor{yellow}{0.036\text{ m}}', size: 25, gap: 14}
          - add: {id: cut, line: [n1, 'lerp(n1, n0, 4.214/4.250)'], color: free, width: 5}
          - add: {id: cutl, label: 'lerp(n1, n0, 0.5)', tex: 'l_{0,1} = 4.214\text{ m}', color: free, size: 21}
