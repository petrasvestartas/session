# Chapter 1: Linkwitz 6.5, materialization (6.34)-(6.37): from force densities to factory cut lengths.
title: Materialization
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
points:
  n0: [3, 3, 0.25]
  n1: [0, 0, 0]
  n2: [5, 0, 3]
  n3: [0, 7, 3]
  n4: [7, 5, 0]
slides:
  - title: What form-finding leaves us
    steps:
      - say: 'Form-finding gave a shape without a material. Now: how long must each cable be cut, and how stiff must it be?'
        do:
          - add:
              - {id: n1, point: n1, color: fixed, label: 'n_1'}
              - {id: n2, point: n2, color: fixed, label: 'n_2'}
              - {id: n3, point: n3, color: fixed, label: 'n_3'}
              - {id: n4, point: n4, color: fixed, label: 'n_4'}
              - {id: e0, line: [n0, n1], label: 'e_0'}
              - {id: e1, line: [n0, n2], label: 'e_1'}
              - {id: e2, line: [n0, n3], label: 'e_2'}
              - {id: e3, line: [n0, n4], label: 'e_3'}
          - add: {id: n0, point: n0, color: free, label: 'n_0'}
      - say: 'We know the stretched lengths, measured on the solved shape, and the forces $f_k = q_k\,l_k$.'
        do:
          - eq: 'l_k = \sqrt{(x_k - x_0)^2 + (y_k - y_0)^2 + (z_k - z_0)^2}'
          - eq: 'f_k = q_k\cdot l_k'
          - row:
              - {id: lv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], rowlabels: [e_0, e_1, e_2, e_3], name: '\mathbf{l}\ \text{(m)}', signs: false}}
              - '\qquad'
              - {id: fv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], name: '\mathbf{f}\ \text{(kN)}', signs: false}}
      - say: 'With $q = 1$ the force in kN equals the length in m. That is a coincidence of this example, not a rule.'
        highlight: ['lv[:,0]', 'fv[:,0]']

  - title: "Hooke's law · (6.34)"
    steps:
      - say: 'A cable cut to length $l_0$ stretches by $\Delta l = l - l_0$ under a force $f$. Hooke: the force is the axial stiffness $EA/l_0$ times the stretch.'
        eq: 'f = \frac{EA}{l_0}\cdot \Delta l \quad\Longrightarrow\quad \Delta l = l - l_0 = \frac{f\,l_0}{EA}'
      - say: 'For all cables at once, with the diagonal matrices $\mathbf{L}_0$ and $\mathbf{EA}$ and $\mathbf{f} = \mathbf{L}\mathbf{q}$:'
        eq: '\Delta\mathbf{l} = \mathbf{l} - \mathbf{l}_0 = \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{f} = \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{L}\,\mathbf{q} \qquad (6.34)'
        text: '$\Delta\mathbf{l}$ stretch (Linkwitz: $\mathbf{e}$), $\mathbf{l}$ stretched length, $\mathbf{l}_0$ cut length, $E$ Young modulus, $A$ cross-section.'
        size: 21
        color: dim

  - title: 'Force density from the material · (6.35)'
    steps:
      - say: 'Turn (6.34) around and solve for the force density.'
        eq: '\mathbf{q} = \Delta\mathbf{l}\,\mathbf{EA}\,\mathbf{L}_0^{-1}\mathbf{L}^{-1} \qquad (6.35)'
      - say: 'Per cable, it is the same force density as before: force over length.'
        do:
          - eq: {id: qk, tex: 'q_k = \frac{\Delta l_k\, EA_k}{l_{0,k}\, l_k} = \frac{\big(EA_k\, \Delta l_k / l_{0,k}\big)}{l_k} = \frac{f_k}{l_k}'}
          - {indicate: [qk], color: free}

  - title: 'Cut lengths · (6.36)–(6.37)'
    steps:
      - say: 'Write the stretched length as cut length plus stretch, with $\mathbf{F} = \operatorname{diag}(\mathbf{f})$.'
        eq: '\mathbf{l} = \mathbf{l}_0 + \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{f} = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{F}\big)\,\mathbf{l}_0 \qquad (6.36)'
      - say: 'Invert the diagonal matrix to get the factory cut lengths.'
        eq: '\mathbf{l}_0 = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{F}\big)^{-1}\mathbf{l} = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{Q}\mathbf{L}\big)^{-1}\mathbf{l} \qquad (6.37)'
      - say: 'Every matrix here is diagonal, so each cable is computed on its own.'
        tex: 'l_0 = \frac{l}{1 + \frac{f}{EA}} = \frac{l}{1 + \frac{q\,l}{EA}}'
        id: one
        color: accent
        highlight: [one]

  - title: 'Worked example · cable $e_0$'
    steps:
      - say: 'Cable $e_0$: stretched length $4.250$ m, force $4.250$ kN, steel with $EA = 500$ kN.'
        color: {target: e0, color: accent}
        camera: {fit: [n0, n1], yaw: -52, pitch: 22, with: true}
        eq: 'l_{0,1} = \frac{4.250}{1 + \frac{4.250}{500}} = \frac{4.250}{1.0085} = 4.214\ \text{m}'
      - say: 'The stretch is $36$ mm. Cut the cable to 4.214 m and pulled into place it carries exactly 4.250 kN.'
        do:
          - eq: {id: w2, tex: '\Delta l_1 = l_1 - l_{0,1} = 4.250 - 4.214 = 0.036\ \text{m}'}
          - add: {id: cut, line: [n1, 'lerp(n1, n0, 4.214/4.250)'], color: free, width: 5}
          - add: {id: cutl, label: 'lerp(n1, n0, 0.5)', tex: 'l_{0,1} = 4.214', color: free, size: 21}
      - say: 'Back to the whole net: one solve gave the shape, the forces, and now the cut list.'
        do:
          - camera: {fit: [n0, n1, n2, n3, n4], yaw: -58, pitch: 26}
          - {indicate: [w2], color: free, with: true}
