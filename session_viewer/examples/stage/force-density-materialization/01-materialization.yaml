# Chapter 1: Linkwitz 6.5, materialization (6.34)-(6.37): from force densities to factory cut lengths.
title: Materialization
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
points:
  P0: [3, 3, 0.25]
  P1: [0, 0, 0]
  P2: [5, 0, 3]
  P3: [0, 7, 3]
  P4: [7, 5, 0]
slides:
  - title: What form-finding leaves us
    steps:
      - say: 'Form-finding gave a shape without a material. Now: how long must each cable be cut, and how stiff must it be?'
        do:
          - add:
              - {id: n1, point: P1, color: fixed, label: 'P_1'}
              - {id: n2, point: P2, color: fixed, label: 'P_2'}
              - {id: n3, point: P3, color: fixed, label: 'P_3'}
              - {id: n4, point: P4, color: fixed, label: 'P_4'}
              - {id: a, line: [P0, P1], label: 'a'}
              - {id: b, line: [P0, P2], label: 'b'}
              - {id: c, line: [P0, P3], label: 'c'}
              - {id: d, line: [P0, P4], label: 'd'}
          - add: {id: n0, point: P0, color: free, label: 'P_0'}
      - say: 'We know the stretched lengths, measured on the solved shape, and the forces $F_k = q_k\,l_k$.'
        do:
          - add: {id: k1, tex: 'l_k = \sqrt{(x_k - x_0)^2 + (y_k - y_0)^2 + (z_k - z_0)^2}', align: '='}
          - add: {id: k2, tex: 'F_k = q_k\cdot l_k', align: '='}
          - add: {id: kv, row: [{id: lv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], rowlabels: [a, b, c, d], name: '\mathbf{l}\ \text{(m)}', signs: false}}, '\qquad', {id: fv, matrix: {rows: [['4.250'], ['4.535'], ['5.706'], ['4.479']], name: '\mathbf{f}\ \text{(kN)}', signs: false}}]}
      - say: 'With $q = 1$ the force in kN equals the length in m. That is a coincidence of this example, not a rule.'
        indicate: ['lv[:,0]', 'fv[:,0]']

  - title: "Hooke's law · (6.34)"
    steps:
      - say: 'A cable cut to length $l_0$ stretches by $e = l - l_0$ under a force $F$. Hooke: the force is the axial stiffness $EA/l_0$ times the stretch.'
        add: {id: h1, tex: 'F = \frac{EA}{l_0}\cdot e \quad\Longrightarrow\quad e = l - l_0 = \frac{F\,l_0}{EA}', align: '='}
      - say: 'For all cables at once, with the diagonal matrices $\mathbf{L}_0$ and $\mathbf{EA}$ and $\mathbf{f} = \mathbf{L}\mathbf{q}$:'
        do:
          - add: {id: e634, tex: '\mathbf{e} = \mathbf{l} - \mathbf{l}_0 = \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{f} = \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{L}\,\mathbf{q} \qquad (6.34)', align: '='}
          - add: {id: legend, text: '$\mathbf{e}$ stretch, $\mathbf{l}$ stretched length, $\mathbf{l}_0$ cut length, $E$ Young modulus, $A$ cross-section.', size: 21, color: dim}

  - title: 'Force density from the material · (6.35)'
    steps:
      - say: 'Turn (6.34) around and solve for the force density.'
        add: {id: e635, tex: '\mathbf{q} = \mathbf{e}\,\mathbf{EA}\,\mathbf{L}_0^{-1}\mathbf{L}^{-1} \qquad (6.35)', align: '='}
      - say: 'Per cable, it is the same force density as before: force over length.'
        do:
          - add: {id: qk, tex: 'q_k = \frac{e_k\, EA_k}{l_{0,k}\, l_k} = \frac{\big(EA_k\, e_k / l_{0,k}\big)}{l_k} = \frac{F_k}{l_k}', align: '='}
          - {indicate: [qk], color: free}

  - title: 'Cut lengths · (6.36)–(6.37)'
    steps:
      - say: 'Write the stretched length as cut length plus stretch, with $\mathbf{F} = \operatorname{diag}(\mathbf{f})$.'
        add: {id: e636, tex: '\mathbf{l} = \mathbf{l}_0 + \mathbf{L}_0(\mathbf{EA})^{-1}\mathbf{f} = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{F}\big)\,\mathbf{l}_0 \qquad (6.36)', align: '='}
      - say: 'Invert the diagonal matrix to get the factory cut lengths.'
        add: {id: e637, tex: '\mathbf{l}_0 = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{F}\big)^{-1}\mathbf{l} = \big(\mathbf{I} + (\mathbf{EA})^{-1}\mathbf{Q}\mathbf{L}\big)^{-1}\mathbf{l} \qquad (6.37)', align: '='}
      - say: 'Every matrix here is diagonal, so each cable is computed on its own.'
        do:
          - add: {id: one, tex: 'l_0 = \frac{l}{1 + \frac{F}{EA}} = \frac{l}{1 + \frac{q\,l}{EA}}', color: accent}
          - {indicate: [one], color: accent}

  - title: 'Worked example · cable $a$'
    steps:
      - say: 'Cable $a$: stretched length $4.250$ m, force $4.250$ kN, steel with $EA = 500$ kN.'
        do:
          - color: {target: a, color: accent}
          - camera: {fit: [P0, P1], yaw: -52, pitch: 22, with: true}
          - add: {id: w1, tex: 'l_{0,a} = \frac{4.250}{1 + \frac{4.250}{500}} = \frac{4.250}{1.0085} = 4.214\ \text{m}', align: '='}
      - say: 'The stretch is $36$ mm. Cut the cable to 4.214 m and pulled into place it carries exactly 4.250 kN.'
        do:
          - add: {id: w2, tex: 'e_a = l_a - l_{0,a} = 4.250 - 4.214 = 0.036\ \text{m}', align: '='}
          - add: {id: cut, line: [P1, 'lerp(P1, P0, 4.214/4.250)'], color: free, width: 5}
          - add: {id: cutl, label: 'lerp(P1, P0, 0.5)', tex: 'l_{0,a} = 4.214', color: free, size: 21}
      - say: 'Back to the whole net: one solve gave the shape, the forces, and now the cut list.'
        do:
          - camera: {fit: [P0, P1, P2, P3, P4], yaw: -58, pitch: 26}
          - {indicate: [w2], color: free, with: true}
