# Chapter 3: forces and cut lengths on the 81-node saddle net.
title: SADDLE NET
grid: {center: [4, 4], size: 11, step: 1}
camera: {yaw: -52, pitch: 30}
palette: {free: pink}
net:
  grid: [9, 9]
  fixed: corners
  lift: {n0_0: 4, n8_8: 4}
  q: 1
  rim: 10
  load: [0, 0, -0.1]
slides:
  - title: FORCES AND CUT LENGTHS
    steps:
      - say: 'Force $f_k = q_k\,l_k$ sets how much each cable is shortened.'
        do:
          - show: [cables, fixed]
          - solve: true
          - show: forces
          - eq: {tex: 'f_k = q_k\,l_k \qquad (\textcolor{fixed}{\text{blue}} = \text{small force}, \;\; \textcolor{pos}{\text{pink}} = \text{large force})', size: 22, gap: 20}
      - say: 'Force $f_k = q_k\,l_k$ sets how much each cable is shortened.'
        do:
          - eq: {tex: 'l_{0,\text{rim}} &= \frac{1.236}{1 + \dfrac{12.36}{500}} = \textcolor{pos}{1.206\text{ m}}\;\;(-2.5\%)', size: 23, gap: 18}
          - eq: {tex: 'l_{0,\text{inner}} &= \frac{1.000}{1 + \dfrac{1.00}{500}} = \textcolor{fixed}{0.998\text{ m}}\;\;(-0.2\%)', size: 23, gap: 14}
