# Chapter 4: method 2, the chain rule, and what the derivative means.
title: Method 2 · the chain rule
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -52, pitch: 22, fit: [n0, n1, '[5.4, 3.6, 0.25]']}
points:
  n0: [3, 3, 0.25]
  X: [3, 3, 0.25]         # the node we nudge; it starts on n0
  n1: [0, 0, 0]
  n2: [5, 0, 3]
  n3: [0, 7, 3]
  n4: [7, 5, 0]
slides:
  - title: 'Method 2 · the chain rule'
    steps:
      - say: 'Write the length as a power of an inner function $u$.'
        do:
          - add:
              - {id: o2, point: n2, color: fixed, opacity: 0.25}
              - {id: o3, point: n3, color: fixed, opacity: 0.25}
              - {id: o4, point: n4, color: fixed, opacity: 0.25}
              - {id: e1, line: [X, n2], opacity: 0.2}
              - {id: e2, line: [X, n3], opacity: 0.2}
              - {id: e3, line: [X, n4], opacity: 0.2}
              - {id: k, line: [X, n1], label: 'l_k', width: 3.6}
              - {id: nk, point: n1, color: fixed, label: 'n_k'}
              - {id: n0, point: X, color: free, label: 'n_0'}
            dur: 0.8
          - tex: 'l_k = u^{1/2}, \qquad u = (x_k - x_0)^2 + (y_k - y_0)^2 + (z_k - z_0)^2'
          - eq: '\frac{\partial l_k}{\partial x_0} = \frac{d l_k}{d u}\cdot\frac{\partial u}{\partial x_0}'
      - say: '**Outer derivative.** The power rule, with $\sqrt{u} = l_k$.'
        eq: '\frac{d l_k}{d u} = \tfrac{1}{2}u^{-1/2} = \frac{1}{2\sqrt{u}} = \frac{1}{2 l_k}'
      - say: '**Inner derivative.** Only the $x$-term contains $x_0$. The $y$ and $z$ terms give $0$.'
        eq: '\frac{\partial u}{\partial x_0} = 2(x_k - x_0)\cdot(-1) = -2(x_k - x_0)'
      - say: 'Multiply outer and inner. The result matches method 1.'
        eq: {id: c5, tex: '\frac{\partial l_k}{\partial x_0} = \frac{1}{2 l_k}\cdot\big(-2(x_k - x_0)\big) = \frac{-(x_k - x_0)}{l_k}', color: accent}
        highlight: [c5]

  - title: What the result means
    steps:
      - say: '$\Delta x_k / l_k$ is the direction cosine: the side along $x$ over the length, with its sign. So $\partial l_k / \partial x_0$ is the **negative** direction cosine along $x$.'
        do:
          - tex: '\frac{\partial l_k}{\partial x_0} = -\frac{\Delta x_k}{l_k}, \qquad \Delta x_k = x_k - x_0'
          - add: {id: unit, arrow: [n0, 'n0 + (n0 - n1)/len(n0, n1)*1.6'], color: accent, width: 3.6}
          - derive: {from: unit, id: unitx, arrow: [n0, 'n0 + [(x(n0) - x(n1))/len(n0, n1)*1.6, 0, 0]'], color: x, width: 3.6}
      - say: 'For cable $e_0$, $n_k = n_1$. The anchor is at $x_1 = 0$, left of $x_0 = 3$.'
        eq: {id: m2, tex: '\frac{\partial l_1}{\partial x_0} = \frac{-(0 - 3)}{4.250} = \frac{+3}{4.250} = +0.706'}
      - say: 'A small move of $n_0$ to the right lengthens $e_0$ by 0.706 times the move: $n_0$ moves away from its anchor.'
        do:
          - {indicate: [m2], color: x}
          - highlight: [unitx]

