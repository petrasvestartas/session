# Chapter 1: why the linear equilibrium formula and cut-length formula hold, and the derivation roadmap.
title: WHY IT WORKS
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: pink}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: FORCE DENSITY DERIVATION
    steps:
      - say: 'Where the equilibrium and cut-length formulas come from.'
        show: net
        do:
          - row:
              - {id: linkwitz, image: {src: ../force-density/img/linkwitz.png, height: 6.5}}
              - '\quad'
              - {id: schek, image: {src: ../force-density/img/schek.png, height: 6.5}}
          - row:
              - {id: linkwitz.name, text: '**Klaus Linkwitz**', width: 7.7580645161}
              - '\quad'
              - {id: schek.name, text: '**Hans-Jörg Schek**', width: 7.5483870968}
          - eq: {tex: '\mathbf{x}_N &= (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_x - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F)', size: 23, gap: 20}
          - eq: {tex: 'l_{0,k} &= \frac{l_k}{1 + \dfrac{q_k\,l_k}{EA}}', size: 23, gap: 12}

  - title: THE QUESTION
    steps:
      - say: 'Cables pull along lengths with square roots, yet the solve is linear.'
        do:
          - eq: {tex: 'l_k = \sqrt{(x_k - x_0)^2 + (y_k - y_0)^2 + (z_k - z_0)^2}', size: 24, gap: 18}
          - solve: true
          - text: '**Why do nonlinear lengths and forces turn into one linear matrix solve?**'
            size: 22
            gap: 20
            color: yellow

  - title: DERIVATION ROADMAP
    steps:
      - say: 'Five steps derive both equilibrium and cable cut lengths.'
        do:
          - {text: '**1. Cable length $l_k$:** 3D Pythagoras between free node and anchor', align: left, size: 22, gap: 14}
          - {text: '**2. Tiny nudge $\partial l_k / \partial x_0$:** how length changes when $n_0$ moves (6.4.2)', align: left, size: 22, gap: 14}
          - {text: '**3. Jacobian matrix $\mathbf{J}$:** collect all cable length derivatives into $\mathbf{C}_N^{T}\mathbf{U}\mathbf{L}^{-1}$', align: left, size: 22, gap: 14}
          - {text: '**4. Force density $\mathbf{q} = \mathbf{L}^{-1}\mathbf{f}$:** eliminate square roots and isolate $\mathbf{x}_N$ (6.4.3)', align: left, size: 22, gap: 14}
          - {text: '**5. Materialization $\mathbf{l}_0$:** Hooke''s law from force densities to factory cut lengths (6.5)', align: left, size: 22, gap: 14}
