# Chapter 5: Linkwitz 6.4.3 (6.25)-(6.33) — equilibrium in matrix form and linearization.
title: MATRIX EQUILIBRIUM
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: pink}
points:
  n0: [3, 3, 0.25]
  n1: [0, 0, 0]
  n2: [5, 0, 3]
  n3: [0, 7, 3]
  n4: [7, 5, 0]
slides:
  - title: EQUILIBRIUM IN MATRIX FORM
    steps:
      - say: 'Multiplying $\mathbf{J}^{T}$ by cable forces $\mathbf{f}$ balances external load $\mathbf{p}_x$.'
        do:
          - add:
              - {id: n1, point: n1, color: fixed, label: 'n_1'}
              - {id: n2, point: n2, color: fixed, label: 'n_2'}
              - {id: n3, point: n3, color: fixed, label: 'n_3'}
              - {id: n4, point: n4, color: fixed, label: 'n_4'}
              - {id: e0, line: [n0, n1]}
              - {id: e1, line: [n0, n2]}
              - {id: e2, line: [n0, n3]}
              - {id: e3, line: [n0, n4]}
          - add:
              - {id: f1, arrow: [n0, 'n0 + 0.5*(n1 - n0)'], color: fixed, width: 3.6, label: 'f_1'}
              - {id: f2, arrow: [n0, 'n0 + 0.5*(n2 - n0)'], color: fixed, width: 3.6, label: 'f_2'}
              - {id: f3, arrow: [n0, 'n0 + 0.5*(n3 - n0)'], color: fixed, width: 3.6, label: 'f_3'}
              - {id: f4, arrow: [n0, 'n0 + 0.5*(n4 - n0)'], color: fixed, width: 3.6, label: 'f_4'}
              - {id: p, arrow: [n0, 'n0 + [0, 0, -2.5]'], color: load, width: 3.6, label: 'p'}
          - add: {id: n0, point: n0, color: free, label: 'n_0'}
          - eq: {tex: '\frac{u_1}{l_1}f_1 + \frac{u_2}{l_2}f_2 + \frac{u_3}{l_3}f_3 + \frac{u_4}{l_4}f_4 &= p_x \qquad (6.25)', size: 23, gap: 18}
          - eq: {tex: '\mathbf{C}_N^{T}\,\mathbf{U}\,\mathbf{L}^{-1}\,\mathbf{f} &= \mathbf{p}_x \qquad (6.26)', size: 25, gap: 14}
          - {tex: '\text{Nonlinear: unknown }x_0\text{ sits inside both }\mathbf{U}\text{ and the square roots of }\mathbf{L}^{-1}', size: 20, gap: 16, color: pos}

  - title: FORCE DENSITY REMOVES LENGTHS
    steps:
      - say: 'Prescribing $\mathbf{q} = \mathbf{L}^{-1}\,\mathbf{f}$ eliminates $\mathbf{L}^{-1}$ and every square root.'
        do:
          - eq: {tex: '\mathbf{q} = \mathbf{L}^{-1}\,\mathbf{f}, \qquad q_k = \frac{f_k}{l_k} \qquad (6.27)', size: 25, gap: 18, color: yellow}
          - eq: {id: s, tex: '\mathbf{C}_N^{T}\,\mathbf{U}\,{{\mathbf{L}^{-1}\,\mathbf{f}}} = \mathbf{p}_x', size: 27, gap: 20}
          - color: {target: 's{\mathbf{L}^{-1}\,\mathbf{f}}', color: yellow}
          - morph: {target: s, tex: '\mathbf{C}_N^{T}\,\mathbf{U}\,{{\mathbf{q}}} = \mathbf{p}_x \qquad (6.28)', map: {'\mathbf{L}^{-1}\,\mathbf{f}': '\mathbf{q}'}}
          - {tex: '\text{Length matrix }\mathbf{L}\text{ is gone: the equilibrium equation is now linear}', size: 21, gap: 18, color: yellow}

  - title: THE FACTOR SWAP $\mathbf{U}\,\mathbf{q} = \mathbf{Q}\,\mathbf{u}$
    steps:
      - say: 'Swapping diagonal factors pulls unknown $\mathbf{x}$ out of $\mathbf{U}$ as a vector.'
        do:
          - row:
              - '\mathbf{U}\,\mathbf{q} ='
              - {matrix: {rows: [[u_1, 0, 0, 0], [0, u_2, 0, 0], [0, 0, u_3, 0], [0, 0, 0, u_4]], signs: false}}
              - {matrix: {rows: [[q_1], [q_2], [q_3], [q_4]], signs: false}}
              - '='
              - {id: uq, matrix: {rows: [[u_1 q_1], [u_2 q_2], [u_3 q_3], [u_4 q_4]], signs: false, empty: true}}
            size: 21
          - show: ['uq[:,0]']
          - row:
              - '\mathbf{Q}\,\mathbf{u} ='
              - {matrix: {rows: [[q_1, 0, 0, 0], [0, q_2, 0, 0], [0, 0, q_3, 0], [0, 0, 0, q_4]], signs: false}}
              - {matrix: {rows: [[u_1], [u_2], [u_3], [u_4]], signs: false}}
              - '='
              - {id: qu, matrix: {rows: [[q_1 u_1], [q_2 u_2], [q_3 u_3], [q_4 u_4]], signs: false, empty: true}}
            size: 21
            gap: 12
          - show: ['qu[:,0]']
          - highlight: ['uq[:,0]', 'qu[:,0]']
          - eq: {tex: '\mathbf{U}\,\mathbf{q} = \mathbf{Q}\,\mathbf{u} = \mathbf{Q}\,\mathbf{C}\,\mathbf{x}', size: 24, gap: 14, color: yellow}

  - title: ISOLATE THE COORDINATES
    steps:
      - say: 'Substitute $\mathbf{U}\mathbf{q} = \mathbf{Q}\mathbf{C}\mathbf{x}$ and split $\mathbf{C}\mathbf{x}$ into free and fixed parts.'
        do:
          - eq: {id: e629, tex: '\mathbf{C}_N^{T}\,{{\mathbf{U}\,\mathbf{q}}} &= \mathbf{p}_x', size: 23, gap: 16}
          - morph: {target: e629, tex: '\mathbf{C}_N^{T}\,{{\mathbf{Q}\,\mathbf{C}\,\mathbf{x}}} &= \mathbf{p}_x \qquad (6.29)', map: {'\mathbf{U}\,\mathbf{q}': '\mathbf{Q}\,\mathbf{C}\,\mathbf{x}'}}
          - eq: {tex: '\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N\,\mathbf{x}_N + \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F &= \mathbf{p}_x \qquad (6.30)', size: 23, gap: 14}
          - eq: {tex: '\underbrace{\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N}_{\mathbf{D}_N}\,\mathbf{x}_N &= \mathbf{p}_x - \underbrace{\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F}_{\mathbf{D}_F}\,\mathbf{x}_F \qquad (6.31)', size: 23, gap: 14}

  - title: SOLVED MATRIX FORMULA
    steps:
      - say: 'Inverting $\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N$ gives the linear solve along $x$, $y$ and $z$.'
        do:
          - eq: {tex: '\mathbf{x}_N &= (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_x - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F) \qquad (6.32)', size: 22, gap: 14, color: yellow}
          - eq: {tex: '\mathbf{y}_N &= (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_y - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{y}_F)', size: 22, gap: 10}
          - eq: {tex: '\mathbf{z}_N &= (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_z - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{z}_F)', size: 22, gap: 10}
          - {tex: '\mathbf{f} = \mathbf{L}\,\mathbf{q} \qquad (6.33)', size: 23, gap: 16, color: pos}
          - {tex: '\mathbf{C}_N^{T}\mathbf{U}\mathbf{L}^{-1}\mathbf{f} = \mathbf{p} \;\xrightarrow{\;\mathbf{q} = \mathbf{L}^{-1}\mathbf{f}\;}\; \mathbf{C}_N^{T}\mathbf{U}\mathbf{q} = \mathbf{p} \;\xrightarrow{\;\mathbf{U}\mathbf{q} = \mathbf{Q}\mathbf{C}\mathbf{x}\;}\; (\mathbf{C}_N^{T}\mathbf{Q}\mathbf{C}_N)\,\mathbf{x}_N = \mathbf{p} - \mathbf{C}_N^{T}\mathbf{Q}\mathbf{C}_F\mathbf{x}_F', size: 18, gap: 14}
