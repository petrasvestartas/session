# Chapter 2: Linkwitz 6.4.2. One cable, its length, and the question of how it changes.
title: One cable, one question
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 24}
points:
  n0: [3, 3, 0.25]
  X: [3, 3, 0.25]         # the node we nudge; it starts on n0
  n1: [0, 0, 0]
  n2: [5, 0, 3]
  n3: [0, 7, 3]
  n4: [7, 5, 0]
slides:
  - title: The physical setup
    steps:
      - say: 'A free node $n_0 = (x_0, y_0, z_0)$ and an anchor $n_k = (x_k, y_k, z_k)$, joined by a cable of length $l_k$.'
        do:
          - add:
              - {id: o2, point: n2, color: fixed, opacity: 0.25}
              - {id: o3, point: n3, color: fixed, opacity: 0.25}
              - {id: o4, point: n4, color: fixed, opacity: 0.25}
              - {id: e1, line: [X, n2], opacity: 0.2}
              - {id: e2, line: [X, n3], opacity: 0.2}
              - {id: e3, line: [X, n4], opacity: 0.2}
          - add: {id: k, line: [X, n1], label: 'l_k', width: 3.6}
          - add:
              - {id: nk, point: n1, color: fixed, label: 'n_k'}
              - {id: n0, point: X, color: free, label: 'n_0'}
          - camera: {fit: [n0, n1, '[5.4, 3.6, 0.25]'], yaw: -52, pitch: 22, with: true}
      - say: 'By Pythagoras in 3D, the length is the root of the three squared coordinate differences.'
        do:
          - project: {of: k}
          - {tex: 'l_k = \sqrt{ {{(x_k - x_0)^2}} + {{(y_k - y_0)^2}} + {{(z_k - z_0)^2}} }', id: L}
          - color: {target: 'L{(x_k - x_0)^2}', color: x}
          - color: {target: 'L{(y_k - y_0)^2}', color: y, with: true}
          - color: {target: 'L{(z_k - z_0)^2}', color: z, with: true}
      - say: 'Linkwitz asks (6.4.2): if $n_0$ moves right by a tiny $\Delta x_0$, how much does $l_k$ change?'
        remove: [k.box, k.y, k.z]
        tex: '\frac{\text{change in length } \Delta l_k}{\text{shift of the node } \Delta x_0} \;=\; ?'
        id: qn

  - title: A tiny nudge
    steps:
      - say: 'Keep the old cable as a ghost. Push $n_0$ to the right.'
        do:
          - remove: [k.x, qn]
          - add: {id: ghost, line: [n0, n1], color: dim, dash: true, width: 2}
          - add: {id: dx, arrow: [n0, X], color: x, width: 3.6}
          - eq: 'l_k = {=len(X,n1):.3}'
          - move: {point: X, to: [3.8, 3, 0.25], dur: 1.6}
      - say: 'Compare the change in length with the shift. For a big nudge the ratio is not yet exact.'
        eq: '\frac{\Delta l_k}{\Delta x_0} = \frac{ {=len(X,n1)-len(n0,n1):.3} }{ {=x(X)-x(n0):.3} } = {=(len(X,n1)-len(n0,n1))/(x(X)-x(n0)):.3}'
      - say: 'Make the nudge smaller and smaller. The ratio settles on one number.'
        do:
          - move: {point: X, to: [3.3, 3, 0.25], dur: 1.4}
          - move: {point: X, to: [3.1, 3, 0.25], dur: 1.2}
          - move: {point: X, to: [3.02, 3, 0.25], dur: 1.2}
      - say: 'That limit is the partial derivative of the length with respect to $x_0$.'
        tex: '\lim_{\Delta x_0 \to 0}\frac{\Delta l_k}{\Delta x_0} = \frac{\partial l_k}{\partial x_0}'
        color: accent
