# Chapter 4: several free nodes. The example graph of Schek's paper: 5 free nodes, 4 fixed, 12 branches.
title: Several free nodes
grid: {center: [0, 0], size: 14, step: 1, z: -2.5}
camera: {yaw: -62, pitch: 32}
net:
  free: {N1: [-3, 0, 0], N2: [0, -3, 0], N3: [3, 0, 0], N4: [0, 3, 0], N5: [0, 0, 0]}
  fixed: {N6: [-6, 0, 0], N7: [0, -6, 0], N8: [6, 0, 0], N9: [0, 6, 0]}
  cables:
    1: [N6, N1]
    2: [N7, N2]
    3: [N8, N3]
    4: [N9, N4]
    5: [N1, N4]
    6: [N1, N2]
    7: [N2, N3]
    8: [N3, N4]
    9: [N4, N5]
    10: [N1, N5]
    11: [N2, N5]
    12: [N3, N5]
  q: {1: 3, 2: 3, 3: 3, 4: 3}      # the four outer branches; every other branch has q = 1
  load: [0, 0, -1]
slides:
  - title: The net of Schek's paper
    steps:
      - say: 'The example from Schek''s 1974 paper: five free nodes $N_1,\dots,N_5$, four fixed nodes $N_6,\dots,N_9$, twelve branches.'
        show: [cables, fixed, free]
      - say: 'Every free node carries a load of 1, downward. The four outer branches have $q = 3$, the eight inner ones $q = 1$.'
        show: loads
      - say: 'Five unknown nodes instead of one. The sums stay the same; the matrices keep them in order.'
        eq: '\mathbf{x}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_x - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F)'

  - title: The branch-node matrix
    steps:
      - say: 'One row per branch, one column per node: $+1$ where the branch starts, $-1$ where it ends. The free nodes come first.'
        matrix: {of: C, cell: 0.95}
      - say: 'Branch 1 joins $N_6$ and $N_1$. Its row has two entries and seven zeros.'
        do:
          - color: {target: '1', color: accent}
          - color: {target: 'C[0,:]', color: accent, with: true}
      - say: 'The first five columns are $\mathbf{C}_N$, the free nodes. The last four are $\mathbf{C}_F$, the fixed ones.'
        do:
          - color: {target: '1', color: reset}
          - color: {target: 'C[0,:]', color: reset, with: true}
          - highlight: ['C[:,0]', 'C[:,1]', 'C[:,2]', 'C[:,3]', 'C[:,4]']

  - title: 'What $\mathbf{D}_N$ says'
    steps:
      - say: '$\mathbf{D}_N = \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N$ has one row and one column per free node.'
        matrix: DN
      - say: 'A diagonal entry adds the force densities of all branches at that node. At $N_1$ meet branches 1, 5, 6 and 10: $3 + 1 + 1 + 1 = 6$.'
        do:
          - color: {target: 'DN[0,0]', color: accent}
          - color: {target: '1', color: accent, with: true}
          - color: {target: '5', color: accent, with: true}
          - color: {target: '6', color: accent, with: true}
          - color: {target: '10', color: accent, with: true}
      - say: 'An off-diagonal entry is $-q$ of the branch between two free nodes. Here: branch 6, between $N_1$ and $N_2$.'
        do:
          - color: {target: 'DN[0,0]', color: reset}
          - color: {target: '1', color: reset, with: true}
          - color: {target: '5', color: reset, with: true}
          - color: {target: '10', color: reset, with: true}
          - color: {target: 'DN[0,1]', color: accent}
      - say: 'Where no branch joins two nodes, the entry is 0. No branch joins $N_1$ and $N_3$.'
        do:
          - color: {target: 'DN[0,1]', color: reset}
          - color: {target: '6', color: reset, with: true}
          - highlight: ['DN[0,2]']

  - title: The fixed nodes go to the right-hand side
    steps:
      - say: '$\mathbf{D}_F = \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F$ couples each free node to the fixed node it hangs from. $N_5$ touches none, so its row is zero.'
        matrix: DF
      - say: 'Multiply by the fixed coordinates and subtract from the loads: the right-hand side, one column per axis.'
        matrix: b

  - title: One solve for all five
    steps:
      - say: 'The same line as before, now with a 5 × 5 matrix. All five nodes find their place at once.'
        do:
          - eq: '\mathbf{D}_N\,\mathbf{x}_N = \mathbf{p} - \mathbf{D}_F\,\mathbf{x}_F'
          - solve: true
      - say: 'The solved coordinates of the free nodes.'
        matrix: xN
      - say: 'Give the four inner branches $q = 4$. They shorten and pull the ring toward the centre.'
        solve: {q: {9: 4, 10: 4, 11: 4, 12: 4}}
      - say: 'Back to the first values. Each choice of force densities gives one net.'
        solve: true
