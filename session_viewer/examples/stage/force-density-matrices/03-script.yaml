# Chapter 3: the five-node star solved in a minimal Python script.
title: PYTHON SCRIPT
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: pink}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: 'PYTHON SCRIPT'
    steps:
      - say: 'Ten lines in NumPy build the matrices and solve for $n_0$.'
        show: net
        code: |
          import numpy as np

          C = np.array([[1, -1, 0, 0, 0],   # e0: n0 -> n1
                        [1, 0, -1, 0, 0],   # e1: n0 -> n2
                        [1, 0, 0, -1, 0],   # e2: n0 -> n3
                        [1, 0, 0, 0, -1]])  # e3: n0 -> n4
          C_N, C_F = C[:, [0]], C[:, [1, 2, 3, 4]]
          Q   = np.diag([1.0, 1.0, 1.0, 1.0])
          X_F = np.array([[0, 0, 0], [5, 0, 3], [0, 7, 3], [7, 5, 0]])
          p   = np.array([[0.0, 0.0, -5.0]])
      - say: 'Ten lines in NumPy build the matrices and solve for $n_0$.'
        do:
          - code: |
              X_N = np.linalg.solve(C_N.T @ Q @ C_N, p - C_N.T @ Q @ C_F @ X_F)
              # X_N -> [[3.0, 3.0, 0.25]]
          - solve: true
