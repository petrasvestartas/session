# Chapter 3: complete runnable NumPy script for the five-node star.
title: PYTHON SCRIPT
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: ink}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: 'NUMPY SCRIPT'
    steps:
      - say: 'Complete runnable NumPy script for the five-node cable net.'
        show: net
        size: 17
        code: |
          import numpy as np

          # connectivity: 4 cables (rows) x 5 nodes n0..n4 (columns)
          C = np.array([
              [1, -1,  0,  0,  0],   # e0: n0 -> n1
              [1,  0, -1,  0,  0],   # e1: n0 -> n2
              [1,  0,  0, -1,  0],   # e2: n0 -> n3
              [1,  0,  0,  0, -1],   # e3: n0 -> n4
          ], dtype=float)

          C_N = C[:, [0]]
          C_F = C[:, [1, 2, 3, 4]]
          Q   = np.diag([1.0, 1.0, 1.0, 1.0])
          x_F = np.array([[0, 0, 0], [5, 0, 3], [0, 7, 3], [7, 5, 0]], dtype=float)
          p   = np.array([[0.0, 0.0, -5.0]])

          A   = C_N.T @ Q @ C_N
          x_N = np.linalg.solve(A, p - C_N.T @ Q @ C_F @ x_F)
          print(x_N)   # [[3.   3.   0.25]]
      - say: 'Complete runnable NumPy script for the five-node cable net.'
        solve: true
