# Chapter 7: a 10x10 pillow grid and solving denser grids with SciPy Cholesky.
title: PILLOW GRID
grid: {center: [4.5, 4.5], size: 12, step: 1}
camera: {yaw: -52, pitch: 30}
palette: {free: pink}
net:
  grid: [10, 10]
  fixed: boundary
  q: 1
  load: [0, 0, 0.35]
slides:
  - title: 'PILLOW GRID'
    steps:
      - say: 'A 100-node grid with a fixed rim rises into a cushion.'
        show: [cables, fixed, loads]
        row:
          - {id: C, matrix: C}
          - '\;\longrightarrow\;'
          - {id: CN, matrix: CN}
          - {id: CF, matrix: CF}
        size: 26
      - say: 'A 100-node grid with a fixed rim rises into a cushion.'
        solve: true

  - title: 'SCIPY CHOLESKY'
    steps:
      - say: 'SciPy Cholesky factors symmetric $\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N$ once for $x, y, z$.'
        do:
          - eq: {tex: '\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N = \mathbf{L}\,\mathbf{L}^{T}', size: 24, gap: 8}
          - code: |
              from scipy.linalg import cho_factor, cho_solve

              # C_N.T @ Q @ C_N is symmetric and positive-definite (q > 0)
              A = C_N.T @ Q @ C_N
              B = P - C_N.T @ Q @ C_F @ X_F

              # Cholesky uses half the work of LU, factored once for x, y, z
              L, low = cho_factor(A, lower=True)
              X_N = cho_solve((L, low), B)
