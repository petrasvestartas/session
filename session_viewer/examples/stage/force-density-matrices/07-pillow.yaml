# Chapter 7: a 10x10 pillow grid and complete runnable SciPy Cholesky script.
title: PILLOW GRID
split: 0.38
grid: {center: [4.5, 4.5], size: 12, step: 1}
camera: {yaw: -52, pitch: 30}
palette: {free: pink}
net:
  grid: [10, 10]
  fixed: boundary
  q: 1
  load: [0, 0, 0.35]
slides:
  - title: 'PILLOW GRID'
    steps:
      - say: 'A 100-node grid with a fixed rim rises into a cushion.'
        show: [cables, fixed, loads]
        row:
          - {id: C, matrix: C}
          - '\;\longrightarrow\;'
          - {id: CN, matrix: CN}
          - {id: CF, matrix: CF}
        size: 26
      - say: 'A 100-node grid with a fixed rim rises into a cushion.'
        solve: true

  - title: 'SCIPY CHOLESKY'
    steps:
      - say: 'Complete runnable SciPy Cholesky script for the 10x10 grid.'
        size: 13
        code: |
          import numpy as np
          from scipy.linalg import cho_factor, cho_solve

          n = 10
          xyz = []
          free = []
          fixed = []
          edges = []

          for r in range(n):
              for c in range(n):
                  k = r * n + c
                  xyz.append([c, r, 0.0])
                  if r == 0 or r == n - 1 or c == 0 or c == n - 1:
                      fixed.append(k)
                  else:
                      free.append(k)
                  if c + 1 < n:
                      edges.append((k, k + 1))
                  if r + 1 < n:
                      edges.append((k, k + n))

          xyz = np.array(xyz)
          C = np.zeros((len(edges), n * n))
          for e, (i, j) in enumerate(edges):
              C[e, i] = 1.0
              C[e, j] = -1.0

          C_N = C[:, free]
          C_F = C[:, fixed]
          Q = np.eye(len(edges))
          x_F = xyz[fixed]
          p = np.tile([0.0, 0.0, 0.35], (len(free), 1))

          L, low = cho_factor(C_N.T @ Q @ C_N, lower=True)
          x_N = cho_solve((L, low), p - C_N.T @ Q @ C_F @ x_F)
          print(x_N.shape, round(x_N[:, 2].max(), 3))   # (64, 3) 2.025
