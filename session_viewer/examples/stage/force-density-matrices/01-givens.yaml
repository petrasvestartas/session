# Chapter 1: where this presentation is heading, and the givens of the five nodes written as matrices for the first time.
title: FORCE DENSITY MATRICES
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
palette: {free: pink}
net:
  fixed: {n1: [0, 0, 0], n2: [5, 0, 3], n3: [0, 7, 3], n4: [7, 5, 0]}
  free: {n0: [3.6, 3.4, 1.9]}        # drawn at a guess; its true place is the answer
  cables: {e0: [n0, n1], e1: [n0, n2], e2: [n0, n3], e3: [n0, n4]}
  q: 1
  load: {n0: [0, 0, -5]}
slides:
  - title: FORCE DENSITY MATRICES
    steps:
      - say: 'The five-node problem written with matrices.'
        show: net
        do:
          - row:
              - {id: linkwitz, image: {src: ../force-density/img/linkwitz.png, height: 6.5}}
              - '\quad'
              - {id: schek, image: {src: ../force-density/img/schek.png, height: 6.5}}
          - row:
              - {id: linkwitz.name, text: '**Klaus Linkwitz**', width: 7.7580645161}
              - '\quad'
              - {id: schek.name, text: '**Hans-Jörg Schek**', width: 7.5483870968}
          - eq: {id: xn, tex: '{{\mathbf{x}}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_x - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{x}_F)}'}
          - color: {target: 'xn{\mathbf{x}}', color: x}
          - eq: {id: yn, tex: '{{\mathbf{y}}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_y - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{y}_F)}'}
          - color: {target: 'yn{\mathbf{y}}', color: y}
          - eq: {id: zn, tex: '{{\mathbf{z}}_N = (\mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_N)^{-1}\,(\mathbf{p}_z - \mathbf{C}_N^{T}\mathbf{Q}\,\mathbf{C}_F\,\mathbf{z}_F)}'}
          - color: {target: 'zn{\mathbf{z}}', color: z}
