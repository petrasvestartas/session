# Chapter 5: Schek's ring-and-spoke topology: 5 free nodes, 4 fixed anchors, 12 cables.
title: SCHEK NET
grid: {center: [0, 0], size: 14, step: 1, z: -2.5}
camera: {yaw: -62, pitch: 32}
palette: {free: pink}
net:
  free: {N1: [-3, 0, 0], N2: [0, -3, 0], N3: [3, 0, 0], N4: [0, 3, 0], N5: [0, 0, 0]}
  fixed: {N6: [-6, 0, 0], N7: [0, -6, 0], N8: [6, 0, 0], N9: [0, 6, 0]}
  cables:
    1: [N6, N1]
    2: [N7, N2]
    3: [N8, N3]
    4: [N9, N4]
    5: [N1, N4]
    6: [N1, N2]
    7: [N2, N3]
    8: [N3, N4]
    9: [N4, N5]
    10: [N1, N5]
    11: [N2, N5]
    12: [N3, N5]
  q: 1
  load: [0, 0, -1]
slides:
  - title: 'SCHEK NET'
    steps:
      - say: 'Five free nodes and four anchors joined by twelve cables.'
        show: net
        row:
          - {id: CN, matrix: {of: CN, cell: 0.9}}
          - '\quad'
          - {id: CF, matrix: {of: CF, cell: 0.9}}
        size: 24
      - say: 'Five free nodes and four anchors joined by twelve cables.'
        solve: true
