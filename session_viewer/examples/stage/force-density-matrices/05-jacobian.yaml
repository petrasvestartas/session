# Chapter 5: (6.22)-(6.24). The derivatives of all four bars as one row, C_N^T U L^-1.
title: The Jacobian row
grid: {center: [3.5, 3.5], size: 9, step: 1}
camera: {yaw: -58, pitch: 26}
points:
  n0: [3, 3, 0.25]
  X: [3, 3, 0.25]         # the node we nudge; it starts on n0
  n1: [0, 0, 0]
  n2: [5, 0, 3]
  n3: [0, 7, 3]
  n4: [7, 5, 0]
slides:
  - title: 'All four cables · (6.23)–(6.24)'
    steps:
      - say: 'Collect the derivative of every cable length into one row: the transposed Jacobian.'
        do:
          - add:
              - {id: n1, point: n1, color: fixed, label: 'n_1'}
              - {id: n2, point: n2, color: fixed, label: 'n_2'}
              - {id: n3, point: n3, color: fixed, label: 'n_3'}
              - {id: n4, point: n4, color: fixed, label: 'n_4'}
              - {id: e0, line: [n0, n1], label: 'e_0'}
              - {id: e1, line: [n0, n2], label: 'e_1'}
              - {id: e2, line: [n0, n3], label: 'e_2'}
              - {id: e3, line: [n0, n4], label: 'e_3'}
              - {id: n0, point: n0, color: free, label: 'n_0'}
            dur: 0.8
          - row: ['\Big(\frac{\partial \mathbf{f}(x_0)}{\partial x_0}\Big)^{T} =', {matrix: {rows: [['\dfrac{-(x_1 - x_0)}{l_1}', '\dfrac{-(x_2 - x_0)}{l_2}', '\dfrac{-(x_3 - x_0)}{l_3}', '\dfrac{-(x_4 - x_0)}{l_4}']], collabels: [e_0, e_1, e_2, e_3]}}]
      - say: 'With the numbers of our net:'
        row: ['=', {matrix: {rows: [['0.706', '-0.441', '0.526', '-0.893']], collabels: [e_0, e_1, e_2, e_3]}}]
      - say: 'With $\mathbf{u} = \mathbf{C}\mathbf{x} = x_0 - x_k$, each entry is $u_k/l_k$: a diagonal $\mathbf{U}\mathbf{L}^{-1}$ summed by $\mathbf{C}_N^T$.'
        row: ['\mathbf{C}_N^{T}\mathbf{U}\mathbf{L}^{-1} =', {matrix: [[1, 1, 1, 1]]}, {matrix: [['0.706', 0, 0, 0], [0, '-0.441', 0, 0], [0, 0, '0.526', 0], [0, 0, 0, '-0.893']]}]
      - say: 'Linkwitz writes the whole row compactly as equation (6.24).'
        do:
          - {tex: '\Big(\frac{\partial \mathbf{f}(\mathbf{x})}{\partial \mathbf{x}}\Big)^{T} = \mathbf{C}_N^{T}\,\mathbf{U}\,\mathbf{L}^{-1} \qquad (6.24)', id: e624, color: accent}
          - highlight: [e624]
