# Chapter 6: a 9x9 saddle grid anchored only at its four corners.
title: SADDLE GRID
grid: {center: [4, 4], size: 11, step: 1}
camera: {yaw: -52, pitch: 30}
palette: {free: pink}
net:
  grid: [9, 9]
  fixed: corners
  lift: {n0_0: 4, n8_8: 4}
  q: 1
  rim: 10
  load: [0, 0, -0.1]
slides:
  - title: 'SADDLE GRID'
    steps:
      - say: 'An 81-node grid with four corner anchors forms a saddle.'
        show: [cables, fixed]
        row:
          - {id: C, matrix: C}
          - '\;\longrightarrow\;'
          - {id: CN, matrix: CN}
          - {id: CF, matrix: CF}
        size: 26
      - say: 'An 81-node grid with four corner anchors forms a saddle.'
        do:
          - solve: true
          - highlight: [n0_0, n8_8]
