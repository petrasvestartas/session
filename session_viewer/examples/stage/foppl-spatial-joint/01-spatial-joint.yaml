title: 1 · The spatial joint
split: 0.54
grid: {center: [0, 0], size: 6, step: 1, z: 0}
camera: {fit: [O, A, B, C, P0, OG], yaw: 20, pitch: 25}
points:
  O: [0, 0, 2]
  A: [2, 1, 0]
  B: [-1, -2, 0]
  C: [-2, 1, 0]
  P0: [2.5, -0.5, 0]
  OG: [0, 0, 0]
  FA: [-1.2, -0.6, 3.2]
  FB: [0.3, 0.6, 2.6]
  FC: [-0.6, 0.3, 1.4]
  LP: [1.5, -0.3, 0.8]
  AX: [2, 0, 2]
  AXY: [2, 1, 2]
blocks:
  joint:
    - add:
        - {id: O, point: O, color: ink, label: 'O'}
        - {id: A, point: A, color: ink, label: 'A'}
        - {id: B, point: B, color: ink, label: 'B'}
        - {id: C, point: C, color: ink, label: 'C'}
        - {id: a, line: [O, A], color: ink, label: 'a'}
        - {id: b, line: [O, B], color: ink, label: 'b'}
        - {id: c, line: [O, C], color: ink, label: 'c'}
slides:
  - title: Given geometry
    steps:
      - say: 'Three non-coplanar bars meet at $O$. Their anchors $A,B,C$ lie on the datum $z=0$.'
        joint: true
        eq: 'O=(0,0,2)'
        text: 'A: (2, 1, 0)   ·   B: (−1, −2, 0)   ·   C: (−2, 1, 0)'
      - say: 'The external load is known. Its line pierces the datum at $P_0$.'
        add:
          - {id: P, arrow: [O, P0], color: load, label: '\mathbf{P}'}
          - {id: P0, point: P0, color: load, label: 'P_0'}
          - {id: dropO, line: [O, OG], color: grey, width: 1.6, dash: true}
          - {id: OG, point: OG, color: ink, size: 0.8}
          - {id: datum, label: [-2.7, -2.7, 0], tex: 'z=0', color: dim}
        eq: '\mathbf{P}=(5,-1,-4), \qquad P_0=(2.5,-0.5,0)'
      - say: 'A demonstration uses exact integer direction cosines; the historical figure supplies no unique dimensions.'
        eq: 'A\mathbf{a}+B\mathbf{b}+C\mathbf{c}+\mathbf{P}=\mathbf{0}'
        text: 'Unit bar directions point away from $O$. Tension is positive; compression is negative.'
  - title: Direction cosines
    steps:
      - say: 'One coordinate box describes bar $a$. Its length is exactly three.'
        joint: true
        remove: [b, c, b.label, c.label, B, C, B.label, C.label]
        add:
          - {id: box, cuboid: [O, A], color: grey, width: 1.2}
          - {id: dx, arrow: [O, AX], color: blue, label: '2'}
          - {id: dy, arrow: [AX, AXY], color: pink, label: '1'}
          - {id: dz, arrow: [AXY, A], color: blue, label: '-2'}
        eq: 'l_a=\sqrt{2^2+1^2+(-2)^2}=3'
      - say: 'Dividing the displacement by the true spatial length gives the unit direction.'
        eq: '\mathbf{a}=\frac{\mathbf{x}_A-\mathbf{x}_O}{l_a}=\left(\frac{2}{3},\frac{1}{3},-\frac{2}{3}\right)'
        text: '$l_b=l_c=3$ as well. A projected edge is not its true length.'
  - title: Four forces in equilibrium
    steps:
      - say: 'Each bar force is its signed scalar multiplied by its unit direction.'
        joint: true
        dim: [a, b, c]
        add:
          - {id: Fa, arrow: [O, FA], color: blue, label: '\mathbf{F}_a'}
          - {id: Fb, arrow: [O, FB], color: blue, label: '\mathbf{F}_b'}
          - {id: Fc, arrow: [O, FC], color: pink, label: '\mathbf{F}_c'}
          - {id: P, arrow: [O, LP], color: load, label: '\mathbf{P}'}
        eq: '\mathbf{F}_a=A\mathbf{a},\quad \mathbf{F}_b=B\mathbf{b},\quad \mathbf{F}_c=C\mathbf{c}'
      - say: 'The solved forces close the spatial polygon. Blue is compression here; pink is tension.'
        eq: 'A=-6, \qquad B=-3, \qquad C=+3'
        text: '$\mathbf{F}_a=(-4,-2,4)$   ·   $\mathbf{F}_b=(1,2,2)$   ·   $\mathbf{F}_c=(-2,1,-2)$'
      - say: 'Their sum with the applied load is exactly zero.'
        eq: '\mathbf{F}_a+\mathbf{F}_b+\mathbf{F}_c+\mathbf{P}=\mathbf{0}'
        text: 'The next construction finds these forces without first solving a $3\times3$ matrix.'
