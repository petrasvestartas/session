[workspace]

[package]
name = "session_viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]  # cdylib = the .wasm the browser loads; rlib lets tests and examples link the same code

[dependencies]
session_rust = { path = "../../../../session_rust" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "=0.8.23"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
winit = "0.30"
wgpu = "29.0"
egui = { version = "=0.34.3", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.34.3", default-features = false }
egui-winit = { version = "=0.34.3", default-features = false }
glyphon = "=0.11.0" # text renderer; `=` pins the one release built for wgpu 29
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    # --8<-- [start:step-1]
    "HtmlInputElement",
    "KeyboardEvent",
    "PointerEvent",
    # --8<-- [end:step-1]
    "EventTarget",
    "Event",
    "Location",
    "History",
    "Performance",
    "EventSource",
    "MessageEvent",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    ] }
# Never called here: the kernel's rand 0.8 pulls in getrandom 0.2, which builds for wasm32 only with `js`.
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
prost = "0.14"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3 # dependencies optimised even in debug builds, so a large scene still parses fast

[profile.release]
strip = true

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }

# Native builds only (tests, examples). A TOML table runs to the next header, so keep this one
# near the end: a wasm dependency written below it would silently leave the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
