# --8<-- [start:deck]
title: A slide of mathematics
slides:
  - title: Align and rewrite
    steps:
      - say: 'Different left sides share one equals column.'
        eq: 'x=\frac{a+b}{c}'
        then: 'x+y=\sqrt{a^2+b^2}'
      - say: 'Equal symbols keep their identity while the equation changes.'
        becomes: 'x+y+z=\sqrt{a^2+b^2}'
  - title: Read a matrix
    steps:
      - say: 'Rows and columns give every entry a stable address.'
        matrix: {id: M, rows: [[2, -1], [-1, 2]]}
      - say: 'The first row contains both addressed entries.'
        color: {target: 'M[0,:]', color: accent}
  - title: Orthographic construction
    steps:
      - say: 'Flat construction ink shares the slide coordinates and the same elongated arrowheads.'
        add:
          - {id: diagram, drawing: [{line: [[0, 0], [280, 160]], color: grey, width: 1.6, dash: true}, {arrow: [[0, 160], [280, 0]], color: load}, {point: [280, 0], color: ink}, {point: [0, 160], color: ink}], at: [160, 230]}
          - {id: load_label, tex: '\mathbf{P}', at: [330, 210], size: 28, color: accent}
# --8<-- [end:deck]
