<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
    <title>Session Viewer</title>
    <!-- Scenes come from this bucket: open the connection while the wasm downloads; register:loading -->
    <link rel="preconnect" href="https://pub-dfd304db921140a09a9ad44c30e0aceb.r2.dev" crossorigin> <!-- register:loading -->
    <!-- The scene manifest and its first file start downloading while the wasm loads; register:loading -->
    <link data-trunk rel="inline" href="src/page/early.js" type="js"/> <!-- register:loading -->
    <style>
      #viewer-error:not([hidden]) {
        position: fixed;
        inset: 0;
        background: #111e;
        color: #fff;
        padding: 25vh 15vw;
        font: 16px/1.5 system-ui;
        z-index: 20;
      }
      #viewer-error button {
        padding: 8px 16px;
        margin-top: 16px;
      }
    </style>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /* overscroll-behavior kills pull-to-refresh and the rubber band: a downward drag on the
      canvas is an orbit, and a page that bounces under it swallows half the gesture. */
      html, body {
        height: 100%;
        overscroll-behavior: none;
      }
      body {
        background: #f0f0f0;
        overflow: hidden;
      }
      /* No focus ring. winit gives the canvas a tabindex so it can receive key
      events, and the browser then rings the focused element - a black
      rectangle around the whole viewport, drawn over the model. Both spellings
      are needed: engines differ on which one they paint. */
      /* touch-action: none is what actually delivers the gestures. winit does call preventDefault,
      on `pointerdown` and on a non-passive `touchstart` (winit-0.30.13 web_sys/pointer.rs:115,
      web_sys/canvas.rs:245), but that is a LATE veto: the compositor has already begun deciding
      whether the gesture is a scroll, and where it decides yes the app gets a pointercancel and
      nothing more. touch-action tells it up front, before any of that, and it is the only one
      of the three that iOS Safari applies to page pinch-zoom.
      The rest turns off the things a long press and a double tap mean to a DOCUMENT: the iOS
      callout menu, text selection, the grey tap flash, and the legacy double-tap-to-zoom.
      100dvh after 100vh: dvh follows a mobile toolbar sliding away, vh does not, and browsers
      that never heard of dvh keep the line above. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas:focus, canvas:focus-visible {
        outline: none;
      }
      #viewer-status:empty {
        display: none;
      }
    </style>
    <link data-trunk rel="inline" href="src/page/no_webgpu.css" type="css"/> <!-- register:page -->
  </head>
  <body>
    <link data-trunk rel="rust" data-target-name="session_viewer" data-wasm-opt="0"/>
    <!-- Trunk copies local fixtures into dist/pb. Named remote scenes resolve through app/route.rs; register:scenes -->
    <link data-trunk rel="copy-dir" href="assets/pb" data-target-path="pb"/> <!-- register:scenes -->
    <!-- The ONE local manifest; every other scene is opened from the bucket with ?scene=; register:scenes -->
    <link data-trunk rel="copy-file" href="assets/view_local.yaml"/> <!-- register:scenes -->
    <div id="viewer-error" role="alert" hidden>
      <p id="viewer-error-message"></p>
      <button type="button" onclick="location.reload()">Reload viewer</button>
    </div>
    <canvas id="canvas" tabindex="0" role="application" aria-label="3D viewer. Click selects, Shift-click adds to selection, right drag orbits. Type Layers On in the command line to show layers. Enter executes and Escape cancels."></canvas>
    <!-- A phone keyboard opens only for an editable element: this one takes the command line's typing (app/agent.rs). Below 16px iOS zooms the page on focus; register:phone -->
    <input id="command-agent" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" tabindex="-1" aria-hidden="true" style="position: fixed; bottom: 0; left: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; pointer-events: none;"> <!-- register:phone -->
    <div id="viewer-status" role="status" aria-live="polite" style="position: fixed; bottom: 12px; left: 12px; color: #fff; background: #222b; font: 14px system-ui; padding: 4px 8px; pointer-events: none;"></div>
    <link data-trunk rel="copy-dir" href="assets/text" data-target-path="text"/> <!-- register:text -->
    <link data-trunk rel="copy-file" href="assets/text-quality.html"/> <!-- register:text_quality -->
    <!-- No context menu on the canvas, scene reloads from the embedding page, the WebGPU notice; register:page -->
    <link data-trunk rel="inline" href="src/page/viewer.js" type="js"/> <!-- register:page -->
  </body>
</html>
