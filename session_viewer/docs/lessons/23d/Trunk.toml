[build]
dist = "../../../target/lessons/23d/dist"
# Benchmarks and tutorial checkpoints use this same optimized browser build.
release = true
no_sri = true
public_url = "./"

[watch]
# This replaces Trunk's default watch set, so the shared path dependency is explicit.
watch = [
    "src",
    "Cargo.toml",
    "index.html",
    "assets/view_local.yaml", # register:scenes
    "assets/text", # register:text
    "assets/text-quality.html", # register:text_quality
    "../../../../session_rust/src",
]
enable_cooldown = true

[serve]
# The mutable development index must always name the current hashed WASM bundle.
headers = { "Cache-Control" = "no-store" }
addresses = ["127.0.0.1"]
port = 8770
