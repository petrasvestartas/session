[package]
name = "session_viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

# Standalone skeleton for Chapter 02 (window + grey clear). Only the deps this
# chapter actually uses — no session_rust, no egui, no bytemuck yet.
[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = { version = "29.0", features = ["webgl"] }
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement"] }

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
