[package]
name = "session_viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
session_rust = { path = "../session_rust" }
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = { version = "29.0"}
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document", 
    "Window", 
    "Element", 
    "HtmlCanvasElement", 
    "EventTarget", 
    "Event", 
    "CanvasRenderingContext2d", 
    "ImageData", 
    "Location",
] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
egui         = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-wgpu    = { version = "0.34", default-features = false }
egui-winit   = { version = "0.34", default-features = false }
egui_extras  = { version = "0.34", default-features = false, features = ["svg"] }

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
