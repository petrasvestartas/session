<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" role="img" aria-labelledby="t d"><title id="t">Measuring retained documents without retaining them</title><desc id="d">Scene owns each source document through an Rc. SourceCache remembers a Weak handle to the same allocation next to the payload figure it computed. On every snapshot it compares identities: the same pointers mean the cached figure is reused; a replaced document means one new walk. Because the cache holds only Weak handles, a document dropped by Scene is freed at once, and the cache reports the drop instead of keeping the bytes alive.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="538.8" lengthAdjust="spacingAndGlyphs">Strong ownership in Scene, weak identity in the cache</text><rect data-box="0" x="28.0" y="80.0" width="210.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="104.0" style="fill:#111111" data-box="0" textLength="43.7" lengthAdjust="spacingAndGlyphs">Scene</text><text class="s" xml:space="preserve" x="40.0" y="128.0" style="fill:#455b6b" data-box="0" textLength="186.6" lengthAdjust="spacingAndGlyphs">documents: Vec&lt;Rc&lt;Session&gt;&gt;</text><text class="s" xml:space="preserve" x="40.0" y="148.0" style="fill:#455b6b" data-box="0" textLength="91.4" lengthAdjust="spacingAndGlyphs">owns the bytes</text><rect data-box="1" x="360.0" y="80.0" width="218.7" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="372.0" y="104.0" style="fill:#111111" data-box="1" textLength="159.2" lengthAdjust="spacingAndGlyphs">Session A · Rc count 1</text><text class="s" xml:space="preserve" x="372.0" y="128.0" style="fill:#455b6b" data-box="1" textLength="141.9" lengthAdjust="spacingAndGlyphs">meshes · breps · clouds</text><rect data-box="2" x="360.0" y="170.0" width="218.7" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="372.0" y="194.0" style="fill:#111111" data-box="2" textLength="158.9" lengthAdjust="spacingAndGlyphs">Session B · Rc count 1</text><text class="s" xml:space="preserve" x="372.0" y="218.0" style="fill:#455b6b" data-box="2" textLength="73.3" lengthAdjust="spacingAndGlyphs">curves · text</text><rect data-box="3" x="700.0" y="80.0" width="230.7" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="712.0" y="104.0" style="fill:#111111" data-box="3" textLength="95.7" lengthAdjust="spacingAndGlyphs">SourceCache</text><text class="s" xml:space="preserve" x="712.0" y="128.0" style="fill:#455b6b" data-box="3" textLength="183.9" lengthAdjust="spacingAndGlyphs">Weak&lt;Session&gt; per document</text><text class="s" xml:space="preserve" x="712.0" y="148.0" style="fill:#455b6b" data-box="3" textLength="186.8" lengthAdjust="spacingAndGlyphs">Payload { known bytes, scans }</text><line x1="238.03" y1="120" x2="360" y2="110" stroke="#bdbfe8" stroke-width="1.6"/><polygon points="360,110 351,105 351,115" fill="#bdbfe8"/><line x1="238.03" y1="132" x2="360" y2="200" stroke="#bdbfe8" stroke-width="1.6"/><polygon points="360,200 351,195 351,205" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="250.0" y="108.0" style="fill:#bdbfe8" textLength="66.0" lengthAdjust="spacingAndGlyphs">Rc (strong)</text><line x1="700" y1="110" x2="578.7" y2="110" stroke="#b9b9bd" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="578.7,110 587.7,105 587.7,115" fill="#b9b9bd"/><line x1="700" y1="132" x2="578.7" y2="200" stroke="#b9b9bd" stroke-width="1.6" stroke-dasharray="5 4"/><polygon points="578.7,200 587.7,195 587.7,205" fill="#b9b9bd"/><text class="s" xml:space="preserve" x="590.7" y="251.0" style="fill:#b9b9bd" textLength="179.5" lengthAdjust="spacingAndGlyphs">Weak (no ownership), dashed</text><text class="l" xml:space="preserve" x="28.0" y="290.0" textLength="123.1" lengthAdjust="spacingAndGlyphs">Three snapshots</text><rect data-box="4" x="28.0" y="304.0" width="237.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="328.0" style="fill:#111111" data-box="4" textLength="81.4" lengthAdjust="spacingAndGlyphs">snapshot 1</text><text class="s" xml:space="preserve" x="40.0" y="352.0" style="fill:#455b6b" data-box="4" textLength="191.1" lengthAdjust="spacingAndGlyphs">identities new → walk A, walk B</text><text class="s" xml:space="preserve" x="40.0" y="372.0" style="fill:#455b6b" data-box="4" textLength="55.7" lengthAdjust="spacingAndGlyphs">scans = 2</text><rect data-box="5" x="289.6" y="304.0" width="280.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="301.6" y="328.0" style="fill:#111111" data-box="5" textLength="221.8" lengthAdjust="spacingAndGlyphs">snapshot 2 · same Rc pointers</text><text class="s" xml:space="preserve" x="301.6" y="352.0" style="fill:#455b6b" data-box="5" textLength="134.2" lengthAdjust="spacingAndGlyphs">cached figures reused</text><text class="s" xml:space="preserve" x="301.6" y="372.0" style="fill:#455b6b" data-box="5" textLength="55.7" lengthAdjust="spacingAndGlyphs">scans = 2</text><rect data-box="6" x="594.2" y="304.0" width="280.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="606.2" y="328.0" style="fill:#111111" data-box="6" textLength="211.5" lengthAdjust="spacingAndGlyphs">snapshot 3 · B replaced by B'</text><text class="s" xml:space="preserve" x="606.2" y="352.0" style="fill:#455b6b" data-box="6" textLength="151.3" lengthAdjust="spacingAndGlyphs">A reused, B' walked once</text><text class="s" xml:space="preserve" x="606.2" y="372.0" style="fill:#455b6b" data-box="6" textLength="186.2" lengthAdjust="spacingAndGlyphs">scans = 3; B freed immediately</text><text class="s" xml:space="preserve" x="28.0" y="420.0" textLength="838.9" lengthAdjust="spacingAndGlyphs">The figure is a known payload: geometry arrays the walk can size exactly; anything it cannot size is listed under exclusions, never guessed.</text></svg>
