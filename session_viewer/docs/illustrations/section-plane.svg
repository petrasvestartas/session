" y1="127.6" x2="1028.6" y2="362.4" stroke="#b9b9bd" stroke-width="1.6" stroke-dasharray="7 5"/><text class="s" xml:space="preserve" x="60.0" y="392.0" textLength="338.6" lengthAdjust="spacingAndGlyphs">the plane crosses a triangle, so the whole triangle goes:</text><text class="s" xml:space="preserve" x="60.0" y="414.0" style="fill:#f0bcdb" textLength="249.2" lengthAdjust="spacingAndGlyphs">the edge follows the mesh, not the plane</text><text class="s" xml:space="preserve" x="460.0" y="392.0" textLength="302.1" lengthAdjust="spacingAndGlyphs">discard decides per pixel, so the edge is the plane</text><text class="s" xml:space="preserve" x="460.0" y="414.0" style="fill:#8fd36a" textLength="289.7" lengthAdjust="spacingAndGlyphs">but the opening shows the inside of the far wall</text><text class="s" xml:space="preserve" x="850.0" y="392.0" textLength="297.8" lengthAdjust="spacingAndGlyphs">back faces painted flat already read as a solid cut</text><text class="s" xml:space="preserve" x="850.0" y="414.0" style="fill:#e8ac00" textLength="276.9" lengthAdjust="spacingAndGlyphs">stencilling the cap properly is the stretch goal</text><text class="s" xml:space="preserve" x="28.0" y="468.0" textLength="959.0" lengthAdjust="spacingAndGlyphs">The dashed rectangle is the uncut solid. A discarding fragment shader gives up early depth testing, which is why the plane wants to compile out when it is off.</text></svg>
