<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">Where the cut happens</title><desc id="d">A section plane can be applied in either shader stage, and the choice shows. A vertex-stage rejection can only remove whole triangles, so wherever the plane crosses a triangle the whole triangle goes and the cut face keeps a staircase of mesh edges. A fragment-stage discard cuts at pixel resolution, exactly on the plane - but discarding alone leaves a hollow shell, because what the opening reveals is the inside of the far wall. A cap is what makes it read as a solid.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="317.3" lengthAdjust="spacingAndGlyphs">A plane, and three ways it looks</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#f0bcdb" textLength="181.6" lengthAdjust="spacingAndGlyphs">vertex stage: a staircase</text><rect x="68.0" y="150.0" width="228.0" height="190.0" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 5"/><polygon points="68.0,150.0 106.0,150.0 68.0,188.0" fill="#b9b9bd" fill-opacity="0.34" stroke="#f4f4f6" stroke-width="0.9"/><polygon points="106.0,150.0 106.0,188.0 68.0,188.0" fill="#b9b9bd" fill-opacity="0.34" stroke="#f4f4f6" stroke-width="0.9"/><polygon points="68.0,188.0 106.0,188.0 68.0,226.0" fill="#b9b9bd" fill-opacity="0.34" s