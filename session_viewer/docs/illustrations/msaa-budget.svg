<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 596" role="img" aria-labelledby="t d"><title id="t">Where 4x is affordable</title><desc id="d">Multisampling is spent only where an adapter can carry it: 4x needs solid geometry on the GPU and a canvas within this adapter's pixel budget, and lesson 17 adds a third condition, a device scale below two physical pixels per CSS pixel. In a browser the adapter never says what it is - wgpu reports DeviceType::Other for every one - so Other is its own budget, not a synonym for integrated.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One gate, then the adapter's budget</text><rect data-box="0" x="28.0" y="76.0" width="430.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="100.0" style="fill:#111111" data-box="0">solid geometry on the GPU?</text><text class="s" xml:space="preserve" x="40.0" y="124.0" style="fill:#455b6b" data-box="0">faces, pipes or spheres — ribbons, dots</text><text class="s" xml:space="preserve" x="40.0" y="144.0" style="fill:#455b6b" data-box="0">and splats antialias themselves</text><rect data-box="1" x="490.0" y="76.0" width="196.0" height="37.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="502.0" y="100.0" style="fill:#111111" data-box="1">no → 1×</text><rect data-box="2" x="722.0" y="76.0" width="430.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="734.0" y="100.0" style="fill:#111111" data-box="2">lesson 17 adds a second gate</text><text class="s" xml:space="preserve" x="734.0" y="124.0" style="fill:#455b6b" data-box="2">device scale below two physical</text><text class="s" xml:space="preserve" x="734.0" y="144.0" style="fill:#455b6b" data-box="2">pixels per CSS pixel</text><text class="s" xml:space="preserve" x="28.0" y="196.0" style="fill:#e8ac00">?msaa= is forced and wins over everything below.</text><text class="s" xml:space="preserve" x="406.0" y="218.0" text-anchor="middle">DiscreteGpu</text><text class="m" xml:space="preserve" x="406.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">9,000,000 px</text><text class="s" xml:space="preserve" x="618.0" y="218.0" text-anchor="middle">IntegratedGpu</text><text class="s" xml:space="preserve" x="618.0" y="236.0" text-anchor="middle">VirtualGpu</text><text class="m" xml:space="preserve" x="618.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">2,500,000 px</text><text class="s" xml:space="preserve" x="830.0" y="218.0" text-anchor="middle">Cpu</text><text class="m" xml:space="preserve" x="830.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">never 4×</text><text class="s" xml:space="preserve" x="1042.0" y="218.0" text-anchor="middle">Other</text><text class="m" xml:space="preserve" x="1042.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">4,200,000 px</text><text class="s" xml:space="preserve" x="28.0" y="252.0">pixels this adapter carries at 4×</text><text class="m" xml:space="preserve" x="28.0" y="288.0">1920 × 1080 = 2.1 Mpx</text><rect x="304.0" y="264.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="406.0" y="288.0" text-anchor="middle" style="fill:#111111">4×</text><rect x="516.0" y="264.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="618.0" y="288.0" text-anchor="middle" style="fill:#111111">4×</text><rect x="728.0" y="264.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="830.0" y="288.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="940.0" y="264.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="1042.0" y="288.0" text-anchor="middle" style="fill:#111111">4×</text><text class="m" xml:space="preserve" x="28.0" y="334.0">2560 × 1440 = 3.7 Mpx</text><rect x="304.0" y="310.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="406.0" y="334.0" text-anchor="middle" style="fill:#111111">4×</text><rect x="516.0" y="310.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="618.0" y="334.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="728.0" y="310.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="830.0" y="334.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="940.0" y="310.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="1042.0" y="334.0" text-anchor="middle" style="fill:#111111">4×</text><text class="m" xml:space="preserve" x="28.0" y="380.0">3840 × 2160 = 8.3 Mpx</text><rect x="304.0" y="356.0" width="204.0" height="36.0" rx="4" fill="#bdbfe8" fill-opacity="1.0"/><text class="l" xml:space="preserve" x="406.0" y="380.0" text-anchor="middle" style="fill:#111111">4×</text><rect x="516.0" y="356.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="618.0" y="380.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="728.0" y="356.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="830.0" y="380.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="940.0" y="356.0" width="204.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.18"/><text class="l" xml:space="preserve" x="1042.0" y="380.0" text-anchor="middle" style="fill:#b9b9bd">1×</text><rect x="936.0" y="198.0" width="212.0" height="204.0" rx="4" fill="#fa9ebc" fill-opacity="0.16"/><rect data-box="3" x="28.0" y="424.0" width="1124.0" height="103.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="448.0" style="fill:#111111" data-box="3">The browser is ALWAYS 'Other'</text><text class="s" xml:space="preserve" x="40.0" y="472.0" style="fill:#455b6b" data-box="3">wgpu's WebGPU backend reports DeviceType::Other for every adapter, because WebGPU</text><text class="s" xml:space="preserve" x="40.0" y="492.0" style="fill:#455b6b" data-box="3">exposes no such field. It is a discrete GPU exactly as often as it is not — read it as</text><text class="s" xml:space="preserve" x="40.0" y="512.0" style="fill:#455b6b" data-box="3">"probably integrated" and an ordinary 2560 × 1440 window gives up its samples for nothing.</text><text class="s" xml:space="preserve" x="28.0" y="552.0">Measured: discrete at 3840 × 2160 costs 8.2 ms at 4× against 6.9 at 1×. An Intel iGPU on the same scene: 108.9 against 46.5,</text><text class="s" xml:space="preserve" x="28.0" y="574.0" style="fill:#e8ac00">and shrinking the canvas does not buy it back (92.4 ms at 2108 × 1186) — so a big canvas gives up the samples, not the pixels.</text></svg>
