<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 565" role="img" aria-labelledby="t d"><title id="t">The six depth modes are three compare functions crossed with the write flag</title><desc id="d">A matrix whose rows are write and no write and whose columns are Greater, GreaterEqual and Always. Five cells hold a named mode and the pair that state() returns for it; the sixth is empty because a pass that always passes has nothing to write, and Detached sits off the matrix because it has no depth attachment at all.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="320.7" lengthAdjust="spacingAndGlyphs">Three compares × one write flag</text><text class="l" xml:space="preserve" x="295.0" y="94.0" text-anchor="middle" textLength="57.7" lengthAdjust="spacingAndGlyphs">Greater</text><text class="s" xml:space="preserve" x="295.0" y="114.0" text-anchor="middle" textLength="115.6" lengthAdjust="spacingAndGlyphs">strictly nearer wins</text><text class="l" xml:space="preserve" x="557.0" y="94.0" text-anchor="middle" textLength="98.9" lengthAdjust="spacingAndGlyphs">GreaterEqual</text><text class="s" xml:space="preserve" x="557.0" y="114.0" text-anchor="middle" textLength="75.4" lengthAdjust="spacingAndGlyphs">ties are kept</text><text class="l" xml:space="preserve" x="819.0" y="94.0" text-anchor="middle" textLength="52.8" lengthAdjust="spacingAndGlyphs">Always</text><text class="s" xml:space="preserve" x="819.0" y="114.0" text-anchor="middle" textLength="42.5" lengthAdjust="spacingAndGlyphs">no test</text><text class="l" xml:space="preserve" x="158.0" y="196.0" text-anchor="end" textLength="39.7" lengthAdjust="spacingAndGlyphs">write</text><text class="l" xml:space="preserve" x="158.0" y="342.0" text-anchor="end" textLength="62.8" lengthAdjust="spacingAndGlyphs">no write</text><rect data-box="0" x="176.0" y="130.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="188.0" y="154.0" style="fill:#111111" data-box="0" textLength="58.8" lengthAdjust="spacingAndGlyphs">Opaque</text><text class="m" xml:space="preserve" x="188.0" y="178.0" style="fill:#111111" data-box="0" textLength="112.9" lengthAdjust="spacingAndGlyphs">(true, Greater)</text><text class="s" xml:space="preserve" x="188.0" y="198.0" style="fill:#455b6b" data-box="0" textLength="176.2" lengthAdjust="spacingAndGlyphs">solids and the depth prepass</text><rect data-box="1" x="438.0" y="130.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="450.0" y="154.0" style="fill:#111111" data-box="1" textLength="100.1" lengthAdjust="spacingAndGlyphs">OpaqueEqual</text><text class="m" xml:space="preserve" x="450.0" y="178.0" style="fill:#111111" data-box="1" textLength="150.5" lengthAdjust="spacingAndGlyphs">(true, GreaterEqual)</text><text class="s" xml:space="preserve" x="450.0" y="198.0" style="fill:#455b6b" data-box="1" textLength="140.1" lengthAdjust="spacingAndGlyphs">source-point queries: a</text><text class="s" xml:space="preserve" x="450.0" y="218.0" style="fill:#455b6b" data-box="1" textLength="174.4" lengthAdjust="spacingAndGlyphs">resident point ties with itself</text><rect x="700" y="130" width="238" height="122" rx="4" fill="#23232a"/><text class="s" xml:space="preserve" x="716.0" y="170.0" style="fill:#b9b9bd" textLength="52.9" lengthAdjust="spacingAndGlyphs">no caller</text><text class="s" xml:space="preserve" x="716.0" y="192.0" style="fill:#b9b9bd" textLength="155.6" lengthAdjust="spacingAndGlyphs">a pass that always passes</text><text class="s" xml:space="preserve" x="716.0" y="214.0" style="fill:#b9b9bd" textLength="123.2" lengthAdjust="spacingAndGlyphs">has nothing to write</text><rect data-box="2" x="176.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="188.0" y="300.0" style="fill:#111111" data-box="2" textLength="72.7" lengthAdjust="spacingAndGlyphs">ReadOnly</text><text class="m" xml:space="preserve" x="188.0" y="324.0" style="fill:#111111" data-box="2" textLength="120.4" lengthAdjust="spacingAndGlyphs">(false, Greater)</text><text class="s" xml:space="preserve" x="188.0" y="344.0" style="fill:#455b6b" data-box="2" textLength="136.0" lengthAdjust="spacingAndGlyphs">sheet fills and the grid</text><rect data-box="3" x="438.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="450.0" y="300.0" style="fill:#111111" data-box="3" textLength="113.6" lengthAdjust="spacingAndGlyphs">ReadOnlyEqual</text><text class="m" xml:space="preserve" x="450.0" y="324.0" style="fill:#111111" data-box="3" textLength="158.0" lengthAdjust="spacingAndGlyphs">(false, GreaterEqual)</text><text class="s" xml:space="preserve" x="450.0" y="344.0" style="fill:#455b6b" data-box="3" textLength="185.9" lengthAdjust="spacingAndGlyphs">blended ink, tying with its own</text><text class="s" xml:space="preserve" x="450.0" y="364.0" style="fill:#455b6b" data-box="3" textLength="139.5" lengthAdjust="spacingAndGlyphs">prepass and with faces</text><rect data-box="4" x="700.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="712.0" y="300.0" style="fill:#111111" data-box="4" textLength="52.8" lengthAdjust="spacingAndGlyphs">Always</text><text class="m" xml:space="preserve" x="712.0" y="324.0" style="fill:#111111" data-box="4" textLength="112.9" lengthAdjust="spacingAndGlyphs">(false, Always)</text><text class="s" xml:space="preserve" x="712.0" y="344.0" style="fill:#455b6b" data-box="4" textLength="97.0" lengthAdjust="spacingAndGlyphs">the background</text><rect data-box="5" x="28.0" y="428.0" width="334.1" height="63.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="452.0" style="fill:#111111" data-box="5" textLength="181.4" lengthAdjust="spacingAndGlyphs">one pair, not two enums</text><text class="m" xml:space="preserve" x="40.0" y="476.0" style="fill:#111111" data-box="5" textLength="308.6" lengthAdjust="spacingAndGlyphs">fn state(self) -&gt; (bool, CompareFunction)</text><rect data-box="6" x="386.1" y="428.0" width="423.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="398.1" y="452.0" style="fill:#111111" data-box="6" textLength="308.8" lengthAdjust="spacingAndGlyphs">Detached · the sixth mode, off the matrix</text><text class="s" xml:space="preserve" x="398.1" y="476.0" style="fill:#455b6b" data-box="6" textLength="359.3" lengthAdjust="spacingAndGlyphs">no depth attachment at all, so nothing to compare against:</text><text class="s" xml:space="preserve" x="398.1" y="496.0" style="fill:#455b6b" data-box="6" textLength="193.6" lengthAdjust="spacingAndGlyphs">a full-screen pass over a texture</text><text class="s" xml:space="preserve" x="28.0" y="543.0" style="fill:#e8ac00" textLength="907.5" lengthAdjust="spacingAndGlyphs">Reverse-Z: the depth buffer clears to 0.0 and nearer is greater, so Greater is the ordinary solid test and GreaterEqual is the one that lets a tie through.</text></svg>
