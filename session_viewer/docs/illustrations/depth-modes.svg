<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 565" role="img" aria-labelledby="t d"><title id="t">The six depth modes are three compare functions crossed with the write flag</title><desc id="d">A matrix whose rows are write and no write and whose columns are Greater, GreaterEqual and Always. Five cells hold a named mode and the pair that state() returns for it; the sixth is empty because a pass that always passes has nothing to write, and Detached sits off the matrix because it has no depth attachment at all.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Three compares × one write flag</text><text class="l" xml:space="preserve" x="295.0" y="94.0" text-anchor="middle">Greater</text><text class="s" xml:space="preserve" x="295.0" y="114.0" text-anchor="middle">strictly nearer wins</text><text class="l" xml:space="preserve" x="557.0" y="94.0" text-anchor="middle">GreaterEqual</text><text class="s" xml:space="preserve" x="557.0" y="114.0" text-anchor="middle">ties are kept</text><text class="l" xml:space="preserve" x="819.0" y="94.0" text-anchor="middle">Always</text><text class="s" xml:space="preserve" x="819.0" y="114.0" text-anchor="middle">no test</text><text class="l" xml:space="preserve" x="158.0" y="196.0" text-anchor="end">write</text><text class="l" xml:space="preserve" x="158.0" y="342.0" text-anchor="end">no write</text><rect data-box="0" x="176.0" y="130.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="188.0" y="154.0" style="fill:#111111" data-box="0">Opaque</text><text class="m" xml:space="preserve" x="188.0" y="178.0" style="fill:#111111" data-box="0">(true, Greater)</text><text class="s" xml:space="preserve" x="188.0" y="198.0" style="fill:#455b6b" data-box="0">solids and the depth prepass</text><rect data-box="1" x="438.0" y="130.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="450.0" y="154.0" style="fill:#111111" data-box="1">OpaqueEqual</text><text class="m" xml:space="preserve" x="450.0" y="178.0" style="fill:#111111" data-box="1">(true, GreaterEqual)</text><text class="s" xml:space="preserve" x="450.0" y="198.0" style="fill:#455b6b" data-box="1">source-point queries: a</text><text class="s" xml:space="preserve" x="450.0" y="218.0" style="fill:#455b6b" data-box="1">resident point ties with itself</text><rect x="700" y="130" width="238" height="122" rx="4" fill="#23232a"/><text class="s" xml:space="preserve" x="716.0" y="170.0" style="fill:#b9b9bd">no caller</text><text class="s" xml:space="preserve" x="716.0" y="192.0" style="fill:#b9b9bd">a pass that always passes</text><text class="s" xml:space="preserve" x="716.0" y="214.0" style="fill:#b9b9bd">has nothing to write</text><rect data-box="2" x="176.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="188.0" y="300.0" style="fill:#111111" data-box="2">ReadOnly</text><text class="m" xml:space="preserve" x="188.0" y="324.0" style="fill:#111111" data-box="2">(false, Greater)</text><text class="s" xml:space="preserve" x="188.0" y="344.0" style="fill:#455b6b" data-box="2">sheet fills and the grid</text><rect data-box="3" x="438.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="450.0" y="300.0" style="fill:#111111" data-box="3">ReadOnlyEqual</text><text class="m" xml:space="preserve" x="450.0" y="324.0" style="fill:#111111" data-box="3">(false, GreaterEqual)</text><text class="s" xml:space="preserve" x="450.0" y="344.0" style="fill:#455b6b" data-box="3">blended ink, tying with its own</text><text class="s" xml:space="preserve" x="450.0" y="364.0" style="fill:#455b6b" data-box="3">prepass and with faces</text><rect data-box="4" x="700.0" y="276.0" width="238.0" height="122.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="712.0" y="300.0" style="fill:#111111" data-box="4">Always</text><text class="m" xml:space="preserve" x="712.0" y="324.0" style="fill:#111111" data-box="4">(false, Always)</text><text class="s" xml:space="preserve" x="712.0" y="344.0" style="fill:#455b6b" data-box="4">the background</text><rect data-box="5" x="28.0" y="428.0" width="334.1" height="63.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="452.0" style="fill:#111111" data-box="5">one pair, not two enums</text><text class="m" xml:space="preserve" x="40.0" y="476.0" style="fill:#111111" data-box="5">fn state(self) -&gt; (bool, CompareFunction)</text><rect data-box="6" x="386.1" y="428.0" width="423.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="398.1" y="452.0" style="fill:#111111" data-box="6">Detached · the sixth mode, off the matrix</text><text class="s" xml:space="preserve" x="398.1" y="476.0" style="fill:#455b6b" data-box="6">no depth attachment at all, so nothing to compare against:</text><text class="s" xml:space="preserve" x="398.1" y="496.0" style="fill:#455b6b" data-box="6">a full-screen pass over a texture</text><text class="s" xml:space="preserve" x="28.0" y="543.0" style="fill:#e8ac00">Reverse-Z: the depth buffer clears to 0.0 and nearer is greater, so Greater is the ordinary solid test and GreaterEqual is the one that lets a tie through.</text></svg>
