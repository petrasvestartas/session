<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 340" role="img" aria-labelledby="t d"><title id="t">Four tools, four artefacts</title><desc id="d">cargo produces a .wasm a browser cannot load on its own, wasm-bindgen writes the JavaScript that can, Trunk assembles the page around it, and the browser runs start().</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">From source to a running page</text><text class="l" xml:space="preserve" x="28.0" y="68.0" style="fill:#b9b9bd">each tool hands the next one file</text><rect data-box="0" x="60.0" y="130.0" width="92.9" height="83.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="72.0" y="154.0" style="fill:#111111" data-box="0">cargo</text><text class="s" xml:space="preserve" x="72.0" y="178.0" style="fill:#455b6b" data-box="0">src/lib.rs</text><text class="s" xml:space="preserve" x="72.0" y="198.0" style="fill:#455b6b" data-box="0">Cargo.toml</text><rect data-box="1" x="222.9" y="130.0" width="154.9" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="234.9" y="154.0" style="fill:#111111" data-box="1">wasm-bindgen</text><text class="s" xml:space="preserve" x="234.9" y="178.0" style="fill:#455b6b" data-box="1">session_viewer.wasm</text><rect data-box="2" x="447.8" y="130.0" width="127.4" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="459.8" y="154.0" style="fill:#111111" data-box="2">Trunk</text><text class="s" xml:space="preserve" x="459.8" y="178.0" style="fill:#455b6b" data-box="2">JS glue + .wasm</text><rect data-box="3" x="645.2" y="130.0" width="154.9" height="63.0" rx="4" fill="#ffffff" stroke="#f0bcdb" stroke-width="1.5"/><text class="l" xml:space="preserve" x="657.2" y="154.0" style="fill:#111111" data-box="3">browser</text><text class="s" xml:space="preserve" x="657.2" y="178.0" style="fill:#455b6b" data-box="3">index.html + bundle</text><path class="ar" d="M152.9,171.5 L214.9,171.5"/><text class="s" xml:space="preserve" x="183.9" y="164.5" text-anchor="middle">.wasm</text><path class="ar" d="M377.8,161.5 L439.8,161.5"/><text class="s" xml:space="preserve" x="408.8" y="154.5" text-anchor="middle">JS glue</text><path class="ar" d="M575.2,161.5 L637.2,161.5"/><text class="s" xml:space="preserve" x="606.2" y="154.5" text-anchor="middle">dist/</text><text class="s" xml:space="preserve" x="60.0" y="268.0">A .wasm is not loadable on its own: wasm-bindgen writes the JavaScript that instantiates it</text><text class="s" xml:space="preserve" x="60.0" y="292.0">and calls start(); Trunk runs both and assembles the page that loads the pair.</text></svg>
