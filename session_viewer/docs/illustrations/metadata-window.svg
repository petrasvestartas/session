<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 410" role="img" aria-labelledby="t d"><title id="t">One window instead of one request per field</title><desc id="d">A streamed cloud file is a sequence of length-delimited protobuf fields: a few small fields (count, bounds, the LOD node table) between very large arrays (coordinates, colours, IDs). The LOD walk reads the small fields only. Checkpoint 14 issued one HTTP Range request per header and one per array body; the MetadataWindow reads at least 64 KiB once, serves every small field inside it from the cache, and skips a large array by its declared length without fetching it.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="536.7" lengthAdjust="spacingAndGlyphs">The file on the server, and what the LOD walk touches</text><rect x="180" y="110" width="40" height="36" fill="#bdbfe8" stroke="#eef0f2" stroke-width="2"/><rect x="220" y="110" width="60" height="36" fill="#bdbfe8" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="250.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="46.1" lengthAdjust="spacingAndGlyphs">bounds</text><rect x="280" y="110" width="300" height="36" fill="#b9b9bd" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="430.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="93.2" lengthAdjust="spacingAndGlyphs">coords · 96 MiB</text><rect x="580" y="110" width="170" height="36" fill="#b9b9bd" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="665.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="88.9" lengthAdjust="spacingAndGlyphs">colors · 24 MiB</text><rect x="750" y="110" width="90" height="36" fill="#bdbfe8" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="795.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="37.4" lengthAdjust="spacingAndGlyphs">nodes</text><rect x="840" y="110" width="200" height="36" fill="#b9b9bd" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="940.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="69.6" lengthAdjust="spacingAndGlyphs">ids · 32 MiB</text><rect x="1040" y="110" width="70" height="36" fill="#bdbfe8" stroke="#eef0f2" stroke-width="2"/><text class="s" xml:space="preserve" x="1075.0" y="133.0" text-anchor="middle" style="fill:#111111" textLength="33.9" lengthAdjust="spacingAndGlyphs">levels</text><text class="s" xml:space="preserve" x="180.0" y="170.0" style="fill:#bdbfe8" textLength="34.8" lengthAdjust="spacingAndGlyphs">count</text><text class="s" xml:space="preserve" x="180.0" y="100.0" textLength="513.4" lengthAdjust="spacingAndGlyphs">tag · length · payload for every field; a large array is skipped by its length, never read</text><text class="l" xml:space="preserve" x="28.0" y="215.0" textLength="104.9" lengthAdjust="spacingAndGlyphs">checkpoint 14</text><text class="s" xml:space="preserve" x="180.0" y="194.0" style="fill:#fa9ebc" textLength="368.9" lengthAdjust="spacingAndGlyphs">one Range request per header and one per small array body</text><rect x="184.0" y="204" width="14.0" height="12" rx="2" fill="#fa9ebc"/><rect x="200.0" y="204" width="14.0" height="12" rx="2" fill="#fa9ebc"/><rect x="224.0" y="204" width="24.0" height="12" rx="2" fill="#fa9ebc"/><rect x="250.0" y="204" width="24.0" height="12" rx="2" fill="#fa9ebc"/><rect x="754.0" y="204" width="39.0" height="12" rx="2" fill="#fa9ebc"/><rect x="795.0" y="204" width="39.0" height="12" rx="2" fill="#fa9ebc"/><rect x="1044.0" y="204" width="29.0" height="12" rx="2" fill="#fa9ebc"/><rect x="1075.0" y="204" width="29.0" height="12" rx="2" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="1125.0" y="215.0" style="fill:#fa9ebc" textLength="63.7" lengthAdjust="spacingAndGlyphs">8 requests</text><text class="l" xml:space="preserve" x="28.0" y="295.0" textLength="104.9" lengthAdjust="spacingAndGlyphs">checkpoint 15</text><text class="s" xml:space="preserve" x="180.0" y="274.0" style="fill:#8fd36a" textLength="487.8" lengthAdjust="spacingAndGlyphs">MetadataWindow: one read of at least 64 KiB, small fields served from the cache</text><rect x="180" y="282" width="170" height="16" rx="3" fill="#8fd36a"/><text class="s" xml:space="preserve" x="186.0" y="294.0" style="fill:#111111" textLength="48.1" lengthAdjust="spacingAndGlyphs">window</text><rect x="750" y="282" width="90" height="16" rx="3" fill="#8fd36a"/><rect x="1040" y="282" width="70" height="16" rx="3" fill="#8fd36a"/><text class="s" xml:space="preserve" x="1125.0" y="295.0" style="fill:#8fd36a" textLength="63.7" lengthAdjust="spacingAndGlyphs">3 requests</text><text class="s" xml:space="preserve" x="28.0" y="350.0" textLength="792.1" lengthAdjust="spacingAndGlyphs">A read outside the window refills it under the same ETag; a changed ETag fails the read rather than mixing two revisions of the file.</text><text class="s" xml:space="preserve" x="28.0" y="376.0" textLength="901.5" lengthAdjust="spacingAndGlyphs">Skipped arrays never decide the window size: the 64 KiB minimum applies to the small fields, and a small array larger than that reads its own length.</text></svg>
