<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">One arena, three index runs</title><desc id="d">Every mesh puts its vertices into one growable arena and its object row into a parallel table of the same length. A mesh is then a range of indices, not a buffer of its own: a draw binds the two vertex buffers, binds one index run, and calls draw_indexed once for the whole run.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="408.1" lengthAdjust="spacingAndGlyphs">A mesh is a range, not a buffer of its own</text><text class="l" xml:space="preserve" x="28.0" y="116.0" textLength="123.5" lengthAdjust="spacingAndGlyphs">three index runs</text><text class="s" xml:space="preserve" x="28.0" y="138.0" textLength="153.3" lengthAdjust="spacingAndGlyphs">u32, one bound at a time</text><rect x="244.0" y="100.0" width="393.8" height="40.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="254.0" y="125.0" style="fill:#111111" textLength="110.2" lengthAdjust="spacingAndGlyphs">faces · lit triangles</text><rect x="672.0" y="100.0" width="205.4" height="40.0" rx="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="682.0" y="125.0" style="fill:#111111" textLength="83.7" lengthAdjust="spacingAndGlyphs">print · flat fills</text><rect x="911.7" y="100.0" width="188.3" height="40.0" rx="4" fill="#bfe3a8"/><text class="s" xml:space="preserve" x="921.7" y="125.0" style="fill:#111111" textLength="119.9" lengthAdjust="spacingAndGlyphs">text · outline glyphs</text><text class="l" xml:space="preserve" x="28.0" y="224.0" textLength="38.2" lengthAdjust="spacingAndGlyphs">verts</text><text class="s" xml:space="preserve" x="28.0" y="246.0" textLength="153.3" lengthAdjust="spacingAndGlyphs">position · normal · colour</text><text class="m" xml:space="preserve" x="28.0" y="268.0" style="fill:#b9b9bd" textLength="150.5" lengthAdjust="spacingAndGlyphs">@location(0) (1) (2)</text><rect x="244.0" y="212.0" width="188.3" height="48.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="254.0" y="241.0" style="fill:#111111" textLength="46.1" lengthAdjust="spacingAndGlyphs">mesh A</text><rect x="432.3" y="212.0" width="342.4" height="48.0" rx="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="442.3" y="241.0" style="fill:#111111" textLength="45.6" lengthAdjust="spacingAndGlyphs">mesh B</text><rect x="774.7" y="212.0" width="154.1" height="48.0" rx="4" fill="#bfe3a8"/><text class="s" xml:space="preserve" x="784.7" y="241.0" style="fill:#111111" textLength="45.4" lengthAdjust="spacingAndGlyphs">mesh C</text><rect x="928.8" y="212.0" width="171.2" height="48.0" rx="4" fill="#e4e4e7"/><text class="s" xml:space="preserve" x="938.8" y="241.0" style="fill:#111111" textLength="46.6" lengthAdjust="spacingAndGlyphs">mesh D</text><text class="l" xml:space="preserve" x="28.0" y="312.0" textLength="30.1" lengthAdjust="spacingAndGlyphs">vids</text><text class="s" xml:space="preserve" x="28.0" y="334.0" textLength="155.9" lengthAdjust="spacingAndGlyphs">one object row per vertex</text><text class="m" xml:space="preserve" x="28.0" y="356.0" style="fill:#b9b9bd" textLength="90.3" lengthAdjust="spacingAndGlyphs">@location(3)</text><rect x="244.0" y="300.0" width="188.3" height="34.0" rx="4" fill="#bdbfe8"/><rect x="432.3" y="300.0" width="342.4" height="34.0" rx="4" fill="#fa9ebc"/><rect x="774.7" y="300.0" width="154.1" height="34.0" rx="4" fill="#bfe3a8"/><rect x="928.8" y="300.0" width="171.2" height="34.0" rx="4" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="254.0" y="322.0" style="fill:#111111" textLength="52.7" lengthAdjust="spacingAndGlyphs">7 7 7 7</text><text class="m" xml:space="preserve" x="449.4" y="322.0" style="fill:#111111" textLength="112.9" lengthAdjust="spacingAndGlyphs">8 8 8 8 8 8 8 8</text><text class="m" xml:space="preserve" x="791.8" y="322.0" style="fill:#111111" textLength="37.6" lengthAdjust="spacingAndGlyphs">9 9 9</text><path class="ar" d="M329.6,144.0 L329.6,206.0"/><path class="ar" d="M535.0,144.0 L535.0,206.0"/><path class="ar" d="M723.4,144.0 L723.4,206.0"/><path class="ar" d="M843.2,144.0 L843.2,206.0"/><path class="ar" d="M1014.4,144.0 L1014.4,206.0"/><rect data-box="0" x="28.0" y="380.0" width="700.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="404.0" style="fill:#111111" data-box="0" textLength="191.0" lengthAdjust="spacingAndGlyphs">One draw for a whole run</text><text class="m" xml:space="preserve" x="40.0" y="428.0" style="fill:#111111" data-box="0" textLength="421.4" lengthAdjust="spacingAndGlyphs">set_vertex_buffer(0, verts) · set_vertex_buffer(1, vids)</text><text class="m" xml:space="preserve" x="40.0" y="448.0" style="fill:#111111" data-box="0" textLength="376.3" lengthAdjust="spacingAndGlyphs">set_index_buffer(run) · draw_indexed(0..run.len())</text><rect data-box="1" x="756.0" y="380.0" width="344.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="768.0" y="404.0" style="fill:#111111" data-box="1" textLength="136.2" lengthAdjust="spacingAndGlyphs">Not vertex pulling</text><text class="s" xml:space="preserve" x="768.0" y="428.0" style="fill:#455b6b" data-box="1" textLength="225.5" lengthAdjust="spacingAndGlyphs">that lane binds no vertex buffer at all</text><text class="m" xml:space="preserve" x="768.0" y="448.0" style="fill:#111111" data-box="1" textLength="225.8" lengthAdjust="spacingAndGlyphs">faces.rs · vs_face · lesson 17</text><text class="s" xml:space="preserve" x="28.0" y="484.0" style="fill:#e8ac00" textLength="728.0" lengthAdjust="spacingAndGlyphs">The mesh's base is folded into the indices on the CPU when the run is built, so a run addresses the whole arena directly.</text></svg>
