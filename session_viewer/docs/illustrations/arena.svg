<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="t d"><title id="t">Vertex pulling: one arena, no vertex buffer</title><desc id="d">Every mesh in the scene puts its vertices into one growable arena, and the object table records where each mesh starts. The pipeline binds no vertex buffer at all: the shader takes its vertex index, reads face_indices, adds the object's base row and pulls the position straight out of the arena.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="293.6" lengthAdjust="spacingAndGlyphs">The shader indexes the arena</text><polygon points="386.0,120.0 590.0,120.0 488.0,214.0" fill="#111111" fill-opacity="0.10" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="386.0" cy="120.0" r="5" fill="#f0bcdb"/><circle cx="590.0" cy="120.0" r="5" fill="#f0bcdb"/><circle cx="488.0" cy="214.0" r="5" fill="#f0bcdb"/><text class="l" xml:space="preserve" x="120.0" y="150.0" textLength="91.6" lengthAdjust="spacingAndGlyphs">one triangle</text><text class="s" xml:space="preserve" x="120.0" y="176.0" style="fill:#f0bcdb" textLength="123.1" lengthAdjust="spacingAndGlyphs">vertex_index 0 · 1 · 2</text><text class="s" xml:space="preserve" x="660.0" y="176.0" style="fill:#b9b9bd" textLength="301.6" lengthAdjust="spacingAndGlyphs">face_indices[vertex_index] + the object's base row</text><rect x="80.0" y="286.0" width="224.4" height="46.0" fill="#bdbfe8" fill-opacity="0.22" stroke="#bdbfe8" stroke-width="1.2"/><text class="s" xml:space="preserve" x="90.0" y="274.0" style="fill:#bdbfe8" textLength="45.4" lengthAdjust="spacingAndGlyphs">mesh A</text><rect x="304.4" y="286.0" width="408.0" height="46.0" fill="#f0bcdb" fill-opacity="0.22" stroke="#f0bcdb" stroke-width="1.2"/><text class="s" xml:space="preserve" x="314.4" y="274.0" style="fill:#f0bcdb" textLength="45.5" lengthAdjust="spacingAndGlyphs">mesh B</text><rect x="712.4" y="286.0" width="183.6" height="46.0" fill="#8fd36a" fill-opacity="0.22" stroke="#8fd36a" stroke-width="1.2"/><text class="s" xml:space="preserve" x="722.4" y="274.0" style="fill:#8fd36a" textLength="45.3" lengthAdjust="spacingAndGlyphs">mesh C</text><rect x="896.0" y="286.0" width="204.0" height="46.0" fill="#b9b9bd" fill-opacity="0.22" stroke="#b9b9bd" stroke-width="1.2"/><text class="s" xml:space="preserve" x="906.0" y="274.0" style="fill:#b9b9bd" textLength="46.6" lengthAdjust="spacingAndGlyphs">mesh D</text><path class="ar" d="M386.0,132.0 L386.0,278.0"/><circle cx="386.0" cy="309.0" r="4.5" fill="#f4f4f6"/><path class="ar" d="M590.0,132.0 L590.0,278.0"/><circle cx="590.0" cy="309.0" r="4.5" fill="#f4f4f6"/><path class="ar" d="M488.0,226.0 L488.0,278.0"/><circle cx="488.0" cy="309.0" r="4.5" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="80.0" y="366.0" textLength="479.8" lengthAdjust="spacingAndGlyphs">One growable arena holds every mesh; the object table holds the base of each.</text><text class="s" xml:space="preserve" x="80.0" y="388.0" style="fill:#8fd36a" textLength="373.9" lengthAdjust="spacingAndGlyphs">No vertex buffer is bound: a draw is a vertex count and a row.</text></svg>
