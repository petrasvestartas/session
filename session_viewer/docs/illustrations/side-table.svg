<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 464" role="img" aria-labelledby="t d"><title id="t">Entity id is the record index</title><desc id="d">A sheet's side table is addressed by arithmetic rather than searched: record_at(id) is 8 + 16 x id, so one identity costs a 16-byte read to find the blob and one more read to fetch it. The 15 MB table is never downloaded.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Two small reads, never the 15 MB</text><text class="l" xml:space="preserve" x="40.0" y="110.0">sheet.meta · 15 MB, never downloaded whole</text><text class="s" xml:space="preserve" x="40.0" y="138.0">head · 8 B</text><rect x="40.0" y="150.0" width="44.0" height="56.0" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="62.0" y="183.0" text-anchor="middle" style="fill:#111111">SHM1</text><rect x="86.0" y="150.0" width="44.0" height="56.0" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="108.0" y="183.0" text-anchor="middle" style="fill:#111111">count</text><text class="s" xml:space="preserve" x="40.0" y="230.0">HEAD_BYTES = 8, read once a sheet and cached with its ETag · RECORD_BYTES = 16</text><rect x="142.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="178.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 0</text><rect x="216.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="252.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 1</text><rect x="290.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="326.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 2</text><rect x="364.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="400.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 3</text><rect x="438.0" y="150.0" width="72" height="56.0" fill="#f9e08a"/><text class="m" xml:space="preserve" x="474.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 4</text><rect x="512.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="548.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 5</text><rect x="586.0" y="150.0" width="72" height="56.0" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="622.0" y="183.0" text-anchor="middle" style="fill:#111111">rec 6</text><text class="s" xml:space="preserve" x="142.0" y="138.0">records · offset : u64 LE · length : u64 LE</text><rect x="670.0" y="150.0" width="470.0" height="56.0" rx="4" fill="#fa9ebc" fill-opacity="0.5"/><text class="s" xml:space="preserve" x="684.0" y="183.0" style="fill:#111111">JSON blobs · guid · name · kind · width · colour</text><text class="m" xml:space="preserve" x="670.0" y="138.0" style="fill:#fa9ebc">record_at(count)</text><rect data-box="0" x="28.0" y="262.0" width="520.0" height="37.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="286.0" style="fill:#111111" data-box="0">a picked ribbon names a sheet row and entity 4711</text><text class="m" xml:space="preserve" x="28.0" y="330.0" style="fill:#e8ac00">read 16 B at  8 + 16 × 4711 = 75,384</text><text class="m" xml:space="preserve" x="28.0" y="354.0" style="fill:#e8ac00">then read  length  bytes at  offset</text><path class="ar" d="M300.0,318.0 L468.0,216.0"/><path class="ar" d="M522.0,178.0 L676.0,178.0"/><rect data-box="1" x="596.0" y="262.0" width="556.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="608.0" y="286.0" style="fill:#111111" data-box="1">Three rules on those two reads</text><text class="s" xml:space="preserve" x="608.0" y="310.0" style="fill:#455b6b" data-box="1">both carry the sheet's revision: a table whose ETag moved is refused, not mixed</text><text class="s" xml:space="preserve" x="608.0" y="330.0" style="fill:#455b6b" data-box="1">a blob longer than 64 KiB is not one entity's record</text><text class="s" xml:space="preserve" x="608.0" y="350.0" style="fill:#455b6b" data-box="1">dropping the Query cancels its callback, exactly as a cloud page does</text><text class="s" xml:space="preserve" x="28.0" y="450.0" style="fill:#e8ac00">One line of arithmetic is the whole design: the id is the index, so there is nothing to scan.</text></svg>
