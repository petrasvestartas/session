<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1001 470" role="img" aria-labelledby="t d"><title id="t">Who owns what in the viewer</title><desc id="d">Browser input asks State for named actions. State selects, hides and replaces through Scene, which retains the source documents; geometry preparation turns them into typed Upload rows for the GPU owner. State also gives the GPU its frame input and visibility flags, and the GPU answers picks asynchronously with a row that Scene maps back to a source identity.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#111111"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#111111;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#455b6b}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#111111}.ar{fill:none;stroke:#111111;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#eef0f2"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="359.4" lengthAdjust="spacingAndGlyphs">One source of truth, one GPU owner</text><rect data-box="0" x="28.0" y="66.0" width="245.2" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="90.0" data-box="0" textLength="191.5" lengthAdjust="spacingAndGlyphs">Scene · retained CPU data</text><text class="s" xml:space="preserve" x="40.0" y="114.0" data-box="0" textLength="202.9" lengthAdjust="spacingAndGlyphs">Session documents + placements</text><text class="s" xml:space="preserve" x="40.0" y="134.0" data-box="0" textLength="177.4" lengthAdjust="spacingAndGlyphs">GUIDs, faces, edges, controls</text><rect data-box="1" x="369.2" y="66.0" width="298.3" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="381.2" y="90.0" data-box="1" textLength="249.5" lengthAdjust="spacingAndGlyphs">Geometry preparation · app/walk</text><text class="s" xml:space="preserve" x="381.2" y="114.0" data-box="1" textLength="237.8" lengthAdjust="spacingAndGlyphs">source geometry → typed Upload rows</text><text class="s" xml:space="preserve" x="381.2" y="134.0" data-box="1" textLength="221.0" lengthAdjust="spacingAndGlyphs">triangles, strokes, points, source IDs</text><rect data-box="2" x="763.6" y="66.0" width="210.0" height="83.0" rx="8" fill="#f0bcdb" stroke="#ce4095" stroke-width="1.5"/><text class="l" xml:space="preserve" x="775.6" y="90.0" data-box="2" textLength="128.8" lengthAdjust="spacingAndGlyphs">Gpu · engine/gpu</text><text class="s" xml:space="preserve" x="775.6" y="114.0" data-box="2" textLength="156.0" lengthAdjust="spacingAndGlyphs">buffers, pipelines, targets</text><text class="s" xml:space="preserve" x="775.6" y="134.0" data-box="2" textLength="146.0" lengthAdjust="spacingAndGlyphs">color, depth, integer IDs</text><rect data-box="3" x="28.0" y="280.0" width="245.2" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="304.0" data-box="3" textLength="105.7" lengthAdjust="spacingAndGlyphs">Browser input</text><text class="s" xml:space="preserve" x="40.0" y="328.0" data-box="3" textLength="168.7" lengthAdjust="spacingAndGlyphs">lib.rs, app/input.rs, touch.rs</text><text class="s" xml:space="preserve" x="40.0" y="348.0" data-box="3" textLength="181.7" lengthAdjust="spacingAndGlyphs">pointer, keyboard, loader Msg</text><rect data-box="4" x="369.2" y="280.0" width="298.3" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="381.2" y="304.0" data-box="4" textLength="147.2" lengthAdjust="spacingAndGlyphs">State · coordination</text><text class="s" xml:space="preserve" x="381.2" y="328.0" data-box="4" textLength="210.8" lengthAdjust="spacingAndGlyphs">camera, selection, redraw demand</text><text class="s" xml:space="preserve" x="381.2" y="348.0" data-box="4" textLength="158.5" lengthAdjust="spacingAndGlyphs">scene text, source queries</text><path class="ar" d="M273.2,106.0 L369.2,106.0"/><text class="s" xml:space="preserve" x="321.2" y="99.0" text-anchor="middle" textLength="27.8" lengthAdjust="spacingAndGlyphs">walk</text><path class="ar" d="M667.6,106.0 L763.6,106.0"/><text class="s" xml:space="preserve" x="715.6" y="99.0" text-anchor="middle" textLength="44.0" lengthAdjust="spacingAndGlyphs">Upload</text><path class="ar" d="M273.2,320.0 L369.2,320.0"/><text class="s" xml:space="preserve" x="321.2" y="313.0" text-anchor="middle" textLength="43.7" lengthAdjust="spacingAndGlyphs">actions</text><path class="ar" d="M409.2,280.0 L409.2,214.5 L150.6,214.5 L150.6,149.0"/><text class="s" xml:space="preserve" x="279.9" y="206.5" text-anchor="middle" textLength="192.7" lengthAdjust="spacingAndGlyphs">select · hide · replace document</text><path class="ar" d="M667.6,302.0 L833.6,302.0 L833.6,149.0"/><text class="s" xml:space="preserve" x="679.6" y="294.0" textLength="163.7" lengthAdjust="spacingAndGlyphs">frame input · visibility flags</text><path class="ar" style="stroke-dasharray:6 5" d="M903.6,149.0 L903.6,341.0 L667.6,341.0"/><text class="s" xml:space="preserve" x="679.6" y="359.0" textLength="257.9" lengthAdjust="spacingAndGlyphs">async pick: row → Scene → source identity</text><text class="s" xml:space="preserve" x="28.0" y="440.0" textLength="497.8" lengthAdjust="spacingAndGlyphs">Camera motion reuses source geometry; selection changes flags, not tessellation.</text></svg>
