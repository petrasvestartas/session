<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Who owns the viewer?</title><desc id="desc">Input changes State. Scene retains source documents; geometry producers turn them into typed display data. One GPU owner draws and returns asynchronous source identities.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#526579"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172d43;font-size:18px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.label{font-weight:650}.arrow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}.box{fill:#eef4f9;stroke:#afc3d6;stroke-width:1.5}.gpu{fill:#edf6f0;stroke:#93b99e;stroke-width:1.5}</style><rect width="100%" height="100%" rx="16" fill="#fbfcfe"/><text class="title" x="28" y="40">One source of truth, one GPU owner</text><rect class="box" x="28" y="75" width="275" height="112" rx="10"/><text class="label" x="46" y="105">Scene · retained CPU data</text><text class="small" x="46" y="132">Session documents + placement</text><text class="small" x="46" y="156">GUIDs, faces, edges and controls</text><rect class="box" x="364" y="75" width="270" height="112" rx="10"/><text class="label" x="382" y="105">Geometry preparation</text><text class="small" x="382" y="132">app/walk → typed Upload</text><text class="small" x="382" y="156">Triangles + strokes + source IDs</text><rect class="gpu" x="697" y="75" width="275" height="112" rx="10"/><text class="label" x="715" y="105">Gpu · device and resources</text><text class="small" x="715" y="132">Buffers, pipelines, targets</text><text class="small" x="715" y="156">Color / depth / integer IDs</text><path class="arrow" d="M303 131 H357"/><path class="arrow" d="M634 131 H690"/><rect class="box" x="28" y="300" width="275" height="113" rx="10"/><text class="label" x="46" y="330">Browser input</text><text class="small" x="46" y="357">lib.rs + app/input.rs</text><text class="small" x="46" y="381">Pointer, keyboard, async Msg</text><rect class="box" x="364" y="300" width="270" height="113" rx="10"/><text class="label" x="382" y="330">State · coordination</text><text class="small" x="382" y="357">Camera, selection and redraw</text><text class="small" x="382" y="381">scene text / source queries</text><path class="arrow" d="M303 356 H357"/><path class="arrow" d="M500 300 V230 H165 V194"/><path class="arrow" d="M634 330 H835 V194"/><path class="arrow" d="M905 187 V385 H641"/><text class="small" x="672" y="294">frame / visibility changes</text><text class="small" x="666" y="435">async pick → source identity</text><text x="28" y="470">Camera motion reuses source geometry. Selection changes flags, not tessellation.</text></svg>