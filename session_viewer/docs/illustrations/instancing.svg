<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="t d"><title id="t">One draw, two counters</title><desc id="d">A draw call carries two ranges: vertex_index walks the three corners, instance_index walks the object rows, and every invocation reads only the row its instance_index names.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="385.3" lengthAdjust="spacingAndGlyphs">One call, one buffer, a hundred objects</text><text class="l" xml:space="preserve" x="28.0" y="68.0" style="fill:#b9b9bd" textLength="124.7" lengthAdjust="spacingAndGlyphs">draw(0..3, 0..100)</text><rect data-box="0" x="60.0" y="120.0" width="141.1" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="72.0" y="144.0" style="fill:#111111" data-box="0" textLength="95.6" lengthAdjust="spacingAndGlyphs">vertex_index</text><text class="s" xml:space="preserve" x="72.0" y="168.0" style="fill:#455b6b" data-box="0" textLength="36.1" lengthAdjust="spacingAndGlyphs">0, 1, 2</text><text class="s" xml:space="preserve" x="72.0" y="188.0" style="fill:#455b6b" data-box="0" textLength="105.6" lengthAdjust="spacingAndGlyphs">the three corners</text><rect data-box="1" x="60.0" y="250.0" width="147.9" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="72.0" y="274.0" style="fill:#111111" data-box="1" textLength="111.5" lengthAdjust="spacingAndGlyphs">instance_index</text><text class="s" xml:space="preserve" x="72.0" y="298.0" style="fill:#455b6b" data-box="1" textLength="36.1" lengthAdjust="spacingAndGlyphs">0 .. 99</text><text class="s" xml:space="preserve" x="72.0" y="318.0" style="fill:#455b6b" data-box="1" textLength="103.3" lengthAdjust="spacingAndGlyphs">which object row</text><rect data-box="2" x="520.0" y="120.0" width="237.6" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="532.0" y="144.0" style="fill:#111111" data-box="2" textLength="60.3" lengthAdjust="spacingAndGlyphs">vs_main</text><text class="s" xml:space="preserve" x="532.0" y="168.0" style="fill:#455b6b" data-box="2" textLength="111.4" lengthAdjust="spacingAndGlyphs">runs 3 x 100 times</text><text class="s" xml:space="preserve" x="532.0" y="188.0" style="fill:#455b6b" data-box="2" textLength="193.6" lengthAdjust="spacingAndGlyphs">reads instances[instance_index]</text><rect data-box="3" x="900.0" y="250.0" width="127.4" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="912.0" y="274.0" style="fill:#111111" data-box="3" textLength="81.2" lengthAdjust="spacingAndGlyphs">instances[]</text><text class="s" xml:space="preserve" x="912.0" y="298.0" style="fill:#455b6b" data-box="3" textLength="98.6" lengthAdjust="spacingAndGlyphs">one 96-byte row</text><text class="s" xml:space="preserve" x="912.0" y="318.0" style="fill:#455b6b" data-box="3" textLength="61.5" lengthAdjust="spacingAndGlyphs">per object</text><path class="ar" d="M201.1,161.5 L512.0,161.5"/><path class="ar" d="M207.9,291.5 L599.2,211.0"/><path class="ar" d="M757.6,161.5 L963.7,242.0"/><text class="s" xml:space="preserve" x="60.0" y="376.0" textLength="582.1" lengthAdjust="spacingAndGlyphs">Nothing is bound per object: the row is an index, so adding the hundredth object costs one row,</text><text class="s" xml:space="preserve" x="60.0" y="400.0" style="fill:#e8ac00" textLength="108.1" lengthAdjust="spacingAndGlyphs">not one draw call.</text></svg>
