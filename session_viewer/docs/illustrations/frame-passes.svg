<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1182 666" role="img" aria-labelledby="t d"><title id="t">One frame, six passes, and who touches each attachment</title><desc id="d">A matrix of the six render passes encode_frame records against the five attachments they can touch. The physical depth is cleared and written by the face pass alone; every later pass either attaches it read-only or samples it, and the pick passes use a second depth of their own.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One frame, six passes</text><text class="s" xml:space="preserve" x="28.0" y="62.0" style="fill:#c9ccd6">in the order encode_frame records them</text><text class="l" xml:space="preserve" x="375.0" y="106.0" text-anchor="middle">surface</text><text class="m" xml:space="preserve" x="375.0" y="124.0" text-anchor="middle" style="fill:#c9ccd6">colour</text><text class="l" xml:space="preserve" x="549.0" y="106.0" text-anchor="middle">physical</text><text class="m" xml:space="preserve" x="549.0" y="124.0" text-anchor="middle" style="fill:#c9ccd6">Depth32Float</text><text class="l" xml:space="preserve" x="723.0" y="106.0" text-anchor="middle">gradient</text><text class="m" xml:space="preserve" x="723.0" y="124.0" text-anchor="middle" style="fill:#c9ccd6">Rg16Float</text><text class="l" xml:space="preserve" x="897.0" y="106.0" text-anchor="middle">coverage</text><text class="m" xml:space="preserve" x="897.0" y="124.0" text-anchor="middle" style="fill:#c9ccd6">R8Unorm</text><text class="l" xml:space="preserve" x="1071.0" y="106.0" text-anchor="middle">ID</text><text class="m" xml:space="preserve" x="1071.0" y="124.0" text-anchor="middle" style="fill:#c9ccd6">Rg32Uint</text><rect x="460" y="214" width="178" height="262" rx="8" fill="#f9e08a" opacity="0.16"/><text class="m" xml:space="preserve" x="28.0" y="178.0">splat.points</text><text class="s" xml:space="preserve" x="28.0" y="198.0" style="fill:#c9ccd6">only when the cloud, camera or knobs moved</text><rect x="292" y="156" width="862" height="54" rx="6" fill="#e4e4e7" opacity="0.5"/><text class="s" xml:space="preserve" x="723.0" y="180.0" text-anchor="middle" style="fill:#111111">its own private pair, one sample always:</text><text class="s" xml:space="preserve" x="723.0" y="198.0" text-anchor="middle" style="fill:#111111">Rgba8Unorm colour + Depth32Float, cleared transparent and 0.0</text><text class="m" xml:space="preserve" x="28.0" y="242.0">face pass</text><text class="s" xml:space="preserve" x="28.0" y="262.0" style="fill:#c9ccd6">backdrop, grid, faces, cloud resolve</text><rect x="292" y="220" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="375.0" y="252.0" text-anchor="middle" style="fill:#111111">Clear → Store</text><rect x="466" y="220" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="549.0" y="252.0" text-anchor="middle" style="fill:#111111">Clear 0.0 → Store</text><rect x="640" y="220" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="723.0" y="252.0" text-anchor="middle" style="fill:#111111">Clear → Store</text><rect x="814" y="220" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="897.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="988" y="220" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="1071.0" y="252.0" text-anchor="middle" style="fill:#b9b9bd">—</text><text class="m" xml:space="preserve" x="28.0" y="306.0">selection coverage</text><text class="s" xml:space="preserve" x="28.0" y="326.0" style="fill:#c9ccd6">only when a selected face is visible</text><rect x="292" y="284" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="375.0" y="316.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="466" y="284" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="549.0" y="316.0" text-anchor="middle">attached read-only</text><rect x="640" y="284" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="723.0" y="316.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="814" y="284" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="897.0" y="316.0" text-anchor="middle" style="fill:#111111">Clear → Store</text><rect x="988" y="284" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="1071.0" y="316.0" text-anchor="middle" style="fill:#b9b9bd">—</text><text class="m" xml:space="preserve" x="28.0" y="370.0">ink pass</text><text class="s" xml:space="preserve" x="28.0" y="390.0" style="fill:#c9ccd6">the scene list, resolved into the surface</text><rect x="292" y="348" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="375.0" y="380.0" text-anchor="middle" style="fill:#111111">Load → Store</text><rect x="466" y="348" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="549.0" y="380.0" text-anchor="middle">read-only AND sampled</text><rect x="640" y="348" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="723.0" y="380.0" text-anchor="middle">sampled</text><rect x="814" y="348" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="897.0" y="380.0" text-anchor="middle">sampled</text><rect x="988" y="348" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="1071.0" y="380.0" text-anchor="middle" style="fill:#b9b9bd">—</text><text class="m" xml:space="preserve" x="28.0" y="434.0">pick pass</text><text class="s" xml:space="preserve" x="28.0" y="454.0" style="fill:#c9ccd6">only when a pick is pending</text><rect x="292" y="412" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="375.0" y="444.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="466" y="412" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="549.0" y="444.0" text-anchor="middle" style="fill:#111111">its own · Clear 0.0</text><rect x="640" y="412" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="723.0" y="444.0" text-anchor="middle" style="fill:#111111">its own · Clear</text><rect x="814" y="412" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="897.0" y="444.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="988" y="412" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="1071.0" y="444.0" text-anchor="middle" style="fill:#111111">Clear → Store</text><text class="m" xml:space="preserve" x="28.0" y="498.0">pick ink</text><text class="s" xml:space="preserve" x="28.0" y="518.0" style="fill:#c9ccd6">the same list, narrowed by mode</text><rect x="292" y="476" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="375.0" y="508.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="466" y="476" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="549.0" y="508.0" text-anchor="middle">its own, read-only</text><rect x="640" y="476" width="166" height="54" rx="6" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="723.0" y="508.0" text-anchor="middle">its own, sampled</text><rect x="814" y="476" width="166" height="54" rx="6" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="897.0" y="508.0" text-anchor="middle" style="fill:#b9b9bd">—</text><rect x="988" y="476" width="166" height="54" rx="6" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="1071.0" y="508.0" text-anchor="middle" style="fill:#111111">Load → Store</text><text class="s" xml:space="preserve" x="549.0" y="548.0" text-anchor="middle" style="fill:#e8ac00">one writer</text><rect x="28" y="574" width="26" height="16" rx="4" fill="#fa9ebc" opacity="1.0"/><text class="s" xml:space="preserve" x="62.0" y="587.0" style="fill:#c9ccd6">written</text><rect x="178" y="574" width="26" height="16" rx="4" fill="#6b2f4a" opacity="1.0"/><text class="s" xml:space="preserve" x="212.0" y="587.0" style="fill:#c9ccd6">read</text><rect x="328" y="574" width="26" height="16" rx="4" fill="#23232a" opacity="1.0"/><text class="s" xml:space="preserve" x="362.0" y="587.0" style="fill:#c9ccd6">untouched</text><text class="s" xml:space="preserve" x="28.0" y="642.0" style="fill:#e8ac00">The physical depth is cleared and written by the face pass alone; the two passes after it attach or sample it, and the pick passes carry a second depth of their own.</text><text class="s" xml:space="preserve" x="28.0" y="618.0" style="fill:#c9ccd6">then copy_window: copy_texture_to_buffer, 8 B a texel → queue.submit → pick.map → output.present</text></svg>
