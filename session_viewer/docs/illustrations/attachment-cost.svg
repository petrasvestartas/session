<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" role="img" aria-labelledby="t d"><title id="t">Where the video memory goes</title><desc id="d">Three attachments per physical pixel: colour in the surface format, depth as Depth32Float, metadata as Rg16Float. That is 12 bytes a pixel at one sample and 48 at four, so the sample count is a four-times decision on the largest allocation the viewer makes - and every rule about picking, device scale and device loss is about those same bytes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Forty-eight bytes, times every pixel on the glass</text><rect x="250.0" y="96.0" width="200.0" height="46" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="260.0" y="116.0" style="fill:#111111">colour</text><text class="m" xml:space="preserve" x="260.0" y="134.0" style="fill:#111111">4 B × 4 = 16</text><rect x="454.0" y="96.0" width="200.0" height="46" rx="4" fill="#e4e4e7"/><text class="s" xml:space="preserve" x="464.0" y="116.0" style="fill:#111111">depth</text><text class="m" xml:space="preserve" x="464.0" y="134.0" style="fill:#111111">4 B × 4 = 16</text><rect x="658.0" y="96.0" width="200.0" height="46" rx="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="668.0" y="116.0" style="fill:#111111">metadata</text><text class="m" xml:space="preserve" x="668.0" y="134.0" style="fill:#111111">4 B × 4 = 16</text><text class="l" xml:space="preserve" x="28.0" y="118.0">4 samples</text><text class="s" xml:space="preserve" x="28.0" y="140.0">48 bytes a pixel</text><rect x="250.0" y="168.0" width="50.0" height="46" rx="4" fill="#bdbfe8"/><rect x="304.0" y="168.0" width="50.0" height="46" rx="4" fill="#e4e4e7"/><rect x="358.0" y="168.0" width="50.0" height="46" rx="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="426.0" y="198.0">the same three, one sample each: 4 + 4 + 4</text><text class="l" xml:space="preserve" x="28.0" y="190.0">1 sample</text><text class="s" xml:space="preserve" x="28.0" y="212.0">12 bytes a pixel</text><text class="s" xml:space="preserve" x="250.0" y="232.0" style="fill:#e8ac00">exactly four times · this is what samples_for is spending</text><text class="l" xml:space="preserve" x="28.0" y="268.0">and the canvas multiplies it</text><text class="m" xml:space="preserve" x="28.0" y="300.0">1600 × 1000  = 1.6 Mpx</text><text class="m" xml:space="preserve" x="300.0" y="300.0" style="fill:#bdbfe8">19 MB at 1×</text><text class="m" xml:space="preserve" x="460.0" y="300.0" style="fill:#fa9ebc">77 MB at 4×</text><text class="m" xml:space="preserve" x="28.0" y="324.0">3840 × 2160  = 8.3 Mpx</text><text class="m" xml:space="preserve" x="300.0" y="324.0" style="fill:#bdbfe8">100 MB at 1×</text><text class="m" xml:space="preserve" x="460.0" y="324.0" style="fill:#fa9ebc">398 MB at 4×</text><text class="l" xml:space="preserve" x="28.0" y="372.0">Three levers hold it down</text><rect data-box="0" x="28.0" y="390.0" width="364.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="414.0" style="fill:#111111" data-box="0">the pick pass draws a window</text><text class="s" xml:space="preserve" x="40.0" y="438.0" style="fill:#455b6b" data-box="0">19 × 19 × 16 B = 5.8 KB, where a canvas-sized</text><text class="s" xml:space="preserve" x="40.0" y="458.0" style="fill:#455b6b" data-box="0">ID target would be 26 MB</text><rect data-box="1" x="412.0" y="390.0" width="364.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="424.0" y="414.0" style="fill:#111111" data-box="1">device scale spends the samples</text><text class="m" xml:space="preserve" x="424.0" y="438.0" style="fill:#111111" data-box="1">samples_for returns 1× from 2 physical</text><text class="s" xml:space="preserve" x="424.0" y="458.0" style="fill:#455b6b" data-box="1">pixels per CSS pixel: the density has</text><text class="s" xml:space="preserve" x="424.0" y="478.0" style="fill:#455b6b" data-box="1">already halved the stair-steps</text><rect data-box="2" x="796.0" y="390.0" width="364.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="808.0" y="414.0" style="fill:#111111" data-box="2">a lost device reloads plainly</text><text class="s" xml:space="preserve" x="808.0" y="438.0" style="fill:#455b6b" data-box="2">once at scale 1 with antialiasing off,</text><text class="s" xml:space="preserve" x="808.0" y="458.0" style="fill:#455b6b" data-box="2">every other query kept, and the status</text><text class="s" xml:space="preserve" x="808.0" y="478.0" style="fill:#455b6b" data-box="2">line says so</text><text class="s" xml:space="preserve" x="28.0" y="564.0" style="fill:#e8ac00">Per-pixel attachments are the largest allocation the viewer makes, and the sample count multiplies all three of them at once.</text></svg>
