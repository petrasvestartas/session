<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 570" role="img" aria-labelledby="t d"><title id="t">Group 2 in three shapes</title><desc id="d">Group 2 is the same slot in three shapes: two bindings for a physical lane, six for ink once it reads the scene's depth and gradient, eight once it also reads the projected triangles and the tile lists. Both sample counts are always in the layout, so the pair this frame does not use is a 1 x 1 placeholder - a bind group must satisfy every entry of its layout, read or not.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One layout, both sample counts</text><text class="l" xml:space="preserve" x="28.0" y="92.0">instance layout · every physical lane</text><rect x="28.0" y="140.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="38.0" y="162.0" style="fill:#111111">0</text><text class="s" xml:space="preserve" x="62.0" y="162.0" style="fill:#111111">object rows · 96 B each</text><rect x="28.0" y="180.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="38.0" y="202.0" style="fill:#111111">1</text><text class="s" xml:space="preserve" x="62.0" y="202.0" style="fill:#111111">anchored translations · 16 B each</text><text class="l" xml:space="preserve" x="400.0" y="92.0">ink instance layout · this lesson</text><rect x="400.0" y="140.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="410.0" y="162.0" style="fill:#111111">0</text><text class="s" xml:space="preserve" x="434.0" y="162.0" style="fill:#111111">object rows</text><rect x="400.0" y="180.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="410.0" y="202.0" style="fill:#111111">1</text><text class="s" xml:space="preserve" x="434.0" y="202.0" style="fill:#111111">anchored translations</text><rect x="400.0" y="220.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="410.0" y="242.0" style="fill:#111111">2</text><text class="s" xml:space="preserve" x="434.0" y="242.0" style="fill:#111111">depth · single-sampled</text><rect x="400.0" y="260.0" width="380.0" height="34.0" rx="4" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="410.0" y="282.0" style="fill:#111111">3</text><text class="s" xml:space="preserve" x="434.0" y="282.0" style="fill:#111111">depth · multisampled</text><text class="s" xml:space="preserve" x="770.0" y="282.0" text-anchor="end" style="fill:#111111">1 × 1 placeholder</text><text class="l" xml:space="preserve" x="772.0" y="92.0">and it grows: 05, then 18</text><rect x="772.0" y="140.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="162.0" style="fill:#111111">0</text><text class="s" xml:space="preserve" x="806.0" y="162.0" style="fill:#111111">object rows</text><rect x="772.0" y="180.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="202.0" style="fill:#111111">1</text><text class="s" xml:space="preserve" x="806.0" y="202.0" style="fill:#111111">anchored translations</text><rect x="772.0" y="220.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="242.0" style="fill:#111111">2</text><text class="s" xml:space="preserve" x="806.0" y="242.0" style="fill:#111111">depth · single-sampled</text><rect x="772.0" y="260.0" width="380.0" height="34.0" rx="4" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="782.0" y="282.0" style="fill:#111111">3</text><text class="s" xml:space="preserve" x="806.0" y="282.0" style="fill:#111111">depth · multisampled</text><text class="s" xml:space="preserve" x="1142.0" y="282.0" text-anchor="end" style="fill:#111111">1 × 1 placeholder</text><rect x="772.0" y="300.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="322.0" style="fill:#111111">4</text><text class="s" xml:space="preserve" x="806.0" y="322.0" style="fill:#111111">gradient · single-sampled (05)</text><rect x="772.0" y="340.0" width="380.0" height="34.0" rx="4" fill="#e4e4e7"/><text class="m" xml:space="preserve" x="782.0" y="362.0" style="fill:#111111">5</text><text class="s" xml:space="preserve" x="806.0" y="362.0" style="fill:#111111">gradient · multisampled (05)</text><text class="s" xml:space="preserve" x="1142.0" y="362.0" text-anchor="end" style="fill:#111111">1 × 1 placeholder</text><rect x="772.0" y="380.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="402.0" style="fill:#111111">6</text><text class="s" xml:space="preserve" x="806.0" y="402.0" style="fill:#111111">projected triangles (18)</text><rect x="772.0" y="420.0" width="380.0" height="34.0" rx="4" fill="#bdbfe8"/><text class="m" xml:space="preserve" x="782.0" y="442.0" style="fill:#111111">7</text><text class="s" xml:space="preserve" x="806.0" y="442.0" style="fill:#111111">tile headers + pool (18)</text><text class="s" xml:space="preserve" x="28.0" y="240.0">split so a re-anchor rewrites</text><text class="s" xml:space="preserve" x="28.0" y="262.0">16 bytes an object, not 96</text><rect data-box="0" x="28.0" y="300.0" width="340.0" height="123.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="324.0" style="fill:#111111" data-box="0">This frame is at one sample</text><text class="s" xml:space="preserve" x="40.0" y="348.0" style="fill:#455b6b" data-box="0">so the multisampled views are</text><text class="s" xml:space="preserve" x="40.0" y="368.0" style="fill:#455b6b" data-box="0">1 × 1 textures nobody reads. At 4×</text><text class="s" xml:space="preserve" x="40.0" y="388.0" style="fill:#455b6b" data-box="0">the pair swaps: 2 and 4 become</text><text class="s" xml:space="preserve" x="40.0" y="408.0" style="fill:#455b6b" data-box="0">the placeholders instead.</text><rect data-box="1" x="28.0" y="474.0" width="1124.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="498.0" style="fill:#111111" data-box="1">A bind group must satisfy every entry of its layout, read or not.</text><text class="s" xml:space="preserve" x="40.0" y="522.0" style="fill:#455b6b" data-box="1">That is why the unused sample count is a placeholder and not an absent binding — and why</text><text class="s" xml:space="preserve" x="40.0" y="542.0" style="fill:#455b6b" data-box="1">flipping the sample count rebuilds bind groups rather than pipelines.</text></svg>
