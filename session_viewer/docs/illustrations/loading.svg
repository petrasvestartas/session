<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">Staged replacement with generations</title><desc id="d">A route change starts a new request generation. Every fetched document is validated and decoded, then staged in manifest order; nothing on screen changes until the whole set is ready, when the staged set replaces the scene in one step. Documents that finish after a newer generation started are dropped, so a slow first request can never overwrite a faster second one.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="490.1" lengthAdjust="spacingAndGlyphs">Two requests in flight: the older generation loses</text><text class="l" xml:space="preserve" x="28.0" y="125.0" textLength="95.3" lengthAdjust="spacingAndGlyphs">generation 1</text><line x1="150" y1="120" x2="1150" y2="120" stroke="#b9b9bd" stroke-width="1"/><text class="l" xml:space="preserve" x="28.0" y="235.0" textLength="95.8" lengthAdjust="spacingAndGlyphs">generation 2</text><line x1="150" y1="230" x2="1150" y2="230" stroke="#b9b9bd" stroke-width="1"/><text class="l" xml:space="preserve" x="28.0" y="345.0" textLength="49.2" lengthAdjust="spacingAndGlyphs">screen</text><line x1="150" y1="340" x2="1150" y2="340" stroke="#b9b9bd" stroke-width="1"/><polygon points="1150,340 1142,335 1142,345" fill="#b9b9bd"/><text class="s" xml:space="preserve" x="1122.0" y="364.0" textLength="27.7" lengthAdjust="spacingAndGlyphs">time</text><rect x="160" y="106" width="120" height="28" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="220.0" y="125.0" text-anchor="middle" style="fill:#111111" textLength="97.0" lengthAdjust="spacingAndGlyphs">manifest a.yaml</text><rect x="290" y="106" width="110" height="28" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="345.0" y="125.0" text-anchor="middle" style="fill:#111111" textLength="67.4" lengthAdjust="spacingAndGlyphs">mesh.pb ✓</text><rect x="410" y="106" width="110" height="28" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="465.0" y="125.0" text-anchor="middle" style="fill:#111111" textLength="62.1" lengthAdjust="spacingAndGlyphs">brep.pb ✓</text><rect x="530" y="106" width="300" height="28" rx="4" fill="#b9b9bd"/><text class="s" xml:space="preserve" x="680.0" y="125.0" text-anchor="middle" style="fill:#111111" textLength="163.3" lengthAdjust="spacingAndGlyphs">cloud.pb (slow) → dropped</text><line x1="600" y1="150" x2="600" y2="210" stroke="#f0bcdb" stroke-width="1.5" stroke-dasharray="4 3"/><text class="s" xml:space="preserve" x="608.0" y="184.0" style="fill:#f0bcdb" textLength="209.8" lengthAdjust="spacingAndGlyphs">route changes: generation 2 starts</text><rect x="600" y="216" width="120" height="28" rx="4" fill="#f0bcdb"/><text class="s" xml:space="preserve" x="660.0" y="235.0" text-anchor="middle" style="fill:#111111" textLength="97.7" lengthAdjust="spacingAndGlyphs">manifest b.yaml</text><rect x="730" y="216" width="110" height="28" rx="4" fill="#f0bcdb"/><text class="s" xml:space="preserve" x="785.0" y="235.0" text-anchor="middle" style="fill:#111111" textLength="67.4" lengthAdjust="spacingAndGlyphs">mesh.pb ✓</text><rect x="850" y="216" width="110" height="28" rx="4" fill="#f0bcdb"/><text class="s" xml:space="preserve" x="905.0" y="235.0" text-anchor="middle" style="fill:#111111" textLength="74.6" lengthAdjust="spacingAndGlyphs">text items ✓</text><rect x="970" y="216" width="130" height="28" rx="4" fill="#8fd36a"/><text class="s" xml:space="preserve" x="1035.0" y="235.0" text-anchor="middle" style="fill:#111111" textLength="92.9" lengthAdjust="spacingAndGlyphs">staged → swap</text><line x1="1035" y1="244" x2="1035" y2="326" stroke="#8fd36a" stroke-width="1.5"/><polygon points="1035,326 1030,318 1040,318" fill="#8fd36a"/><rect x="160" y="326" width="860" height="28" rx="4" fill="#d9dbe0"/><text class="s" xml:space="preserve" x="590.0" y="345.0" text-anchor="middle" style="fill:#111111" textLength="260.8" lengthAdjust="spacingAndGlyphs">previous scene stays visible and interactive</text><rect x="1035" y="326" width="64" height="28" rx="4" fill="#8fd36a"/><text class="s" xml:space="preserve" x="1067.0" y="345.0" text-anchor="middle" style="fill:#111111" textLength="46.5" lengthAdjust="spacingAndGlyphs">scene b</text><text class="s" xml:space="preserve" x="160.0" y="392.0" textLength="916.1" lengthAdjust="spacingAndGlyphs">A document is accepted only if its generation is still the current one; decoding yields between slices, so the page never freezes while a large file is read.</text></svg>
