<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 469" role="img" aria-labelledby="t d"><title id="t">A shape is four functions and a name</title><desc id="d">Every shape command is a static SHAPE. The Shaping tool asks its next question, reads the answers into a part, draws the part's outline while you move, and builds the object once nothing is left to ask.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="286.2" lengthAdjust="spacingAndGlyphs">Box: four questions, one tool</text><rect data-box="0" x="28.0" y="80.0" width="320.3" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="104.0" style="fill:#111111" data-box="0" textLength="195.6" lengthAdjust="spacingAndGlyphs">ask(answers, part, option)</text><text class="s" xml:space="preserve" x="40.0" y="128.0" style="fill:#455b6b" data-box="0" textLength="163.6" lengthAdjust="spacingAndGlyphs">the next question, or None</text><text class="s" xml:space="preserve" x="40.0" y="148.0" style="fill:#455b6b" data-box="0" textLength="260.5" lengthAdjust="spacingAndGlyphs">"Base center", "Corner or length", "Height"</text><rect data-box="1" x="458.3" y="80.0" width="271.8" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="470.3" y="104.0" style="fill:#111111" data-box="1" textLength="216.8" lengthAdjust="spacingAndGlyphs">read(frame, answers, option)</text><text class="s" xml:space="preserve" x="470.3" y="128.0" style="fill:#455b6b" data-box="1" textLength="168.6" lengthAdjust="spacingAndGlyphs">the answers so far as a Part</text><text class="s" xml:space="preserve" x="470.3" y="148.0" style="fill:#455b6b" data-box="1" textLength="194.7" lengthAdjust="spacingAndGlyphs">an error refuses the last answer</text><path class="ar" d="M348.3,121.5 L452.3,121.5"/><text class="s" xml:space="preserve" x="400.3" y="114.5" text-anchor="middle" textLength="63.8" lengthAdjust="spacingAndGlyphs">an answer</text><rect data-box="2" x="458.3" y="233.0" width="237.6" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="470.3" y="257.0" style="fill:#111111" data-box="2" textLength="95.6" lengthAdjust="spacingAndGlyphs">outline(part)</text><text class="s" xml:space="preserve" x="470.3" y="281.0" style="fill:#455b6b" data-box="2" textLength="193.6" lengthAdjust="spacingAndGlyphs">preview wires, blue, every move</text><text class="s" xml:space="preserve" x="470.3" y="301.0" style="fill:#455b6b" data-box="2" textLength="187.6" lengthAdjust="spacingAndGlyphs">cheap: points, no kernel object</text><rect data-box="3" x="745.9" y="233.0" width="192.1" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="757.9" y="257.0" style="fill:#111111" data-box="3" textLength="137.2" lengthAdjust="spacingAndGlyphs">build(part, option)</text><text class="s" xml:space="preserve" x="757.9" y="281.0" style="fill:#455b6b" data-box="3" textLength="145.4" lengthAdjust="spacingAndGlyphs">the BRep or mesh, once</text><text class="s" xml:space="preserve" x="757.9" y="301.0" style="fill:#455b6b" data-box="3" textLength="152.2" lengthAdjust="spacingAndGlyphs">added in one transaction</text><path class="ar" d="M594.2,167.0 L577.1,227.0"/><path class="ar" d="M730.1,121.5 L841.9,227.0"/><text class="s" xml:space="preserve" x="794.0" y="178.2" textLength="86.7" lengthAdjust="spacingAndGlyphs">ask says None</text><path class="ar" d="M458.3,274.5 L188.1,274.5 L188.1,169.0"/><text class="s" xml:space="preserve" x="198.1" y="264.5" textLength="72.3" lengthAdjust="spacingAndGlyphs">more to ask</text><rect data-box="4" x="28.0" y="356.0" width="1124.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="380.0" style="fill:#111111" data-box="4" textLength="149.2" lengthAdjust="spacingAndGlyphs">Why plain functions</text><text class="s" xml:space="preserve" x="40.0" y="404.0" style="fill:#455b6b" data-box="4" textLength="594.2" lengthAdjust="spacingAndGlyphs">thirteen solids share one tool, so a new shape is one file with a static SHAPE and one line in verbs!</text><text class="s" xml:space="preserve" x="40.0" y="424.0" style="fill:#455b6b" data-box="4" textLength="618.5" lengthAdjust="spacingAndGlyphs">a Part holds only numbers (a frame and sizes), so the outline is redrawn at every mouse move for free</text></svg>
