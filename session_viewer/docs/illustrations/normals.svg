<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 480" role="img" aria-labelledby="t d"><title id="t">Where a shading normal comes from, and how it moves</title><desc id="d">Left: the normal is the normalized cross product of the surface derivatives; at a pole or apex that product vanishes and incident triangle normals are averaged instead. Middle: a C0 crease needs two normals at one position, or the fold smears. Right: under nonuniform scale only the cofactor matrix keeps the normal perpendicular.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">1 · Analytic normal or fallback</text><path d="M50,230 Q180,90 330,220" fill="none" stroke="#bdbfe8" stroke-width="2.5"/><circle cx="190" cy="150" r="4" fill="#bdbfe8"/><line x1="190" y1="150" x2="250" y2="138" stroke="#b9b9bd" stroke-width="1.6"/><line x1="250" y1="138" x2="242.8" y2="143.4" stroke="#b9b9bd" stroke-width="1.6"/><line x1="250" y1="138" x2="241.3" y2="135.8" stroke="#b9b9bd" stroke-width="1.6"/><text class="s" xml:space="preserve" x="256.0" y="142.0">∂u</text><line x1="190" y1="150" x2="176" y2="100" stroke="#b9b9bd" stroke-width="1.6"/><line x1="176" y1="100" x2="182.0" y2="106.7" stroke="#b9b9bd" stroke-width="1.6"/><line x1="176" y1="100" x2="174.4" y2="108.9" stroke="#b9b9bd" stroke-width="1.6"/><text class="s" xml:space="preserve" x="150.0" y="96.0">∂v</text><line x1="190" y1="150" x2="230" y2="84" stroke="#8fd36a" stroke-width="2.4"/><line x1="230" y1="84" x2="229.1" y2="93.0" stroke="#8fd36a" stroke-width="2.4"/><line x1="230" y1="84" x2="222.5" y2="88.9" stroke="#8fd36a" stroke-width="2.4"/><text class="s" xml:space="preserve" x="236.0" y="82.0" style="fill:#8fd36a">n = normalize(∂u × ∂v)</text><text class="s" xml:space="preserve" x="50.0" y="250.0">smooth interior: derivatives define the normal</text><polygon points="90,410 130,330 170,410" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="1.5"/><polygon points="130,330 170,410 220,390" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="1.5"/><circle cx="130" cy="330" r="4" fill="#e07a26"/><line x1="130" y1="330" x2="130" y2="284" stroke="#e07a26" stroke-width="2.4"/><line x1="130" y1="284" x2="133.9" y2="292.1" stroke="#e07a26" stroke-width="2.4"/><line x1="130" y1="284" x2="126.1" y2="292.1" stroke="#e07a26" stroke-width="2.4"/><text class="s" xml:space="preserve" x="232.0" y="352.0" style="fill:#e07a26">pole: ∂u × ∂v = 0</text><text class="s" xml:space="preserve" x="232.0" y="370.0" style="fill:#e07a26">fallback: mean of the</text><text class="s" xml:space="preserve" x="232.0" y="388.0" style="fill:#e07a26">fan's face normals</text><text class="s" xml:space="preserve" x="50.0" y="446.0">a sentinel +Z is never accepted as a derivative</text><text class="h" xml:space="preserve" x="440.0" y="40.0">2 · A crease keeps two normals</text><path d="M460,220 L590,120 L730,210" fill="none" stroke="#bdbfe8" stroke-width="2.5"/><circle cx="590" cy="120" r="4.5" fill="#fa9ebc"/><line x1="590" y1="120" x2="558" y2="75" stroke="#8fd36a" stroke-width="2.4"/><line x1="558" y1="75" x2="565.9" y2="79.3" stroke="#8fd36a" stroke-width="2.4"/><line x1="558" y1="75" x2="559.5" y2="83.9" stroke="#8fd36a" stroke-width="2.4"/><text class="s" xml:space="preserve" x="480.0" y="70.0" style="fill:#8fd36a">left side normal</text><line x1="590" y1="120" x2="626" y2="70" stroke="#8fd36a" stroke-width="2.4"/><line x1="626" y1="70" x2="624.4" y2="78.9" stroke="#8fd36a" stroke-width="2.4"/><line x1="626" y1="70" x2="618.1" y2="74.3" stroke="#8fd36a" stroke-width="2.4"/><text class="s" xml:space="preserve" x="632.0" y="66.0" style="fill:#8fd36a">right side normal</text><text class="s" xml:space="preserve" x="460.0" y="250.0">two shading vertices at one XYZ, one per side</text><path d="M460,430 L590,330 L730,420" fill="none" stroke="#bdbfe8" stroke-width="2.5"/><circle cx="590" cy="330" r="4.5" fill="#b9b9bd"/><line x1="590" y1="330" x2="596" y2="282" stroke="#e07a26" stroke-width="2.4"/><line x1="596" y1="282" x2="598.9" y2="290.5" stroke="#e07a26" stroke-width="2.4"/><line x1="596" y1="282" x2="591.1" y2="289.6" stroke="#e07a26" stroke-width="2.4"/><text class="s" xml:space="preserve" x="604.0" y="288.0" style="fill:#e07a26">one averaged normal</text><text class="s" xml:space="preserve" x="460.0" y="462.0">shared vertex: the fold is lit as if round</text><text class="h" xml:space="preserve" x="860.0" y="40.0">3 · Transforming a normal</text><polygon points="880,200 980,140 1080,200" fill="none" stroke="#bdbfe8" stroke-width="2.5"/><line x1="980" y1="140" x2="980" y2="84" stroke="#8fd36a" stroke-width="2.4"/><line x1="980" y1="84" x2="983.9" y2="92.1" stroke="#8fd36a" stroke-width="2.4"/><line x1="980" y1="84" x2="976.1" y2="92.1" stroke="#8fd36a" stroke-width="2.4"/><text class="s" xml:space="preserve" x="988.0" y="88.0" style="fill:#8fd36a">n</text><text class="s" xml:space="preserve" x="880.0" y="222.0">before: n ⟂ surface</text><polygon points="880,410 980,310 1080,410" fill="none" stroke="#bdbfe8" stroke-width="2.5"/><line x1="980" y1="310" x2="980" y2="254" stroke="#e07a26" stroke-width="2.4"/><line x1="980" y1="254" x2="983.9" y2="262.1" stroke="#e07a26" stroke-width="2.4"/><line x1="980" y1="254" x2="976.1" y2="262.1" stroke="#e07a26" stroke-width="2.4"/><text class="s" xml:space="preserve" x="988.0" y="262.0" style="fill:#e07a26">M·n</text><line x1="980" y1="310" x2="1018" y2="270" stroke="#8fd36a" stroke-width="2.4"/><line x1="1018" y1="270" x2="1015.3" y2="278.6" stroke="#8fd36a" stroke-width="2.4"/><line x1="1018" y1="270" x2="1009.6" y2="273.2" stroke="#8fd36a" stroke-width="2.4"/><text class="s" xml:space="preserve" x="1026.0" y="276.0" style="fill:#8fd36a">cofactor(M)·n</text><text class="s" xml:space="preserve" x="880.0" y="444.0">after a stretch in y: only the cofactor form stays ⟂</text><text class="s" xml:space="preserve" x="880.0" y="464.0">normalize in the fragment stage: interpolation shrinks it</text></svg>
