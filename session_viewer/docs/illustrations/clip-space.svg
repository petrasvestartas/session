<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 458" role="img" aria-labelledby="t d"><title id="t">Clip space and the viewport flip</title><desc id="d">The shader computes three positions in clip space, a square two units across with y up; the viewport transform turns that into pixels with y down. The triangle does not move: the numbers on the axes turn over, and flipping the sign yourself on top of that is what makes a first image upside down.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="326.7" lengthAdjust="spacingAndGlyphs">Two coordinate systems, one flip</text><text class="l" xml:space="preserve" x="90.0" y="96.0" style="fill:#bdbfe8" textLength="235.2" lengthAdjust="spacingAndGlyphs">clip space, after the divide by w</text><rect x="110.0" y="126.0" width="210.0" height="210.0" rx="4" fill="#e4e4e7" fill-opacity="0.10"/><polygon points="146.8,288.8 283.2,288.8 215.0,155.4" fill="#bdbfe8" fill-opacity="0.85"/><line x1="110.0" y1="231.0" x2="320.0" y2="231.0" stroke="#b9b9bd" stroke-width="1" stroke-opacity="0.55"/><line x1="215.0" y1="126.0" x2="215.0" y2="336.0" stroke="#b9b9bd" stroke-width="1" stroke-opacity="0.55"/><text class="s" xml:space="preserve" x="215.0" y="114.0" text-anchor="middle" style="fill:#bdbfe8" textLength="35.7" lengthAdjust="spacingAndGlyphs">y = +1</text><text class="s" xml:space="preserve" x="215.0" y="358.0" text-anchor="middle" style="fill:#bdbfe8" textLength="32.5" lengthAdjust="spacingAndGlyphs">y = -1</text><text class="s" xml:space="preserve" x="100.0" y="236.0" text-anchor="end" style="fill:#bdbfe8" textLength="32.7" lengthAdjust="spacingAndGlyphs">x = -1</text><text class="s" xml:space="preserve" x="330.0" y="236.0" style="fill:#bdbfe8" textLength="36.0" lengthAdjust="spacingAndGlyphs">x = +1</text><text class="m" xml:space="preserve" x="225.0" y="147.4" style="fill:#bdbfe8" textLength="105.4" lengthAdjust="spacingAndGlyphs">( 0.0, +0.72 )</text><text class="l" xml:space="preserve" x="700.0" y="96.0" style="fill:#fa9ebc" textLength="314.9" lengthAdjust="spacingAndGlyphs">framebuffer, after the viewport transform</text><rect x="700.0" y="126.0" width="280.0" height="210.0" rx="4" fill="#e4e4e7" fill-opacity="0.10"/><polygon points="749.0,288.8 931.0,288.8 840.0,155.4" fill="#fa9ebc" fill-opacity="0.85"/><text class="s" xml:space="preserve" x="840.0" y="114.0" text-anchor="middle" style="fill:#fa9ebc" textLength="28.3" lengthAdjust="spacingAndGlyphs">y = 0</text><text class="s" xml:space="preserve" x="840.0" y="358.0" text-anchor="middle" style="fill:#fa9ebc" textLength="28.9" lengthAdjust="spacingAndGlyphs">y = h</text><text class="s" xml:space="preserve" x="690.0" y="236.0" text-anchor="end" style="fill:#fa9ebc" textLength="28.5" lengthAdjust="spacingAndGlyphs">x = 0</text><text class="s" xml:space="preserve" x="990.0" y="236.0" style="fill:#fa9ebc" textLength="32.1" lengthAdjust="spacingAndGlyphs">x = w</text><text class="m" xml:space="preserve" x="850.0" y="147.4" style="fill:#fa9ebc" textLength="135.5" lengthAdjust="spacingAndGlyphs">( 0.50 w, 0.14 h )</text><path class="ar" d="M400.0,231.0 L618.0,231.0"/><text class="s" xml:space="preserve" x="509.0" y="224.0" text-anchor="middle" textLength="117.8" lengthAdjust="spacingAndGlyphs">viewport transform</text><text class="s" xml:space="preserve" x="90.0" y="392.0" textLength="657.0" lengthAdjust="spacingAndGlyphs">Both squares hold the same triangle in the same place: the apex is half way across and near the top in each.</text><text class="s" xml:space="preserve" x="90.0" y="416.0" textLength="657.6" lengthAdjust="spacingAndGlyphs">Only the numbers turn over - +1 at the top becomes 0, -1 at the bottom becomes h - so an upside-down first</text><text class="s" xml:space="preserve" x="90.0" y="440.0" style="fill:#e8ac00" textLength="445.4" lengthAdjust="spacingAndGlyphs">image is a sign you flipped y a second time yourself, not a broken shader.</text></svg>
