<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-labelledby="t d"><title id="t">Clip space and the viewport flip</title><desc id="d">The shader computes three positions in clip space, a square two units across with y up; the viewport transform turns that into pixels with y down, and that flip is why a first image is sometimes upside down.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="326.6" lengthAdjust="spacingAndGlyphs">Two coordinate systems, one flip</text><text class="l" xml:space="preserve" x="90.0" y="92.0" style="fill:#bdbfe8" textLength="235.6" lengthAdjust="spacingAndGlyphs">clip space, after the divide by w</text><rect x="110.0" y="120.0" width="240.0" height="240.0" fill="none" stroke="#bdbfe8" stroke-width="1.6"/><line x1="110.0" y1="240.0" x2="350.0" y2="240.0" stroke="#bdbfe8" stroke-width="1"/><line x1="230.0" y1="120.0" x2="230.0" y2="360.0" stroke="#bdbfe8" stroke-width="1"/><text class="s" xml:space="preserve" x="76.0" y="126.0" style="fill:#bdbfe8" textLength="14.9" lengthAdjust="spacingAndGlyphs">+1</text><text class="s" xml:space="preserve" x="76.0" y="366.0" style="fill:#bdbfe8" textLength="11.6" lengthAdjust="spacingAndGlyphs">-1</text><text class="s" xml:space="preserve" x="360.0" y="245.0" style="fill:#bdbfe8" textLength="35.9" lengthAdjust="spacingAndGlyphs">x = +1</text><text class="s" xml:space="preserve" x="240.0" y="140.0" style="fill:#bdbfe8" textLength="26.0" lengthAdjust="spacingAndGlyphs">y up</text><text class="l" xml:space="preserve" x="700.0" y="92.0" style="fill:#f0bcdb" textLength="314.6" lengthAdjust="spacingAndGlyphs">framebuffer, after the viewport transform</text><rect x="720.0" y="120.0" width="320.0" height="240.0" fill="none" stroke="#f0bcdb" stroke-width="1.6"/><text class="s" xml:space="preserve" x="678.0" y="126.0" style="fill:#f0bcdb" textLength="28.4" lengthAdjust="spacingAndGlyphs">y = 0</text><text class="s" xml:space="preserve" x="668.0" y="366.0" style="fill:#f0bcdb" textLength="28.8" lengthAdjust="spacingAndGlyphs">y = h</text><text class="s" xml:space="preserve" x="1050.0" y="126.0" style="fill:#f0bcdb" textLength="31.6" lengthAdjust="spacingAndGlyphs">x = w</text><text class="s" xml:space="preserve" x="890.0" y="140.0" style="fill:#f0bcdb" textLength="43.8" lengthAdjust="spacingAndGlyphs">y down</text><path class="ar" d="M426.0,240.0 L660.0,240.0"/><text class="s" xml:space="preserve" x="543.0" y="233.0" text-anchor="middle" textLength="117.6" lengthAdjust="spacingAndGlyphs">viewport transform</text><text class="s" xml:space="preserve" x="90.0" y="404.0" textLength="522.4" lengthAdjust="spacingAndGlyphs">The two squares hold the same triangle. Only the y axis turns over, which is why a first</text><text class="s" xml:space="preserve" x="90.0" y="428.0" style="fill:#e8ac00" textLength="367.1" lengthAdjust="spacingAndGlyphs">image that is upside down is a sign flip, not a broken shader.</text></svg>
