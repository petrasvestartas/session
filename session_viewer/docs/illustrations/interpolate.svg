<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">What the rasterizer hands over</title><desc id="d">A value carried from the vertex shader to the fragment shader is blended, and the blend is perspective-correct: evenly spaced pixels do not correspond to evenly spaced points on the surface. Marking an output flat turns the blending off, so every fragment of the triangle reads one vertex's value unchanged. Both are used here: a colour interpolates, a stroke's half-width does not.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="239.3" lengthAdjust="spacingAndGlyphs">Blended, or not blended</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#f0bcdb" textLength="236.6" lengthAdjust="spacingAndGlyphs">the blend is perspective-correct</text><line x1="250.0" y1="171.2" x2="250.0" y2="316.1" stroke="#b9b9bd" stroke-width="1.4"/><text class="s" xml:space="preserve" x="214.0" y="159.2" textLength="40.3" lengthAdjust="spacingAndGlyphs">screen</text><line x1="420.0" y1="170.0" x2="580.0" y2="330.0" stroke="#f0bcdb" stroke-width="2.4"/><circle cx="90.0" cy="250.0" r="5" fill="#e8ac00"/><text class="s" xml:space="preserve" x="60.0" y="292.0" style="fill:#e8ac00" textLength="21.0" lengthAdjust="spacingAndGlyphs">eye</text><line x1="250.0" y1="211.2" x2="420.0" y2="170.0" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="211.2" r="3.4" fill="#f4f4f6"/><circle cx="420.0" cy="170.0" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="222.0" x2="439.0" y2="189.0" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="222.0" r="3.4" fill="#f4f4f6"/><circle cx="439.0" cy="189.0" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="232.8" x2="460.3" y2="210.3" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="232.8" r="3.4" fill="#f4f4f6"/><circle cx="460.3" cy="210.3" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="243.7" x2="484.4" y2="234.4" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="243.7" r="3.4" fill="#f4f4f6"/><circle cx="484.4" cy="234.4" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="254.5" x2="511.8" y2="261.8" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="254.5" r="3.4" fill="#f4f4f6"/><circle cx="511.8" cy="261.8" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="265.3" x2="543.4" y2="293.4" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="265.3" r="3.4" fill="#f4f4f6"/><circle cx="543.4" cy="293.4" r="3.4" fill="#f0bcdb"/><line x1="250.0" y1="276.1" x2="580.0" y2="330.0" stroke="#b9b9bd" stroke-width="0.9" stroke-dasharray="4 4"/><circle cx="250.0" cy="276.1" r="3.4" fill="#f4f4f6"/><circle cx="580.0" cy="330.0" r="3.4" fill="#f0bcdb"/><text class="s" xml:space="preserve" x="430.0" y="378.0" style="fill:#f0bcdb" textLength="157.5" lengthAdjust="spacingAndGlyphs">the surface, seen edge on</text><text class="s" xml:space="preserve" x="60.0" y="412.0" textLength="410.1" lengthAdjust="spacingAndGlyphs">seven evenly spaced pixels, seven points that are not evenly spaced</text><text class="s" xml:space="preserve" x="60.0" y="434.0" style="fill:#f0bcdb" textLength="259.8" lengthAdjust="spacingAndGlyphs">dividing by w is what keeps the two in step</text><text class="l" xml:space="preserve" x="700.0" y="86.0" style="fill:#8fd36a" textLength="249.0" lengthAdjust="spacingAndGlyphs">@interpolate(flat): no blend at all</text><polygon points="760.0,320.0 930.0,160.0 1100.0,320.0" fill="#8fd36a" fill-opacity="0.30" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="760.0" cy="320.0" r="6" fill="#f4f4f6"/><circle cx="930.0" cy="160.0" r="6" fill="#f4f4f6"/><circle cx="1100.0" cy="320.0" r="6" fill="#f4f4f6"/><circle cx="760.0" cy="320.0" r="9" fill="#8fd36a"/><text class="s" xml:space="preserve" x="700.0" y="380.0" style="fill:#8fd36a" textLength="249.9" lengthAdjust="spacingAndGlyphs">one vertex decides for the whole triangle</text><text class="s" xml:space="preserve" x="700.0" y="412.0" textLength="370.1" lengthAdjust="spacingAndGlyphs">a stroke's half-width goes down flat and is resolved per pixel:</text><text class="s" xml:space="preserve" x="700.0" y="434.0" textLength="395.9" lengthAdjust="spacingAndGlyphs">a width blended over a trapezoid would be projective, and wrong</text></svg>
