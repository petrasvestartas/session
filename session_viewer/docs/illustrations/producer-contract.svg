<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 605" role="img" aria-labelledby="t d"><title id="t">What crosses a producer's edge</title><desc id="d">A producer is handed one kernel geometry, the row it is filling and the vertex base its indices must start from. It appends to the lane tables and reports one Row measured in the object's own space. The file, the document, the camera and the selection are not in scope.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="314.2" lengthAdjust="spacingAndGlyphs">What crosses a producer's edge</text><rect x="340" y="70" width="81.1" height="26" rx="6" fill="#2a2a32"/><text class="s" xml:space="preserve" x="380.6" y="88.0" text-anchor="middle" style="fill:#b9b9bd" textLength="42.0" lengthAdjust="spacingAndGlyphs">the file</text><path d="M346,92 L415.1,74" stroke="#6a6a74" stroke-width="1.4"/><rect x="433.12" y="70" width="108.7" height="26" rx="6" fill="#2a2a32"/><text class="s" xml:space="preserve" x="487.5" y="88.0" text-anchor="middle" style="fill:#b9b9bd" textLength="86.1" lengthAdjust="spacingAndGlyphs">the document</text><path d="M439.12,92 L535.8,74" stroke="#6a6a74" stroke-width="1.4"/><rect x="553.8" y="70" width="94.9" height="26" rx="6" fill="#2a2a32"/><text class="s" xml:space="preserve" x="601.2" y="88.0" text-anchor="middle" style="fill:#b9b9bd" textLength="68.9" lengthAdjust="spacingAndGlyphs">the camera</text><path d="M559.8,92 L642.7,74" stroke="#6a6a74" stroke-width="1.4"/><rect x="660.6999999999999" y="70" width="115.6" height="26" rx="6" fill="#2a2a32"/><text class="s" xml:space="preserve" x="718.5" y="88.0" text-anchor="middle" style="fill:#b9b9bd" textLength="77.9" lengthAdjust="spacingAndGlyphs">the selection</text><path d="M666.6999999999999,92 L770.3,74" stroke="#6a6a74" stroke-width="1.4"/><text class="s" xml:space="preserve" x="794.3" y="88.0" style="fill:#b9b9bd" textLength="88.2" lengthAdjust="spacingAndGlyphs">never in scope</text><rect data-box="0" x="340.0" y="116.0" width="372.0" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="352.0" y="140.0" style="fill:#111111" data-box="0" textLength="100.1" lengthAdjust="spacingAndGlyphs">one producer</text><text class="m" xml:space="preserve" x="352.0" y="164.0" style="fill:#111111" data-box="0" textLength="210.7" lengthAdjust="spacingAndGlyphs">walk_mesh(arena, ink, m, mc)</text><text class="m" xml:space="preserve" x="352.0" y="184.0" style="fill:#111111" data-box="0" textLength="233.3" lengthAdjust="spacingAndGlyphs">walk_brep(arena, ink, brep, cx)</text><text class="m" xml:space="preserve" x="352.0" y="204.0" style="fill:#111111" data-box="0" textLength="165.6" lengthAdjust="spacingAndGlyphs">walk_line(seg, l, row)</text><text class="s" xml:space="preserve" x="352.0" y="224.0" style="fill:#455b6b" data-box="0" textLength="223.9" lengthAdjust="spacingAndGlyphs">one geometry, one row, nothing else</text><rect data-box="1" x="28.0" y="120.0" width="213.1" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="144.0" style="fill:#111111" data-box="1" textLength="102.7" lengthAdjust="spacingAndGlyphs">the geometry</text><text class="m" xml:space="preserve" x="40.0" y="168.0" style="fill:#111111" data-box="1" textLength="188.2" lengthAdjust="spacingAndGlyphs">&amp;Mesh  &amp;BRep  &amp;NurbsCurve</text><text class="s" xml:space="preserve" x="40.0" y="188.0" style="fill:#455b6b" data-box="1" textLength="126.0" lengthAdjust="spacingAndGlyphs">f64, the kernel's own</text><rect data-box="2" x="28.0" y="227.0" width="318.9" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="251.0" style="fill:#111111" data-box="2" textLength="203.2" lengthAdjust="spacingAndGlyphs">WalkCx · the row it is filling</text><text class="m" xml:space="preserve" x="40.0" y="275.0" style="fill:#111111" data-box="2" textLength="293.5" lengthAdjust="spacingAndGlyphs">vert_base arena rows already on the GPU</text><text class="m" xml:space="preserve" x="40.0" y="295.0" style="fill:#111111" data-box="2" textLength="158.5" lengthAdjust="spacingAndGlyphs">row this object's row</text><text class="m" xml:space="preserve" x="40.0" y="315.0" style="fill:#111111" data-box="2" textLength="293.5" lengthAdjust="spacingAndGlyphs">cloud_px the file's point-size override</text><path class="ar" d="M241.1,161.5 L340.0,161.5"/><path class="ar" d="M346.9,278.5 L340.0,278.5"/><rect data-box="3" x="756.0" y="140.0" width="326.5" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="768.0" y="164.0" style="fill:#111111" data-box="3" textLength="155.9" lengthAdjust="spacingAndGlyphs">Row · what it reports</text><text class="m" xml:space="preserve" x="768.0" y="188.0" style="fill:#111111" data-box="3" textLength="301.0" lengthAdjust="spacingAndGlyphs">bounds an Aabb in the object's OWN space</text><text class="m" xml:space="preserve" x="768.0" y="208.0" style="fill:#111111" data-box="3" textLength="210.7" lengthAdjust="spacingAndGlyphs">spacing diagonal / √vertices</text><text class="m" xml:space="preserve" x="768.0" y="228.0" style="fill:#111111" data-box="3" textLength="270.9" lengthAdjust="spacingAndGlyphs">flags PRINT · SMOOTH · SINGLE · OPEN</text><text class="m" xml:space="preserve" x="768.0" y="248.0" style="fill:#111111" data-box="3" textLength="210.7" lengthAdjust="spacingAndGlyphs">faces did it draw triangles?</text><path class="ar" d="M712.0,180.0 L756.0,180.0"/><text class="s" xml:space="preserve" x="756.0" y="283.0" style="fill:#c9ccd6" textLength="351.1" lengthAdjust="spacingAndGlyphs">Row::thin: a box and nothing else, for linework and points</text><rect data-box="4" x="340.0" y="279.0" width="148.0" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="352.0" y="303.0" style="fill:#111111" data-box="4" textLength="83.8" lengthAdjust="spacingAndGlyphs">ArenaRows</text><text class="s" xml:space="preserve" x="352.0" y="327.0" style="fill:#455b6b" data-box="4" textLength="93.2" lengthAdjust="spacingAndGlyphs">verts · vids · idx</text><path class="ar" d="M414.0,279.0 L414.0,247.0"/><rect data-box="5" x="504.0" y="279.0" width="127.4" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="516.0" y="303.0" style="fill:#111111" data-box="5" textLength="65.8" lengthAdjust="spacingAndGlyphs">SegRows</text><text class="s" xml:space="preserve" x="516.0" y="327.0" style="fill:#455b6b" data-box="5" textLength="90.0" lengthAdjust="spacingAndGlyphs">pipes · ribbons</text><path class="ar" d="M567.7,279.0 L567.7,247.0"/><rect data-box="6" x="647.4" y="279.0" width="120.5" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="659.4" y="303.0" style="fill:#111111" data-box="6" textLength="82.5" lengthAdjust="spacingAndGlyphs">GlyphRows</text><text class="s" xml:space="preserve" x="659.4" y="327.0" style="fill:#455b6b" data-box="6" textLength="85.3" lengthAdjust="spacingAndGlyphs">spheres · dots</text><path class="ar" d="M707.6,279.0 L707.6,247.0"/><text class="s" xml:space="preserve" x="340.0" y="369.0" style="fill:#c9ccd6" textLength="301.9" lengthAdjust="spacingAndGlyphs">append-only: a producer never reads a table back</text><text class="s" xml:space="preserve" x="756.0" y="319.0" textLength="177.4" lengthAdjust="spacingAndGlyphs">arena.verts · one index space</text><rect x="756" y="333" width="44" height="70" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="812.0" y="373.0" style="fill:#c9ccd6" textLength="63.5" lengthAdjust="spacingAndGlyphs">this object</text><rect x="756" y="409" width="44" height="62" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="812.0" y="445.0" style="fill:#c9ccd6" textLength="149.8" lengthAdjust="spacingAndGlyphs">earlier objects of this file</text><rect x="756" y="477" width="44" height="52" rx="4" fill="#3a3a44"/><text class="s" xml:space="preserve" x="812.0" y="508.0" style="fill:#c9ccd6" textLength="106.2" lengthAdjust="spacingAndGlyphs">already uploaded</text><text class="m" xml:space="preserve" x="756.0" y="561.0" textLength="293.5" lengthAdjust="spacingAndGlyphs">base = cx.vert_base + arena.verts.len()</text><text class="s" xml:space="preserve" x="756.0" y="581.0" style="fill:#e8ac00" textLength="246.0" lengthAdjust="spacingAndGlyphs">idx.push(base + i) — wrong here is silent</text></svg>
