<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 346" role="img" aria-labelledby="t d"><title id="t">A measurement is a number and a mark</title><desc id="d">Length, Area, Volume and Measure Distance read the selected kernel objects in world units, print the total, and keep one mark in Features that the scene draws until the next command.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="298.7" lengthAdjust="spacingAndGlyphs">Length of two selected curves</text><rect data-box="0" x="28.0" y="80.0" width="182.5" height="103.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="104.0" style="fill:#111111" data-box="0" textLength="102.0" lengthAdjust="spacingAndGlyphs">selected rows</text><text class="s" xml:space="preserve" x="40.0" y="128.0" style="fill:#455b6b" data-box="0" textLength="124.5" lengthAdjust="spacingAndGlyphs">row 12 · NurbsCurve</text><text class="s" xml:space="preserve" x="40.0" y="148.0" style="fill:#455b6b" data-box="0" textLength="99.2" lengthAdjust="spacingAndGlyphs">row 31 · Polyline</text><text class="s" xml:space="preserve" x="40.0" y="168.0" style="fill:#455b6b" data-box="0" textLength="135.5" lengthAdjust="spacingAndGlyphs">row 40 · Text (skipped)</text><rect data-box="1" x="260.5" y="80.0" width="258.4" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="272.5" y="104.0" style="fill:#111111" data-box="1" textLength="159.9" lengthAdjust="spacingAndGlyphs">kernel, in world units</text><text class="m" xml:space="preserve" x="272.5" y="128.0" style="fill:#111111" data-box="1" textLength="233.3" lengthAdjust="spacingAndGlyphs">compute_length(geometry, place)</text><text class="s" xml:space="preserve" x="272.5" y="148.0" style="fill:#455b6b" data-box="1" textLength="65.8" lengthAdjust="spacingAndGlyphs">3.20 + 1.45</text><rect data-box="2" x="568.9" y="80.0" width="416.7" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="580.9" y="104.0" style="fill:#111111" data-box="2" textLength="84.2" lengthAdjust="spacingAndGlyphs">the answer</text><text class="s" xml:space="preserve" x="580.9" y="128.0" style="fill:#455b6b" data-box="2" textLength="334.0" lengthAdjust="spacingAndGlyphs">status: "Length 4.65 · 2 curves · 1 other object skipped"</text><text class="s" xml:space="preserve" x="580.9" y="148.0" style="fill:#455b6b" data-box="2" textLength="192.5" lengthAdjust="spacingAndGlyphs">Features.mark: points and label</text><path class="ar" d="M210.5,131.5 L254.5,131.5"/><path class="ar" d="M518.9,131.5 L562.9,131.5"/><rect data-box="3" x="28.0" y="233.0" width="1124.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="257.0" style="fill:#111111" data-box="3" textLength="260.7" lengthAdjust="spacingAndGlyphs">The mark is not a document object</text><text class="s" xml:space="preserve" x="40.0" y="281.0" style="fill:#455b6b" data-box="3" textLength="494.6" lengthAdjust="spacingAndGlyphs">it is drawn from state.features.mark, so undo, save and the layer tree never see it</text><text class="s" xml:space="preserve" x="40.0" y="301.0" style="fill:#455b6b" data-box="3" textLength="597.1" lengthAdjust="spacingAndGlyphs">it carries the row revision it was measured on: a changed scene, Esc or the next command drops it</text></svg>
