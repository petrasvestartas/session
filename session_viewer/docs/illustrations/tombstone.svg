<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 574" role="img" aria-labelledby="t d"><title id="t">What a removal has to remember</title><desc id="d">Undo is not 'remember the object', it is 'remember every slot the object was in'. One removal empties five live tables, and the tombstone records the position it held in each: the typed list, the guid lookup, the transform, the tree with its whole subtree, and every incident graph edge. It can only be built while _detach is emptying them, because that is the last moment every one of those positions is still known.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Remember every slot, not the object</text><text class="l" xml:space="preserve" x="28.0" y="82.0">the five live tables, before the removal</text><text class="l" xml:space="preserve" x="470.0" y="82.0">what the tombstone keeps of each</text><rect data-box="0" x="28.0" y="96.0" width="420.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0">typed list</text><text class="s" xml:space="preserve" x="40.0" y="144.0" style="fill:#455b6b" data-box="0">the object at obj_index in its collection,</text><text class="s" xml:space="preserve" x="40.0" y="164.0" style="fill:#455b6b" data-box="0">so order() survives a round trip</text><path class="ar" d="M452.0,137.5 L466.0,137.5"/><rect x="470" y="96.0" width="330" height="83.0" rx="4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="482.0" y="142.5" style="fill:#111111">guid · obj · collection · obj_index</text><rect data-box="1" x="28.0" y="189.0" width="420.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="213.0" style="fill:#111111" data-box="1">lookup</text><text class="s" xml:space="preserve" x="40.0" y="237.0" style="fill:#455b6b" data-box="1">guid → object</text><path class="ar" d="M452.0,220.5 L466.0,220.5"/><rect x="470" y="189.0" width="330" height="63.0" rx="4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="482.0" y="225.5" style="fill:#111111">guid</text><rect data-box="2" x="28.0" y="262.0" width="420.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="286.0" style="fill:#111111" data-box="2">transforms</text><text class="s" xml:space="preserve" x="40.0" y="310.0" style="fill:#455b6b" data-box="2">the local xform, or none</text><path class="ar" d="M452.0,293.5 L466.0,293.5"/><rect x="470" y="262.0" width="330" height="63.0" rx="4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="482.0" y="298.5" style="fill:#111111">xform</text><rect data-box="3" x="28.0" y="335.0" width="420.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="359.0" style="fill:#111111" data-box="3">tree</text><text class="s" xml:space="preserve" x="40.0" y="383.0" style="fill:#455b6b" data-box="3">parent_guid, the index among the siblings,</text><text class="s" xml:space="preserve" x="40.0" y="403.0" style="fill:#455b6b" data-box="3">and the node with its whole subtree</text><path class="ar" d="M452.0,376.5 L466.0,376.5"/><rect x="470" y="335.0" width="330" height="83.0" rx="4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="482.0" y="381.5" style="fill:#111111">parent_guid · index · node</text><rect data-box="4" x="28.0" y="428.0" width="420.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="452.0" style="fill:#111111" data-box="4">graph</text><text class="s" xml:space="preserve" x="40.0" y="476.0" style="fill:#455b6b" data-box="4">the node attribute, and every incident edge</text><text class="s" xml:space="preserve" x="40.0" y="496.0" style="fill:#455b6b" data-box="4">as (other guid, attribute, forward)</text><path class="ar" d="M452.0,469.5 L466.0,469.5"/><rect x="470" y="428.0" width="330" height="83.0" rx="4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="482.0" y="474.5" style="fill:#111111">attribute · edges</text><rect data-box="5" x="828.0" y="96.0" width="324.0" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="840.0" y="120.0" style="fill:#111111" data-box="5">_attach puts every one back</text><text class="s" xml:space="preserve" x="840.0" y="144.0" style="fill:#455b6b" data-box="5">the same list position, the same</text><text class="s" xml:space="preserve" x="840.0" y="164.0" style="fill:#455b6b" data-box="5">sibling index, the same subtree,</text><text class="s" xml:space="preserve" x="840.0" y="184.0" style="fill:#455b6b" data-box="5">and the edges whose other end</text><text class="s" xml:space="preserve" x="840.0" y="204.0" style="fill:#455b6b" data-box="5">still exists</text><rect data-box="6" x="828.0" y="256.0" width="324.0" height="103.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="840.0" y="280.0" style="fill:#111111" data-box="6">clone, not duplicate</text><text class="s" xml:space="preserve" x="840.0" y="304.0" style="fill:#455b6b" data-box="6">a snapshot must still name the</text><text class="s" xml:space="preserve" x="840.0" y="324.0" style="fill:#455b6b" data-box="6">object it stands for, and duplicate</text><text class="s" xml:space="preserve" x="840.0" y="344.0" style="fill:#455b6b" data-box="6">mints a fresh guid</text><rect data-box="7" x="828.0" y="392.0" width="324.0" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="840.0" y="416.0" style="fill:#111111" data-box="7">absolute, never deltas</text><text class="s" xml:space="preserve" x="840.0" y="440.0" style="fill:#455b6b" data-box="7">Replace and Xform carry the before</text><text class="s" xml:space="preserve" x="840.0" y="460.0" style="fill:#455b6b" data-box="7">and after values, so replaying one</text><text class="s" xml:space="preserve" x="840.0" y="480.0" style="fill:#455b6b" data-box="7">cannot depend on the state it is</text><text class="s" xml:space="preserve" x="840.0" y="500.0" style="fill:#455b6b" data-box="7">replayed into</text><text class="s" xml:space="preserve" x="28.0" y="546.0" style="fill:#e8ac00">The tombstone is built while _detach empties the tables: that is the only moment when every position it has to remember is still known.</text></svg>
