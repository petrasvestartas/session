<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">One join plane per shared vertex</title><desc id="d">A stroke is drawn as one ribbon per segment. Where two segments meet, two independent ribbons either overlap, which darkens the joint where coverage adds up, or leave a wedge open on the outer side of the bend. The joined lane gives every segment its neighbours and cuts both ribbons at the same join plane through the shared vertex, so a dense polyline and a coarse one look identical at their joints.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#111111"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#111111;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#455b6b}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#111111}.ar{fill:none;stroke:#111111;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#eef0f2"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="536.7" lengthAdjust="spacingAndGlyphs">Two ribbons at a bend, before and after the join plane</text><text class="l" xml:space="preserve" x="60.0" y="84.0" textLength="156.6" lengthAdjust="spacingAndGlyphs">independent ribbons</text><polygon points="91.5,313.8 271.5,163.8 248.5,136.2 68.5,286.2" fill="#111111" fill-opacity="0.55"/><polygon points="248.5,163.8 428.5,313.8 451.5,286.2 271.5,136.2" fill="#111111" fill-opacity="0.55"/><circle cx="260" cy="150" r="4" fill="#ce4095"/><text class="s" xml:space="preserve" x="290.0" y="104.0" style="fill:#ce4095" textLength="218.8" lengthAdjust="spacingAndGlyphs">overlap adds coverage: a darker dot</text><text class="s" xml:space="preserve" x="290.0" y="120.0" style="fill:#ce4095" textLength="162.4" lengthAdjust="spacingAndGlyphs">outer side: an open wedge</text><text class="s" xml:space="preserve" x="60.0" y="350.0" textLength="366.4" lengthAdjust="spacingAndGlyphs">the same stroke with 40 short segments shows 39 such dots</text><text class="l" xml:space="preserve" x="660.0" y="84.0" textLength="241.6" lengthAdjust="spacingAndGlyphs">joined lane: cut at the join plane</text><polygon points="668.5,286.2 860.0,121.9 860.0,178.1 691.5,313.8" fill="#111111" fill-opacity="0.55"/><polygon points="860.0,121.9 1051.5,286.2 1028.5,313.8 860.0,178.1" fill="#111111" fill-opacity="0.55"/><line x1="860.0" y1="121.9" x2="860.0" y2="178.1" stroke="#3f9c20" stroke-width="2" stroke-dasharray="5 4"/><circle cx="860" cy="150" r="4" fill="#3f9c20"/><text class="s" xml:space="preserve" x="890.0" y="104.0" style="fill:#3f9c20" textLength="223.0" lengthAdjust="spacingAndGlyphs">join plane through the shared vertex</text><text class="s" xml:space="preserve" x="890.0" y="120.0" style="fill:#3f9c20" textLength="246.6" lengthAdjust="spacingAndGlyphs">no overlap, no wedge, uniform coverage</text><text class="s" xml:space="preserve" x="660.0" y="350.0" textLength="498.0" lengthAdjust="spacingAndGlyphs">each GPU row carries prev and next; the shader clips its ribbon at both join planes</text><text class="s" xml:space="preserve" x="28.0" y="400.0" textLength="894.7" lengthAdjust="spacingAndGlyphs">Chains are marked by the producers (Step 12), the row gains neighbours (Step 13), and the shader computes one plane per shared vertex (Step 14).</text></svg>
