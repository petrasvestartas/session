<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 638" role="img" aria-labelledby="t d"><title id="t">Two coverages, two channels</title><desc id="d">The plate's alpha is computed from a signed distance to a rounded rectangle and softened over exactly one pixel by fwidth; the plane's ink is sampled from the R8 coverage atlas and multiplies the colour, so a glyph edge darkens toward black instead of opening a hole.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Two coverages, two channels</text><text class="l" xml:space="preserve" x="28.0" y="74.0">the plate · a distance becomes alpha</text><rect x="70" y="100" width="300" height="132" rx="34" fill="#2a2a32"/><rect x="70" y="100" width="300" height="132" rx="34" fill="none" stroke="#f4f4f6" stroke-width="1.6"/><circle cx="220.0" cy="166.0" r="3" fill="#f4f4f6"/><path d="M220.0,166.0 L370,166.0" stroke="#9a9aa4" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M220.0,166.0 L220.0,100" stroke="#9a9aa4" stroke-width="1.2" stroke-dasharray="4 4"/><text class="m" xml:space="preserve" x="290.0" y="158.0" style="fill:#c9ccd6">half_size.x</text><text class="m" xml:space="preserve" x="228.0" y="126.0" style="fill:#c9ccd6">half_size.y</text><circle cx="336" cy="134" r="34" fill="none" stroke="#8fd36a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="336" cy="134" r="3" fill="#8fd36a"/><text class="m" xml:space="preserve" x="70.0" y="258.0" style="fill:#8fd36a">r = min(radius, half_size.x, half_size.y)</text><circle cx="396" cy="84" r="4" fill="#fa9ebc"/><path d="M394,86 L360.5,109.5" stroke="#fa9ebc" stroke-width="1.2"/><text class="s" xml:space="preserve" x="406.0" y="88.0" style="fill:#fa9ebc">outside: length(max(q, 0)) − r</text><circle cx="150.0" cy="196.0" r="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="70.0" y="280.0" style="fill:#c9ccd6">inside: min(max(q.x, q.y), 0) − r, the negative distance to the nearest side</text><rect data-box="0" x="70.0" y="294.0" width="394.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="82.0" y="318.0" style="fill:#111111" data-box="0">one distance, both jobs</text><text class="m" xml:space="preserve" x="82.0" y="342.0" style="fill:#111111" data-box="0">q = |local| − half_size + r</text><text class="m" xml:space="preserve" x="82.0" y="362.0" style="fill:#111111" data-box="0">d = length(max(q, 0)) + min(max(q.x, q.y), 0) − r</text><path d="M70,487 L370,487" stroke="#f4f4f6" stroke-width="1.3"/><path d="M220.0,487 L220.0,494" stroke="#f4f4f6" stroke-width="1.3"/><text class="m" xml:space="preserve" x="220.0" y="511.0" text-anchor="middle">d = 0</text><path d="M70,427 L184.0,427 L256.0,487 L370,487" stroke="#8fd36a" stroke-width="2.4" fill="none"/><text class="m" xml:space="preserve" x="70.0" y="417.0" style="fill:#8fd36a">alpha = clamp(0.5 − d / max(fwidth(d), 0.001), 0, 1)</text><path d="M184.0,501 L256.0,501" stroke="#e8ac00" stroke-width="1.4"/><text class="s" xml:space="preserve" x="264.0" y="505.0" style="fill:#e8ac00">one fwidth: one physical pixel at any zoom</text><rect data-box="1" x="70.0" y="527.0" width="216.9" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="82.0" y="551.0" style="fill:#111111" data-box="1">the plate's output</text><text class="m" xml:space="preserve" x="82.0" y="575.0" style="fill:#111111" data-box="1">vec4(0, 0, 0, coverage)</text><text class="s" xml:space="preserve" x="82.0" y="595.0" style="fill:#455b6b" data-box="1">black; only the alpha varies</text><text class="l" xml:space="preserve" x="640.0" y="74.0">the plane · a texel becomes ink</text><polygon points="670,130 940,108 960,214 686,240" fill="#bdbfe8" opacity="0.5"/><circle cx="670" cy="130" r="3.4" fill="#f4f4f6"/><circle cx="940" cy="108" r="3.4" fill="#f4f4f6"/><circle cx="960" cy="214" r="3.4" fill="#f4f4f6"/><circle cx="686" cy="240" r="3.4" fill="#f4f4f6"/><text class="m" xml:space="preserve" x="660.0" y="122.0" text-anchor="end">uv 0,0</text><text class="m" xml:space="preserve" x="970.0" y="214.0">uv 1,1</text><rect x="670" y="268" width="26" height="26" fill="rgb(29,29,29)"/><rect x="696" y="268" width="26" height="26" fill="rgb(157,157,157)"/><rect x="722" y="268" width="26" height="26" fill="rgb(243,243,243)"/><rect x="748" y="268" width="26" height="26" fill="rgb(81,81,81)"/><rect x="670" y="294" width="26" height="26" fill="rgb(29,29,29)"/><rect x="696" y="294" width="26" height="26" fill="rgb(175,175,175)"/><rect x="722" y="294" width="26" height="26" fill="rgb(243,243,243)"/><rect x="748" y="294" width="26" height="26" fill="rgb(94,94,94)"/><rect x="670" y="320" width="26" height="26" fill="rgb(29,29,29)"/><rect x="696" y="320" width="26" height="26" fill="rgb(175,175,175)"/><rect x="722" y="320" width="26" height="26" fill="rgb(243,243,243)"/><rect x="748" y="320" width="26" height="26" fill="rgb(94,94,94)"/><rect x="670" y="346" width="26" height="26" fill="rgb(22,22,22)"/><rect x="696" y="346" width="26" height="26" fill="rgb(108,108,108)"/><rect x="722" y="346" width="26" height="26" fill="rgb(184,184,184)"/><rect x="748" y="346" width="26" height="26" fill="rgb(54,54,54)"/><text class="s" xml:space="preserve" x="670.0" y="398.0" style="fill:#c9ccd6">R8 coverage atlas, one stem magnified</text><rect data-box="2" x="804.0" y="268.0" width="288.7" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="816.0" y="292.0" style="fill:#111111" data-box="2">the plane's output</text><text class="m" xml:space="preserve" x="816.0" y="316.0" style="fill:#111111" data-box="2">textureSample(coverage, samp, uv).r</text><text class="m" xml:space="preserve" x="816.0" y="336.0" style="fill:#111111" data-box="2">vec4(color.rgb * coverage, color.a)</text><text class="s" xml:space="preserve" x="816.0" y="356.0" style="fill:#455b6b" data-box="2">coverage 1 → the label's colour</text><text class="s" xml:space="preserve" x="816.0" y="376.0" style="fill:#455b6b" data-box="2">coverage 0 → black, still opaque</text><text class="s" xml:space="preserve" x="640.0" y="419.0" style="fill:#e8ac00">The backing is opaque: coverage darkens toward black rather than opening a hole,</text><text class="s" xml:space="preserve" x="640.0" y="439.0" style="fill:#e8ac00">so a glyph edge never shows the scene through it.</text></svg>
