<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 635" role="img" aria-labelledby="t d"><title id="t">One angle decides whether a shared edge gets ink</title><desc id="d">The cosine between two face normals sorts a shared edge into one of three verdicts. The thresholds sit in an order that has to hold: the mesher may turn 5 degrees between samples, so a sampling seam can never reach the 25 degree crease test, and the packed normal code is only good to 1.4 degrees, so the test runs on the walk's f64 normals.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="422.5" lengthAdjust="spacingAndGlyphs">One angle decides: does this edge get ink?</text><path d="M176,232 L1092,232" stroke="#f4f4f6" stroke-width="1.6" fill="none"/><path d="M176.0,232 L176.0,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="176.0" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="33.2" lengthAdjust="spacingAndGlyphs">0.001</text><path d="M350.3,232 L350.3,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="350.3" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="25.8" lengthAdjust="spacingAndGlyphs">0.01</text><path d="M524.6,232 L524.6,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="524.6" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="18.4" lengthAdjust="spacingAndGlyphs">0.1</text><path d="M698.9,232 L698.9,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="698.9" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="7.4" lengthAdjust="spacingAndGlyphs">1</text><path d="M873.2,232 L873.2,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="873.2" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="14.9" lengthAdjust="spacingAndGlyphs">10</text><path d="M1047.5,232 L1047.5,239" stroke="#6a6a74" stroke-width="1.2"/><text class="s" xml:space="preserve" x="1047.5" y="256.0" text-anchor="middle" style="fill:#b9b9bd" textLength="22.3" lengthAdjust="spacingAndGlyphs">100</text><text class="s" xml:space="preserve" x="1092.0" y="280.0" text-anchor="end" style="fill:#c9ccd6" textLength="301.4" lengthAdjust="spacingAndGlyphs">degrees between the two faces' outward normals</text><path d="M248.3,232 L248.3,198" stroke="#bdbfe8" stroke-width="2.6"/><text class="m" xml:space="preserve" x="248.3" y="96.0" text-anchor="middle" style="fill:#bdbfe8" textLength="188.2" lengthAdjust="spacingAndGlyphs">COPLANAR_DOT = 1.0 − 1e-9</text><text class="s" xml:space="preserve" x="248.3" y="114.0" text-anchor="middle" style="fill:#c9ccd6" textLength="289.7" lengthAdjust="spacingAndGlyphs">0.0026°: below this the faces are one flat region</text><path d="M248.3,122.0 L248.3,196.0" stroke="#4a4a54" stroke-width="1"/><path d="M724.4,232 L724.4,198" stroke="#b9b9bd" stroke-width="2.6"/><text class="s" xml:space="preserve" x="724.4" y="150.0" text-anchor="middle" style="fill:#b9b9bd" textLength="113.9" lengthAdjust="spacingAndGlyphs">oct16 quantisation</text><text class="s" xml:space="preserve" x="724.4" y="168.0" text-anchor="middle" style="fill:#c9ccd6" textLength="287.0" lengthAdjust="spacingAndGlyphs">1.4°: the smallest turn the packed code can see</text><path d="M724.4,176.0 L724.4,196.0" stroke="#4a4a54" stroke-width="1"/><path d="M820.7,232 L820.7,198" stroke="#8fd36a" stroke-width="2.6"/><text class="m" xml:space="preserve" x="820.7" y="96.0" text-anchor="middle" style="fill:#8fd36a" textLength="165.6" lengthAdjust="spacingAndGlyphs">QUALITY = (5.0, 0.001)</text><text class="s" xml:space="preserve" x="820.7" y="114.0" text-anchor="middle" style="fill:#c9ccd6" textLength="327.3" lengthAdjust="spacingAndGlyphs">5°: the most a tessellation may turn between samples</text><path d="M820.7,122.0 L820.7,196.0" stroke="#4a4a54" stroke-width="1"/><path d="M942.6,232 L942.6,198" stroke="#fa9ebc" stroke-width="2.6"/><text class="m" xml:space="preserve" x="942.6" y="150.0" text-anchor="middle" style="fill:#fa9ebc" textLength="195.7" lengthAdjust="spacingAndGlyphs">CREASE_COS = 0.906_307_787</text><text class="s" xml:space="preserve" x="942.6" y="168.0" text-anchor="middle" style="fill:#c9ccd6" textLength="115.2" lengthAdjust="spacingAndGlyphs">25°: a genuine fold</text><path d="M942.6,176.0 L942.6,196.0" stroke="#4a4a54" stroke-width="1"/><text class="s" xml:space="preserve" x="28.0" y="326.0" style="fill:#bdbfe8" textLength="93.1" lengthAdjust="spacingAndGlyphs">authored Mesh</text><rect x="176.0" y="300" width="72.3" height="38" rx="4" fill="#e4e4e7"/><rect x="248.3" y="300" width="843.7" height="38" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="670.2" y="324.0" text-anchor="middle" style="fill:#111111" textLength="220.3" lengthAdjust="spacingAndGlyphs">ink: every edge the author put there</text><text class="s" xml:space="preserve" x="28.0" y="392.0" style="fill:#bdbfe8" textLength="69.8" lengthAdjust="spacingAndGlyphs">tessellation</text><rect x="176.0" y="366" width="72.3" height="38" rx="4" fill="#e4e4e7"/><rect x="248.3" y="366" width="694.2" height="38" rx="4" fill="#e4e4e7"/><text class="s" xml:space="preserve" x="595.4" y="390.0" text-anchor="middle" style="fill:#111111" textLength="296.9" lengthAdjust="spacingAndGlyphs">dropped: this is the sampling grid, not the shape</text><rect x="942.6" y="366" width="149.4" height="38" rx="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="1017.3" y="390.0" text-anchor="middle" style="fill:#111111" textLength="75.4" lengthAdjust="spacingAndGlyphs">ink: a crease</text><path d="M942.6,300 L942.6,404" stroke="#fa9ebc" stroke-width="1.6" stroke-dasharray="6 5" fill="none"/><text class="m" xml:space="preserve" x="242.3" y="438.0" style="fill:#e07a26" textLength="309.0" lengthAdjust="spacingAndGlyphs">VIEWER_ALL_EDGES re-opens the flat sliver</text><text class="m" xml:space="preserve" x="936.6" y="458.0" text-anchor="end" style="fill:#e07a26" textLength="225.8" lengthAdjust="spacingAndGlyphs">VIEWER_SEAMS re-opens the grid</text><rect data-box="0" x="28.0" y="480.0" width="416.7" height="103.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="504.0" style="fill:#111111" data-box="0" textLength="217.2" lengthAdjust="spacingAndGlyphs">A border has no angle to test</text><text class="m" xml:space="preserve" x="40.0" y="528.0" style="fill:#111111" data-box="0" textLength="218.7" lengthAdjust="spacingAndGlyphs">edge_faces[ei][1] == u32::MAX</text><text class="s" xml:space="preserve" x="40.0" y="548.0" style="fill:#455b6b" data-box="0" textLength="328.7" lengthAdjust="spacingAndGlyphs">one face only, so the verdict is ink before any cosine is</text><text class="s" xml:space="preserve" x="40.0" y="568.0" style="fill:#455b6b" data-box="0" textLength="235.0" lengthAdjust="spacingAndGlyphs">computed: at any angle, in both bands</text><rect data-box="1" x="468.7" y="480.0" width="513.2" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="480.7" y="504.0" style="fill:#111111" data-box="1" textLength="318.9" lengthAdjust="spacingAndGlyphs">Why the order of the ticks is the argument</text><text class="s" xml:space="preserve" x="480.7" y="528.0" style="fill:#455b6b" data-box="1" textLength="454.0" lengthAdjust="spacingAndGlyphs">5° is the most the mesher may turn between samples, so a sampling seam</text><text class="s" xml:space="preserve" x="480.7" y="548.0" style="fill:#455b6b" data-box="1" textLength="431.2" lengthAdjust="spacingAndGlyphs">cannot reach 25°: the crease test never mistakes the grid for the shape</text><text class="s" xml:space="preserve" x="480.7" y="568.0" style="fill:#455b6b" data-box="1" textLength="389.0" lengthAdjust="spacingAndGlyphs">1.4° is the packed code's error, so the test runs on the walk's f64</text><text class="s" xml:space="preserve" x="480.7" y="588.0" style="fill:#455b6b" data-box="1" textLength="303.0" lengthAdjust="spacingAndGlyphs">normals and never on the codes the shader reads</text></svg>
