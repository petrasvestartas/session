<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 514" role="img" aria-labelledby="t d"><title id="t">Independent chords versus one shared boundary chain</title><desc id="d">Left: two faces and the ink sample one common edge independently, so three polylines approximate one curve and cross, separate or hide each other as the camera moves. Right: one canonical chain is chosen, both face meshes are constrained to those exact points and the ink reuses them, so the seam is one curve everywhere.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Before: three approximations of one edge</text><rect x="40" y="70" width="420" height="250" rx="10" fill="#111111" stroke="#b9b9bd" stroke-width="1"/><polygon points="60,300 60,120 250,140 250,290" fill="#bdbfe8" fill-opacity="0.6" stroke="none"/><polygon points="250,140 440,110 440,300 250,290" fill="#fa9ebc" fill-opacity="0.6" stroke="none"/><polyline points="120.0,245.5 170.0,205.2 220.0,182.9 270.0,182.9 320.0,205.2 370.0,245.5" fill="none" stroke="#bdbfe8" stroke-width="2"/><circle cx="120.0" cy="245.5" r="3.2" fill="#bdbfe8"/><circle cx="170.0" cy="205.2" r="3.2" fill="#bdbfe8"/><circle cx="220.0" cy="182.9" r="3.2" fill="#bdbfe8"/><circle cx="270.0" cy="182.9" r="3.2" fill="#bdbfe8"/><circle cx="320.0" cy="205.2" r="3.2" fill="#bdbfe8"/><circle cx="370.0" cy="245.5" r="3.2" fill="#bdbfe8"/><polyline points="120.0,250.6 155.7,212.0 191.4,193.7 227.1,183.5 262.9,177.2 298.6,198.8 334.3,209.2 370.0,250.6" fill="none" stroke="#fa9ebc" stroke-width="2"/><circle cx="120.0" cy="250.6" r="3.2" fill="#fa9ebc"/><circle cx="155.7" cy="212.0" r="3.2" fill="#fa9ebc"/><circle cx="191.4" cy="193.7" r="3.2" fill="#fa9ebc"/><circle cx="227.1" cy="183.5" r="3.2" fill="#fa9ebc"/><circle cx="262.9" cy="177.2" r="3.2" fill="#fa9ebc"/><circle cx="298.6" cy="198.8" r="3.2" fill="#fa9ebc"/><circle cx="334.3" cy="209.2" r="3.2" fill="#fa9ebc"/><circle cx="370.0" cy="250.6" r="3.2" fill="#fa9ebc"/><polyline points="120.0,249.2 140.8,225.3 161.7,207.2 182.5,199.3 203.3,191.6 224.2,180.3 245.0,176.4 265.8,183.7 286.7,191.6 307.5,196.0 328.3,207.2 349.2,228.6 370.0,249.2" fill="none" stroke="#f4f4f6" stroke-width="1.6" stroke-dasharray="6 4"/><text class="s" xml:space="preserve" x="60.0" y="335.0" style="fill:#bdbfe8">face A chords (5)</text><text class="s" xml:space="preserve" x="200.0" y="335.0" style="fill:#fa9ebc">face B chords (7)</text><text class="s" xml:space="preserve" x="340.0" y="335.0">ink sampled apart</text><text class="s" xml:space="preserve" x="60.0" y="358.0">they cross and separate; the seam z-fights and breaks as the camera moves</text><text class="h" xml:space="preserve" x="520.0" y="40.0">After: one canonical chain</text><rect x="532" y="70" width="420" height="250" rx="10" fill="#111111" stroke="#b9b9bd" stroke-width="1"/><polygon points="552,300 552,120 742,140 742,290" fill="#bdbfe8" fill-opacity="0.6" stroke="none"/><polygon points="742,140 932,110 932,300 742,290" fill="#fa9ebc" fill-opacity="0.6" stroke="none"/><polyline points="612.0,245.5 643.2,218.5 674.5,197.7 705.8,184.5 737.0,180.0 768.2,184.5 799.5,197.7 830.8,218.5 862.0,245.5" fill="none" stroke="#f4f4f6" stroke-width="2.4"/><circle cx="612.0" cy="245.5" r="3.2" fill="#8fd36a"/><circle cx="643.2" cy="218.5" r="3.2" fill="#8fd36a"/><circle cx="674.5" cy="197.7" r="3.2" fill="#8fd36a"/><circle cx="705.8" cy="184.5" r="3.2" fill="#8fd36a"/><circle cx="737.0" cy="180.0" r="3.2" fill="#8fd36a"/><circle cx="768.2" cy="184.5" r="3.2" fill="#8fd36a"/><circle cx="799.5" cy="197.7" r="3.2" fill="#8fd36a"/><circle cx="830.8" cy="218.5" r="3.2" fill="#8fd36a"/><circle cx="862.0" cy="245.5" r="3.2" fill="#8fd36a"/><text class="s" xml:space="preserve" x="552.0" y="335.0">one chain, refined once; both meshes constrained to it</text><text class="s" xml:space="preserve" x="552.0" y="358.0">ink drawn from those same mesh nodes: one curve, no seam</text><rect data-box="0" x="28.0" y="390.0" width="944.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="414.0" style="fill:#111111" data-box="0">Where it lives</text><text class="m" xml:space="preserve" x="40.0" y="438.0" style="fill:#111111" data-box="0">brep.rs phase 2      chooses and refines the chain, once per edge</text><text class="m" xml:space="preserve" x="40.0" y="458.0" style="fill:#111111" data-box="0">TrimLoops            carries the given XYZ into mesh_loops</text><text class="m" xml:space="preserve" x="40.0" y="478.0" style="fill:#111111" data-box="0">brep_edges.rs        reads the chain back as pipes with the original edge id</text></svg>
