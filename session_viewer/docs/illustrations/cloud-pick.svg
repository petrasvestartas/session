<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 604" role="img" aria-labelledby="t d"><title id="t">The display has a residency budget; a pick does not</title><desc id="d">A streamed cloud shows a bounded prefix, so a click cannot ask the screen: the nearest displayed point at a coarse level of detail is a point the user never clicked. It asks the file instead. Every octree node whose cube meets the click window is eligible, resident or not, and the answer is accumulated one page at a time against the depth the frame already has.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="344.3" lengthAdjust="spacingAndGlyphs">A click asks the file, not the screen</text><text class="l" xml:space="preserve" x="28.0" y="92.0" textLength="130.4" lengthAdjust="spacingAndGlyphs">what is on screen</text><rect x="28" y="106" width="318" height="200" rx="4" fill="#e4e4e7" fill-opacity="0.10"/><circle cx="104" cy="196" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="79" cy="193" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="219" cy="222" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="112" cy="231" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="41" cy="128" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="238" cy="210" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="329" cy="289" r="2" fill="#e4e4e7" fill-opacity="0.55"/>