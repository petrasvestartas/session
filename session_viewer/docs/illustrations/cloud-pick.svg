.55"/><circle cx="232" cy="229" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="71" cy="182" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="302" cy="167" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="215" cy="161" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="94" cy="264" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="60" cy="246" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="265" cy="192" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="304" cy="144" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="130" cy="264" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="314" cy="276" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="130" cy="120" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="256" cy="141" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="60" cy="183" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="272" cy="144" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="230" cy="221" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="119" cy="280" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="83" cy="163" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="59" cy="266" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="285" cy="256" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="234" cy="240" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="277" cy="205" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="61" cy="258" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="104" cy="178" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="114" cy="279" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="101" cy="182" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="111" cy="168" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="75" cy="225" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="225" cy="268" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="177" cy="252" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="281" cy="172" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="128" cy="127" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="62" cy="159" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="87" cy="225" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="314" cy="254" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="130" cy="186" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="42" cy="144" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="271" cy="227" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="210" cy="206" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="213" cy="180" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="289" cy="255" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="254" cy="148" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="248" cy="140" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="192" cy="123" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="312" cy="284" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="180" cy="210" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="107" cy="280" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="299" cy="224" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="196" cy="215" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="144" cy="270" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="301" cy="146" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="72" cy="244" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="247" cy="288" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="98" cy="201" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="323" cy="154" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="112" cy="181" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="40" cy="119" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="312" cy="241" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="202" cy="160" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="67" cy="213" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="46" cy="172" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="221" cy="184" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="320" cy="260" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="294" cy="226" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="223" cy="159" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="333" cy="156" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="262" cy="293" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="143" cy="238" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="54" cy="208" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="41" cy="207" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="61" cy="213" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="184" cy="119" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="143" cy="287" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="101" cy="143" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="263" cy="195" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="255" cy="271" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="263" cy="156" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="127" cy="206" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="287" cy="287" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="47" cy="244" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="312" cy="119" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="304" cy="154" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="178" cy="281" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="118" cy="263" r="2" fill="#e4e4e7" fill-opacity="0.55"/><circle cx="209" cy="271" r="2" fill="#e4e4e7" fill-opacity="0.55"/><rect x="150" y="186" width="40" height="40" fill="#fa9ebc" fill-opacity="0.42"/><text class="s" xml:space="preserve" x="200.0" y="210.0" style="fill:#fa9ebc" textLength="148.5" lengthAdjust="spacingAndGlyphs">the click, ± PICK_RADIUS</text><text class="s" xml:space="preserve" x="28.0" y="330.0" textLength="222.5" lengthAdjust="spacingAndGlyphs">a resident prefix: a bounded fraction</text><text class="s" xml:space="preserve" x="28.0" y="352.0" textLength="125.2" lengthAdjust="spacingAndGlyphs">of this cloud's points</text><text class="s" xml:space="preserve" x="28.0" y="382.0" style="fill:#fa9ebc" textLength="236.7" lengthAdjust="spacingAndGlyphs">ask the screen and you get the nearest</text><text class="s" xml:space="preserve" x="28.0" y="404.0" style="fill:#fa9ebc" textLength="237.1" lengthAdjust="spacingAndGlyphs">displayed point, which at a coarse level</text><text class="s" xml:space="preserve" x="28.0" y="426.0" style="fill:#fa9ebc" textLength="236.8" lengthAdjust="spacingAndGlyphs">of detail is not the one that was clicked</text><text class="l" xml:space="preserve" x="400.0" y="92.0" textLength="142.3" lengthAdjust="spacingAndGlyphs">what the click asks</text><rect x="400.0" y="106.0" width="72" height="60" rx="4" fill="#bdbfe8"/><rect x="478.0" y="106.0" width="72" height="60" rx="4" fill="#55555e"/><rect x="478.0" y="172.0" width="72" height="60" rx="4" fill="#bdbfe8"/><rect x="556.0" y="172.0" width="72" height="60" rx="4" fill="#55555e"/><rect x="556.0" y="238.0" width="72" height="60" rx="4" fill="#bdbfe8"/><rect x="634.0" y="238.0" width="72" height="60" rx="4" fill="#55555e"/><rect x="400.0" y="172.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><rect x="400.0" y="238.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><rect x="478.0" y="238.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><rect x="556.0" y="106.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><rect x="634.0" y="106.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><rect x="634.0" y="172.0" width="72" height="60" rx="4" fill="#e4e4e7" fill-opacity="0.08"/><text class="s" xml:space="preserve" x="400.0" y="330.0" textLength="275.2" lengthAdjust="spacingAndGlyphs">lavender · resident · dark · never downloaded</text><text class="m" xml:space="preserve" x="400.0" y="352.0" textLength="195.7" lengthAdjust="spacingAndGlyphs">eligible_ranges walks both</text><text class="s" xml:space="preserve" x="400.0" y="382.0" textLength="289.5" lengthAdjust="spacingAndGlyphs">kept, not rejected, when the answer is not sure:</text><text class="s" xml:space="preserve" x="400.0" y="404.0" textLength="296.8" lengthAdjust="spacingAndGlyphs">a cube crossing the eye plane, and a cube whose</text><text class="s" xml:space="preserve" x="400.0" y="426.0" textLength="267.5" lengthAdjust="spacingAndGlyphs">projection is not finite — the arithmetic that</text><text class="s" xml:space="preserve" x="400.0" y="448.0" textLength="253.9" lengthAdjust="spacingAndGlyphs">would reject it is the arithmetic that failed</text><text class="l" xml:space="preserve" x="772.0" y="92.0" textLength="146.9" lengthAdjust="spacingAndGlyphs">one page per frame</text><rect data-box="0" x="772.0" y="106.0" width="380.0" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="784.0" y="130.0" style="fill:#111111" data-box="0" textLength="215.1" lengthAdjust="spacingAndGlyphs">PAGE_POINTS = 65,536 points</text><text class="s" xml:space="preserve" x="784.0" y="154.0" style="fill:#455b6b" data-box="0" textLength="167.0" lengthAdjust="spacingAndGlyphs">≈ 1.5 MiB · one HTTP Range</text><rect data-box="1" x="772.0" y="180.0" width="380.0" height="37.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="784.0" y="204.0" style="fill:#111111" data-box="1" textLength="221.4" lengthAdjust="spacingAndGlyphs">upload the page as ID targets</text><rect data-box="2" x="772.0" y="236.0" width="380.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="784.0" y="260.0" style="fill:#111111" data-box="2" textLength="270.1" lengthAdjust="spacingAndGlyphs">the ID pass runs against the frame's</text><text class="s" xml:space="preserve" x="784.0" y="284.0" style="fill:#455b6b" data-box="2" textLength="231.9" lengthAdjust="spacingAndGlyphs">retained depth, so a candidate behind</text><text class="s" xml:space="preserve" x="784.0" y="304.0" style="fill:#455b6b" data-box="2" textLength="69.3" lengthAdjust="spacingAndGlyphs">a wall loses</text><rect data-box="3" x="772.0" y="322.0" width="380.0" height="37.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="784.0" y="346.0" style="fill:#111111" data-box="3" textLength="239.5" lengthAdjust="spacingAndGlyphs">fold the nearest into the winner</text><text class="s" xml:space="preserve" x="772.0" y="404.0" textLength="282.7" lengthAdjust="spacingAndGlyphs">the first page clears the accumulated ids, later</text><text class="s" xml:space="preserve" x="772.0" y="426.0" textLength="285.3" lengthAdjust="spacingAndGlyphs">pages load them; no colour frame is presented</text><text class="s" xml:space="preserve" x="772.0" y="448.0" textLength="195.5" lengthAdjust="spacingAndGlyphs">while a page owns the readback</text><rect data-box="4" x="28.0" y="486.0" width="560.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="510.0" style="fill:#111111" data-box="4" textLength="206.8" lengthAdjust="spacingAndGlyphs">QueryView freezes the click</text><text class="s" xml:space="preserve" x="40.0" y="534.0" style="fill:#455b6b" data-box="4" textLength="467.6" lengthAdjust="spacingAndGlyphs">its matrix, canvas size, pixel and radius. Every page is tested against that one</text><text class="s" xml:space="preserve" x="40.0" y="554.0" style="fill:#455b6b" data-box="4" textLength="297.1" lengthAdjust="spacingAndGlyphs">projection, never against the camera as it is now.</text><rect data-box="5" x="616.0" y="486.0" width="536.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="628.0" y="510.0" style="fill:#111111" data-box="5" textLength="192.0" lengthAdjust="spacingAndGlyphs">Cancellation is ownership</text><text class="s" xml:space="preserve" x="628.0" y="534.0" style="fill:#455b6b" data-box="5" textLength="454.1" lengthAdjust="spacingAndGlyphs">every page carries the query's generation, and dropping the Query flips its</text><text class="s" xml:space="preserve" x="628.0" y="554.0" style="fill:#455b6b" data-box="5" textLength="301.2" lengthAdjust="spacingAndGlyphs">token — nothing has to remember to clear a flag.</text><text class="s" xml:space="preserve" x="28.0" y="592.0" style="fill:#e8ac00" textLength="698.6" lengthAdjust="spacingAndGlyphs">When every eligible page has answered, two more range reads bring the winner's exact position and its original id.</text></svg>
