<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 645" role="img" aria-labelledby="t d"><title id="t">Where a carried ink depth has to land</title><desc id="d">Two reverse-Z depth lines. When the texel under the fragment is farther than the ink's axis the test is one sided; when it is nearer the predicted depth must fall inside the tolerance band on both sides, so a surface that does not pass through the axis cannot uncover covered ink.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="384.2" lengthAdjust="spacingAndGlyphs">Where the predicted depth has to land</text><text class="s" xml:space="preserve" x="28.0" y="64.0" style="fill:#c9ccd6" textLength="349.9" lengthAdjust="spacingAndGlyphs">reverse-Z: the buffer clears to 0.0 and nearer is greater →</text><text class="l" xml:space="preserve" x="28.0" y="94.0" textLength="333.8" lengthAdjust="spacingAndGlyphs">the texel is FARTHER than the axis   z ≤ depth</text><path d="M60,170 L700,170" stroke="#f4f4f6" stroke-width="1.6" fill="none"/><text class="s" xml:space="preserve" x="60.0" y="196.0" style="fill:#c9ccd6" textLength="145.0" lengthAdjust="spacingAndGlyphs">far · 0.0 · the clear value</text><text class="s" xml:space="preserve" x="700.0" y="196.0" text-anchor="end" style="fill:#c9ccd6" textLength="56.6" lengthAdjust="spacingAndGlyphs">near · 1.0</text><rect x="60" y="154" width="406.0" height="32" fill="#8fd36a" opacity="0.34"/><path d="M420.0,148 L420.0,192" stroke="#f4f4f6" stroke-width="2"/><text class="m" xml:space="preserve" x="420.0" y="112.0" text-anchor="middle" textLength="75.3" lengthAdjust="spacingAndGlyphs">axis.depth</text><path d="M374.0,158 L374.0,182" stroke="#f4f4f6" stroke-width="1.2"/><path d="M466.0,158 L466.0,182" stroke="#f4f4f6" stroke-width="1.2"/><circle cx="270.0" cy="170" r="6" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="270.0" y="136.0" text-anchor="middle" style="fill:#bdbfe8" textLength="160.1" lengthAdjust="spacingAndGlyphs">z · the depth already there</text><circle cx="448.0" cy="170" r="6" fill="#8fd36a"/><text class="s" xml:space="preserve" x="462.0" y="236.0" style="fill:#8fd36a" textLength="58.0" lengthAdjust="spacingAndGlyphs">predicted</text><path class="ar" d="M278.0,196.0 L440.0,196.0"/><text class="s" xml:space="preserve" x="359.0" y="213.0" text-anchor="middle" textLength="163.0" lengthAdjust="spacingAndGlyphs">+ gradient · (axis.at − pixel)</text><rect data-box="0" x="760.0" y="122.0" width="252.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="772.0" y="146.0" style="fill:#111111" data-box="0" textLength="72.7" lengthAdjust="spacingAndGlyphs">one-sided</text><text class="m" xml:space="preserve" x="772.0" y="170.0" style="fill:#111111" data-box="0" textLength="218.2" lengthAdjust="spacingAndGlyphs">predicted ≤ depth + tolerance</text><text class="s" xml:space="preserve" x="772.0" y="190.0" style="fill:#455b6b" data-box="0" textLength="121.2" lengthAdjust="spacingAndGlyphs">ink still overhangs a</text><text class="s" xml:space="preserve" x="772.0" y="210.0" style="fill:#455b6b" data-box="0" textLength="136.6" lengthAdjust="spacingAndGlyphs">silhouette at full width</text><text class="l" xml:space="preserve" x="28.0" y="294.0" textLength="339.5" lengthAdjust="spacingAndGlyphs">the texel is NEARER   z &gt; depth + |depth| · 2⁻¹⁹</text><path d="M60,370 L700,370" stroke="#f4f4f6" stroke-width="1.6" fill="none"/><text class="s" xml:space="preserve" x="60.0" y="396.0" style="fill:#c9ccd6" textLength="145.0" lengthAdjust="spacingAndGlyphs">far · 0.0 · the clear value</text><text class="s" xml:space="preserve" x="700.0" y="396.0" text-anchor="end" style="fill:#c9ccd6" textLength="56.6" lengthAdjust="spacingAndGlyphs">near · 1.0</text><rect x="374.0" y="354" width="92" height="32" fill="#8fd36a" opacity="0.34"/><path d="M420.0,348 L420.0,392" stroke="#f4f4f6" stroke-width="2"/><text class="m" xml:space="preserve" x="420.0" y="312.0" text-anchor="middle" textLength="75.3" lengthAdjust="spacingAndGlyphs">axis.depth</text><path d="M374.0,358 L374.0,382" stroke="#f4f4f6" stroke-width="1.2"/><path d="M466.0,358 L466.0,382" stroke="#f4f4f6" stroke-width="1.2"/><circle cx="540.0" cy="370" r="6" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="540.0" y="336.0" text-anchor="middle" style="fill:#bdbfe8" textLength="160.1" lengthAdjust="spacingAndGlyphs">z · the depth already there</text><circle cx="400.0" cy="370" r="6" fill="#8fd36a"/><text class="s" xml:space="preserve" x="414.0" y="436.0" style="fill:#8fd36a" textLength="58.0" lengthAdjust="spacingAndGlyphs">predicted</text><path class="ar" d="M548.0,396.0 L392.0,396.0"/><text class="s" xml:space="preserve" x="470.0" y="413.0" text-anchor="middle" textLength="163.0" lengthAdjust="spacingAndGlyphs">+ gradient · (axis.at − pixel)</text><rect data-box="1" x="760.0" y="322.0" width="252.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="772.0" y="346.0" style="fill:#111111" data-box="1" textLength="73.4" lengthAdjust="spacingAndGlyphs">two-sided</text><text class="m" xml:space="preserve" x="772.0" y="370.0" style="fill:#111111" data-box="1" textLength="233.3" lengthAdjust="spacingAndGlyphs">|predicted − depth| ≤ tolerance</text><text class="s" xml:space="preserve" x="772.0" y="390.0" style="fill:#455b6b" data-box="1" textLength="134.0" lengthAdjust="spacingAndGlyphs">the surface must pass</text><text class="s" xml:space="preserve" x="772.0" y="410.0" style="fill:#455b6b" data-box="1" textLength="114.3" lengthAdjust="spacingAndGlyphs">THROUGH the axis</text><rect data-box="2" x="28.0" y="470.0" width="984.0" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="494.0" style="fill:#111111" data-box="2" textLength="71.4" lengthAdjust="spacingAndGlyphs">tolerance</text><text class="m" xml:space="preserve" x="40.0" y="518.0" style="fill:#111111" data-box="2" textLength="459.1" lengthAdjust="spacingAndGlyphs">|depth| · 1.9073486e-6  +  |slope| · 0.00390625 · (1 + lever)</text><text class="s" xml:space="preserve" x="40.0" y="538.0" style="fill:#455b6b" data-box="2" textLength="194.3" lengthAdjust="spacingAndGlyphs">2⁻¹⁹: about 16 ULPs of the depth</text><text class="s" xml:space="preserve" x="40.0" y="558.0" style="fill:#455b6b" data-box="2" textLength="383.1" lengthAdjust="spacingAndGlyphs">2⁻⁸: the rasterizer snaps vertices to 1/256 px, so a fitted slope is</text><text class="s" xml:space="preserve" x="40.0" y="578.0" style="fill:#455b6b" data-box="2" textLength="347.3" lengthAdjust="spacingAndGlyphs">wrong by that much, times the lever it was carried across</text><text class="s" xml:space="preserve" x="28.0" y="623.0" style="fill:#e8ac00" textLength="679.9" lengthAdjust="spacingAndGlyphs">One verdict, three callers: the plane carry, the neighbouring-pair carry and the disc's two-axis carry all end here.</text></svg>
