<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 404" role="img" aria-labelledby="t d"><title id="t">Text from a string to pixels</title><desc id="d">A string with a font and CSS size is shaped once into glyph runs. Placement decides where the line belongs. The physical raster size is chosen from the device scale, glyph coverage is rasterized into an atlas, and a plate pass and a glyph pass composite the label. Camera motion changes placement only, never the shaped runs.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Shape once, place per frame, raster per scale</text><rect data-box="0" x="28.0" y="66.0" width="254.1" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0">TextLabel · engine/text.rs</text><text class="s" xml:space="preserve" x="40.0" y="114.0" style="fill:#455b6b" data-box="0">text, font, CSS size,</text><text class="s" xml:space="preserve" x="40.0" y="134.0" style="fill:#455b6b" data-box="0">color, placement</text><text class="s" xml:space="preserve" x="40.0" y="154.0" style="fill:#455b6b" data-box="0">bundled Noto font bytes</text><rect data-box="1" x="336.6" y="66.0" width="244.5" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="348.6" y="90.0" style="fill:#111111" data-box="1">TextDocument · runs</text><text class="m" xml:space="preserve" x="348.6" y="114.0" style="fill:#111111" data-box="1">glyph id, advance, offset</text><text class="m" xml:space="preserve" x="348.6" y="134.0" style="fill:#111111" data-box="1">cluster → source char</text><text class="s" xml:space="preserve" x="348.6" y="154.0" style="fill:#455b6b" data-box="1">cached until text or font change</text><rect data-box="2" x="635.5" y="66.0" width="228.2" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="647.5" y="90.0" style="fill:#111111" data-box="2">TextPlacement</text><text class="m" xml:space="preserve" x="647.5" y="114.0" style="fill:#111111" data-box="2">Screen · Anchor · Nameplate</text><text class="m" xml:space="preserve" x="647.5" y="134.0" style="fill:#111111" data-box="2">WorldPlane · WorldBillboard</text><text class="s" xml:space="preserve" x="647.5" y="154.0" style="fill:#455b6b" data-box="2">camera changes only this</text><rect data-box="3" x="907.7" y="66.0" width="223.8" height="103.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="919.7" y="90.0" style="fill:#111111" data-box="3">TextLane::prepare</text><text class="s" xml:space="preserve" x="919.7" y="114.0" style="fill:#455b6b" data-box="3">physical raster size once</text><text class="s" xml:space="preserve" x="919.7" y="134.0" style="fill:#455b6b" data-box="3">coverage atlas, bounded cache</text><text class="s" xml:space="preserve" x="919.7" y="154.0" style="fill:#455b6b" data-box="3">release on scene drop</text><path class="ar" d="M282.1,117.5 L336.6,117.5"/><text class="s" xml:space="preserve" x="309.3" y="110.5" text-anchor="middle">shape</text><path class="ar" d="M581.0,117.5 L635.5,117.5"/><text class="s" xml:space="preserve" x="608.3" y="110.5" text-anchor="middle">place</text><path class="ar" d="M863.7,117.5 L907.7,117.5"/><text class="s" xml:space="preserve" x="885.7" y="110.5" text-anchor="middle">DPR</text><path class="ar" d="M1019.6,169.0 L1019.6,205.0"/><rect data-box="4" x="635.5" y="205.0" width="561.4" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="647.5" y="229.0" style="fill:#111111" data-box="4">Two passes per label</text><text class="s" xml:space="preserve" x="647.5" y="253.0" style="fill:#455b6b" data-box="4">plate: rounded black box with padding (yellow while a source text is selected)</text><text class="s" xml:space="preserve" x="647.5" y="273.0" style="fill:#455b6b" data-box="4">glyphs: white letters from atlas coverage, straight alpha, no gray baked in</text><rect x="28" y="205" width="250" height="44" rx="22" fill="#f4f4f6"/><text class="l" xml:space="preserve" x="52.0" y="234.0" style="fill:#111111">Ø 12 mm · Beam 04</text><text class="s" xml:space="preserve" x="28.0" y="275.0">14 CSS px on any DPR: same size, more pixels</text><rect data-box="5" x="28.0" y="308.0" width="781.9" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="332.0" style="fill:#111111" data-box="5">Identity</text><text class="s" xml:space="preserve" x="40.0" y="356.0" style="fill:#455b6b" data-box="5">Authored text is a source object (app/scene_text.rs): it has a row, is picked by its rounded plate, and can be</text><text class="s" xml:space="preserve" x="40.0" y="376.0" style="fill:#455b6b" data-box="5">selected, hidden and shown. A derived selected-object name has no row and cannot steal its parent's click.</text></svg>
