<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 312" role="img" aria-labelledby="t d"><title id="t">Where this step sits in the viewer</title><desc id="d">The whole viewer as one map. This step works in: Page, Shell. A solid box is something you have already built, a dashed one is still ahead, and the pink box is where the code on this page lives.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="l" xml:space="preserve" x="28.0" y="34.0" style="fill:#b9b9bd">Where you are</text><rect x="28.0" y="76.0" width="269.0" height="66.0" rx="4" fill="#f0bcdb" stroke="#ce4095" stroke-width="2.4"/><text class="l" xml:space="preserve" x="40.0" y="102.0" style="fill:#111111">Page</text><text class="s" xml:space="preserve" x="40.0" y="124.0" style="fill:#111111">index.html · Trunk · Cargo</text><rect x="313.0" y="76.0" width="269.0" height="66.0" rx="4" fill="none" stroke="#f4f4f6" stroke-width="1.4"/><text class="l" xml:space="preserve" x="325.0" y="102.0" style="fill:#f4f4f6">Network</text><text class="s" xml:space="preserve" x="325.0" y="124.0" style="fill:#c9ccd6">fetch · manifest · stream</text><rect x="598.0" y="76.0" width="269.0" height="66.0" rx="4" fill="none" stroke="#f4f4f6" stroke-width="1.4"/><text class="l" xml:space="preserve" x="610.0" y="102.0" style="fill:#f4f4f6">Kernel</text><text class="s" xml:space="preserve" x="610.0" y="124.0" style="fill:#c9ccd6">documents in f64</text><rect x="883