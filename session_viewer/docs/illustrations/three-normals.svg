<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 537" role="img" aria-labelledby="t d"><title id="t">Three normals at one vertex, and what each is allowed to decide</title><desc id="d">A shading normal is an average chosen to make a tessellation look smooth. A cone's apex fan averages to straight up, so asking that average whether the seam faces away answered yes from every side and the seam vanished. The cull indexes each triangle's own normal by the exact bits of its edge endpoints instead.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Three normals at one vertex, and what each decides</text><text class="l" xml:space="preserve" x="40.0" y="76.0">the cone</text><path d="M188,110 L96,300 A 92 26 0 0 0 280,300 Z" fill="#bdbfe8" opacity="0.30" stroke="#9a9aa4" stroke-width="1.2"/><ellipse cx="188" cy="300" rx="92" ry="26" fill="none" stroke="#9a9aa4" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M188,110 L240,318" stroke="#f4f4f6" stroke-width="3"/><text class="s" xml:space="preserve" x="258.0" y="340.0">the seam</text><circle cx="188" cy="110" r="30" fill="none" stroke="#6a6a74" stroke-width="1.2" stroke-dasharray="5 4"/><path class="ar" d="M220.0,116.0 L372.0,150.0"/><text class="s" xml:space="preserve" x="304.0" y="137.0">zoom</text><text class="l" xml:space="preserve" x="392.0" y="76.0">the apex, enlarged</text><polygon points="520,190 416.6,152.4 456.9,99.9" fill="#bdbfe8" opacity="0.55" stroke="#9a9aa4" stroke-width="0.9"/><polygon points="520,190 456.9,99.9 520.0,80.0" fill="#bdbfe8" opacity="0.55" stroke="#9a9aa4" stroke-width="0.9"/><polygon points="520,190 520.0,80.0 583.1,99.9" fill="#bdbfe8" opacity="0.55" stroke="#9a9aa4" stroke-width="0.9"/><polygon points="520,190 583.1,99.9 623.4,152.4" fill="#bdbfe8" opacity="0.55" stroke="#9a9aa4" stroke-width="0.9"/><path d="M520,190 L520.0,80.0" stroke="#f4f4f6" stroke-width="3"/><path class="ar" d="M520.0,190.0 L520.0,106.0"/><text class="s" xml:space="preserve" x="648.0" y="94.0" style="fill:#8fd36a">shading normal</text><text class="s" xml:space="preserve" x="648.0" y="112.0" style="fill:#8fd36a">the fan's mean · lighting only</text><path d="M499.0,123.3 L445.0,145.3" stroke="#fa9ebc" stroke-width="2.6" fill="none"/><circle cx="445.0" cy="145.3" r="4" fill="#fa9ebc"/><path d="M541.0,123.3 L595.0,145.3" stroke="#fa9ebc" stroke-width="2.6" fill="none"/><circle cx="595.0" cy="145.3" r="4" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="392.0" y="326.0" style="fill:#fa9ebc">facet normals: each triangle's own cross product,</text><text class="s" xml:space="preserve" x="392.0" y="344.0" style="fill:#fa9ebc">turned outward by the face sign · the facing cull</text><text class="m" xml:space="preserve" x="392.0" y="368.0">oct16 → facing word (1.4°) · what the shader compares</text><text class="l" xml:space="preserve" x="860.0" y="76.0">the same seam, two culls</text><rect data-box="0" x="860.0" y="96.0" width="292.0" height="103.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="872.0" y="120.0" style="fill:#111111" data-box="0">cull with the shading normal</text><text class="s" xml:space="preserve" x="872.0" y="144.0" style="fill:#455b6b" data-box="0">both average to the same up vector</text><text class="s" xml:space="preserve" x="872.0" y="164.0" style="fill:#455b6b" data-box="0">→ both face away → the seam is culled</text><text class="s" xml:space="preserve" x="872.0" y="184.0" style="fill:#455b6b" data-box="0">and disappears</text><rect x="860" y="96" width="292" height="103.0" rx="4" fill="none" stroke="#e07a26" stroke-width="1.8" stroke-dasharray="7 5"/><rect data-box="1" x="860.0" y="221.0" width="292.0" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="872.0" y="245.0" style="fill:#111111" data-box="1">cull with the facet normals</text><text class="s" xml:space="preserve" x="872.0" y="269.0" style="fill:#455b6b" data-box="1">the two triangles splay left and right</text><text class="s" xml:space="preserve" x="872.0" y="289.0" style="fill:#455b6b" data-box="1">→ one of them faces the eye</text><text class="s" xml:space="preserve" x="872.0" y="309.0" style="fill:#455b6b" data-box="1">→ the seam is drawn</text><rect data-box="2" x="28.0" y="402.0" width="912.8" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="426.0" style="fill:#111111" data-box="2">The refusals built into the lookup</text><text class="s" xml:space="preserve" x="40.0" y="450.0" style="fill:#455b6b" data-box="2">the key is the two endpoint positions' exact bits, smallest first, so winding cannot change the answer</text><text class="s" xml:space="preserve" x="40.0" y="470.0" style="fill:#455b6b" data-box="2">a periodic face's seam has both its triangles in one mesh and keeps both</text><text class="s" xml:space="preserve" x="40.0" y="490.0" style="fill:#455b6b" data-box="2">more than two incident facets, or a facet missing on the lending face, returns FACING_UNKNOWN — always draw — rather than a guess</text></svg>
