 fill-opacity="0.34"/><rect x="584.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="254.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="267.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="280.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="293.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="584.0" y="306.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="254.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="267.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="280.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="293.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="597.0" y="306.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="254.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="267.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="280.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="610.0" y="293.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="254.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="623.0" y="267.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="163.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="636.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="163.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="649.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="662.0" y="163.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="662.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="662.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="662.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="675.0" y="163.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="675.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><polygon points="490.0,190.0 700.0,160.0 600.0,330.0" fill="none" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="490.0" cy="190.0" r="7" fill="#bdbfe8"/><circle cx="700.0" cy="160.0" r="7" fill="#bdbfe8"/><circle cx="600.0" cy="330.0" r="7" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="450.0" y="400.0" textLength="249.0" lengthAdjust="spacingAndGlyphs">it finds the covered pixels and blends the</text><text class="s" xml:space="preserve" x="450.0" y="422.0" textLength="281.0" lengthAdjust="spacingAndGlyphs">three vertex outputs across every one of them</text><text class="l" xml:space="preserve" x="830.0" y="86.0" style="fill:#f0bcdb" textLength="57.6" lengthAdjust="spacingAndGlyphs">fs_main</text><text class="s" xml:space="preserve" x="830.0" y="112.0" style="fill:#f0bcdb" textLength="197.4" lengthAdjust="spacingAndGlyphs">one invocation per covered pixel</text><polygon points="870.0,190.0 1080.0,160.0 980.0,330.0" fill="none" stroke="#f4f4f6" stroke-width="1.4"/><line x1="870.0" y1="190.0" x2="980.0" y2="280.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="4 4"/><circle cx="870.0" cy="190.0" r="7" fill="#bdbfe8"/><line x1="1080.0" y1="160.0" x2="980.0" y2="280.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="4 4"/><circle cx="1080.0" cy="160.0" r="7" fill="#bdbfe8"/><line x1="980.0" y1="330.0" x2="980.0" y2="280.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="4 4"/><circle cx="980.0" cy="330.0" r="7" fill="#bdbfe8"/><rect x="972.0" y="272.0" width="16" height="16" fill="#e8ac00"/><text class="s" xml:space="preserve" x="830.0" y="400.0" textLength="222.3" lengthAdjust="spacingAndGlyphs">it never sees a vertex, only the blend</text><text class="s" xml:space="preserve" x="830.0" y="422.0" style="fill:#e8ac00" textLength="241.0" lengthAdjust="spacingAndGlyphs">w0·v0 + w1·v1 + w2·v2, summing to one</text><path class="ar" d="M330.0,250.0 L470.0,250.0"/><path class="ar" d="M730.0,250.0 L870.0,250.0"/><text class="s" xml:space="preserve" x="28.0" y="484.0" textLength="389.6" lengthAdjust="spacingAndGlyphs">This is why a value cannot travel from one pixel to its neighbour.</text><text class="s" xml:space="preserve" x="28.0" y="506.0" textLength="693.4" lengthAdjust="spacingAndGlyphs">Anything a fragment needs is a uniform, a buffer it can index, or something a vertex handed to the rasterizer first.</text></svg>
