<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" role="img" aria-labelledby="t d"><title id="t">Three vertices in, thousands of fragments out</title><desc id="d">The two shaders you write never meet. vs_main runs once per vertex and its only required output is a clip position. Between the two stages sits the rasterizer, which you do not write: it works out which pixels the triangle covers and blends the vertex outputs across them. fs_main then runs once per covered pixel and never sees a vertex at all, only the blend.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="282.8" lengthAdjust="spacingAndGlyphs">The two shaders never meet</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#bdbfe8" textLength="60.4" lengthAdjust="spacingAndGlyphs">vs_main</text><text class="s" xml:space="preserve" x="60.0" y="112.0" style="fill:#bdbfe8" textLength="80.3" lengthAdjust="spacingAndGlyphs">3 invocations</text><polygon points="100.0,190.0 310.0,160.0 210.0,330.0" fill="none" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="100.0" cy="190.0" r="7" fill="#bdbfe8"/><circle cx="310.0" cy="160.0" r="7" fill="#bdbfe8"/><circle cx="210.0" cy="330.0" r="7" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="60.0" y="400.0" textLength="259.0" lengthAdjust="spacingAndGlyphs">one call per vertex; the only output it owes</text><text class="s" xml:space="preserve" x="60.0" y="422.0" textLength="201.5" lengthAdjust="spacingAndGlyphs">is @builtin(position), in clip space</text><text class="l" xml:space="preserve" x="450.0" y="86.0" style="fill:#b9b9bd" textLength="101.9" lengthAdjust="spacingAndGlyphs">the rasterizer</text><text class="s" xml:space="preserve" x="450.0" y="112.0" style="fill:#b9b9bd" textLength="202.0" lengthAdjust="spacingAndGlyphs">fixed function: you do not write it</text><rect x="493.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="506.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="506.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="519.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="519.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="519.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="519.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="532.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="532.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="532.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="532.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="532.0" y="241.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="176.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="189.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="202.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="215.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="228.0" width="11.6" height="11.6" fill="#f0bcdb" fill-opacity="0.34"/><rect x="545.0" y="241.0"