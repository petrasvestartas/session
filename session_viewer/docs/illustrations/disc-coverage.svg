<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1106 500" role="img" aria-labelledby="t d"><title id="t">One radius, two primitives, one clamped ramp</title><desc id="d">A quad template and a triangle template both carry a corner whose length 1 is the far edge of the disc, and the antialiasing ramp is clamped to twice the ink's half width so a thin pen still reaches full opacity.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="461.4" lengthAdjust="spacingAndGlyphs">One radius, two primitives, one clamped ramp</text><text class="l" xml:space="preserve" x="28.0" y="74.0" textLength="96.0" lengthAdjust="spacingAndGlyphs">corner space</text><polygon points="58.0,142.0 166.0,142.0 166.0,250.0 58.0,250.0" fill="none" stroke="#f4f4f6" stroke-width="1.6"/><circle cx="112" cy="196" r="54" fill="none" stroke="#8fd36a" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="112" cy="196" r="33.5" fill="#fa9ebc"/><circle cx="58.0" cy="142.0" r="3.6" fill="#f4f4f6"/><circle cx="166.0" cy="142.0" r="3.6" fill="#f4f4f6"/><circle cx="166.0" cy="250.0" r="3.6" fill="#f4f4f6"/><circle cx="58.0" cy="250.0" r="3.6" fill="#f4f4f6"/><polygon points="268.0,70.0 174.5,232.0 361.5,232.0" fill="none" stroke="#f4f4f6" stroke-width="1.6"/><circle cx="268" cy="178" r="54" fill="none" stroke="#8fd36a" stroke-width="1.6" stroke-dasharray="6 5"/><circle cx="268" cy="178" r="33.5" fill="#fa9ebc"/><circle cx="268.0" cy="70.0" r="3.6" fill="#f4f4f6"/><circle cx="174.5" cy="232.0" r="3.6" fill="#f4f4f6"/><circle cx="361.5" cy="232.0" r="3.6" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="112.0" y="272.0" text-anchor="middle" textLength="98.8" lengthAdjust="spacingAndGlyphs">quad · 4 corners</text><text class="s" xml:space="preserve" x="268.0" y="272.0" text-anchor="middle" textLength="88.1" lengthAdjust="spacingAndGlyphs">dot · 3 corners</text><text class="s" xml:space="preserve" x="28.0" y="300.0" style="fill:#8fd36a" textLength="303.4" lengthAdjust="spacingAndGlyphs">|corner| = 1 is the quad's edge midpoint AND the</text><text class="s" xml:space="preserve" x="28.0" y="318.0" style="fill:#8fd36a" textLength="251.8" lengthAdjust="spacingAndGlyphs">triangle's incircle, so the disc fits in either.</text><text class="l" xml:space="preserve" x="400.0" y="74.0" textLength="116.3" lengthAdjust="spacingAndGlyphs">corner to pixels</text><rect data-box="0" x="400.0" y="92.0" width="288.7" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="412.0" y="116.0" style="fill:#111111" data-box="0" textLength="74.5" lengthAdjust="spacingAndGlyphs">clip offset</text><text class="m" xml:space="preserve" x="412.0" y="140.0" style="fill:#111111" data-box="0" textLength="218.2" lengthAdjust="spacingAndGlyphs">corner * (px + 0.5 * feather)</text><text class="m" xml:space="preserve" x="412.0" y="160.0" style="fill:#111111" data-box="0" textLength="203.7" lengthAdjust="spacingAndGlyphs">* 2 / (vp_w, vp_h) * clip.w</text><rect data-box="1" x="400.0" y="201.0" width="288.7" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="412.0" y="225.0" style="fill:#111111" data-box="1" textLength="165.0" lengthAdjust="spacingAndGlyphs">pixels from the centre</text><text class="m" xml:space="preserve" x="412.0" y="249.0" style="fill:#111111" data-box="1" textLength="263.4" lengthAdjust="spacingAndGlyphs">d = |corner| * (px + 0.5 * feather)</text><path class="ar" d="M544.3,175.0 L544.3,201.0"/><rect data-box="2" x="400.0" y="280.0" width="288.7" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="412.0" y="304.0" style="fill:#111111" data-box="2" textLength="182.8" lengthAdjust="spacingAndGlyphs">px = to_px(radius, clip.w)</text><text class="s" xml:space="preserve" x="412.0" y="328.0" style="fill:#455b6b" data-box="2" textLength="99.2" lengthAdjust="spacingAndGlyphs">floored at 0.5 px</text><text class="s" xml:space="preserve" x="412.0" y="348.0" style="fill:#455b6b" data-box="2" textLength="195.5" lengthAdjust="spacingAndGlyphs">wider than the viewport: parked</text><text class="s" xml:space="preserve" x="412.0" y="368.0" style="fill:#455b6b" data-box="2" textLength="142.0" lengthAdjust="spacingAndGlyphs">outside the clip volume</text><text class="l" xml:space="preserve" x="744.7" y="74.0" textLength="68.9" lengthAdjust="spacingAndGlyphs">the ramp</text><path d="M778.6875,300 L1044.6875,300" stroke="#f4f4f6" stroke-width="1.4" fill="none"/><path d="M778.6875,300 L778.6875,110" stroke="#f4f4f6" stroke-width="1.4" fill="none"/><path d="M778.6875,120.0 L1044.6875,120.0" stroke="#55555f" stroke-width="1" stroke-dasharray="4 4" fill="none"/><path d="M867.4,300 L867.4,306" stroke="#f4f4f6" stroke-width="1.2"/><text class="m" xml:space="preserve" x="867.4" y="322.0" text-anchor="middle" textLength="7.5" lengthAdjust="spacingAndGlyphs">1</text><path d="M956.0,300 L956.0,306" stroke="#f4f4f6" stroke-width="1.2"/><text class="m" xml:space="preserve" x="956.0" y="322.0" text-anchor="middle" textLength="7.5" lengthAdjust="spacingAndGlyphs">2</text><path d="M1044.7,300 L1044.7,306" stroke="#f4f4f6" stroke-width="1.2"/><text class="m" xml:space="preserve" x="1044.7" y="322.0" text-anchor="middle" textLength="7.5" lengthAdjust="spacingAndGlyphs">3</text><text class="s" xml:space="preserve" x="1052.7" y="305.0" textLength="26.1" lengthAdjust="spacingAndGlyphs">d px</text><text class="m" xml:space="preserve" x="770.7" y="124.0" text-anchor="end" textLength="7.5" lengthAdjust="spacingAndGlyphs">1</text><text class="m" xml:space="preserve" x="770.7" y="304.0" text-anchor="end" textLength="7.5" lengthAdjust="spacingAndGlyphs">0</text><path d="M778.7,120.0 L845.2,120.0 L911.7,300.0" stroke="#8fd36a" stroke-width="2.4" fill="none"/><path d="M778.7,176.2 L1022.5,300.0" stroke="#e07a26" stroke-width="2.2" stroke-dasharray="7 5" fill="none"/><text class="m" xml:space="preserve" x="787.6" y="108.0" style="fill:#8fd36a" textLength="180.6" lengthAdjust="spacingAndGlyphs">f = min(feather, 2 · px)</text><text class="m" xml:space="preserve" x="827.5" y="194.0" style="fill:#e07a26" textLength="165.6" lengthAdjust="spacingAndGlyphs">f = feather, unclamped</text><path d="M783.1,176.2 L783.1,120.0" stroke="#e07a26" stroke-width="1.4" fill="none"/><text class="s" xml:space="preserve" x="789.3" y="152.8" style="fill:#e07a26" textLength="96.2" lengthAdjust="spacingAndGlyphs">never reaches 1</text><rect data-box="3" x="744.7" y="346.0" width="334.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="756.7" y="370.0" style="fill:#111111" data-box="3" textLength="153.6" lengthAdjust="spacingAndGlyphs">px = 0.75, feather = 4</text><text class="m" xml:space="preserve" x="756.7" y="394.0" style="fill:#111111" data-box="3" textLength="270.9" lengthAdjust="spacingAndGlyphs">clamped   f = 1.5  → alpha(0) = 1.00</text><text class="m" xml:space="preserve" x="756.7" y="414.0" style="fill:#111111" data-box="3" textLength="270.9" lengthAdjust="spacingAndGlyphs">unclamped f = 4.0  → alpha(0) = 0.69</text><text class="s" xml:space="preserve" x="756.7" y="434.0" style="fill:#455b6b" data-box="3" textLength="225.7" lengthAdjust="spacingAndGlyphs">the fade always ends inside the quad</text><text class="m" xml:space="preserve" x="28.0" y="470.0" textLength="978.3" lengthAdjust="spacingAndGlyphs">alpha = clamp((px + 0.5 · f − d) / f, 0, 1); a free dot then multiplies by its hairline fade, floored at HAIRLINE_MIN_ALPHA = 0.5.</text></svg>
