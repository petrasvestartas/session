<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 460" role="img" aria-labelledby="t d"><title id="t">A stroke segment is a screen-space quad</title><desc id="d">A segment has no mesh. The vertex shader emits six vertices per row, placing a camera-facing quad around the projected axis, and the half-width at each end travels down as a scalar so the trapezoid resolves per pixel. Coverage is not a distance ramp: band_area integrates the pixel box against the capsule exactly, so a thin stroke cannot beat with its own subpixel phase.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="326.0" lengthAdjust="spacingAndGlyphs">Six vertices, then exact coverage</text><text class="l" xml:space="preserve" x="60.0" y="86.0" textLength="354.9" lengthAdjust="spacingAndGlyphs">no vertex buffer: the quad is built in the shader</text><polygon points="124.7,357.2 448.1,210.5 431.9,169.5 95.3,282.8" fill="#111111" fill-opacity="0.10" stroke="#f4f4f6" stroke-width="1.4"/><line x1="124.7" y1="357.2" x2="431.9" y2="169.5" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="4 4"/><line x1="110.0" y1="320.0" x2="440.0" y2="190.0" stroke="#f0bcdb" stroke-width="1.8"/><circle cx="124.7" cy="357.2" r="4.5" fill="#f4f4f6"/><circle cx="448.1" cy="210.5" r="4.5" fill="#f4f4f6"/><circle cx="431.9" cy="169.5" r="4.5" fill="#f4f4f6"/><circle cx="95.3" cy="282.8" r="4.5" fill="#f4f4f6"/><line x1="110.0" y1="320.0" x2="124.7" y2="357.2" stroke="#8fd36a" stroke-width="1.6"/><line x1="440.0" y1="190.0" x2="448.1" y2="210.5" stroke="#8fd36a" stroke-width="1.6"/><text class="s" xml:space="preserve" x="96.0" y="372.0" textLength="245.0" lengthAdjust="spacingAndGlyphs">two triangles share the dashed diagonal</text><text class="s" xml:space="preserve" x="96.0" y="394.0" style="fill:#f0bcdb" textLength="275.0" lengthAdjust="spacingAndGlyphs">the axis is the row; the corners are computed</text><text class="s" xml:space="preserve" x="96.0" y="416.0" style="fill:#8fd36a" textLength="253.4" lengthAdjust="spacingAndGlyphs">one half-width per end, resolved per pixel</text><text class="l" xml:space="preserve" x="660.0" y="86.0" textLength="258.4" lengthAdjust="spacingAndGlyphs">coverage is an area, not a distance</text><rect x="700.0" y="150.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="700.0" y="208.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="700.0" y="266.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="758.0" y="150.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="758.0" y="208.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="758.0" y="266.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="816.0" y="150.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="816.0" y="208.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="816.0" y="266.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="874.0" y="150.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="874.0" y="208.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><rect x="874.0" y="266.0" width="58.0" height="58.0" fill="none" stroke="#b9b9bd" stroke-width="0.9"/><path d="M700.0,172.0 L932.0,294.0" stroke="#f0bcdb" stroke-width="2"/><polygon points="758.0,202.5 816.0,233.0 816.0,266.0 758.0,266.0" fill="#f0bcdb" fill-opacity="0.55"/><rect x="758.0" y="208.0" width="58.0" height="58.0" fill="none" stroke="#f4f4f6" stroke-width="2"/><text class="s" xml:space="preserve" x="660.0" y="372.0" textLength="335.3" lengthAdjust="spacingAndGlyphs">band_area integrates one pixel box against the capsule</text><text class="s" xml:space="preserve" x="660.0" y="394.0" style="fill:#f0bcdb" textLength="282.6" lengthAdjust="spacingAndGlyphs">the shaded part is the pixel's coverage, exactly</text><text class="s" xml:space="preserve" x="660.0" y="416.0" textLength="401.7" lengthAdjust="spacingAndGlyphs">a distance ramp beats with the line's subpixel phase; this does not</text></svg>
