<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="t d"><title id="t">Three gestures, three fields</title><desc id="d">The camera keeps a target, a distance and an orientation, and every gesture changes exactly one of them. Orbit turns the orientation about the target; pan slides the target across the camera's own plane; the wheel scales the distance and never reaches zero. The view matrix is rebuilt from those three, so no gesture can put the camera in a state the others cannot undo.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="290.8" lengthAdjust="spacingAndGlyphs">Each gesture moves one field</text><text class="l" xml:space="preserve" x="90.0" y="92.0" style="fill:#f0bcdb" textLength="36.7" lengthAdjust="spacingAndGlyphs">orbit</text><circle cx="200.0" cy="230.0" r="4.5" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="178.0" y="260.0" textLength="37.2" lengthAdjust="spacingAndGlyphs">target</text><circle cx="200.0" cy="230.0" r="90.0" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="5 5"/><polygon points="132.3,205.4 101.6,208.0 110.5,183.6" fill="#f0bcdb"/><polygon points="175.4,162.3 153.6,140.5 178.0,131.6" fill="#f0bcdb"/><path d="M94.8,191.7 A112.0,112.0 0 0 1 161.7,124.8" fill="none" stroke="#f0bcdb" stroke-width="2"/><text class="s" xml:space="preserve" x="90.0" y="342.0" style="fill:#f0bcdb" textLength="282.6" lengthAdjust="spacingAndGlyphs">the orientation turns; target and distance hold</text><text class="l" xml:space="preserve" x="490.0" y="92.0" style="fill:#8fd36a" textLength="28.4" lengthAdjust="spacingAndGlyphs">pan</text><circle cx="600.0" cy="230.0" r="4.5" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="578.0" y="260.0" textLength="37.2" lengthAdjust="spacingAndGlyphs">target</text><polygon points="528.0,230.0 500.0,243.0 500.0,217.0" fill="#8fd36a"/><line x1="600.0" y1="230.0" x2="670.0" y2="186.0" stroke="#8fd36a" stroke-width="2"/><circle cx="670.0" cy="186.0" r="4.5" fill="#8fd36a"/><text class="s" xml:space="preserve" x="490.0" y="342.0" style="fill:#8fd36a" textLength="231.4" lengthAdjust="spacingAndGlyphs">the target slides in the camera's plane</text><text class="l" xml:space="preserve" x="890.0" y="92.0" style="fill:#e8ac00" textLength="45.0" lengthAdjust="spacingAndGlyphs">wheel</text><circle cx="1000.0" cy="230.0" r="4.5" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="978.0" y="260.0" textLength="37.2" lengthAdjust="spacingAndGlyphs">target</text><line x1="850.0" y1="230.0" x2="1000.0" y2="230.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="5 5"/><polygon points="868.0,230.0 840.0,243.0 840.0,217.0" fill="#b9b9bd"/><polygon points="960.0,230.0 932.0,243.0 932.0,217.0" fill="#e8ac00"/><path class="ar" d="M876.0,276.0 L936.0,276.0"/><text class="s" xml:space="preserve" x="890.0" y="342.0" style="fill:#e8ac00" textLength="262.9" lengthAdjust="spacingAndGlyphs">the distance scales, and never reaches zero</text><text class="s" xml:space="preserve" x="28.0" y="392.0" textLength="961.2" lengthAdjust="spacingAndGlyphs">The view-projection is rebuilt from target, distance and orientation every frame, so the three gestures compose in any order and each one is exactly undoable.</text></svg>
