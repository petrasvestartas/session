  <text x="188" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#00c46a" font-weight="700">n</text>
  <text x="128" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#007bc4" font-weight="700">v</text>
  <text x="284" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#ff2d7a" font-weight="700">horizon h</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">GTAO analytical horizon integral (ssao.wgsl::arc)</text>
  <text x="486" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="13.6" fill="#111111"><tspan font-style="italic">A</tspan>(<tspan font-style="italic">h, n</tspan>) = ¼ ( cos <tspan font-style="italic">n</tspan> + 2 <tspan font-style="italic">h</tspan> sin <tspan font-style="italic">n</tspan> − cos(2 <tspan font-style="italic">h − n</tspan>) )</text>
  <text x="486" y="134" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#666666">6 quadratic taps per side:  <tspan font-style="italic">r</tspan><tspan font-size="9.5" dy="2">step</tspan><tspan dy="-2"> = max(1.5, </tspan><tspan font-style="italic">r</tspan><tspan font-size="9.5" dy="2">px</tspan><tspan dy="-2"> ((</tspan><tspan font-style="italic">k</tspan> + 0.5) / 6)²)</text>
  <text x="486" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Four-shader ambient pipeline (1× &amp; 4× MSAA)</text>
  <text x="538" y="182" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">2×2 z + 5×5 occ</text>
  <text x="650" y="182" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#007bc4" font-weight="500" text-anchor="middle">slot_table n</text>
  <text x="762" y="182" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">GTAO + history</text>
  <text x="874" y="182" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#ff2d7a" font-weight="500" text-anchor="middle">sample_mask</text>
  <rect x="486" y="188" width="104" height="40" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="538" y="211.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">ambient_depth</text>
  <rect x="598" y="188" width="104" height="40" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="650" y="211.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">ambient_geom</text>
  <rect x="710" y="188" width="104" height="40" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="762" y="211.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">ssao.wgsl</text>
  <rect x="822" y="188" width="104" height="40" rx="4.5" fill="#ff5c9a" stroke="none"/>
  <text x="874" y="211.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">composite</text>
  <text x="486" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">surface_outline.wgsl · 3×3 coarse-block halo early-out</text>
  <text x="486" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0">fs_pool</tspan> builds a coarse block max mask; pixels inside (<tspan font-family="monospace" font-size="11.0">center ≥ 0.999</tspan>)</text>
  <text x="498" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">or outside <tspan font-family="monospace" font-size="11.0">near_any_coverage</tspan> skip all 512 tap offsets immediately.</text>
  <text x="486" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0">ambient_composite.wgsl</tspan> applies a fullscreen pass on interior pixels and</text>
  <text x="498" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">instanced <tspan font-family="monospace" font-size="11.0">16×16</tspan> edge tiles writing per-sample <tspan font-family="monospace" font-size="11.0">@builtin(sample_mask)</tspan>.</text>
