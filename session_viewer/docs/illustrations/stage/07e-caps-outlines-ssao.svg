  <text x="300" y="154" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#00c46a" font-weight="700">leave (+1) → inside!</text>
  <text x="30" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">ssao.wgsl · quadratic horizon steps &amp; cosine arc</text>
