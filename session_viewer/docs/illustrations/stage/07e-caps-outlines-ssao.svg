  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">SECTION CAPS, OUTLINES AND HORIZON SSAO</text>
  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Cap cut solids from crossing counts, skip empty blocks, and integrate GTAO.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">cap.wgsl · back-minus-front crossing count &amp; 45° hatch</text>
