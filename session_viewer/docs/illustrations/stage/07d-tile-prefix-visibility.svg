  <text x="486" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#007bc4" font-weight="700">Three compute dispatches:  scan_tiles  →  scan_blocks  →  finish_offsets</text>
  <text x="486" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">Saturates at pool capacity on overflow; async CPU readback doubles the pool next frame.</text>
  <text x="486" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">triangle.wgsl, face_coverage.wgsl &amp; carry tolerance</text>
  <text x="486" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="13.2" fill="#111111">ε(<tspan font-style="italic">z, g, L</tspan>) = |<tspan font-style="italic">z</tspan>| · 2<tspan font-size="9.5" dy="-5">−19</tspan><tspan dy="5"> + |</tspan><tspan font-style="italic">g</tspan>| · (1 / 256) · (1 + <tspan font-style="italic">L</tspan>)</text>
  <text x="486" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0" fill="#007bc4">triangle.wgsl</tspan>: decodes <tspan font-family="monospace" font-size="11.0">oct32</tspan>, flips winding when <tspan font-family="monospace" font-size="11.0">det(M) &lt; 0</tspan>,</text>
  <text x="498" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">applies per-sample <tspan font-family="monospace" font-size="11.0">clip_mask</tspan>, and writes <tspan font-family="monospace" font-size="11.0">2×u16</tspan> primitive IDs.</text>
  <text x="486" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0" fill="#007bc4">face_coverage.wgsl</tspan>: converts nonzero MSAA primitive samples into exact</text>
  <text x="498" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">fractional coverage &amp; <tspan font-family="monospace" font-size="11.0">@builtin(sample_mask)</tspan> for silhouettes.</text>
