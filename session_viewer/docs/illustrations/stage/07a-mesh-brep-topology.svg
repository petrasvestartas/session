  <text x="474" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• If <tspan font-family="monospace" font-size="11.0">id ≤ head.y</tspan>: arena triangle keeps its own vertex row (<tspan font-family="monospace" font-size="11.0">SLOT_OWN_ROW</tspan>).</text>
  <text x="474" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• If <tspan font-family="monospace" font-size="11.0">id &gt; head.y</tspan>: binary search <tspan font-family="monospace" font-size="11.0">lo..hi</tspan> in O(log S) steps to resolve</text>
  <text x="488" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111"><tspan font-family="monospace" font-size="11.0" fill="#007bc4">(definition_tri = (id − 1) − slot.base,  instance_row = slot.row)</tspan>.</text>
  <text x="474" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">1,000 placed timber joints share 1 mesh upload while keeping unique pick &amp; normal IDs.</text>
