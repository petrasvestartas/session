<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">
  <rect x="0.5" y="0.5" width="959" height="399" fill="#ffffff" stroke="#e4e7e8" stroke-width="1"/>
  <line x1="451.2" y1="54" x2="451.2" y2="378" stroke="#e4e7e8" stroke-width="1"/>
  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">EARLY FETCH, RANGE GATE AND HYDRATION</text>
  <text x="473.2" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Overlap <tspan font-style="italic">__viewerEarly</tspan> with wasm compile, cap Range at 3, hydrate on edit.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Parallel startup timeline (index.html + fetch.rs + loader.rs)</text>
  <rect x="42" y="96" width="278" height="26" rx="4" fill="#ffc400" stroke="none"/>
  <text x="52" y="113" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.6" fill="#111111" font-weight="500">window.__viewerEarly (8 KiB probe + YAML)</text>
  <rect x="42" y="148" width="298" height="26" rx="4" fill="#a9c9ff" stroke="none"/>
  <text x="52" y="165" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.6" fill="#111111" font-weight="500">wasm download + compile + DeviceSetup</text>
  <rect x="196" y="200" width="236" height="26" rx="4" fill="#ff5c9a" stroke="none"/>
  <text x="206" y="217" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.6" fill="#111111" font-weight="500">RangeGate (≤ 3 FIFO Range slots)</text>
  <line x1="42" y1="262" x2="432" y2="262" stroke="#e4e7e8" stroke-width="1" stroke-linecap="round"/>
  <text x="42" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#111111">• One-shot take clears __viewerEarly[key] after first read.</text>
  <text x="42" y="312" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#111111">• Load &amp; stream generations drop superseded reloads.</text>
  <text x="42" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#007bc4" font-weight="700">• Malformed reload keeps active scene, camera &amp; grid.</text>
  <text x="474" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">scene_release.rs &amp; hydrate.rs · zero-RAM display vs edit</text>
  <text x="545" y="88" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#007bc4" font-weight="500" text-anchor="middle">112 B + lanes live</text>
  <text x="699" y="88" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">0 kernel RAM kept</text>
  <text x="853" y="88" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">token-checked .pb</text>
  <rect x="474" y="94" width="142" height="42" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="545" y="118.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">1. Upload to GPU</text>
  <rect x="628" y="94" width="142" height="42" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="699" y="118.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">2. Release Session</text>
  <rect x="782" y="94" width="142" height="42" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="853" y="118.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">3. Hydrate on Save</text>
  <line x1="617" y1="115" x2="622.5" y2="115" stroke="#007bc4" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="627,115 622.5,115.67 622.5,114.33" fill="#007bc4" stroke="none"/>
  <line x1="771" y1="115" x2="776.5" y2="115" stroke="#ff7a1a" stroke-width="1.7" stroke-linecap="round"/>
  <polygon points="781,115 776.5,115.67 776.5,114.33" fill="#ff7a1a" stroke="none"/>
  <text x="474" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Identity &amp; failure invariants during re-hydration</text>
  <text x="474" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Released FileDoc retains tree names, GUIDs, GPU rows &amp; release_token.</text>
  <text x="474" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Orbit, pan, hide/show &amp; GPU picking work with 0 resident kernel bytes.</text>
  <text x="474" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Save or geometry edit queues Resume, re-fetches .pb, verifies</text>
  <text x="486" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">(doc_idx, release_token), and runs the queued command automatically.</text>
  <text x="474" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• HTTP 500 during hydration reports a contextual error while keeping</text>
  <text x="486" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">every visible GPU row on screen for retry.</text>
  <rect x="0.5" y="396.5" width="959" height="3" fill="#e4e7e8"/>
  <rect x="0.5" y="396.5" width="757.89" height="3" fill="#007bc4"/>
</svg>
