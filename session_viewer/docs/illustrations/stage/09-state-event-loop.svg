  <text x="474" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Production runtime safeguards (352/352 src/ parity)</text>
  <text x="474" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• Resize throttle: surface target rebuilds coalesce to 100 ms intervals.</text>
  <text x="474" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• Camera preservation on slow load: Msg::Fit compares current camera</text>
  <text x="486" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">pose against load-start pose so manual orbit is never snapped back.</text>
  <text x="474" y="278" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• FramePacing: queue.on_submitted_work_done gate prevents frame backlog.</text>
  <text x="474" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• Trunk production.html bundles stage/, decks/, text/, pb/ &amp; docs/.</text>
  <text x="474" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#007bc4" font-weight="700">Status: 8 checkpoints accepted; Tutorial 9 tracks 31-px instanced test.</text>
