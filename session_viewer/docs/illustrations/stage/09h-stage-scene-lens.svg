  <text x="486" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Computed after user orbit so 2D TeX labels lock onto orbited 3D nodes.</text>
  <text x="486" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• ?stage=decks/&lt;name&gt;/index.yaml&amp;data=off serves all 7 shipped decks</text>
  <text x="498" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">(30 chapters) locally with hot YAML reload and zero viewer UI chrome.</text>
