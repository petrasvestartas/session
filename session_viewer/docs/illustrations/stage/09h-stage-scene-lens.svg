  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">3D STAGE SYNC, 2×4 LENS AND EQUILIBRIUM</text>
  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Project orbited 3D nodes through a <tspan fill="#007bc4">2×4 lens</tspan> and solve <tspan font-style="italic">D</tspan><tspan font-size="9.5" dy="2">N</tspan><tspan dy="-2"> </tspan><tspan font-style="italic">x</tspan><tspan font-size="9.5" dy="2">N</tspan><tspan dy="-2"> = </tspan><tspan font-style="italic">p − D</tspan><tspan font-size="9.5" dy="2">F</tspan><tspan dy="-2"> </tspan><tspan font-style="italic">x</tspan><tspan font-size="9.5" dy="2">F</tspan>.</text>
