  <text x="38" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#666666">3D Point = outer ink disc + 0.58-scale bg paper disc; arrowhead_pens = 24.</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">net.rs · linear force-density equilibrium solver</text>
  <text x="486" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" fill="#111111"><tspan font-weight="700">D</tspan> = <tspan font-weight="700">C</tspan><tspan font-size="9.5" dy="-5">T</tspan><tspan dy="5"> </tspan><tspan font-weight="700">Q C</tspan>,       <tspan fill="#007bc4" font-weight="700">D</tspan><tspan fill="#007bc4" font-size="9.5" dy="2">N</tspan><tspan dy="-2"> </tspan><tspan font-weight="700">x</tspan><tspan font-size="9.5" dy="2">N</tspan><tspan dy="-2"> = </tspan><tspan font-weight="700">p</tspan> − <tspan font-weight="700">D</tspan><tspan font-size="9.5" dy="2">F</tspan><tspan dy="-2"> </tspan><tspan font-weight="700">x</tspan><tspan font-size="9.5" dy="2">F</tspan></text>
  <text x="486" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#666666">Exposes C, CN, CF, q, Q, DN, DF, xF, p, b, xN, l, L, f, U to YAML slides.</text>
  <text x="486" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">mode.rs · strict 5-step real-scene stage frame order</text>
