  <text x="476" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#111111">Matched pairs tween (<tspan font-style="italic">x, y, size, color</tspan>) via smootherstep <tspan font-style="italic">s</tspan>(<tspan font-style="italic">t</tspan>) = <tspan font-style="italic">t</tspan>³(6<tspan font-style="italic">t</tspan>² − 15<tspan font-style="italic">t</tspan> + 10);</text>
  <text x="476" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#666666">unmatched old glyphs fade out while new glyphs fade in without mutating Rc&lt;Expr&gt;.</text>
