  <text x="608" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#111111">− 1,</text>
  <text x="676" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" fill="#111111"><tspan font-style="italic">y</tspan><tspan font-size="10" dy="3">ndc</tspan><tspan dy="-3"> = 1 − </tspan></text>
  <text x="782" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#ff2d7a" text-anchor="middle">2 <tspan font-style="italic">y</tspan><tspan font-size="9.5" dy="2">pt</tspan></text>
  <line x1="752" y1="112.5" x2="812" y2="112.5" stroke="#ff2d7a" stroke-width="1.15" stroke-linecap="round"/>
  <text x="782" y="127" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#ff2d7a" text-anchor="middle"><tspan font-style="italic">H</tspan><tspan font-size="9.5" dy="2">px</tspan><tspan dy="-2"> / </tspan><tspan font-style="italic">s</tspan></text>
  <text x="486" y="162" font-family="Georgia, 'Times New Roman', serif" font-size="12.6" fill="#111111">Tessellation scale: <tspan font-family="monospace" font-size="11.8" fill="#007bc4">pixels_per_point = s</tspan> rasterizes edges at physical DPI.</text>
  <text x="486" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Single CommandEncoder · two sequential render passes</text>
