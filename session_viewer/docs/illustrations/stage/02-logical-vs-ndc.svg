  <text x="48" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#666666">Never free an atlas texture while Frame N's render pass still samples it.</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Density-independent coordinates &amp; NDC y-inversion</text>
