  <text x="486" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#111111">• Pass 1 writes <tspan font-family="monospace" font-size="11.8">LoadOp::Clear(WHITE)</tspan> (and 3D scene ink in Tutorial 7).</text>
  <text x="486" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#111111">• <tspan font-family="monospace" font-size="11.8" fill="#007bc4">Ui::draw</tspan> opens Pass 2 with <tspan font-family="monospace" font-size="11.8" fill="#ff2d7a">LoadOp::Load</tspan> so Pass 1 pixels survive.</text>
  <text x="486" y="342" font-family="Georgia, 'Times New Roman', serif" font-size="12.4" fill="#666666">• Premultiplied alpha blends anti-aliased glyph quads over the white paper.</text>
