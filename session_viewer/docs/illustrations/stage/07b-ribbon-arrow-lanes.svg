  <text x="856" y="208.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">plane.wgsl</text>
  <rect x="486" y="234" width="140" height="38" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="556" y="256.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">72 B StrokeSegment</text>
  <rect x="636" y="234" width="140" height="38" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="706" y="256.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">64 B VectorRow</text>
  <rect x="786" y="234" width="140" height="38" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="856" y="256.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">48 B PlaneRow</text>
  <text x="486" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0" fill="#007bc4">plane.wgsl</tspan>: 1 row → <tspan font-family="monospace" font-size="11.0">22×6</tspan> grid verts (hidden by solids) + <tspan font-family="monospace" font-size="11.0">3×18</tspan> XYZ arrows.</text>
  <text x="486" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0" fill="#007bc4">grid.wgsl</tspan>: <tspan font-family="monospace" font-size="11.0">44</tspan> floor vertices (±5 m at 1 m step) + pink X, green Y, blue Z axes.</text>
  <text x="486" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0" fill="#007bc4">background.wgsl</tspan>: 1 oversized 3-vertex triangle <tspan font-family="monospace" font-size="11.0">(-1,-1),(3,-1),(-1,3)</tspan> at</text>
  <text x="498" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">primitive ID = 0 (white 1.0, or 0.94 paper when SSAO is active).</text>
