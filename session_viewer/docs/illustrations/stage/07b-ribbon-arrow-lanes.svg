  <text x="233" y="290" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.2" fill="#111111" font-weight="500" text-anchor="middle">v0..5 shaft (tucked)</text>
  <text x="375" y="290" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.2" fill="#007bc4" font-weight="500" text-anchor="middle">v6..11</text>
  <text x="68" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#111111" font-weight="700" text-anchor="middle">start</text>
  <text x="404" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#007bc4" font-weight="700" text-anchor="end">end (0.30 aspect)</text>
  <text x="34" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#666666">Scalar arguments in arrow_corner(...) avoid Android struct-packing driver bug.</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Analytical pixel-square box_cdf anti-aliasing filter</text>
  <text x="486" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="13.2" fill="#111111">band_area(<tspan font-style="italic">d, hw</tspan>, <tspan font-weight="700">g</tspan>) = box_cdf(<tspan font-style="italic">d + hw</tspan>) − box_cdf(<tspan font-style="italic">d − hw</tspan>)</text>
  <text x="486" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">Exact 1×1 pixel-square overlap with a stroke band; sub-pixel wires fade smoothly.</text>
  <text x="486" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Procedural stroke, arrow, plane, grid &amp; backdrop lanes</text>
