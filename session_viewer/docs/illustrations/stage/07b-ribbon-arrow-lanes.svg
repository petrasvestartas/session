  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Extrude 6-vertex mitered quads in <tspan font-style="italic">ribbon.wgsl</tspan> and 18-vertex 0.30 arrows.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">ribbon.wgsl · 6-vertex quad, join_plane miter &amp; reveal</text>
