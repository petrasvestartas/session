  <text x="486" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="13.8" fill="#111111"><tspan font-weight="700">M</tspan><tspan font-size="10" dy="3">vp</tspan><tspan dy="-3"> = </tspan><tspan fill="#007bc4" font-weight="700">T</tspan><tspan fill="#007bc4" font-size="10" dy="3">lens</tspan><tspan dy="-3">(δ</tspan><tspan font-size="10" dy="3">x</tspan><tspan dy="-3">, δ</tspan><tspan font-size="10" dy="3">y</tspan><tspan dy="-3">) · </tspan><tspan fill="#ff2d7a" font-weight="700">P</tspan><tspan fill="#ff2d7a" font-size="10" dy="3">rev-z</tspan><tspan dy="-3"> · </tspan><tspan font-weight="700">V</tspan>(<tspan font-weight="700">e − a</tspan>, <tspan font-weight="700">t − a</tspan>) · <tspan font-weight="700">S</tspan>(<tspan font-style="italic">u</tspan><tspan font-size="10" dy="3">m</tspan><tspan dy="-3">)</tspan></text>
  <text x="486" y="142" font-family="Georgia, 'Times New Roman', serif" font-size="12.8" fill="#666666">Panel shift:  δ<tspan font-size="9.5" dy="2">x</tspan><tspan dy="-2"> = </tspan><tspan font-style="italic">f</tspan><tspan font-size="9.5" dy="2">0</tspan><tspan dy="-2"> + </tspan><tspan font-style="italic">f</tspan><tspan font-size="9.5" dy="2">2</tspan><tspan dy="-2"> − 1,    </tspan>δ<tspan font-size="9.5" dy="2">y</tspan><tspan dy="-2"> = 1 − </tspan><tspan font-style="italic">f</tspan><tspan font-size="9.5" dy="2">1</tspan><tspan dy="-2"> − </tspan><tspan font-style="italic">f</tspan><tspan font-size="9.5" dy="2">3</tspan></text>
