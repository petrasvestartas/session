  <text x="486" y="322" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• <tspan font-weight="700">Anchor subtraction in f64</tspan>: large coordinates cancel before f32 upload.</text>
  <text x="486" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">• <tspan font-weight="700">Reversed-Z</tspan> (<tspan font-family="monospace" font-size="11.0">perspective(fov, aspect, far, near)</tspan>): mantissa bits</text>
