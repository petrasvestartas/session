  <text x="486" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#111111"><tspan font-style="italic">x</tspan><tspan font-size="9.5" dy="2">scr</tspan><tspan dy="-2"> = ½ (1 + </tspan><tspan font-style="italic">x</tspan><tspan font-size="9.5" dy="2">ndc</tspan><tspan dy="-2">) </tspan><tspan font-style="italic">W</tspan>,       <tspan font-style="italic">y</tspan><tspan font-size="9.5" dy="2">scr</tspan><tspan dy="-2"> = ½ (1 </tspan><tspan fill="#ff2d7a" font-weight="700">−</tspan> <tspan font-style="italic">y</tspan><tspan font-size="9.5" dy="2">ndc</tspan><tspan dy="-2">) </tspan><tspan font-style="italic">H</tspan></text>
