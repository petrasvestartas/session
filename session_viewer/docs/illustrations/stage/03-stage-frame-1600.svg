  <text x="476" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="12.6" fill="#111111">Head length <tspan font-style="italic">L</tspan> = min(24, 0.45 ‖<tspan font-weight="700">b − a</tspan>‖),   width / <tspan font-style="italic">L</tspan> = <tspan fill="#007bc4" font-weight="700">0.30</tspan>,   shaft stops at <tspan fill="#ff2d7a">base</tspan>.</text>
  <text x="476" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="11.9" fill="#666666">Matches 3D <tspan font-family="monospace" font-size="11.2">arrow.wgsl</tspan> proportions so 2D and 3D force polygons share one visual pen.</text>
