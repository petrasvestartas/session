  <text x="476" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#111111"><tspan font-style="italic">k</tspan> = min( <tspan font-style="italic">W</tspan><tspan font-size="9.5" dy="2">scr</tspan><tspan dy="-2"> / 1600,  </tspan><tspan font-style="italic">H</tspan><tspan font-size="9.5" dy="2">scr</tspan><tspan dy="-2"> / 900 ),     </tspan><tspan font-weight="700">p</tspan><tspan font-size="9.5" dy="2">scr</tspan><tspan dy="-2"> = </tspan><tspan font-weight="700">o</tspan> + <tspan font-style="italic">k</tspan> <tspan font-weight="700">p</tspan><tspan font-size="9.5" dy="2">slide</tspan></text>
  <text x="476" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#666666">Default split = 0.46 (x = 736); column budget TOP = 150 .. 830 (680 px).</text>
