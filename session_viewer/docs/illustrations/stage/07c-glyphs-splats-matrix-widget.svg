  <text x="486" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0">text_plate</tspan>: derivative-AA rounded rectangle behind depth-tested labels.</text>
  <text x="486" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0">text_plane</tspan>: uniform <tspan font-family="monospace" font-size="11.0">fwidth</tspan> sampling + full-box pick across spaces.</text>
  <text x="486" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• <tspan font-family="monospace" font-size="11.0">text_outline</tspan>: writes <tspan font-family="monospace" font-size="11.0">primitive = 0</tspan> so sheet letters never hide lines.</text>
