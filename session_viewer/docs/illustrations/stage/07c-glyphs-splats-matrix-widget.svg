  <text x="614" y="108" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.2" fill="#007bc4" font-weight="700">HEADER_WORDS = 16</text>
  <text x="614" y="128" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="11.2" fill="#111111" font-weight="500">VALUE_WORDS  = 3 / cell:</text>
  <text x="614" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• word 0: f32 ramp value</text>
  <text x="614" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• word 1: exact whole u32</text>
  <text x="614" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#ff2d7a">• word 2: thousandths | SIGN_BIT</text>
  <text x="486" y="226" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Three scene text shaders (plates, UV quads, arena outlines)</text>
  <text x="556" y="238" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">SDF rounded pill</text>
  <text x="706" y="238" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#007bc4" font-weight="500" text-anchor="middle">UV coverage atlas</text>
  <text x="856" y="238" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#ff2d7a" font-weight="500" text-anchor="middle">arena mesh letters</text>
  <rect x="486" y="244" width="140" height="40" rx="4.5" fill="#ffc400" stroke="none"/>
