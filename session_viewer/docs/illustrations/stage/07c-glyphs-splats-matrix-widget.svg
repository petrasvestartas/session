  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">MARKERS, SPLATS, MATRICES AND GUMBALL</text>
  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Cut SDF dots in 3 vertices, resolve EDL splats, and draw 7-segment cells.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">glyph.wgsl (3-vertex SDF disc) &amp; sphere.wgsl taper</text>
  <polygon points="116,109.04 73.6,182.48 158.4,182.48" fill="#a9c9ff" fill-opacity="0.16" stroke="#111111" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
