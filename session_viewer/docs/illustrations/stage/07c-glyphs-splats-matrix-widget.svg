  <rect x="636" y="244" width="140" height="40" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="706" y="267.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">text_plane.wgsl</text>
  <rect x="786" y="244" width="140" height="40" rx="4.5" fill="#ff5c9a" stroke="none"/>
