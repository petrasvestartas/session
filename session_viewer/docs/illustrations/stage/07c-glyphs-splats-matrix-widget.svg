  <text x="116" y="202" font-family="Georgia, 'Times New Roman', serif" font-size="11.2" fill="#111111" font-weight="700" text-anchor="middle">1 triangle / dot</text>
  <text x="214" y="114" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#007bc4" font-weight="700">48 B GlyphPoint + 6 face normals</text>
  <text x="214" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111">• Culled when all neighbour faces</text>
  <text x="224" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">turn away from the eye.</text>
  <text x="214" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111">• Tapers down to 0.15× when mesh</text>
  <text x="224" y="198" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">spacing &lt; 3 diameters.</text>
  <text x="30" y="238" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">splat + splat_resolve (EDL)  &amp;  widget.wgsl private tile</text>
