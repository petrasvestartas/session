  <text x="486" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Split, Trim, Extend &amp; exact Gauss / tetrahedral measures</text>
  <text x="486" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#111111">Signed volume:  <tspan font-style="italic">V</tspan> = ⅙ ∑ ( (<tspan font-weight="700">a</tspan> − <tspan font-weight="700">o</tspan>) × (<tspan font-weight="700">b</tspan> − <tspan font-weight="700">o</tspan>) ) · (<tspan font-weight="700">c</tspan> − <tspan font-weight="700">o</tspan>)</text>
  <text x="486" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• area.rs integrates 8×8 Gauss quadrature across NURBS knot spans.</text>
  <text x="486" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#666666">• deform.rs edits mesh vertices &amp; (u, v) NURBS CVs in place at 60 Hz.</text>
