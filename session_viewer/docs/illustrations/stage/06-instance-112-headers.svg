  <text x="474" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Cofactor normal transform &amp; 6 shared headers</text>
  <text x="474" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#111111"><tspan font-weight="700">n</tspan>′ = normalize( [ <tspan font-weight="700">y × z</tspan>,  <tspan font-weight="700">z × x</tspan>,  <tspan font-weight="700">x × y</tspan> ] · <tspan font-weight="700">n</tspan> · sgn(det <tspan font-weight="700">M</tspan>) )</text>
  <text x="474" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">Preserves perpendicularity under non-uniform scale and reflection sign under mirroring.</text>
