  <text x="200" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#111111">e = unpack2x16snorm(p)</text>
  <text x="200" y="328" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#007bc4">n_z = 1 − |e_x| − |e_y|</text>
