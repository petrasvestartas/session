<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="960" height="415">
  <rect x="0.5" y="0.5" width="959" height="414" fill="#ffffff" stroke="#e4e7e8" stroke-width="1"/>
  <line x1="460.8" y1="54" x2="460.8" y2="393" stroke="#e4e7e8" stroke-width="1"/>
  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">OUT-OF-CORE CLOUDS, SHEETS AND ETAG</text>
  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Cap resident points, page <tspan fill="#007bc4">65,536</tspan>-point GPU picks, and stage live ETag reloads.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">6.06M-point cloud: 250k resident prefix + paged GPU pick</text>
  <rect x="40" y="96" width="134" height="44" rx="4" fill="#a9c9ff" stroke="#007bc4" stroke-width="1.8"/>
  <text x="107" y="116" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="700" text-anchor="middle">250k resident</text>
  <text x="107" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="10.2" fill="#111111" text-anchor="middle">octree LOD display</text>
  <rect x="180" y="96" width="246" height="44" rx="4" fill="#ff8fbd" fill-opacity="0.25" stroke="#ff2d7a" stroke-width="1.8" stroke-dasharray="5 3"/>
  <text x="303" y="116" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#ff2d7a" font-weight="700" text-anchor="middle">5.81M out-of-core HTTP Range</text>
  <text x="303" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="10.2" fill="#111111" text-anchor="middle">65,536-pt GPU pick pages → source_id</text>
  <text x="30" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">sheet_query.rs · SHM1 binary side-table Range lookup</text>
  <text x="102" y="194" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">8 B header</text>
  <text x="234" y="194" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">(u64 off, u64 len)</text>
  <text x="366" y="194" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">≤ 64 KiB entity</text>
  <rect x="40" y="200" width="124" height="38" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="102" y="222.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">SHM1 + count</text>
  <rect x="172" y="200" width="124" height="38" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="234" y="222.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">dir[id] (16 B)</text>
  <rect x="304" y="200" width="124" height="38" rx="4.5" fill="#ff5c9a" stroke="none"/>
  <text x="366" y="222.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">UTF-8 JSON</text>
  <text x="40" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111">• 2 HTTP Range reads resolve clicked 'Wall A' / 'Door B' metadata</text>
  <text x="50" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#666666">from a 50+ MB drawing sheet without parsing unused entities.</text>
  <text x="40" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#007bc4" font-weight="700">• Every Range request pins If-Match / ETag revision consistency.</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">stream.rs · CloudFields &amp; SheetFields byte-span directory</text>
  <text x="538" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">packed f32/f64</text>
  <text x="650" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">rgba bytes</text>
  <text x="762" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">0 = absent</text>
  <text x="874" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">exact u32 ID</text>
  <rect x="486" y="92" width="104" height="36" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="538" y="113.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">coords_at</text>
  <rect x="598" y="92" width="104" height="36" rx="4.5" fill="#ff5c9a" stroke="none"/>
  <text x="650" y="113.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">colors_at</text>
  <rect x="710" y="92" width="104" height="36" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="762" y="113.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">normals_at</text>
  <rect x="822" y="92" width="104" height="36" rx="4.5" fill="#00c46a" stroke="none"/>
  <text x="874" y="113.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">ids_at</text>
  <text x="486" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">Validates protobuf field boundaries &amp; array strides before Range reads.</text>
  <text x="486" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">live.rs &amp; live_revision.rs · EventSource + atomic swap</text>
  <text x="556" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">untrusted nudge</text>
  <text x="706" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">skip if identical</text>
  <text x="856" y="208" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">keep live camera</text>
  <rect x="486" y="214" width="140" height="38" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="556" y="236.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">EventSource</text>
  <rect x="636" y="214" width="140" height="38" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="706" y="236.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">ETag + SHA check</text>
  <rect x="786" y="214" width="140" height="38" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="856" y="236.6" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.6" fill="#111111" font-weight="500" text-anchor="middle">Atomic swap</text>
  <text x="486" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Relay events only set a recheck flag; relay bytes are never trusted.</text>
  <text x="486" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Identical content hashes under new ETags skip re-upload completely.</text>
  <text x="486" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#666666">• Mid-reload network failure discards staging and keeps active scene.</text>
  <rect x="0.5" y="411.5" width="959" height="3" fill="#e4e7e8"/>
  <rect x="0.5" y="411.5" width="858.95" height="3" fill="#007bc4"/>
</svg>
