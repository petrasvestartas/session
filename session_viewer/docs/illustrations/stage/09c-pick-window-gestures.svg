<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410">
  <rect x="0.5" y="0.5" width="959" height="409" fill="#ffffff" stroke="#e4e7e8" stroke-width="1"/>
  <line x1="460.8" y1="54" x2="460.8" y2="388" stroke="#e4e7e8" stroke-width="1"/>
  <text x="26" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="14.2" font-weight="700" fill="#007bc4">19×19 GPU PICK WINDOW AND GESTURES</text>
  <text x="482.8" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="13.0" fill="#111111">Render a <tspan fill="#007bc4">13×13</tspan> cursor box + <tspan fill="#007bc4">3 px</tspan> halo and stamp async readbacks.</text>
  <text x="30" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">engine/gpu/pick.rs · 19×19 cropped IdTargets window</text>
  <rect x="48" y="94" width="212" height="168" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <rect x="92" y="118" width="124" height="120" fill="#a9c9ff" fill-opacity="0.24" stroke="#007bc4" stroke-width="1.8" stroke-dasharray="4 3"/>
  <rect x="112" y="138" width="84" height="80" fill="#ffe38a" fill-opacity="0.55" stroke="#ff7a1a" stroke-width="2"/>
  <circle cx="154" cy="178" r="3.8" fill="#ff2d7a"/>
  <text x="56" y="112" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10" fill="#666666" font-weight="500">Full canvas</text>
  <text x="154" y="132" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.8" fill="#007bc4" font-weight="500" text-anchor="middle">19×19 (+3 px halo)</text>
  <text x="154" y="162" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="9.8" fill="#111111" font-weight="700" text-anchor="middle">13×13 query</text>
  <text x="274" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#ff7a1a" font-weight="700">PICK_RADIUS = 6 px</text>
  <text x="274" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#007bc4" font-weight="700">PICK_HALO   = 3 px</text>
  <text x="274" y="172" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#111111">Halo supplies neighbour</text>
  <text x="274" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#666666">depth slopes for planar</text>
  <text x="274" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#666666">ink_visibility tests!</text>
  <text x="30" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">touch.rs &amp; agent.rs · multi-touch + IME composition</text>
  <text x="42" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111">• 1 finger orbits; 2 fingers pan midpoint + pinch-zoom; 2× tap fits.</text>
  <text x="42" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#111111">• Hidden &lt;input id='command-agent'&gt; (16 px, no iOS zoom) bridges</text>
  <text x="52" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="11.4" fill="#666666">mobile keyboards while respecting IME compositionstart/end.</text>
  <text x="486" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">gesture/mod.rs · deterministic priority &amp; hysteresis</text>
  <text x="527" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">priority 1</text>
  <text x="616" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">priority 2</text>
  <text x="705" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">priority 3</text>
  <text x="794" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">priority 4</text>
  <text x="883" y="86" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">priority 5</text>
  <rect x="486" y="92" width="82" height="38" rx="4.5" fill="#e4e7e8" stroke="none"/>
  <text x="527" y="114.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">panel UI</text>
  <rect x="575" y="92" width="82" height="38" rx="4.5" fill="#ff5c9a" stroke="none"/>
  <text x="616" y="114.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">control</text>
  <rect x="664" y="92" width="82" height="38" rx="4.5" fill="#ff7a1a" stroke="none"/>
  <text x="705" y="114.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">gizmo</text>
  <rect x="753" y="92" width="82" height="38" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="794" y="114.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">object</text>
  <rect x="842" y="92" width="82" height="38" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="883" y="114.57" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#111111" font-weight="500" text-anchor="middle">box_sel</text>
  <text x="486" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Drag threshold: &gt; 10 CSS px motion (or &gt; 4 px held 200 ms).</text>
  <text x="486" y="182" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Gizmo click without drag opens floating number_box.</text>
  <text x="486" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" fill="#007bc4">Selection modes &amp; generation-stamped async poll</text>
  <text x="538" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">whole row</text>
  <text x="650" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">sub tag</text>
  <text x="762" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">FACE_TAG</text>
  <text x="874" y="234" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.5" fill="#888888" font-weight="500" text-anchor="middle">vertex / CV</text>
  <rect x="486" y="240" width="104" height="36" rx="4.5" fill="#a9c9ff" stroke="none"/>
  <text x="538" y="261.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">Object</text>
  <rect x="598" y="240" width="104" height="36" rx="4.5" fill="#ffc400" stroke="none"/>
  <text x="650" y="261.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">Edge</text>
  <rect x="710" y="240" width="104" height="36" rx="4.5" fill="#ff5c9a" stroke="none"/>
  <text x="762" y="261.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">Face</text>
  <rect x="822" y="240" width="104" height="36" rx="4.5" fill="#00c46a" stroke="none"/>
  <text x="874" y="261.67" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" font-size="10.8" fill="#111111" font-weight="500" text-anchor="middle">ControlId</text>
  <text x="486" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• 256-byte row-aligned staging buffer maps asynchronously via poll.</text>
  <text x="486" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="11.8" fill="#111111">• Monotonic generation counter discards hits superseded by orbit,</text>
  <text x="498" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="11.6" fill="#666666">Escape or a newer click before mutating Selection.</text>
  <rect x="0.5" y="406.5" width="959" height="3" fill="#e4e7e8"/>
  <rect x="0.5" y="406.5" width="656.84" height="3" fill="#007bc4"/>
