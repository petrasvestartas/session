<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="t d"><title id="t">A stroke's alpha is the area of one pixel square inside the band</title><desc id="d">The left panel shows one pixel square crossed by a capsule's two parallel edges; the part of the square inside the band is the returned alpha. The right panel shows that area as one trapezoid CDF evaluated at hw minus d and at hw plus d.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="470.5" lengthAdjust="spacingAndGlyphs">Coverage is an area, and the area is a trapezoid</text><text class="l" xml:space="preserve" x="28.0" y="74.0" textLength="145.8" lengthAdjust="spacingAndGlyphs">one pixel, one band</text><rect x="56" y="96" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="56" y="154" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="56" y="212" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="56" y="270" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="56" y="328" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="114" y="96" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="114" y="154" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="114" y="212" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="114" y="270" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="114" y="328" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="172" y="96" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="172" y="154" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="172" y="212" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="172" y="270" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="172" y="328" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="230" y="96" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="230" y="154" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="230" y="212" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="230" y="270" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="230" y="328" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="288" y="96" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="288" y="154" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="288" y="212" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="288" y="270" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><rect x="288" y="328" width="58" height="58" fill="none" stroke="#3a3a42" stroke-width="1"/><clipPath id="cbp"><rect x="172" y="212" width="58" height="58"/></clipPath><clipPath id="cgr"><rect x="56" y="96" width="290" height="290"/></clipPath><g clip-path="url(#cgr)"><polygon points="391.8,177.3 34.8,307.3 10.2,239.7 367.2,109.7" fill="#fa9ebc" opacity="0.45"/></g><polygon points="391.8,177.3 34.8,307.3 10.2,239.7 367.2,109.7" fill="#f9e08a" clip-path="url(#cbp)"/><rect x="172" y="212" width="58" height="58" fill="none" stroke="#f4f4f6" stroke-width="2.4"/><g clip-path="url(#cgr)"><path d="M13.1,276.9 L388.9,140.1" stroke="#fa9ebc" stroke-width="1.6" fill="none"/></g><circle cx="201.0" cy="241.0" r="3.2" fill="#f4f4f6"/><path class="ar" d="M201.0,241.0 L190.6,212.3"/><text class="m" xml:space="preserve" x="207.8" y="230.7" style="fill:#111111" textLength="7.5" lengthAdjust="spacingAndGlyphs">d</text><path d="M267.6,146.0 L292.2,213.6" stroke="#f4f4f6" stroke-width="1.4" fill="none"/><text class="m" xml:space="preserve" x="302.2" y="229.6" textLength="45.6" lengthAdjust="spacingAndGlyphs">2 · hw</text><text class="s" xml:space="preserve" x="56.0" y="412.0" style="fill:#e8ac00" textLength="373.5" lengthAdjust="spacingAndGlyphs">the yellow area IS the returned alpha, not a sample of a ramp</text><text class="m" xml:space="preserve" x="56.0" y="432.0" textLength="376.3" lengthAdjust="spacingAndGlyphs">g = v / d, the unit gradient of the distance field</text><text class="l" xml:space="preserve" x="430.0" y="74.0" textLength="236.5" lengthAdjust="spacingAndGlyphs">the same pixel projected onto g</text><polygon points="528.6,300 646.2,150 763.8,150 881.4,300" fill="#e4e4e7"/><path d="M460,300 L950,300" stroke="#f4f4f6" stroke-width="1.4" fill="none"/><text class="m" xml:space="preserve" x="958.0" y="305.0" textLength="7.5" lengthAdjust="spacingAndGlyphs">t</text><path d="M528.6,300 L528.6,307" stroke="#f4f4f6" stroke-width="1.4"/><text class="m" xml:space="preserve" x="528.6" y="324.0" text-anchor="middle" textLength="22.6" lengthAdjust="spacingAndGlyphs">−hi</text><path d="M646.2,300 L646.2,307" stroke="#f4f4f6" stroke-width="1.4"/><text class="m" xml:space="preserve" x="646.2" y="324.0" text-anchor="middle" textLength="22.6" lengthAdjust="spacingAndGlyphs">−lo</text><path d="M763.8,300 L763.8,307" stroke="#f4f4f6" stroke-width="1.4"/><text class="m" xml:space="preserve" x="763.8" y="324.0" text-anchor="middle" textLength="15.1" lengthAdjust="spacingAndGlyphs">lo</text><path d="M881.4,300 L881.4,307" stroke="#f4f4f6" stroke-width="1.4"/><text class="m" xml:space="preserve" x="881.4" y="324.0" text-anchor="middle" textLength="15.1" lengthAdjust="spacingAndGlyphs">hi</text><path d="M724.6,124.0 L724.6,300.0" stroke="#fa9ebc" stroke-width="1.8" fill="none"/><circle cx="724.6" cy="300.0" r="3.4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="724.6" y="116.0" text-anchor="middle" style="fill:#fa9ebc" textLength="45.2" lengthAdjust="spacingAndGlyphs">hw − d</text><path d="M847.1,124.0 L847.1,300.0" stroke="#fa9ebc" stroke-width="1.8" fill="none"/><circle cx="847.1" cy="300.0" r="3.4" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="847.1" y="116.0" text-anchor="middle" style="fill:#fa9ebc" textLength="45.2" lengthAdjust="spacingAndGlyphs">hw + d</text><text class="m" xml:space="preserve" x="460.0" y="360.0" textLength="368.8" lengthAdjust="spacingAndGlyphs">band_area = box_cdf(hw − d) + box_cdf(hw + d) − 1</text><rect data-box="0" x="460.0" y="376.0" width="356.8" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="472.0" y="400.0" style="fill:#111111" data-box="0" textLength="213.9" lengthAdjust="spacingAndGlyphs">the trapezoid is the gradient</text><text class="m" xml:space="preserve" x="472.0" y="424.0" style="fill:#111111" data-box="0" textLength="301.0" lengthAdjust="spacingAndGlyphs">hi = (|g.x| + |g.y|) / 2   half its base</text><text class="m" xml:space="preserve" x="472.0" y="444.0" style="fill:#111111" data-box="0" textLength="331.1" lengthAdjust="spacingAndGlyphs">lo = ||g.x| − |g.y|| / 2   half its flat top</text><text class="s" xml:space="preserve" x="472.0" y="464.0" style="fill:#455b6b" data-box="0" textLength="189.7" lengthAdjust="spacingAndGlyphs">axis-aligned: hi = lo = 0.5, a box</text><text class="s" xml:space="preserve" x="472.0" y="484.0" style="fill:#455b6b" data-box="0" textLength="213.6" lengthAdjust="spacingAndGlyphs">at 45°: hi = 0.7071, lo = 0, a triangle</text><text class="s" xml:space="preserve" x="28.0" y="520.0" style="fill:#c9ccd6" textLength="808.6" lengthAdjust="spacingAndGlyphs">A distance ramp is sampled at pixel centres, spaced cos(angle) apart, so it beats with the line's subpixel phase: 22.2 % at a 1.5 px pen.</text><text class="s" xml:space="preserve" x="28.0" y="540.0" style="fill:#c9ccd6" textLength="934.4" lengthAdjust="spacingAndGlyphs">Pixel boxes tile the plane, so summing their true areas cannot beat. FILTER_REACH = 0.70711 is half a pixel's diagonal, and the quad grows by exactly that.</text></svg>
