<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1002 288" role="img" aria-labelledby="t d"><title id="t">Tutorial 1 startup and white-frame submission loop</title><desc id="d">DOM #canvas CSS dimensions times devicePixelRatio initialize wgpu SurfaceConfiguration; async device::open posts Ready via EventLoopProxy; Frame::draw records LoadOp::Clear(WHITE), drops the pass borrow, submits to queue and presents.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="626.2" lengthAdjust="spacingAndGlyphs">Async GPU startup · CPU command recording · queue presentation</text><rect data-box="0" x="28.0" y="72.0" width="192.1" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="131.1" lengthAdjust="spacingAndGlyphs">1 · #canvas + winit</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="144.3" lengthAdjust="spacingAndGlyphs">client_w * dpr pixels</text><text class="m" xml:space="preserve" x="40.0" y="140.0" style="fill:#111111" data-box="0" textLength="144.3" lengthAdjust="spacingAndGlyphs">EventLoopProxy&lt;Ready&gt;</text><rect data-box="1" x="315.9" y="72.0" width="167.7" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="327.9" y="96.0" style="fill:#111111" data-box="1" textLength="109.9" lengthAdjust="spacingAndGlyphs">2 · device::open</text><text class="m" xml:space="preserve" x="327.9" y="120.0" style="fill:#111111" data-box="1" textLength="130.6" lengthAdjust="spacingAndGlyphs">256 MiB storage cap</text><text class="s" xml:space="preserve" x="327.9" y="140.0" style="fill:#455b6b" data-box="1" textLength="113.2" lengthAdjust="spacingAndGlyphs">sRGB + error Mutex</text><rect data-box="2" x="538.1" y="72.0" width="183.3" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="550.1" y="96.0" style="fill:#111111" data-box="2" textLength="150.2" lengthAdjust="spacingAndGlyphs">3 · CommandEncoder</text><text class="m" xml:space="preserve" x="550.1" y="120.0" style="fill:#111111" data-box="2" textLength="137.5" lengthAdjust="spacingAndGlyphs">LoadOp::Clear(WHITE)</text><text class="s" xml:space="preserve" x="550.1" y="140.0" style="fill:#455b6b" data-box="2" textLength="118.5" lengthAdjust="spacingAndGlyphs">drop _pass → finish()</text><rect data-box="3" x="782.7" y="72.0" width="192.1" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="794.7" y="96.0" style="fill:#111111" data-box="3" textLength="138.6" lengthAdjust="spacingAndGlyphs">4 · Queue + Surface</text><text class="m" xml:space="preserve" x="794.7" y="120.0" style="fill:#111111" data-box="3" textLength="130.6" lengthAdjust="spacingAndGlyphs">queue.submit([buf])</text><text class="m" xml:space="preserve" x="794.7" y="140.0" style="fill:#111111" data-box="3" textLength="110.0" lengthAdjust="spacingAndGlyphs">output.present()</text><path class="ar" d="M220.1,113.5 L315.9,113.5"/><text class="s" xml:space="preserve" x="268.0" y="106.5" text-anchor="middle" textLength="68.5" lengthAdjust="spacingAndGlyphs">spawn_local</text><path class="ar" d="M483.6,113.5 L538.1,113.5"/><text class="s" xml:space="preserve" x="510.9" y="106.5" text-anchor="middle" textLength="34.8" lengthAdjust="spacingAndGlyphs">Ready</text><path class="ar" d="M721.4,113.5 L782.7,113.5"/><text class="s" xml:space="preserve" x="752.0" y="106.5" text-anchor="middle" textLength="39.3" lengthAdjust="spacingAndGlyphs">submit</text><rect data-box="4" x="28.0" y="183.0" width="946.9" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="482.4" lengthAdjust="spacingAndGlyphs">Three invariants introduced in Tutorial 1 and kept through Tutorial 9</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="705.5" lengthAdjust="spacingAndGlyphs">Size the surface from DOM clientWidth × devicePixelRatio immediately — winit's first resize can arrive after device creation.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="712.3" lengthAdjust="spacingAndGlyphs">Drop _pass before encoder.finish() to release the mutable borrow, and return false so static frames sleep until input or resize.</text></svg>
