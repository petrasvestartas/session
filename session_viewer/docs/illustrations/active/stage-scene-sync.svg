<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1018 288" role="img" aria-labelledby="t d"><title id="t">Real-scene stage frame order and force-density equilibrium</title><desc id="d">Tick stage clock -&gt; apply orthographic camera -&gt; build 2x4 world-to-slide lens -&gt; paint equations and projected labels -&gt; sync kernel geometry rows in Scene3.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="560.9" lengthAdjust="spacingAndGlyphs">One coordinate bridge · 3D kernel scene ↔ 2D math column</text><rect data-box="0" x="28.0" y="72.0" width="182.8" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="104.0" lengthAdjust="spacingAndGlyphs">1 · Clock + Net</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="144.3" lengthAdjust="spacingAndGlyphs">D_N x_N = p − D_F x_F</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="114.1" lengthAdjust="spacingAndGlyphs">solves free XYZ + M</text><rect data-box="1" x="268.8" y="72.0" width="197.9" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="280.8" y="96.0" style="fill:#111111" data-box="1" textLength="121.2" lengthAdjust="spacingAndGlyphs">2 · Camera + lens</text><text class="s" xml:space="preserve" x="280.8" y="120.0" style="fill:#455b6b" data-box="1" textLength="135.3" lengthAdjust="spacingAndGlyphs">orthographic scene half</text><text class="m" xml:space="preserve" x="280.8" y="140.0" style="fill:#111111" data-box="1" textLength="158.1" lengthAdjust="spacingAndGlyphs">2 × 4 world → slide map</text><rect data-box="2" x="535.0" y="72.0" width="175.6" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="547.0" y="96.0" style="fill:#111111" data-box="2" textLength="100.9" lengthAdjust="spacingAndGlyphs">3 · Stage paint</text><text class="s" xml:space="preserve" x="547.0" y="120.0" style="fill:#455b6b" data-box="2" textLength="127.0" lengthAdjust="spacingAndGlyphs">TeX + projected labels</text><text class="s" xml:space="preserve" x="547.0" y="140.0" style="fill:#455b6b" data-box="2" textLength="122.2" lengthAdjust="spacingAndGlyphs">fly-outs across halves</text><rect data-box="3" x="792.6" y="72.0" width="197.9" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="804.6" y="96.0" style="fill:#111111" data-box="3" textLength="109.6" lengthAdjust="spacingAndGlyphs">4 · Scene3::sync</text><text class="m" xml:space="preserve" x="804.6" y="120.0" style="fill:#111111" data-box="3" textLength="158.1" lengthAdjust="spacingAndGlyphs">Point · Line · Polyline</text><text class="s" xml:space="preserve" x="804.6" y="140.0" style="fill:#455b6b" data-box="3" textLength="140.9" lengthAdjust="spacingAndGlyphs">updates 112 B GPU rows</text><path class="ar" d="M210.8,113.5 L268.8,113.5"/><text class="s" xml:space="preserve" x="239.8" y="106.5" text-anchor="middle" textLength="29.3" lengthAdjust="spacingAndGlyphs">solve</text><path class="ar" d="M466.8,113.5 L535.0,113.5"/><text class="s" xml:space="preserve" x="500.9" y="106.5" text-anchor="middle" textLength="45.0" lengthAdjust="spacingAndGlyphs">anchors</text><path class="ar" d="M710.6,113.5 L792.6,113.5"/><text class="s" xml:space="preserve" x="751.6" y="106.5" text-anchor="middle" textLength="46.3" lengthAdjust="spacingAndGlyphs">Spatial[]</text><rect data-box="4" x="28.0" y="183.0" width="962.5" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="323.0" lengthAdjust="spacingAndGlyphs">Why sync runs AFTER paint in the same frame</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="688.4" lengthAdjust="spacingAndGlyphs">Presentation::paint evaluates current Spatial descriptions at clock t; Scene3::sync then updates row transforms and reveal</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="711.1" lengthAdjust="spacingAndGlyphs">before State::render encodes GPU passes — zero 1-frame lag, and moving a cable updates one 112 B row instead of a mesh.</text></svg>
