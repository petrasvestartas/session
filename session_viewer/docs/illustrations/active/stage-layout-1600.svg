<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 412" role="img" aria-labelledby="t d"><title id="t">1600x900 presentation slide layout, white-paper graphic-statics style and upright portrait stacking</title><desc id="d">Each stage chapter shares a 1600x900 logical slide on white paper (#ffffff default, toggled to #000000 with T), split at split=0.46 (x=736) between the clipped 3D WebGPU scene half and the opaque bg derivation column, with accent blue titles and 4 px whole-deck progress bar, non-overlapping 650 ms say narration, ETH Zurich | BRG marks, and Frame::stacked portrait reflow when height &gt;= 1.1 * width.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="711.6" lengthAdjust="spacingAndGlyphs">1600 × 900 presentation layout · split = 0.46 (x = 736) · white-paper default</text><rect x="28" y="62" width="640" height="304" rx="6" fill="#ffffff" stroke="#8a9099" stroke-width="1.5"/><line x1="322" y1="96" x2="322" y2="344" stroke="#d0d6dc" stroke-width="1.4"/><text class="s" xml:space="preserve" x="44.0" y="86.0" style="fill:#0066a6" textLength="154.2" lengthAdjust="spacingAndGlyphs">FORCE DENSITY MATRICES</text><text class="s" xml:space="preserve" x="44.0" y="104.0" style="fill:#4c535d" textLength="160.1" lengthAdjust="spacingAndGlyphs">[40, 40] · 23 px bold · accent</text><text class="s" xml:space="preserve" x="338.0" y="86.0" style="fill:#111111" textLength="212.9" lengthAdjust="spacingAndGlyphs">say: step sentence ($math$, **bold**)</text><text class="s" xml:space="preserve" x="338.0" y="104.0" style="fill:#0066a6" textLength="208.2" lengthAdjust="spacingAndGlyphs">[769.6, 40] · 650 ms out → +6 px rise</text><line x1="176" y1="244" x2="86" y2="288" stroke="#111111" stroke-width="2.1"/><line x1="176" y1="244" x2="148" y2="176" stroke="#111111" stroke-width="2.1"/><line x1="176" y1="244" x2="268" y2="280" stroke="#111111" stroke-width="2.1"/><line x1="176" y1="244" x2="142" y2="264" stroke="#111111" stroke-width="2.1"/><line x1="176" y1="244" x2="176" y2="280" stroke="#007bc4" stroke-width="2.2"/><polygon points="172.4,278 179.6,278 176,296" fill="#007bc4"/><circle cx="86" cy="288" r="4.2" fill="#ffffff" stroke="#111111" stroke-width="1.8"/><text class="s" xml:space="preserve" x="79.0" y="281.0" text-anchor="end" style="fill:#111111" textLength="11.9" lengthAdjust="spacingAndGlyphs">n₁</text><circle cx="148" cy="176" r="4.2" fill="#ffffff" stroke="#111111" stroke-width="1.8"/><text class="s" xml:space="preserve" x="156.0" y="173.0" style="fill:#111111" textLength="12.1" lengthAdjust="spacingAndGlyphs">n₃</text><circle cx="268" cy="280" r="4.2" fill="#ffffff" stroke="#111111" stroke-width="1.8"/><text class="s" xml:space="preserve" x="276.0" y="276.0" style="fill:#111111" textLength="11.9" lengthAdjust="spacingAndGlyphs">n₄</text><circle cx="142" cy="264" r="4.2" fill="#ffffff" stroke="#111111" stroke-width="1.8"/><text class="s" xml:space="preserve" x="146.0" y="280.0" style="fill:#111111" textLength="12.1" lengthAdjust="spacingAndGlyphs">n₂</text><circle cx="176" cy="244" r="4.5" fill="#ffffff" stroke="#111111" stroke-width="1.9"/><text class="s" xml:space="preserve" x="185.0" y="237.0" style="fill:#111111" textLength="79.2" lengthAdjust="spacingAndGlyphs">n₀ (open ring)</text><text class="s" xml:space="preserve" x="185.0" y="282.0" style="fill:#0066a6" textLength="44.1" lengthAdjust="spacingAndGlyphs">p (load)</text><text class="s" xml:space="preserve" x="44.0" y="346.0" style="fill:#0066a6" textLength="181.6" lengthAdjust="spacingAndGlyphs">WebGPU 3D (0..736 px, clipped)</text><rect x="338" y="118" width="314" height="208" rx="4" fill="none" stroke="#b8c0c8" stroke-width="1.1" stroke-dasharray="4 3"/><text class="s" xml:space="preserve" x="348.0" y="136.0" style="fill:#4c535d" textLength="248.0" lengthAdjust="spacingAndGlyphs">TOP = 150 · x = 769.6..1544 (MARGIN = 56)</text><text class="m" xml:space="preserve" x="348.0" y="161.0" style="fill:#111111" textLength="254.3" lengthAdjust="spacingAndGlyphs">eq / tex (36 px): '=' axis + {{part}}</text><text class="m" xml:space="preserve" x="348.0" y="187.0" style="fill:#0066a6" textLength="233.7" lengthAdjust="spacingAndGlyphs">matrix / row (30 px): C → C_N, C_F</text><text class="m" xml:space="preserve" x="348.0" y="213.0" style="fill:#b81858" textLength="268.0" lengthAdjust="spacingAndGlyphs">drawing: (flat.rs) 2D polygons &amp; arrows</text><text class="m" xml:space="preserve" x="348.0" y="239.0" style="fill:#111111" textLength="274.9" lengthAdjust="spacingAndGlyphs">text 25 · label 24 · say 23 · code 19 px</text><text class="s" xml:space="preserve" x="348.0" y="265.0" style="fill:#4c535d" textLength="238.0" lengthAdjust="spacingAndGlyphs">overflow &gt; 680 px → 650 ms upward shift</text><text class="s" xml:space="preserve" x="652.0" y="346.0" text-anchor="end" style="fill:#111111" textLength="167.7" lengthAdjust="spacingAndGlyphs">ETH zürich | BRG  (21 px · ink)</text><rect x="29" y="360" width="638" height="5" fill="#e4e7e8"/><rect x="29" y="360" width="281" height="5" fill="#007bc4"/><rect x="692" y="62" width="172" height="304" rx="8" fill="#181b24" stroke="#5b6278" stroke-width="1.5"/><line x1="693" y1="206" x2="863" y2="206" stroke="#4a4e68" stroke-width="1.2"/><text class="m" xml:space="preserve" x="778.0" y="86.0" text-anchor="middle" style="fill:#e8ac00" textLength="96.2" lengthAdjust="spacingAndGlyphs">Frame::stacked</text><text class="s" xml:space="preserve" x="778.0" y="106.0" text-anchor="middle" style="fill:#b9b9bd" textLength="124.4" lengthAdjust="spacingAndGlyphs">h &gt;= 1.1 w (390×844)</text><text class="s" xml:space="preserve" x="778.0" y="148.0" text-anchor="middle" style="fill:#bdbfe8" textLength="98.1" lengthAdjust="spacingAndGlyphs">Top: 3D WebGPU</text><text class="s" xml:space="preserve" x="778.0" y="170.0" text-anchor="middle" style="fill:#c9ccd6" textLength="100.8" lengthAdjust="spacingAndGlyphs">hold-drag = orbit</text><text class="s" xml:space="preserve" x="778.0" y="234.0" text-anchor="middle" style="fill:#f4f6fa" textLength="91.8" lengthAdjust="spacingAndGlyphs">Bottom: column</text><text class="s" xml:space="preserve" x="778.0" y="258.0" text-anchor="middle" style="fill:#fa9ebc" textLength="100.8" lengthAdjust="spacingAndGlyphs">say + eq + matrix</text><text class="s" xml:space="preserve" x="778.0" y="282.0" text-anchor="middle" style="fill:#c9ccd6" textLength="103.9" lengthAdjust="spacingAndGlyphs">swipe ←/→ = step</text><text class="s" xml:space="preserve" x="854.0" y="350.0" text-anchor="end" style="fill:#f4f6fa" textLength="56.8" lengthAdjust="spacingAndGlyphs">ETH | BRG</text><rect x="693" y="360" width="170" height="5" fill="#3f4548"/><rect x="693" y="360" width="76" height="5" fill="#2f8bff"/><rect data-box="0" x="888.0" y="62.0" width="304.0" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="900.0" y="86.0" style="fill:#111111" data-box="0" textLength="173.2" lengthAdjust="spacingAndGlyphs">Local vs live URL routing</text><text class="m" xml:space="preserve" x="900.0" y="110.0" style="fill:#111111" data-box="0" textLength="206.2" lengthAdjust="spacingAndGlyphs">?stage=decks/&lt;name&gt;/index.yaml</text><text class="m" xml:space="preserve" x="900.0" y="130.0" style="fill:#111111" data-box="0" textLength="219.9" lengthAdjust="spacingAndGlyphs">&amp;data=off → local Trunk (decks/)</text><text class="m" xml:space="preserve" x="900.0" y="150.0" style="fill:#111111" data-box="0" textLength="199.3" lengthAdjust="spacingAndGlyphs">6 decks · 27 chapters shipped</text><text class="m" xml:space="preserve" x="900.0" y="170.0" style="fill:#111111" data-box="0" textLength="213.1" lengthAdjust="spacingAndGlyphs">&amp;chapter=1..7&amp;step=N&amp;theme=dark</text><rect data-box="1" x="888.0" y="201.0" width="304.0" height="123.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="900.0" y="225.0" style="fill:#111111" data-box="1" textLength="195.0" lengthAdjust="spacingAndGlyphs">Zero-chrome stage controls</text><text class="m" xml:space="preserve" x="900.0" y="249.0" style="fill:#111111" data-box="1" textLength="213.1" lengthAdjust="spacingAndGlyphs">#viewer-docs removed on ?stage=</text><text class="s" xml:space="preserve" x="900.0" y="269.0" style="fill:#455b6b" data-box="1" textLength="200.4" lengthAdjust="spacingAndGlyphs">Left half: drag orbit, wheel, 2× click</text><text class="s" xml:space="preserve" x="900.0" y="289.0" style="fill:#455b6b" data-box="1" textLength="170.6" lengthAdjust="spacingAndGlyphs">Right half: click / Space / ← →</text><text class="m" xml:space="preserve" x="900.0" y="309.0" style="fill:#111111" data-box="1" textLength="240.5" lengthAdjust="spacingAndGlyphs">1..9 chapter · ↑/↓ slide · T ground</text><text class="s" xml:space="preserve" x="28.0" y="390.0" style="fill:#c9ccd6" textLength="947.3" lengthAdjust="spacingAndGlyphs">index.html preloads NewCMMath-Book, NewCM10-Book, NewCM10-Bold and NewCMMono10-Book plus index.yaml and all chapter YAMLs while WASM downloads.</text></svg>
