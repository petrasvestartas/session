<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1051 288" role="img" aria-labelledby="t d"><title id="t">Command dock state versus one-frame command output</title><desc id="d">CommandLine persists input text, history, completion candidates and focus across frames; view::show returns Option&lt;String&gt; once when Enter or an option chip commits.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="501.1" lengthAdjust="spacingAndGlyphs">Persistent input state · one-frame returned command</text><rect data-box="0" x="28.0" y="72.0" width="182.5" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="97.8" lengthAdjust="spacingAndGlyphs">WindowEvent</text><text class="s" xml:space="preserve" x="40.0" y="120.0" style="fill:#455b6b" data-box="0" textLength="99.3" lengthAdjust="spacingAndGlyphs">keys, Tab, ↑/↓, Esc</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="134.6" lengthAdjust="spacingAndGlyphs">pointer on option chips</text><rect data-box="1" x="271.8" y="72.0" width="201.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="283.8" y="96.0" style="fill:#111111" data-box="1" textLength="162.8" lengthAdjust="spacingAndGlyphs">CommandLine · mod.rs</text><text class="s" xml:space="preserve" x="283.8" y="120.0" style="fill:#455b6b" data-box="1" textLength="127.5" lengthAdjust="spacingAndGlyphs">persists across frames:</text><text class="m" xml:space="preserve" x="283.8" y="140.0" style="fill:#111111" data-box="1" textLength="144.3" lengthAdjust="spacingAndGlyphs">buf · history · focus</text><rect data-box="2" x="530.8" y="72.0" width="201.0" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="542.8" y="96.0" style="fill:#111111" data-box="2" textLength="138.3" lengthAdjust="spacingAndGlyphs">view::show · view.rs</text><text class="s" xml:space="preserve" x="542.8" y="120.0" style="fill:#455b6b" data-box="2" textLength="149.2" lengthAdjust="spacingAndGlyphs">paints bottom bar + chips</text><text class="s" xml:space="preserve" x="542.8" y="140.0" style="fill:#455b6b" data-box="2" textLength="135.4" lengthAdjust="spacingAndGlyphs">returns Option&lt;String&gt;</text><rect data-box="3" x="813.8" y="72.0" width="209.8" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="825.8" y="96.0" style="fill:#111111" data-box="3" textLength="147.5" lengthAdjust="spacingAndGlyphs">Caller (1× execution)</text><text class="s" xml:space="preserve" x="825.8" y="120.0" style="fill:#455b6b" data-box="3" textLength="142.7" lengthAdjust="spacingAndGlyphs">runs Hello / Color / Clear</text><text class="s" xml:space="preserve" x="825.8" y="140.0" style="fill:#455b6b" data-box="3" textLength="138.1" lengthAdjust="spacingAndGlyphs">never re-runs on redraw</text><path class="ar" d="M210.5,113.5 L271.8,113.5"/><text class="s" xml:space="preserve" x="241.1" y="106.5" text-anchor="middle" textLength="37.1" lengthAdjust="spacingAndGlyphs">events</text><path class="ar" d="M472.8,113.5 L530.8,113.5"/><text class="s" xml:space="preserve" x="501.8" y="106.5" text-anchor="middle" textLength="27.8" lengthAdjust="spacingAndGlyphs">state</text><path class="ar" d="M731.8,113.5 L813.8,113.5"/><text class="s" xml:space="preserve" x="772.8" y="106.5" text-anchor="middle" textLength="65.2" lengthAdjust="spacingAndGlyphs">Some(cmd)</text><rect data-box="4" x="28.0" y="183.0" width="995.7" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="271.0" lengthAdjust="spacingAndGlyphs">Why state and execution stay separate</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="674.5" lengthAdjust="spacingAndGlyphs">Redrawing a frame must never execute the last command twice; Option&lt;String&gt; is consumed once after egui finishes.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="645.5" lengthAdjust="spacingAndGlyphs">The Commands trait supplies vocabulary, prefix completion and option chips (Blue, Pink) without scene coupling.</text></svg>
