<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1003 288" role="img" aria-labelledby="t d"><title id="t">Document identity, display rows and multi-lane GPU footprints</title><desc id="d">FileDoc wraps Rc&lt;Session&gt; with a file transform; (doc_idx, GUID) maps to a stable display row while Footprint tracks relocating vertex/stroke spans across GPU lanes.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="592.4" lengthAdjust="spacingAndGlyphs">Stable (doc_idx, GUID) row identity · relocatable GPU Footprint</text><rect data-box="0" x="28.0" y="72.0" width="189.4" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="120.0" lengthAdjust="spacingAndGlyphs">FileDoc · scene.rs</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="130.6" lengthAdjust="spacingAndGlyphs">Rc&lt;Session&gt; + Xform</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="145.8" lengthAdjust="spacingAndGlyphs">2 placements share 1 doc</text><rect data-box="1" x="271.8" y="72.0" width="189.4" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="283.8" y="96.0" style="fill:#111111" data-box="1" textLength="110.3" lengthAdjust="spacingAndGlyphs">(doc_idx, GUID)</text><text class="m" xml:space="preserve" x="283.8" y="120.0" style="fill:#111111" data-box="1" textLength="123.7" lengthAdjust="spacingAndGlyphs">guid_to_row lookup</text><text class="s" xml:space="preserve" x="283.8" y="140.0" style="fill:#455b6b" data-box="1" textLength="139.6" lengthAdjust="spacingAndGlyphs">stable across edits/undo</text><rect data-box="2" x="507.2" y="72.0" width="213.1" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="519.2" y="96.0" style="fill:#111111" data-box="2" textLength="129.2" lengthAdjust="spacingAndGlyphs">Footprint · rows.rs</text><text class="m" xml:space="preserve" x="519.2" y="120.0" style="fill:#111111" data-box="2" textLength="171.8" lengthAdjust="spacingAndGlyphs">One · Many · Cloud · None</text><text class="s" xml:space="preserve" x="519.2" y="140.0" style="fill:#455b6b" data-box="2" textLength="155.7" lengthAdjust="spacingAndGlyphs">arena / pipe / ribbon spans</text><rect data-box="3" x="774.7" y="72.0" width="201.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="786.7" y="96.0" style="fill:#111111" data-box="3" textLength="147.6" lengthAdjust="spacingAndGlyphs">Hierarchy · 128/page</text><text class="s" xml:space="preserve" x="786.7" y="120.0" style="fill:#455b6b" data-box="3" textLength="100.7" lengthAdjust="spacingAndGlyphs">flat pre-order Vec</text><text class="m" xml:space="preserve" x="786.7" y="140.0" style="fill:#111111" data-box="3" textLength="130.6" lengthAdjust="spacingAndGlyphs">depth · subtree_end</text><path class="ar" d="M217.4,113.5 L271.8,113.5"/><text class="s" xml:space="preserve" x="244.6" y="106.5" text-anchor="middle" textLength="30.9" lengthAdjust="spacingAndGlyphs">index</text><path class="ar" d="M461.2,113.5 L507.2,113.5"/><text class="s" xml:space="preserve" x="484.2" y="106.5" text-anchor="middle" textLength="21.5" lengthAdjust="spacingAndGlyphs">row</text><path class="ar" d="M720.2,113.5 L774.7,113.5"/><text class="s" xml:space="preserve" x="747.5" y="106.5" text-anchor="middle" textLength="31.6" lengthAdjust="spacingAndGlyphs">panel</text><rect data-box="4" x="28.0" y="183.0" width="947.7" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="355.1" lengthAdjust="spacingAndGlyphs">Why GUID alone cannot be the viewer's object key</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="774.0" lengthAdjust="spacingAndGlyphs">Loading the same .pb twice under two manifest transforms shares Rc&lt;Session&gt;; (doc_idx, GUID) hides or moves one placement cleanly.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="719.8" lengthAdjust="spacingAndGlyphs">Separating row ID from Footprint lets 16 MiB compaction repack GPU buffers without invalidating selection or layer overrides.</text></svg>
