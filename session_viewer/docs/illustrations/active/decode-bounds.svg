<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 933 288" role="img" aria-labelledby="t d"><title id="t">Bounded protobuf validation, conversion and cooperative yielding</title><desc id="d">Raw bytes pass four explicit gates: 512 MiB body cap, wire-tag/varint validation, 2,000,000 geometry object counter, and an explicit 64-level tree stack, yielding to the browser every 2,048 items.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="427.5" lengthAdjust="spacingAndGlyphs">Four explicit bounds before any scene upload</text><rect data-box="0" x="28.0" y="72.0" width="175.6" height="83.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="93.6" lengthAdjust="spacingAndGlyphs">1 · Body limit</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="96.2" lengthAdjust="spacingAndGlyphs">len &lt;= 512 MiB</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="131.5" lengthAdjust="spacingAndGlyphs">larger clouds → stream</text><rect data-box="1" x="258.0" y="72.0" width="161.8" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="270.0" y="96.0" style="fill:#111111" data-box="1" textLength="104.0" lengthAdjust="spacingAndGlyphs">2 · Wire reader</text><text class="m" xml:space="preserve" x="270.0" y="120.0" style="fill:#111111" data-box="1" textLength="110.0" lengthAdjust="spacingAndGlyphs">validate::varint</text><text class="s" xml:space="preserve" x="270.0" y="140.0" style="fill:#455b6b" data-box="1" textLength="122.2" lengthAdjust="spacingAndGlyphs">checked field bounds</text><rect data-box="2" x="474.3" y="72.0" width="183.3" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="486.3" y="96.0" style="fill:#111111" data-box="2" textLength="120.8" lengthAdjust="spacingAndGlyphs">3 · Kernel objects</text><text class="m" xml:space="preserve" x="486.3" y="120.0" style="fill:#111111" data-box="2" textLength="123.7" lengthAdjust="spacingAndGlyphs">&lt;= 2,000,000 items</text><text class="m" xml:space="preserve" x="486.3" y="140.0" style="fill:#111111" data-box="2" textLength="144.3" lengthAdjust="spacingAndGlyphs">Rc shared in GUID map</text><rect data-box="3" x="709.6" y="72.0" width="196.2" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="721.6" y="96.0" style="fill:#111111" data-box="3" textLength="91.0" lengthAdjust="spacingAndGlyphs">4 · Tree stack</text><text class="s" xml:space="preserve" x="721.6" y="120.0" style="fill:#455b6b" data-box="3" textLength="143.0" lengthAdjust="spacingAndGlyphs">explicit Vec, depth &lt;= 64</text><text class="s" xml:space="preserve" x="721.6" y="140.0" style="fill:#455b6b" data-box="3" textLength="141.7" lengthAdjust="spacingAndGlyphs">no unbounded recursion</text><path class="ar" d="M203.6,113.5 L258.0,113.5"/><text class="s" xml:space="preserve" x="230.8" y="106.5" text-anchor="middle" textLength="30.7" lengthAdjust="spacingAndGlyphs">bytes</text><path class="ar" d="M419.8,113.5 L474.3,113.5"/><text class="s" xml:space="preserve" x="447.1" y="106.5" text-anchor="middle" textLength="29.7" lengthAdjust="spacingAndGlyphs">prost</text><path class="ar" d="M657.6,113.5 L709.6,113.5"/><text class="s" xml:space="preserve" x="683.6" y="106.5" text-anchor="middle" textLength="22.5" lengthAdjust="spacingAndGlyphs">tree</text><rect x="28" y="72" width="175.6" height="83.0" rx="4" fill="none" stroke="#e07a26" stroke-width="1.8" stroke-dasharray="7 5"/><rect data-box="4" x="28.0" y="183.0" width="877.8" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="344.8" lengthAdjust="spacingAndGlyphs">Cooperative browser responsiveness (yielding.rs)</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="734.5" lengthAdjust="spacingAndGlyphs">Every 2,048 decoded records, wasm awaits a zero-millisecond browser timer (yield_now) so input and status frames never freeze.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="727.9" lengthAdjust="spacingAndGlyphs">Unknown valid protobuf fields skip cleanly via next-offset; truncated varints or out-of-range mesh indices fail with the filename.</text></svg>
