<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 376" role="img" aria-labelledby="t d"><title id="t">Dual-ground graphic-statics palette, co-highlighted matrix cells, open-ring nodes and 6-stop force ramp</title><desc id="d">theme_palette defaults to Theme::Light (#ffffff) and swaps to Theme::Dark (#000000) on T; numbers stay dark inside sign/yellow cells while titles and labels highlight in accent blue, vectors use 24x0.30 arrowheads, and show: forces maps 6 rank stops.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="645.5" lengthAdjust="spacingAndGlyphs">Graphic-statics dual-ground palette (white default, T swaps to black)</text><text class="s" xml:space="preserve" x="28.0" y="62.0" style="fill:#c9ccd6" textLength="728.6" lengthAdjust="spacingAndGlyphs">Decks name semantic roles (ink, load, accent, pos, neg, yellow, blue_band, pink_band) so T flips paper ↔ black at the same step.</text><rect x="28" y="80" width="186" height="122" rx="6" fill="#181b24" stroke="#4a4e68" stroke-width="1.2"/><text class="m" xml:space="preserve" x="38.0" y="100.0" style="fill:#f4f6fa" textLength="96.2" lengthAdjust="spacingAndGlyphs">bg / ink / bar</text><rect x="38" y="110" width="166" height="28" rx="4" fill="#ffffff" stroke="#8a9099" stroke-width="1"/><circle cx="52" cy="124" r="7" fill="#111111" stroke="#111111" stroke-width="0.7"/><text class="s" xml:spa