<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 321" role="img" aria-labelledby="t d"><title id="t">112-byte Instance row and 16-byte camera-relative translation</title><desc id="d">Every scene object occupies one 112-byte Instance row plus one 16-byte vec4 translation rebased around the camera anchor. Rust #[repr(C)] and WGSL scene.wgsl share exact field offsets.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="496.2" lengthAdjust="spacingAndGlyphs">112 bytes per object row · exact Rust ↔ WGSL mirror</text><text class="l" xml:space="preserve" x="28.0" y="66.0" textLength="498.3" lengthAdjust="spacingAndGlyphs">Instance (src/engine/gpu/instance/layout.rs ↔ src/shaders/scene.wgsl)</text><rect data-box="0" x="28.0" y="84" width="196.0" height="58" rx="5" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="40.0" y="106.0" style="fill:#111111" data-box="0" textLength="61.9" lengthAdjust="spacingAndGlyphs">0 · model</text><text class="s" xml:space="preserve" x="40.0" y="129.0" style="fill:#455b6b" data-box="0" textLength="81.3" lengthAdjust="spacingAndGlyphs">[f32; 16] · 64 B</text><rect data-box="1" x="232.0" y="84" width="154.0" height="58" rx="5" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="244.0" y="106.0" style="fill:#111111" data-box="1" textLength="68.7" lengthAdjust="spacingAndGlyphs">64 · color</text><text class="s" xml:space="preserve" x="244.0" y="129.0" style="fill:#455b6b" data-box="1" textLength="74.3" lengthAdjust="spacingAndGlyphs">[f32; 4] · 16 B</text><rect data-box="2" x="394.0" y="84" width="118.0" height="58" rx="5" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="406.0" y="106.0" style="fill:#111111" data-box="2" textLength="68.7" lengthAdjust="spacingAndGlyphs">80 · flags</text><text class="s" xml:space="preserve" x="406.0" y="129.0" style="fill:#455b6b" data-box="2" textLength="49.3" lengthAdjust="spacingAndGlyphs">u32 · 4 B</text><rect data-box="3" x="520.0" y="84" width="146.0" height="58" rx="5" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="532.0" y="106.0" style="fill:#111111" data-box="3" textLength="96.2" lengthAdjust="spacingAndGlyphs">84 · ao_radius</text><text class="s" xml:space="preserve" x="532.0" y="129.0" style="fill:#455b6b" data-box="3" textLength="46.0" lengthAdjust="spacingAndGlyphs">f32 · 4 B</text><rect data-box="4" x="674.0" y="84" width="132.0" height="58" rx="5" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="686.0" y="106.0" style="fill:#111111" data-box="4" textLength="82.5" lengthAdjust="spacingAndGlyphs">88 · spacing</text><text class="s" xml:space="preserve" x="686.0" y="129.0" style="fill:#455b6b" data-box="4" textLength="46.0" lengthAdjust="spacingAndGlyphs">f32 · 4 B</text><rect data-box="5" x="814.0" y="84" width="162.0" height="58" rx="5" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="m" xml:space="preserve" x="826.0" y="106.0" style="fill:#111111" data-box="5" textLength="110.0" lengthAdjust="spacingAndGlyphs">92 · _pad (edge)</text><text class="s" xml:space="preserve" x="826.0" y="129.0" style="fill:#455b6b" data-box="5" textLength="49.3" lengthAdjust="spacingAndGlyphs">u32 · 4 B</text><rect data-box="6" x="984.0" y="84" width="160.0" height="58" rx="5" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="996.0" y="106.0" style="fill:#111111" data-box="6" textLength="75.6" lengthAdjust="spacingAndGlyphs">96 · effect</text><text class="s" xml:space="preserve" x="996.0" y="129.0" style="fill:#455b6b" data-box="6" textLength="74.3" lengthAdjust="spacingAndGlyphs">[f32; 4] · 16 B</text><text class="s" xml:space="preserve" x="28.0" y="166.0" style="fill:#e8ac00" textLength="673.7" lengthAdjust="spacingAndGlyphs">assert!(size_of::&lt;Instance&gt;() == 112);  ·  _pad @ 92 packs RGB edge colour; effect @ 96 holds [reveal, point_scale, 0, 0]</text><rect data-box="7" x="28.0" y="188.0" width="558.0" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="212.0" style="fill:#111111" data-box="7" textLength="306.6" lengthAdjust="spacingAndGlyphs">Group 2 · Binding 0: instances[] (N × 112 B)</text><text class="s" xml:space="preserve" x="40.0" y="236.0" style="fill:#455b6b" data-box="7" textLength="315.1" lengthAdjust="spacingAndGlyphs">Rotation + scale in model (f32); translation zeroed here</text><text class="s" xml:space="preserve" x="40.0" y="256.0" style="fill:#455b6b" data-box="7" textLength="347.0" lengthAdjust="spacingAndGlyphs">Rewriting tint, FLAG_VISIBLE, or effect[0] reveal = 112 B write</text><rect data-box="8" x="606.0" y="188.0" width="538.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="618.0" y="212.0" style="fill:#111111" data-box="8" textLength="315.9" lengthAdjust="spacingAndGlyphs">Group 2 · Binding 1: translations[] (N × 16 B)</text><text class="m" xml:space="preserve" x="618.0" y="236.0" style="fill:#111111" data-box="8" textLength="329.9" lengthAdjust="spacingAndGlyphs">f64 world origin − f64 camera anchor → vec4&lt;f32&gt;</text><text class="s" xml:space="preserve" x="618.0" y="256.0" style="fill:#455b6b" data-box="8" textLength="376.7" lengthAdjust="spacingAndGlyphs">Eliminates f32 jitter far from (0, 0, 0) without re-uploading meshes</text><text class="s" xml:space="preserve" x="28.0" y="297.0" style="fill:#c9ccd6" textLength="810.0" lengthAdjust="spacingAndGlyphs">build.rs expands #include "scene.wgsl" once per shader into OUT_DIR/shaders/ and strips // comments so Rust shader!() embeds exact WGSL.</text></svg>
