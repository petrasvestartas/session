<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 288" role="img" aria-labelledby="t d"><title id="t">Stage glyph coverage atlas and textured quad batching</title><desc id="d">Glyphs are keyed by (font_idx, glyph_id, px_tenths), rasterized once by swash with a 1 px gutter, and batched into ordered egui textured quads alongside matrix cells and rules.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="573.6" lengthAdjust="spacingAndGlyphs">Rasterize once per (font, glyph_id, px) · batch textured quads</text><rect data-box="0" x="28.0" y="72.0" width="175.2" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="84.5" lengthAdjust="spacingAndGlyphs">1 · Atlas key</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="137.5" lengthAdjust="spacingAndGlyphs">(font, glyph_id, px)</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="112.0" lengthAdjust="spacingAndGlyphs">quantized pixel size</text><rect data-box="1" x="251.2" y="72.0" width="168.7" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="263.2" y="96.0" style="fill:#111111" data-box="1" textLength="105.6" lengthAdjust="spacingAndGlyphs">2 · swash::scale</text><text class="s" xml:space="preserve" x="263.2" y="120.0" style="fill:#455b6b" data-box="1" textLength="118.1" lengthAdjust="spacingAndGlyphs">8-bit alpha coverage</text><text class="s" xml:space="preserve" x="263.2" y="140.0" style="fill:#455b6b" data-box="1" textLength="124.9" lengthAdjust="spacingAndGlyphs">whitespace uses 0 px²</text><rect data-box="2" x="474.4" y="72.0" width="197.9" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="486.4" y="96.0" style="fill:#111111" data-box="2" textLength="107.4" lengthAdjust="spacingAndGlyphs">3 · Shelf packer</text><text class="m" xml:space="preserve" x="486.4" y="120.0" style="fill:#111111" data-box="2" textLength="158.1" lengthAdjust="spacingAndGlyphs">1 px transparent gutter</text><text class="s" xml:space="preserve" x="486.4" y="140.0" style="fill:#455b6b" data-box="2" textLength="141.0" lengthAdjust="spacingAndGlyphs">overflow triggers rebuild</text><rect data-box="3" x="720.3" y="72.0" width="196.2" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="732.3" y="96.0" style="fill:#111111" data-box="3" textLength="90.2" lengthAdjust="spacingAndGlyphs">4 · Out::flush</text><text class="s" xml:space="preserve" x="732.3" y="120.0" style="fill:#455b6b" data-box="3" textLength="135.8" lengthAdjust="spacingAndGlyphs">merges adjacent glyphs</text><text class="s" xml:space="preserve" x="732.3" y="140.0" style="fill:#455b6b" data-box="3" textLength="138.6" lengthAdjust="spacingAndGlyphs">preserves cell/rule order</text><path class="ar" d="M203.2,113.5 L251.2,113.5"/><text class="s" xml:space="preserve" x="227.2" y="106.5" text-anchor="middle" textLength="25.4" lengthAdjust="spacingAndGlyphs">miss</text><path class="ar" d="M419.9,113.5 L474.4,113.5"/><text class="s" xml:space="preserve" x="447.2" y="106.5" text-anchor="middle" textLength="31.4" lengthAdjust="spacingAndGlyphs">alpha</text><path class="ar" d="M672.3,113.5 L720.3,113.5"/><text class="s" xml:space="preserve" x="696.3" y="106.5" text-anchor="middle" textLength="22.1" lengthAdjust="spacingAndGlyphs">UVs</text><rect data-box="4" x="28.0" y="183.0" width="888.6" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="440.5" lengthAdjust="spacingAndGlyphs">Why mathematics owns its own glyph atlas instead of glyphon</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="684.8" lengthAdjust="spacingAndGlyphs">TeX fractions, radicals and extensible delimiters address exact OpenType MATH glyph IDs and baseline bearings directly.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="623.8" lengthAdjust="spacingAndGlyphs">1 px gutters prevent bilinear texture sampling from bleeding neighbour ink into fraction bars or matrix digits.</text></svg>
