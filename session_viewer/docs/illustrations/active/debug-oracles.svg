<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058 288" role="img" aria-labelledby="t d"><title id="t">Four failure boundaries and four independent diagnostic oracles</title><desc id="d">Isolate startup/HTTP failures with viewerDiagnostics, scene/memory drift with ?inspect=1, incremental sync bugs with scene_sync::verify, and shader/occlusion bugs with selftest ray/ID oracles.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="38.0" textLength="472.3" lengthAdjust="spacingAndGlyphs">Four failure boundaries · four independent oracles</text><rect data-box="0" x="28.0" y="72.0" width="203.1" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="96.0" style="fill:#111111" data-box="0" textLength="133.1" lengthAdjust="spacingAndGlyphs">1 · Startup &amp; HTTP</text><text class="m" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="116.8" lengthAdjust="spacingAndGlyphs">viewerDiagnostics</text><text class="s" xml:space="preserve" x="40.0" y="140.0" style="fill:#455b6b" data-box="0" textLength="144.9" lengthAdjust="spacingAndGlyphs">adapter, phases, 1st error</text><rect data-box="1" x="299.4" y="72.0" width="201.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="311.4" y="96.0" style="fill:#111111" data-box="1" textLength="130.8" lengthAdjust="spacingAndGlyphs">2 · Live scene state</text><text class="m" xml:space="preserve" x="311.4" y="120.0" style="fill:#111111" data-box="1" textLength="103.1" lengthAdjust="spacingAndGlyphs">?inspect=1 JSON</text><text class="s" xml:space="preserve" x="311.4" y="140.0" style="fill:#455b6b" data-box="1" textLength="143.5" lengthAdjust="spacingAndGlyphs">rows, lanes, known_bytes</text><rect data-box="2" x="568.6" y="72.0" width="210.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="580.6" y="96.0" style="fill:#111111" data-box="2" textLength="140.2" lengthAdjust="spacingAndGlyphs">3 · Incremental sync</text><text class="m" xml:space="preserve" x="580.6" y="120.0" style="fill:#111111" data-box="2" textLength="123.7" lengthAdjust="spacingAndGlyphs">scene_sync::verify</text><text class="s" xml:space="preserve" x="580.6" y="140.0" style="fill:#455b6b" data-box="2" textLength="153.6" lengthAdjust="spacingAndGlyphs">150-step fuzz vs fresh walk</text><rect data-box="3" x="840.0" y="72.0" width="190.4" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="852.0" y="96.0" style="fill:#111111" data-box="3" textLength="121.6" lengthAdjust="spacingAndGlyphs">4 · Shader &amp; GPU</text><text class="m" xml:space="preserve" x="852.0" y="120.0" style="fill:#111111" data-box="3" textLength="151.2" lengthAdjust="spacingAndGlyphs">selftest::oracle + IDs</text><text class="s" xml:space="preserve" x="852.0" y="140.0" style="fill:#455b6b" data-box="3" textLength="162.7" lengthAdjust="spacingAndGlyphs">CPU ray check + WARP/GPU</text><path class="ar" d="M231.1,113.5 L299.4,113.5"/><text class="s" xml:space="preserve" x="265.3" y="106.5" text-anchor="middle" textLength="45.3" lengthAdjust="spacingAndGlyphs">loaded?</text><path class="ar" d="M500.4,113.5 L568.6,113.5"/><text class="s" xml:space="preserve" x="534.5" y="106.5" text-anchor="middle" textLength="44.5" lengthAdjust="spacingAndGlyphs">staged?</text><path class="ar" d="M778.6,113.5 L840.0,113.5"/><text class="s" xml:space="preserve" x="809.3" y="106.5" text-anchor="middle" textLength="41.4" lengthAdjust="spacingAndGlyphs">drawn?</text><rect data-box="4" x="28.0" y="183.0" width="1002.3" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="207.0" style="fill:#111111" data-box="4" textLength="339.8" lengthAdjust="spacingAndGlyphs">Never judge a GPU pass by its own output alone</text><text class="s" xml:space="preserve" x="40.0" y="231.0" style="fill:#455b6b" data-box="4" textLength="698.4" lengthAdjust="spacingAndGlyphs">selftest::oracle casts independent CPU rays to verify hidden-line ink; selftest::lifecycle checks both RGB and pick-ID images.</text><text class="s" xml:space="preserve" x="40.0" y="251.0" style="fill:#455b6b" data-box="4" textLength="767.6" lengthAdjust="spacingAndGlyphs">Software WARP witnesses isolate pipeline logic, while hardware driver ABI bugs (e.g. Android arrow_corner) require target-device runs.</text></svg>
