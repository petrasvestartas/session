<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 468" role="img" aria-labelledby="t d"><title id="t">A drag is three moments, and only the last one writes the document</title><desc id="d">Grabbing remembers base_local and base_place. Every drag frame writes a preview into the 112-byte Instance row + 16-byte translation without touching Session. Releasing commits one undoable transaction.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="503.8" lengthAdjust="spacingAndGlyphs">One gesture · 60 Hz GPU preview · 1 undo transaction</text><text class="l" xml:space="preserve" x="28.0" y="76.0" textLength="53.6" lengthAdjust="spacingAndGlyphs">1 · grab</text><text class="l" xml:space="preserve" x="420.0" y="76.0" textLength="153.4" lengthAdjust="spacingAndGlyphs">2 · drag (every frame)</text><text class="l" xml:space="preserve" x="812.0" y="76.0" textLength="70.2" lengthAdjust="spacingAndGlyphs">3 · release</text><rect data-box="0" x="28.0" y="96.0" width="360.0" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="149.1" lengthAdjust="spacingAndGlyphs">remembered at press</text><text class="m" xml:space="preserve" x="40.0" y="144.0" style="fill:#111111" data-box="0" textLength="192.4" lengthAdjust="spacingAndGlyphs">base_local: object transform</text><text class="m" xml:space="preserve" x="40.0" y="164.0" style="fill:#111111" data-box="0" textLength="185.6" lengthAdjust="spacingAndGlyphs">base_place: drawn placement</text><text class="m" xml:space="preserve" x="40.0" y="184.0" style="fill:#111111" data-box="0" textLength="158.1" lengthAdjust="spacingAndGlyphs">Drag: ray hit on handle</text><rect data-box="1" x="420.0" y="96.0" width="360.0" height="103.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="432.0" y="120.0" style="fill:#111111" data-box="1" textLength="139.7" lengthAdjust="spacingAndGlyphs">written to GPU only</text><text class="m" xml:space="preserve" x="432.0" y="144.0" style="fill:#111111" data-box="1" textLength="213.1" lengthAdjust="spacingAndGlyphs">delta = gizmo.update(drag, ray)</text><text class="m" xml:space="preserve" x="432.0" y="164.0" style="fill:#111111" data-box="1" textLength="178.7" lengthAdjust="spacingAndGlyphs">place = delta * base_place</text><text class="m" xml:space="preserve" x="432.0" y="184.0" style="fill:#111111" data-box="1" textLength="226.8" lengthAdjust="spacingAndGlyphs">objects.set_placement(row, place)</text><rect data-box="2" x="812.0" y="96.0" width="360.0" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="824.0" y="120.0" style="fill:#111111" data-box="2" textLength="152.6" lengthAdjust="spacingAndGlyphs">committed to Session</text><text class="m" xml:space="preserve" x="824.0" y="144.0" style="fill:#111111" data-box="2" textLength="178.7" lengthAdjust="spacingAndGlyphs">local = delta * base_local</text><text class="m" xml:space="preserve" x="824.0" y="164.0" style="fill:#111111" data-box="2" textLength="144.3" lengthAdjust="spacingAndGlyphs">session.begin("move")</text><text class="m" xml:space="preserve" x="824.0" y="184.0" style="fill:#111111" data-box="2" textLength="206.2" lengthAdjust="spacingAndGlyphs">session.set_xform(guid, local)</text><text class="m" xml:space="preserve" x="824.0" y="204.0" style="fill:#111111" data-box="2" textLength="110.0" lengthAdjust="spacingAndGlyphs">session.commit()</text><path class="ar" d="M394.0,136.0 L414.0,136.0"/><path class="ar" d="M786.0,136.0 L806.0,136.0"/><path d="M750,209 a 24 24 0 1 1 -38 0" stroke="#fa9ebc" stroke-width="2" fill="none" marker-end="url(#a)"/><text class="s" xml:space="preserve" x="730.0" y="269.0" text-anchor="middle" style="fill:#fa9ebc" textLength="80.8" lengthAdjust="spacingAndGlyphs">60 Hz preview</text><rect x="420" y="311" width="255.4" height="28" rx="6" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="434.0" y="330.0" style="fill:#111111" textLength="188.1" lengthAdjust="spacingAndGlyphs">112 B instance + 16 B translation</text><rect x="812" y="311" width="172.7" height="28" rx="6" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="826.0" y="330.0" style="fill:#111111" textLength="126.0" lengthAdjust="spacingAndGlyphs">1 undoable history op</text><text class="s" xml:space="preserve" x="28.0" y="330.0" style="fill:#c9ccd6" textLength="134.7" lengthAdjust="spacingAndGlyphs">0 GPU / 0 history writes</text><rect data-box="3" x="28.0" y="359.0" width="1144.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="383.0" style="fill:#111111" data-box="3" textLength="229.6" lengthAdjust="spacingAndGlyphs">Why drag frames bypass Session</text><text class="s" xml:space="preserve" x="40.0" y="407.0" style="fill:#455b6b" data-box="3" textLength="635.3" lengthAdjust="spacingAndGlyphs">Writing 60 document ops per second would make Ctrl+Z undo a single 16 ms frame instead of the whole drag.</text><text class="s" xml:space="preserve" x="40.0" y="427.0" style="fill:#455b6b" data-box="3" textLength="572.1" lengthAdjust="spacingAndGlyphs">Measuring both preview and commit from base_local / base_place makes dropped frames drift-free.</text></svg>
