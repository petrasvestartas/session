<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1084 470" role="img" aria-labelledby="t d"><title id="t">Shaping: characters become positioned glyphs</title><desc id="d">A string is not a row of glyph bitmaps. Shaping chooses glyphs and pen advances: a kerning pair pulls the second glyph back, a ligature turns two characters into one glyph, a combining accent adds a glyph with no advance, and a space advances the pen without any pixels. Clusters map each glyph back to the source characters.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="500.2" lengthAdjust="spacingAndGlyphs">The pen moves by advances, not by bitmap widths</text><line x1="60" y1="200" x2="1040" y2="200" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="1040.0" y="218.0" text-anchor="end" textLength="50.9" lengthAdjust="spacingAndGlyphs">baseline</text><rect x="60" y="90" width="92" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="106.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#bdbfe8" textLength="69.3" lengthAdjust="spacingAndGlyphs">A</text><line x1="60" y1="204" x2="60" y2="214" stroke="#bdbfe8" stroke-width="2"/><rect x="152" y="90" width="84" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="194.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#f0bcdb" textLength="69.3" lengthAdjust="spacingAndGlyphs">V</text><line x1="152" y1="204" x2="152" y2="214" stroke="#f0bcdb" stroke-width="2"/><rect x="236" y="90" width="64" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="268.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#bdbfe8" textLength="42.6" lengthAdjust="spacingAndGlyphs">e</text><line x1="236" y1="204" x2="236" y2="214" stroke="#bdbfe8" stroke-width="2"/><rect x="300" y="90" width="44" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><line x1="300" y1="204" x2="300" y2="214" stroke="#e07a26" stroke-width="2"/><rect x="344" y="90" width="96" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="392.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#8fd36a" textLength="53.4" lengthAdjust="spacingAndGlyphs">ﬁ</text><line x1="344" y1="204" x2="344" y2="214" stroke="#8fd36a" stroke-width="2"/><rect x="440" y="90" width="70" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="475.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#bdbfe8" textLength="48.0" lengthAdjust="spacingAndGlyphs">n</text><line x1="440" y1="204" x2="440" y2="214" stroke="#bdbfe8" stroke-width="2"/><rect x="510" y="90" width="66" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="543.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#8fd36a" textLength="42.6" lengthAdjust="spacingAndGlyphs">é</text><line x1="510" y1="204" x2="510" y2="214" stroke="#8fd36a" stroke-width="2"/><rect x="576" y="90" width="60" height="110" fill="none" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="3 3"/><text x="606.0" y="192" text-anchor="middle" style="font-family:serif;font-size:96px;fill:#bdbfe8" textLength="37.4" lengthAdjust="spacingAndGlyphs">s</text><line x1="576" y1="204" x2="576" y2="214" stroke="#bdbfe8" stroke-width="2"/><text class="s" xml:space="preserve" x="60.0" y="240.0" style="fill:#bdbfe8" textLength="69.0" lengthAdjust="spacingAndGlyphs">advance 92</text><text class="s" xml:space="preserve" x="152.0" y="240.0" style="fill:#f0bcdb" textLength="79.9" lengthAdjust="spacingAndGlyphs">V kerned −14</text><text class="s" xml:space="preserve" x="300.0" y="240.0" style="fill:#e07a26" textLength="152.9" lengthAdjust="spacingAndGlyphs">space: pen moves, no ink</text><text class="s" xml:space="preserve" x="344.0" y="262.0" style="fill:#8fd36a" textLength="180.6" lengthAdjust="spacingAndGlyphs">ligature: two chars, one glyph</text><text class="s" xml:space="preserve" x="510.0" y="284.0" style="fill:#8fd36a" textLength="254.2" lengthAdjust="spacingAndGlyphs">combining accent: a glyph with advance 0</text><text class="s" xml:space="preserve" x="60.0" y="310.0" textLength="567.5" lengthAdjust="spacingAndGlyphs">Each dashed box is one pen advance; a glyph's ink may overhang it (V, ﬁ) or be empty (space).</text><rect data-box="0" x="28.0" y="350.0" width="175.6" height="63.0" rx="8" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="374.0" style="fill:#111111" data-box="0" textLength="71.8" lengthAdjust="spacingAndGlyphs">TextLabel</text><text class="s" xml:space="preserve" x="40.0" y="398.0" style="fill:#455b6b" data-box="0" textLength="117.7" lengthAdjust="spacingAndGlyphs">text · font · CSS size</text><rect data-box="1" x="258.0" y="350.0" width="230.7" height="83.0" rx="8" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="270.0" y="374.0" style="fill:#111111" data-box="1" textLength="152.2" lengthAdjust="spacingAndGlyphs">Cosmic Text shaping</text><text class="s" xml:space="preserve" x="270.0" y="398.0" style="fill:#455b6b" data-box="1" textLength="120.3" lengthAdjust="spacingAndGlyphs">bundled Noto bytes</text><text class="s" xml:space="preserve" x="270.0" y="418.0" style="fill:#455b6b" data-box="1" textLength="167.7" lengthAdjust="spacingAndGlyphs">kerning · ligatures · fallback</text><rect data-box="2" x="532.7" y="350.0" width="228.2" height="83.0" rx="8" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="544.7" y="374.0" style="fill:#111111" data-box="2" textLength="152.8" lengthAdjust="spacingAndGlyphs">TextRun · glyph runs</text><text class="m" xml:space="preserve" x="544.7" y="398.0" style="fill:#111111" data-box="2" textLength="203.1" lengthAdjust="spacingAndGlyphs">glyph id · advance · offset</text><text class="m" xml:space="preserve" x="544.7" y="418.0" style="fill:#111111" data-box="2" textLength="157.9" lengthAdjust="spacingAndGlyphs">cluster → source char</text><rect data-box="3" x="804.9" y="350.0" width="251.4" height="63.0" rx="8" fill="#ffffff" stroke="#f0bcdb" stroke-width="1.5"/><text class="l" xml:space="preserve" x="816.9" y="374.0" style="fill:#111111" data-box="3" textLength="109.2" lengthAdjust="spacingAndGlyphs">TextDocument</text><text class="s" xml:space="preserve" x="816.9" y="398.0" style="fill:#455b6b" data-box="3" textLength="200.1" lengthAdjust="spacingAndGlyphs">cached until text or font changes</text><path class="ar" d="M203.6,381.5 L258.0,381.5"/><text class="s" xml:space="preserve" x="230.8" y="374.5" text-anchor="middle" textLength="36.9" lengthAdjust="spacingAndGlyphs">shape</text><path class="ar" d="M488.7,391.5 L532.7,391.5"/><path class="ar" d="M760.9,391.5 L804.9,391.5"/></svg>
