<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 479" role="img" aria-labelledby="t d"><title id="t">A tool asks until it has enough</title><desc id="d">A command such as Move opens a tool. The tool prompts for a point, takes a click, a snap or typed coordinates, and answers More, Repeat or Done. Between answers it only draws a preview.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="355.1" lengthAdjust="spacingAndGlyphs">Move: two points, one conversation</text><rect data-box="0" x="28.0" y="80.0" width="94.8" height="63.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="104.0" style="fill:#111111" data-box="0" textLength="65.1" lengthAdjust="spacingAndGlyphs">you type</text><text class="m" xml:space="preserve" x="40.0" y="128.0" style="fill:#111111" data-box="0" textLength="30.1" lengthAdjust="spacingAndGlyphs">Move</text><rect data-box="1" x="200.0" y="80.0" width="165.6" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="212.0" y="104.0" style="fill:#111111" data-box="1" textLength="126.2" lengthAdjust="spacingAndGlyphs">the tool prompts</text><text class="m" xml:space="preserve" x="212.0" y="128.0" style="fill:#111111" data-box="1" textLength="105.4" lengthAdjust="spacingAndGlyphs">prompt(points)</text><text class="s" xml:space="preserve" x="212.0" y="148.0" style="fill:#455b6b" data-box="1" textLength="128.3" lengthAdjust="spacingAndGlyphs">"Point to move from"</text><rect data-box="2" x="470.0" y="80.0" width="127.4" height="83.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="482.0" y="104.0" style="fill:#111111" data-box="2" textLength="86.7" lengthAdjust="spacingAndGlyphs">you answer</text><text class="s" xml:space="preserve" x="482.0" y="128.0" style="fill:#455b6b" data-box="2" textLength="83.9" lengthAdjust="spacingAndGlyphs">a click, a snap</text><text class="s" xml:space="preserve" x="482.0" y="148.0" style="fill:#455b6b" data-box="2" textLength="80.7" lengthAdjust="spacingAndGlyphs">or typed x,y,z</text><rect data-box="3" x="720.0" y="80.0" width="235.8" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="732.0" y="104.0" style="fill:#111111" data-box="3" textLength="119.2" lengthAdjust="spacingAndGlyphs">the tool decides</text><text class="m" xml:space="preserve" x="732.0" y="128.0" style="fill:#111111" data-box="3" textLength="210.7" lengthAdjust="spacingAndGlyphs">placed(state, points, plane)</text><path class="ar" d="M122.8,121.5 L194.0,121.5"/><path class="ar" d="M365.6,121.5 L464.0,121.5"/><path class="ar" d="M597.4,121.5 L714.0,121.5"/><rect data-box="4" x="470.0" y="223.0" width="230.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="482.0" y="247.0" style="fill:#111111" data-box="4" textLength="83.4" lengthAdjust="spacingAndGlyphs">Next::More</text><text class="s" xml:space="preserve" x="482.0" y="271.0" style="fill:#455b6b" data-box="4" textLength="130.7" lengthAdjust="spacingAndGlyphs">ask for the next point</text><rect data-box="5" x="720.0" y="223.0" width="230.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="732.0" y="247.0" style="fill:#111111" data-box="5" textLength="173.3" lengthAdjust="spacingAndGlyphs">Next::Repeat(message)</text><text class="s" xml:space="preserve" x="732.0" y="271.0" style="fill:#455b6b" data-box="5" textLength="154.1" lengthAdjust="spacingAndGlyphs">acted once; keep the first</text><text class="s" xml:space="preserve" x="732.0" y="291.0" style="fill:#455b6b" data-box="5" textLength="119.8" lengthAdjust="spacingAndGlyphs">point and ask again</text><rect data-box="6" x="970.0" y="223.0" width="190.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="982.0" y="247.0" style="fill:#111111" data-box="6" textLength="159.7" lengthAdjust="spacingAndGlyphs">Next::Done(message)</text><text class="s" xml:space="preserve" x="982.0" y="271.0" style="fill:#455b6b" data-box="6" textLength="133.7" lengthAdjust="spacingAndGlyphs">finished; the message</text><text class="s" xml:space="preserve" x="982.0" y="291.0" style="fill:#455b6b" data-box="6" textLength="134.8" lengthAdjust="spacingAndGlyphs">goes to the status line</text><path class="ar" d="M837.9,147.0 L585.0,217.0"/><path class="ar" d="M837.9,147.0 L835.0,217.0"/><path class="ar" d="M837.9,147.0 L1065.0,217.0"/><path class="ar" d="M470.0,254.5 L282.8,254.5 L282.8,169.0"/><rect data-box="7" x="28.0" y="346.0" width="1124.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="370.0" style="fill:#111111" data-box="7" textLength="230.6" lengthAdjust="spacingAndGlyphs">Between answers, every frame</text><text class="s" xml:space="preserve" x="40.0" y="394.0" style="fill:#455b6b" data-box="7" textLength="410.4" lengthAdjust="spacingAndGlyphs">guide() draws the rubber band from the placed points to the cursor</text><text class="s" xml:space="preserve" x="40.0" y="414.0" style="fill:#455b6b" data-box="7" textLength="498.5" lengthAdjust="spacingAndGlyphs">preview() moves the selection with the cursor, readout() shows a distance beside it</text><text class="s" xml:space="preserve" x="40.0" y="434.0" style="fill:#455b6b" data-box="7" textLength="431.0" lengthAdjust="spacingAndGlyphs">none of them writes the document: only Done does, in one transaction</text></svg>
