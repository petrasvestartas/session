<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 530" role="img" aria-labelledby="t d"><title id="t">One thing, declared three times</title><desc id="d">Almost every wgpu validation error is the same bug in different clothes: a vertex attribute, a binding, a uniform field or a texture format is declared in three places and only two of them were changed. The message names one of the three; the stale one is usually a different one.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="367.0" lengthAdjust="spacingAndGlyphs">Name the thing, then check all three</text><line x1="590.0" y1="190.0" x2="270.0" y2="410.0" stroke="#8fd36a" stroke-width="2.4"/><line x1="270.0" y1="410.0" x2="910.0" y2="410.0" stroke="#f0bcdb" stroke-width="2.8" stroke-dasharray="8 6"/><line x1="590.0" y1="190.0" x2="910.0" y2="410.0" stroke="#f0bcdb" stroke-width="2.8" stroke-dasharray="8 6"/><circle cx="590.0" cy="190.0" r="9" fill="#bdbfe8"/><circle cx="270.0" cy="410.0" r="9" fill="#bdbfe8"/><circle cx="910.0" cy="410.0" r="11" fill="#f0bcdb"/><text class="l" xml:space="preserve" x="520.0" y="132.0" textLength="82.5" lengthAdjust="spacingAndGlyphs">Rust struct</text><text class="s" xml:space="preserve" x="452.0" y="156.0" textLength="166.1" lengthAdjust="spacingAndGlyphs">#[repr(C)] fields and offsets</text><text class="l" xml:space="preserve" x="196.0" y="452.0" textLength="47.8" lengthAdjust="spacingAndGlyphs">layout</text><text class="s" xml:space="preserve" x="96.0" y="476.0" textLength="225.3" lengthAdjust="spacingAndGlyphs">vertex attributes · bind-group entries</text><text class="l" xml:space="preserve" x="846.0" y="452.0" style="fill:#f0bcdb" textLength="41.9" lengthAdjust="spacingAndGlyphs">WGSL</text><text class="s" xml:space="preserve" x="680.0" y="476.0" style="fill:#f0bcdb" textLength="334.8" lengthAdjust="spacingAndGlyphs">@location · @binding · struct members — the stale one</text><text class="s" xml:space="preserve" x="742.0" y="268.0" style="fill:#f0bcdb" textLength="202.4" lengthAdjust="spacingAndGlyphs">both edges that touch it disagree</text><text class="s" xml:space="preserve" x="298.0" y="268.0" style="fill:#8fd36a" textLength="215.6" lengthAdjust="spacingAndGlyphs">these two agree: you changed both</text><text class="s" xml:space="preserve" x="28.0" y="512.0" textLength="902.8" lengthAdjust="spacingAndGlyphs">The error names one corner. Name the thing yourself, then read all three declarations of it: the stale one is rarely the corner the message pointed at.</text></svg>
