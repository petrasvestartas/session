<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1139 430" role="img" aria-labelledby="t d"><title id="t">Coordinate spaces from a source point to a framebuffer pixel</title><desc id="d">A point travels from f64 source coordinates through placement and rebasing to f32 object-relative coordinates, then through view and projection to clip space, the divide by w and the viewport scale. f64 becomes f32 only after the camera anchor is subtracted.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="209.6" lengthAdjust="spacingAndGlyphs">One point, six spaces</text><rect data-box="0" x="28.0" y="66.0" width="189.4" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0" textLength="85.7" lengthAdjust="spacingAndGlyphs">Source · f64</text><text class="s" xml:space="preserve" x="40.0" y="114.0" style="fill:#455b6b" data-box="0" textLength="101.3" lengthAdjust="spacingAndGlyphs">CAD coordinates</text><text class="s" xml:space="preserve" x="40.0" y="134.0" style="fill:#455b6b" data-box="0" textLength="142.7" lengthAdjust="spacingAndGlyphs">large offsets kept exact</text><rect data-box="1" x="299.4" y="66.0" width="182.8" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="311.4" y="90.0" style="fill:#111111" data-box="1" textLength="79.5" lengthAdjust="spacingAndGlyphs">World · f64</text><text class="m" xml:space="preserve" x="311.4" y="114.0" style="fill:#111111" data-box="1" textLength="135.3" lengthAdjust="spacingAndGlyphs">Mat4 model × point</text><text class="m" xml:space="preserve" x="311.4" y="134.0" style="fill:#111111" data-box="1" textLength="157.8" lengthAdjust="spacingAndGlyphs">math::xform_point_f64</text><rect data-box="2" x="557.3" y="66.0" width="258.4" height="83.0" rx="4" fill="#f0bcdb" stroke="#f0bcdb" stroke-width="0"/><text class="l" xml:space="preserve" x="569.3" y="90.0" style="fill:#111111" data-box="2" textLength="146.6" lengthAdjust="spacingAndGlyphs">Object-relative · f32</text><text class="m" xml:space="preserve" x="569.3" y="114.0" style="fill:#111111" data-box="2" textLength="232.9" lengthAdjust="spacingAndGlyphs">Instance.model (no translation)</text><text class="m" xml:space="preserve" x="569.3" y="134.0" style="fill:#111111" data-box="2" textLength="180.3" lengthAdjust="spacingAndGlyphs">translations[row] (16 B)</text><path class="ar" d="M217.4,107.5 L299.4,107.5"/><text class="s" xml:space="preserve" x="258.4" y="100.5" text-anchor="middle" textLength="65.5" lengthAdjust="spacingAndGlyphs">placement</text><path class="ar" d="M482.2,107.5 L557.3,107.5"/><text class="s" xml:space="preserve" x="519.7" y="100.5" text-anchor="middle" textLength="54.2" lengthAdjust="spacingAndGlyphs">− anchor</text><path class="dash" d="M519.7,119.5 L519.7,163.0"/><text class="s" xml:space="preserve" x="519.7" y="179.0" text-anchor="middle" style="fill:#e07a26" textLength="182.1" lengthAdjust="spacingAndGlyphs">f64 → f32 here, after rebasing</text><path class="ar" d="M686.5,189.0 L686.5,219.0"/><text class="s" xml:space="preserve" x="676.5" y="209.0" text-anchor="end" textLength="175.6" lengthAdjust="spacingAndGlyphs">mvp = projection · view · unit</text><rect data-box="3" x="557.3" y="221.0" width="258.4" height="63.0" rx="4" fill="#f0bcdb" stroke="#f0bcdb" stroke-width="0"/><text class="l" xml:space="preserve" x="569.3" y="245.0" style="fill:#111111" data-box="3" textLength="112.4" lengthAdjust="spacingAndGlyphs">Clip · (x, y, z, w)</text><text class="m" xml:space="preserve" x="569.3" y="269.0" style="fill:#111111" data-box="3" textLength="135.3" lengthAdjust="spacingAndGlyphs">@builtin(position)</text><rect data-box="4" x="299.4" y="221.0" width="182.8" height="63.0" rx="4" fill="#f0bcdb" stroke="#f0bcdb" stroke-width="0"/><text class="l" xml:space="preserve" x="311.4" y="245.0" style="fill:#111111" data-box="4" textLength="94.7" lengthAdjust="spacingAndGlyphs">NDC · [−1, 1]²</text><text class="s" xml:space="preserve" x="311.4" y="269.0" style="fill:#455b6b" data-box="4" textLength="148.8" lengthAdjust="spacingAndGlyphs">depth reversed: near = 1</text><rect data-box="5" x="28.0" y="221.0" width="189.4" height="63.0" rx="4" fill="#f0bcdb" stroke="#f0bcdb" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="245.0" style="fill:#111111" data-box="5" textLength="115.8" lengthAdjust="spacingAndGlyphs">Framebuffer px</text><text class="s" xml:space="preserve" x="40.0" y="269.0" style="fill:#455b6b" data-box="5" textLength="152.9" lengthAdjust="spacingAndGlyphs">CSS px × devicePixelRatio</text><path class="ar" d="M557.3,252.5 L482.2,252.5"/><text class="s" xml:space="preserve" x="519.7" y="245.5" text-anchor="middle" textLength="21.0" lengthAdjust="spacingAndGlyphs">÷ w</text><path class="ar" d="M299.4,252.5 L217.4,252.5"/><text class="s" xml:space="preserve" x="258.4" y="245.5" text-anchor="middle" textLength="54.3" lengthAdjust="spacingAndGlyphs">viewport</text><rect data-box="6" x="28.0" y="308.0" width="787.7" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="332.0" style="fill:#111111" data-box="6" textLength="175.4" lengthAdjust="spacingAndGlyphs">The camera stays in f64</text><text class="s" xml:space="preserve" x="40.0" y="356.0" style="fill:#455b6b" data-box="6" textLength="475.4" lengthAdjust="spacingAndGlyphs">Camera { target, distance, orientation } → view_proj_anchored(aspect, anchor)</text><text class="s" xml:space="preserve" x="40.0" y="376.0" style="fill:#455b6b" data-box="6" textLength="478.4" lengthAdjust="spacingAndGlyphs">one uniform upload per frame; panning rewrites 16 B per object, not the mesh</text><rect data-box="7" x="845.7" y="66.0" width="266.0" height="203.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="857.7" y="90.0" style="fill:#111111" data-box="7" textLength="102.5" lengthAdjust="spacingAndGlyphs">Who converts</text><text class="m" xml:space="preserve" x="857.7" y="114.0" style="fill:#111111" data-box="7" textLength="210.4" lengthAdjust="spacingAndGlyphs">walk/*    world → object f32</text><text class="m" xml:space="preserve" x="857.7" y="134.0" style="fill:#111111" data-box="7" textLength="240.5" lengthAdjust="spacingAndGlyphs">objects.rs  anchor, translations</text><text class="m" xml:space="preserve" x="857.7" y="154.0" style="fill:#111111" data-box="7" textLength="217.9" lengthAdjust="spacingAndGlyphs">camera.rs   view + projection</text><text class="m" xml:space="preserve" x="857.7" y="174.0" style="fill:#111111" data-box="7" textLength="172.8" lengthAdjust="spacingAndGlyphs">frame.rs    mvp uniform</text><text class="m" xml:space="preserve" x="857.7" y="194.0" style="fill:#111111" data-box="7" textLength="225.4" lengthAdjust="spacingAndGlyphs">*.wgsl     mvp * (model·p + t)</text><text class="m" xml:space="preserve" x="857.7" y="214.0" style="fill:#111111" data-box="7" textLength="180.3" lengthAdjust="spacingAndGlyphs">GPU        ÷ w, viewport</text><text class="s" xml:space="preserve" x="857.7" y="234.0" style="fill:#455b6b" data-box="7" textLength="188.4" lengthAdjust="spacingAndGlyphs">Pointer events arrive in CSS px;</text><text class="s" xml:space="preserve" x="857.7" y="254.0" style="fill:#455b6b" data-box="7" textLength="182.9" lengthAdjust="spacingAndGlyphs">picking and text convert once.</text></svg>
