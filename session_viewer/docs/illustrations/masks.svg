<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">One border, however many masks</title><desc id="d">The silhouette is not drawn from geometry. Ordinary and selected ink each rasterize into an R8 coverage mask, the compositor takes the larger of the two so a selected edge thickens without doubling, and a pooled copy holding the maximum of every block lets a fragment with no ink anywhere near it return zero without entering the search loop at all.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="456.8" lengthAdjust="spacingAndGlyphs">Two coverage masks, pooled, then one border</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#f0bcdb" textLength="80.6" lengthAdjust="spacingAndGlyphs">two masks</text><polygon points="190.0,164.0 271.8,223.4 240.5,319.6 139.5,319.6 108.2,223.4" fill="none" stroke="#e8ac00" stroke-width="18" stroke-opacity="0.55" stroke-linejoin="round"/><polygon points="190.0,164.0 271.8,223.4 240.5,319.6 139.5,319.6 108.2,223.4" fill="none" stroke="#f0bcdb" stroke-width="6" stroke-opacity="1.0" stroke-linejoin="round"/><text class="s" xml:space="preserve" x="60.0" y="386.0" textLength="252.2" lengthAdjust="spacingAndGlyphs">ordinary ink is thin, selected ink is thicker,</text><text class="s" xml:space="preserve" x="60.0" y="408.0" style="fill:#f0bcdb" textLength="245.9" lengthAdjust="spacingAndGlyphs">and each lands in its own R8 attachment</text><text class="l" xml:space="preserve" x="460.0" y="86.0" style="fill:#8fd36a" textLength="102.1" lengthAdjust="spacingAndGlyphs">max, not sum</text><polygon points="590.0,164.0 671.8,223.4 640.5,319.6 539.5,319.6 508.2,223.4" fill="none" stroke="#8fd36a" stroke-width="18" stroke-opacity="0.75" stroke-linejoin="round"/><text class="s" xml:space="preserve" x="460.0" y="386.0" textLength="244.7" lengthAdjust="spacingAndGlyphs">the larger of the two, so a selected edge</text><text class="s" xml:space="preserve" x="460.0" y="408.0" style="fill:#8fd36a" textLength="232.3" lengthAdjust="spacingAndGlyphs">thickens instead of doubling in weight</text><text class="l" xml:space="preserve" x="850.0" y="86.0" style="fill:#e8ac00" textLength="105.0" lengthAdjust="spacingAndGlyphs">block maxima</text><polygon points="980.0,164.0 1061.8,223.4 1030.5,319.6 929.5,319.6 898.2,223.4" fill="none" stroke="#b9b9bd" stroke-width="18" stroke-opacity="0.35" stroke-linejoin="round"/><rect x="859.0" y="129.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="156.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="183.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="210.0" width="25.0" height="25.0" fill="#e8ac00" fill-opacity="0.42"/><rect x="859.0" y="237.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="264.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="291.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="318.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="859.0" y="345.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="886.0" y="129.0" width="25.0" height="25.0" fill="#b9b9bd" fill-opacity="0.1"/><rect x="886.0" y="156.0" width="25.0" height="25.0" 