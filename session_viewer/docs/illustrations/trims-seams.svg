<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 506" role="img" aria-labelledby="t d"><title id="t">Trim loops select part of a surface; a periodic seam is one curve used twice</title><desc id="d">Left: in the surface's u,v rectangle the outer loop and an inner loop select the face; the constrained triangulation keeps loop edges as triangle edges and leaves the hole empty. Right: a cylinder unrolled in u,v has its seam curve at u=0 and again at u=1: two face uses with different parameters map to the same XYZ points.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#111111"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#111111;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#455b6b}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#111111}.ar{fill:none;stroke:#111111;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#eef0f2"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="382.0" lengthAdjust="spacingAndGlyphs">Trims: the u,v rectangle is not the face</text><rect x="60" y="90" width="360" height="230" fill="#ffffff" stroke="#aaaaaa" stroke-width="1"/><path d="M90,290 L100,130 L260,110 L390,150 L380,300 L210,305 Z M210,180 L290,170 L305,230 L230,245 Z" fill="#bdbfe8" fill-opacity="0.7" fill-rule="evenodd" stroke="none"/><polygon points="100,130 210,180 90,290" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="260,110 210,180 100,130" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="260,110 290,170 210,180" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="390,150 305,230 290,170" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="380,300 305,230 390,150" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="210,305 230,245 380,300" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="90,290 210,180 230,245" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="90,290 230,245 210,305" fill="none" stroke="#aaaaaa" stroke-width="0.8"/><polygon points="90,290 100,130 260,110 390,150 380,300 210,305" fill="none" stroke="#1a1eb2" stroke-width="2.2"/><polygon points="210,180 290,170 305,230 230,245" fill="none" stroke="#ce4095" stroke-width="2.2"/><text class="s" xml:space="preserve" x="60.0" y="344.0" style="fill:#1a1eb2" textLength="63.7" lengthAdjust="spacingAndGlyphs">outer loop</text><text class="s" xml:space="preserve" x="170.0" y="344.0" style="fill:#ce4095" textLength="172.1" lengthAdjust="spacingAndGlyphs">inner loop = hole, left empty</text><text class="s" xml:space="preserve" x="60.0" y="366.0" textLength="300.9" lengthAdjust="spacingAndGlyphs">loop edges are triangle edges; grey diagonals are</text><text class="s" xml:space="preserve" x="60.0" y="384.0" textLength="238.3" lengthAdjust="spacingAndGlyphs">interior and never drawn as CAD edges</text><text class="s" xml:space="preserve" x="408.0" y="82.0" text-anchor="end" textLength="24.4" lengthAdjust="spacingAndGlyphs">u →</text><text class="s" xml:space="preserve" x="52.0" y="104.0" text-anchor="end" textLength="6.6" lengthAdjust="spacingAndGlyphs">v</text><text class="h" xml:space="preserve" x="560.0" y="40.0" textLength="416.8" lengthAdjust="spacingAndGlyphs">Seam: one XYZ curve, two parameter uses</text><rect x="580" y="90" width="200" height="230" fill="#f0bcdb" fill-opacity="0.6" stroke="#aaaaaa" stroke-width="1"/><line x1="580" y1="90" x2="580" y2="320" stroke="#3f9c20" stroke-width="3"/><line x1="780" y1="90" x2="780" y2="320" stroke="#3f9c20" stroke-width="3"/><text class="s" xml:space="preserve" x="580.0" y="82.0" text-anchor="middle" style="fill:#3f9c20" textLength="29.6" lengthAdjust="spacingAndGlyphs">u = 0</text><text class="s" xml:space="preserve" x="780.0" y="82.0" text-anchor="middle" style="fill:#3f9c20" textLength="29.6" lengthAdjust="spacingAndGlyphs">u = 1</text><text class="s" xml:space="preserve" x="680.0" y="205.0" text-anchor="middle" textLength="131.4" lengthAdjust="spacingAndGlyphs">unrolled cylinder face</text><ellipse cx="900" cy="120" rx="60" ry="18" fill="none" stroke="#aaaaaa" stroke-width="1.2"/><line x1="840" y1="120" x2="840" y2="290" stroke="#aaaaaa" stroke-width="1.2"/><line x1="960" y1="120" x2="960" y2="290" stroke="#aaaaaa" stroke-width="1.2"/><path d="M840,290 A60,18 0 0 0 960,290" fill="none" stroke="#aaaaaa" stroke-width="1.2"/><line x1="900" y1="138" x2="900" y2="308" stroke="#3f9c20" stroke-width="3"/><text class="s" xml:space="preserve" x="900.0" y="344.0" text-anchor="middle" style="fill:#3f9c20" textLength="91.5" lengthAdjust="spacingAndGlyphs">the seam in 3D</text><text class="s" xml:space="preserve" x="560.0" y="366.0" textLength="279.4" lengthAdjust="spacingAndGlyphs">same XYZ, different (u,v): keep both face uses;</text><text class="s" xml:space="preserve" x="560.0" y="384.0" textLength="256.9" lengthAdjust="spacingAndGlyphs">a pole collapses many (u,v) onto one point</text><rect data-box="0" x="28.0" y="402.0" width="1044.0" height="83.0" rx="8" fill="#e4e4e7" stroke="#b9b9bd" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="426.0" data-box="0" textLength="151.4" lengthAdjust="spacingAndGlyphs">The consumer's rule</text><text class="s" xml:space="preserve" x="40.0" y="450.0" data-box="0" textLength="723.7" lengthAdjust="spacingAndGlyphs">walk_surface keeps the producer's constrained mesh and its loop provenance; map_surface_boundaries names natural</text><text class="s" xml:space="preserve" x="40.0" y="470.0" data-box="0" textLength="739.8" lengthAdjust="spacingAndGlyphs">boundaries from u/v extremes, so a repeated seam use or a zero-length pole edge never becomes an invented CAD edge.</text></svg>
