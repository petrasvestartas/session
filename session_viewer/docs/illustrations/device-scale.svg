<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">Three rulers over the same glass</title><desc id="d">A pointer position and a rendered pixel are measured in different units. winit reports at the browser's ratio whatever ?dpr= asks for, so every arriving position is multiplied by surface_per_physical - the cap over the ratio, and 1 when there is no cap - before it is used. Picks, zooms and drags then read against the surface that is actually drawn.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="465.0" lengthAdjust="spacingAndGlyphs">The pointer and the surface are different units</text><text class="l" xml:space="preserve" x="60.0" y="86.0" textLength="349.2" lengthAdjust="spacingAndGlyphs">the same strip of screen, measured three ways</text><text class="s" xml:space="preserve" x="60.0" y="165.0" style="fill:#b9b9bd" textLength="41.1" lengthAdjust="spacingAndGlyphs">CSS px</text><line x1="268.0" y1="160.0" x2="1120.0" y2="160.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="268.0" y1="151.0" x2="268.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="410.0" y1="151.0" x2="410.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="552.0" y1="151.0" x2="552.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="694.0" y1="151.0" x2="694.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="836.0" y1="151.0" x2="836.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="978.0" y1="151.0" x2="978.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><line x1="1120.0" y1="151.0" x2="1120.0" y2="169.0" stroke="#b9b9bd" stroke-width="1.8"/><text class="s" xml:space="preserve" x="60.0" y="237.0" style="fill:#fa9ebc" textLength="105.9" lengthAdjust="spacingAndGlyphs">device px · ratio 2</text><line x1="268.0" y1="232.0" x2="1120.0" y2="232.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="268.0" y1="223.0" x2="268.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="339.0" y1="223.0" x2="339.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="410.0" y1="223.0" x2="410.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="481.0" y1="223.0" x2="481.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="552.0" y1="223.0" x2="552.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="623.0" y1="223.0" x2="623.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="694.0" y1="223.0" x2="694.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="765.0" y1="223.0" x2="765.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="836.0" y1="223.0" x2="836.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="907.0" y1="223.0" x2="907.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="978.0" y1="223.0" x2="978.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="1049.0" y1="223.0" x2="1049.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="1120.0" y1="223.0" x2="1120.0" y2="241.0" stroke="#fa9ebc" stroke-width="1.8"/><text class="s" xml:space="preserve" x="60.0" y="309.0" style="fill:#8fd36a" textLength="157.4" lengthAdjust="spacingAndGlyphs">surface px · ?dpr=1 caps it</text><line x1="268.0" y1="304.0" x2="1120.0" y2="304.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="268.0" y1="295.0" x2="268.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="410.0" y1="295.0" x2="410.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="552.0" y1="295.0" x2="552.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="694.0" y1="295.0" x2="694.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="836.0" y1="295.0" x2="836.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="978.0" y1="295.0" x2="978.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="1120.0" y1="295.0" x2="1120.0" y2="313.0" stroke="#8fd36a" stroke-width="1.8"/><line x1="694.0" y1="142" x2="694.0" y2="322" stroke="#e8ac00" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="694.0" cy="160.0" r="5" fill="#e8ac00"/><circle cx="694.0" cy="232.0" r="5" fill="#e8ac00"/><circle cx="694.0" cy="304.0" r="5" fill="#e8ac00"/><text class="s" xml:space="preserve" x="708.0" y="134.0" style="fill:#e8ac00" textLength="135.5" lengthAdjust="spacingAndGlyphs">one point on the glass</text><text class="s" xml:space="preserve" x="60.0" y="366.0" style="fill:#e8ac00" textLength="402.1" lengthAdjust="spacingAndGlyphs">winit reports 6 device px; × surface_per_physical 0.5 = 3 surface px</text><text class="s" xml:space="preserve" x="60.0" y="388.0" textLength="433.7" lengthAdjust="spacingAndGlyphs">the cap over the ratio, and 1 when nothing is capped, applied on arrival</text><text class="s" xml:space="preserve" x="60.0" y="410.0" textLength="982.9" lengthAdjust="spacingAndGlyphs">At two physical pixels per CSS pixel the density already halves the stair-steps, so samples_for drops to 1×: the same edge for a quarter of the attachment memory.</text></svg>
