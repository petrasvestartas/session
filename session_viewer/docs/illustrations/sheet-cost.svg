<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">A sheet is one pen, not ten thousand objects</title><desc id="d">Loaded as objects, every line of a drawing pays for a GUID string, a name, a colour and four copies of itself between the file bytes and the GPU, so a 51 MB sheet lifts the wasm heap by 300 MiB. Published as one segment batch, a line is a few numbers and a small source id; the GUID, name and kind live in a side table read by byte range only when something is selected.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="324.6" lengthAdjust="spacingAndGlyphs">What one line of a drawing costs</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#f0bcdb" textLength="139.2" lengthAdjust="spacingAndGlyphs">one object per line</text><rect x="60.0" y="146.0" width="132.0" height="26" fill="#f0bcdb" fill-opacity="0.26" stroke="#f0bcdb" stroke-width="1"/><text class="s" xml:space="preserve" x="64.0" y="136.0" style="fill:#f0bcdb" textLength="27.3" lengthAdjust="spacingAndGlyphs">guid</text><rect x="196.0" y="146.0" width="74.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="200.0" y="136.0" style="fill:#b9b9bd" textLength="34.8" lengthAdjust="spacingAndGlyphs">name</text><rect x="274.0" y="146.0" width="60.0" height="26" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><text class="s" xml:space="preserve" x="278.0" y="136.0" style="fill:#bdbfe8" textLength="38.7" lengthAdjust="spacingAndGlyphs">colour</text><rect x="338.0" y="146.0" width="130.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="342.0" y="136.0" style="fill:#b9b9bd" textLength="62.9" lengthAdjust="spacingAndGlyphs">coords × 4</text><rect x="60.0" y="186.0" width="132.0" height="26" fill="#f0bcdb" fill-opacity="0.26" stroke="#f0bcdb" stroke-width="1"/><rect x="196.0" y="186.0" width="74.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="274.0" y="186.0" width="60.0" height="26" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="338.0" y="186.0" width="130.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="60.0" y="226.0" width="132.0" height="26" fill="#f0bcdb" fill-opacity="0.26" stroke="#f0bcdb" stroke-width="1"/><rect x="196.0" y="226.0" width="74.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="274.0" y="226.0" width="60.0" height="26" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="338.0" y="226.0" width="130.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="60.0" y="266.0" width="132.0" height="26" fill="#f0bcdb" fill-opacity="0.26" stroke="#f0bcdb" stroke-width="1"/><rect x="196.0" y="266.0" width="74.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="274.0" y="266.0" width="60.0" height="26" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="338.0" y="266.0" width="130.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="60.0" y="306.0" width="132.0" height="26" fill="#f0bcdb" fill-opacity="0.26" stroke="#f0bcdb" stroke-width="1"/><rect x="196.0" y="306.0" width="74.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="274.0" y="306.0" width="60.0" height="26" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="338.0" y="306.0" width="130.0" height="26" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="60.0" y="384.0" textLength="309.7" lengthAdjust="spacingAndGlyphs">one line, four copies and a string that is never read</text><text class="s" xml:space="preserve" x="60.0" y="406.0" style="fill:#f0bcdb" textLength="299.8" lengthAdjust="spacingAndGlyphs">51 MB of drawing lifts the wasm heap by 300 MiB</text><text class="l" xml:space="preserve" x="660.0" y="86.0" style="fill:#8fd36a" textLength="187.4" lengthAdjust="spacingAndGlyphs">one batch, one side table</text><rect x="660.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="680.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="700.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="720.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="740.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="760.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="780.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="800.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="820.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="840.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="860.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="880.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="900.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="920.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="940.0" y="146.0" width="18.0" height="34" fill="#e8ac00" fill-opacity="0.30" stroke="#e8ac00" stroke-width="1"/><rect x="960.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="980.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="1000.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="1020.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="1040.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="1060.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="1080.0" y="146.0" width="18.0" height="34" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><text class="s" xml:space="preserve" x="660.0" y="136.0" style="fill:#8fd36a" textLength="269.5" lengthAdjust="spacingAndGlyphs">segments: coords · colour · width · source_id</text><rect x="780.0" y="288.0" width="200.0" height="34" fill="#b9b9bd" fill-opacity="0.22" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="776.0" y="344.0" textLength="212.9" lengthAdjust="spacingAndGlyphs">.meta side table: guid · name · kind</text><path d="M948.0,180.0 C948.0,232.0 820.0,234.0 820.0,286.0" fill="none" stroke="#e8ac00" stroke-width="1.6" stroke-dasharray="5 4"/><text class="s" xml:space="preserve" x="660.0" y="384.0" textLength="303.5" lengthAdjust="spacingAndGlyphs">streamed by HTTP Range, the way a point cloud is</text><text class="s" xml:space="preserve" x="660.0" y="406.0" style="fill:#e8ac00" textLength="339.2" lengthAdjust="spacingAndGlyphs">two ranged reads, and only when something is selected</text><text class="s" xml:space="preserve" x="28.0" y="456.0" textLength="1108.1" lengthAdjust="spacingAndGlyphs">The batch is what the GPU draws; the side table is what a human asks for. Keeping them apart is what makes a sheet openable on a machine that would otherwise die without a word.</text></svg>
