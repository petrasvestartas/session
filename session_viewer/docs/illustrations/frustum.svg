<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 500" role="img" aria-labelledby="t d"><title id="t">The frustum becomes a cube</title><desc id="d">The projection matrix and the divide by w take everything inside the viewing frustum and land it in a cube. Depth does not survive that trip evenly: with the near and far planes swapped, so that near maps to one and far to zero, the float values crowd where the geometry is instead of where it is not.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="301.6" lengthAdjust="spacingAndGlyphs">Depth does not survive evenly</text><text class="l" xml:space="preserve" x="60.0" y="86.0" textLength="241.5" lengthAdjust="spacingAndGlyphs">view space: metres from the eye</text><polygon points="200.0,206.0 560.0,122.0 560.0,378.0 200.0,294.0" fill="#111111" fill-opacity="0.07" stroke="#f4f4f6" stroke-width="1.3"/><line x1="100.0" y1="250.0" x2="560.0" y2="122.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="5 5"/><line x1="100.0" y1="250.0" x2="560.0" y2="378.0" stroke="#b9b9bd" stroke-width="1" stroke-dasharray="5 5"/><circle cx="100.0" cy="250.0" r="5" fill="#e8ac00"/><text class="s" xml:space="preserve" x="62.0" y="300.0" style="fill:#e8ac00" textLength="21.0" lengthAdjust="spacingAndGlyphs">eye</text><circle cx="200.0" cy="250.0" r="4.5" fill="#fa9ebc"/><circle cx="260.0" cy="250.0" r="4.5" fill="#fa9ebc"/><circle cx="350.0" cy="250.0" r="4.5" fill="#fa9ebc"/><circle cx="450.0" cy="250.0" r="4.5" fill="#fa9ebc"/><circle cx="560.0" cy="250.0" r="4.5" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="60.0" y="400.0" style="fill:#fa9ebc" textLength="265.0" lengthAdjust="spacingAndGlyphs">five points, spread out through the frustum</text><text class="s" xml:space="preserve" x="60.0" y="422.0" textLength="271.6" lengthAdjust="spacingAndGlyphs">at 1×, 1.5×, 2.5×, 4× and 8× the near distance</text><text class="l" xml:space="preserve" x="700.0" y="86.0" textLength="230.8" lengthAdjust="spacingAndGlyphs">clip, then divide by w: the cube</text><rect x="740.0" y="130.0" width="240.0" height="240.0" fill="#111111" fill-opacity="0.07" stroke="#f4f4f6" stroke-width="1.3"/><line x1="740.0" y1="130.0" x2="980.0" y2="130.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="740.0" y1="210.0" x2="980.0" y2="210.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="740.0" y1="274.0" x2="980.0" y2="274.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="740.0" y1="310.0" x2="980.0" y2="310.0" stroke="#fa9ebc" stroke-width="1.8"/><line x1="740.0" y1="340.0" x2="980.0" y2="340.0" stroke="#fa9ebc" stroke-width="1.8"/><text class="s" xml:space="preserve" x="1000.0" y="148.0" style="fill:#8fd36a" textLength="49.7" lengthAdjust="spacingAndGlyphs">near = 1</text><text class="s" xml:space="preserve" x="1000.0" y="380.0" style="fill:#8fd36a" textLength="38.8" lengthAdjust="spacingAndGlyphs">far = 0</text><text class="s" xml:space="preserve" x="700.0" y="400.0" style="fill:#fa9ebc" textLength="344.2" lengthAdjust="spacingAndGlyphs">the same five points: the far ones crowd into a thin band</text><text class="s" xml:space="preserve" x="700.0" y="422.0" textLength="437.3" lengthAdjust="spacingAndGlyphs">and that band sits at zero, where float32 is densest — which is the swap</text><text class="s" xml:space="preserve" x="28.0" y="458.0" textLength="372.4" lengthAdjust="spacingAndGlyphs">Only x and y go on to the viewport map, from [-1, 1] to pixels.</text><text class="s" xml:space="preserve" x="28.0" y="480.0" textLength="699.5" lengthAdjust="spacingAndGlyphs">Depth is compared and never displayed, so all that matters is that two nearby surfaces land on two different floats.</text></svg>
