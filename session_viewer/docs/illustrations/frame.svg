<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">The actual frame order</title><desc id="desc">Physical depth determines visibility. Selected solid edges draw before the black silhouette; selected standalone curves draw afterward so coincident mesh edges cannot erase yellow ink.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#526579"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172d43;font-size:18px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.label{font-weight:650}.arrow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}.box{fill:#eef4f9;stroke:#afc3d6;stroke-width:1.5}.gpu{fill:#edf6f0;stroke:#93b99e;stroke-width:1.5}</style><rect width="100%" height="100%" rx="16" fill="#fbfcfe"/><text class="title" x="28" y="40">Draw order is part of the visual contract</text><circle cx="49" cy="91" r="20" fill="#254d70"/><text x="49" y="97" text-anchor="middle" style="fill:white;font-weight:700">1</text><rect x="88" y="65" width="883" height="59" rx="8" fill="#eef4f9"/><text class="label" x="105" y="89">Prepare visibility</text><text class="small" x="105" y="111">Project/bin triangles only when camera or geometry changed.</text><circle cx="49" cy="163" r="20" fill="#254d70"/><text x="49" y="169" text-anchor="middle" style="fill:white;font-weight:700">2</text><rect x="88" y="137" width="883" height="59" rx="8" fill="#eef4f9"/><text class="label" x="105" y="161">Physical surfaces</text><text class="small" x="105" y="183">Opaque faces and clouds establish depth + primitive metadata.</text><circle cx="49" cy="235" r="20" fill="#254d70"/><text x="49" y="241" text-anchor="middle" style="fill:white;font-weight:700">3</text><rect x="88" y="209" width="883" height="59" rx="8" fill="#eef4f9"/><text class="label" x="105" y="233">Source ink and solid selection</text><text class="small" x="105" y="255">Ordinary strokes, source-face highlight, selected solid edges.</text><circle cx="49" cy="307" r="20" fill="#254d70"/><text x="49" y="313" text-anchor="middle" style="fill:white;font-weight:700">4</text><rect x="88" y="281" width="883" height="59" rx="8" fill="#e1f0e6"/><text class="label" x="105" y="305">One black silhouette</text><text class="small" x="105" y="327">Combine ordinary + selected mask coverage with max().</text><circle cx="49" cy="379" r="20" fill="#254d70"/><text x="49" y="385" text-anchor="middle" style="fill:white;font-weight:700">5</text><rect x="88" y="353" width="883" height="59" rx="8" fill="#eef4f9"/><text class="label" x="105" y="377">Selected standalone curves</text><text class="small" x="105" y="399">Yellow polylines cover coincident mesh ink; true occlusion stays.</text><circle cx="49" cy="451" r="20" fill="#254d70"/><text x="49" y="457" text-anchor="middle" style="fill:white;font-weight:700">6</text><rect x="88" y="425" width="883" height="59" rx="8" fill="#eef4f9"/><text class="label" x="105" y="449">Markers, controls and text</text><text class="small" x="105" y="471">Authored text has source identity; derived names are overlays.</text><text class="small" x="28" y="535">Picking uses a separate single-sample ID pass with the same source visibility rules.</text></svg>