<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 546" role="img" aria-labelledby="t d"><title id="t">Draw order of one frame</title><desc id="d">Six ordered passes: prepare finite visibility, draw physical surfaces that establish depth, draw source ink and the selected solid edges, composite one black silhouette from the ordinary and selected masks, draw selected standalone curves over coincident mesh ink, then markers, controls and text. Picking repeats the same lists in a separate ID pass.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#111111"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#111111;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#455b6b}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#111111}.ar{fill:none;stroke:#111111;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#eef0f2"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="398.7" lengthAdjust="spacingAndGlyphs">Draw order is part of the visual contract</text><circle cx="46" cy="94" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="99.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">1</text><rect data-box="0" x="76.0" y="64.0" width="880.0" height="63.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="88.0" data-box="0" textLength="125.9" lengthAdjust="spacingAndGlyphs">Prepare visibility</text><text class="s" xml:space="preserve" x="88.0" y="112.0" data-box="0" textLength="399.3" lengthAdjust="spacingAndGlyphs">project and bin triangles only when camera or geometry changed</text><circle cx="46" cy="167" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="172.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">2</text><rect data-box="1" x="76.0" y="137.0" width="880.0" height="63.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="161.0" data-box="1" textLength="128.0" lengthAdjust="spacingAndGlyphs">Physical surfaces</text><text class="s" xml:space="preserve" x="88.0" y="185.0" data-box="1" textLength="355.1" lengthAdjust="spacingAndGlyphs">opaque faces and clouds write depth + primitive metadata</text><circle cx="46" cy="240" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="245.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">3</text><rect data-box="2" x="76.0" y="210.0" width="880.0" height="63.0" rx="8" fill="#f0bcdb" stroke="#ce4095" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="234.0" data-box="2" textLength="263.8" lengthAdjust="spacingAndGlyphs">Source ink and selected solid edges</text><text class="s" xml:space="preserve" x="88.0" y="258.0" data-box="2" textLength="384.7" lengthAdjust="spacingAndGlyphs">ordinary strokes, source-face highlight, yellow solid boundaries</text><circle cx="46" cy="313" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="318.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">4</text><rect data-box="3" x="76.0" y="283.0" width="880.0" height="63.0" rx="8" fill="#e4e4e7" stroke="#b9b9bd" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="307.0" data-box="3" textLength="154.8" lengthAdjust="spacingAndGlyphs">One black silhouette</text><text class="s" xml:space="preserve" x="88.0" y="331.0" data-box="3" textLength="348.5" lengthAdjust="spacingAndGlyphs">max(ordinary, selected) mask coverage, composited once</text><circle cx="46" cy="386" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="391.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">5</text><rect data-box="4" x="76.0" y="356.0" width="880.0" height="63.0" rx="8" fill="#f0bcdb" stroke="#ce4095" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="380.0" data-box="4" textLength="204.0" lengthAdjust="spacingAndGlyphs">Selected standalone curves</text><text class="s" xml:space="preserve" x="88.0" y="404.0" data-box="4" textLength="414.6" lengthAdjust="spacingAndGlyphs">yellow polylines above coincident mesh ink; true occlusion still hides</text><circle cx="46" cy="459" r="16" fill="#1a1eb2"/><text class="l" xml:space="preserve" x="46.0" y="464.0" text-anchor="middle" style="fill:#ffffff" textLength="8.6" lengthAdjust="spacingAndGlyphs">6</text><rect data-box="5" x="76.0" y="429.0" width="880.0" height="63.0" rx="8" fill="#f0bcdb" stroke="#ce4095" stroke-width="1.5"/><text class="l" xml:space="preserve" x="88.0" y="453.0" data-box="5" textLength="198.1" lengthAdjust="spacingAndGlyphs">Markers, controls and text</text><text class="s" xml:space="preserve" x="88.0" y="477.0" data-box="5" textLength="331.2" lengthAdjust="spacingAndGlyphs">authored text has identity; derived names are overlays</text><text class="s" xml:space="preserve" x="28.0" y="524.0" textLength="550.5" lengthAdjust="spacingAndGlyphs">Picking repeats the same lists in a separate single-sample ID pass under the same toggles.</text></svg>
