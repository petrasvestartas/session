<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" role="img" aria-labelledby="t d"><title id="t">Read, type, check, understand</title><desc id="d">Read the idea, type the block, check that it compiles, then read why it is that way - and the reasoning is the part worth reading twice.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="187.7" lengthAdjust="spacingAndGlyphs">How one step goes</text><rect data-box="0" x="60.0" y="110.0" width="161.8" height="63.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="72.0" y="134.0" style="fill:#111111" data-box="0" textLength="98.9" lengthAdjust="spacingAndGlyphs">read the idea</text><text class="s" xml:space="preserve" x="72.0" y="158.0" style="fill:#455b6b" data-box="0" textLength="130.6" lengthAdjust="spacingAndGlyphs">one or two sentences</text><rect data-box="1" x="281.8" y="110.0" width="154.9" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="293.8" y="134.0" style="fill:#111111" data-box="1" textLength="108.0" lengthAdjust="spacingAndGlyphs">type the block</text><text class="s" xml:space="preserve" x="293.8" y="158.0" style="fill:#455b6b" data-box="1" textLength="121.3" lengthAdjust="spacingAndGlyphs">by hand, not pasted</text><rect data-box="2" x="496.7" y="110.0" width="196.2" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="508.7" y="134.0" style="fill:#111111" data-box="2" textLength="44.7" lengthAdjust="spacingAndGlyphs">check</text><text class="s" xml:space="preserve" x="508.7" y="158.0" style="fill:#455b6b" data-box="2" textLength="156.8" lengthAdjust="spacingAndGlyphs">cargo check · the browser</text><rect data-box="3" x="753.0" y="110.0" width="183.3" height="63.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="765.0" y="134.0" style="fill:#111111" data-box="3" textLength="141.8" lengthAdjust="spacingAndGlyphs">read the reasoning</text><text class="s" xml:space="preserve" x="765.0" y="158.0" style="fill:#455b6b" data-box="3" textLength="105.7" lengthAdjust="spacingAndGlyphs">why it is that way</text><path class="ar" d="M221.8,141.5 L273.8,141.5"/><path class="ar" d="M436.7,141.5 L488.7,141.5"/><path class="ar" d="M693.0,141.5 L745.0,141.5"/><text class="s" xml:space="preserve" x="60.0" y="262.0" textLength="569.5" lengthAdjust="spacingAndGlyphs">Nothing is hidden: the answer and the reasoning are on the page. The order is what matters -</text><text class="s" xml:space="preserve" x="60.0" y="286.0" style="fill:#e8ac00" textLength="549.5" lengthAdjust="spacingAndGlyphs">type it before you read why, and the reasoning lands on something you have already built.</text></svg>
