<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 494" role="img" aria-labelledby="t d"><title id="t">A surface command is a list of questions</title><desc id="d">Circle and the other NURBS curves use the shape tool. Surfaces use a Recipe: picked curves first, then points, numbers or a distance, and a build function that turns the answers into NURBS surfaces.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="331.1" lengthAdjust="spacingAndGlyphs">Three recipes, one gathering tool</text><rect data-box="0" x="28.0" y="80.0" width="110.0" height="37.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="104.0" style="fill:#111111" data-box="0" textLength="30.6" lengthAdjust="spacingAndGlyphs">Loft</text><rect data-box="1" x="164.0" y="80.0" width="180.0" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="176.0" y="104.0" style="fill:#111111" data-box="1" textLength="51.1" lengthAdjust="spacingAndGlyphs">Curves</text><text class="s" xml:space="preserve" x="176.0" y="128.0" style="fill:#455b6b" data-box="1" textLength="115.8" lengthAdjust="spacingAndGlyphs">2 or more, in order</text><path class="ar" d="M138.0,98.5 L158.0,98.5"/><rect data-box="2" x="370.0" y="80.0" width="150.0" height="63.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="382.0" y="104.0" style="fill:#111111" data-box="2" textLength="88.5" lengthAdjust="spacingAndGlyphs">build(input)</text><text class="s" xml:space="preserve" x="382.0" y="128.0" style="fill:#455b6b" data-box="2" textLength="103.3" lengthAdjust="spacingAndGlyphs">the new surfaces</text><path class="ar" d="M344.0,98.5 L364.0,98.5"/><rect data-box="3" x="28.0" y="169.0" width="110.0" height="37.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="193.0" style="fill:#111111" data-box="3" textLength="58.7" lengthAdjust="spacingAndGlyphs">Extrude</text><rect data-box="4" x="164.0" y="169.0" width="180.0" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="176.0" y="193.0" style="fill:#111111" data-box="4" textLength="51.1" lengthAdjust="spacingAndGlyphs">Curves</text><text class="s" xml:space="preserve" x="176.0" y="217.0" style="fill:#455b6b" data-box="4" textLength="69.2" lengthAdjust="spacingAndGlyphs">the profiles</text><path class="ar" d="M138.0,187.5 L158.0,187.5"/><rect data-box="5" x="370.0" y="169.0" width="180.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="382.0" y="193.0" style="fill:#111111" data-box="5" textLength="65.3" lengthAdjust="spacingAndGlyphs">Distance</text><text class="s" xml:space="preserve" x="382.0" y="217.0" style="fill:#455b6b" data-box="5" textLength="105.4" lengthAdjust="spacingAndGlyphs">along the normal</text><path class="ar" d="M344.0,187.5 L364.0,187.5"/><rect data-box="6" x="576.0" y="169.0" width="150.0" height="63.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="588.0" y="193.0" style="fill:#111111" data-box="6" textLength="88.5" lengthAdjust="spacingAndGlyphs">build(input)</text><text class="s" xml:space="preserve" x="588.0" y="217.0" style="fill:#455b6b" data-box="6" textLength="103.3" lengthAdjust="spacingAndGlyphs">the new surfaces</text><path class="ar" d="M550.0,187.5 L570.0,187.5"/><rect data-box="7" x="28.0" y="258.0" width="110.0" height="37.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="282.0" style="fill:#111111" data-box="7" textLength="58.4" lengthAdjust="spacingAndGlyphs">Revolve</text><rect data-box="8" x="164.0" y="258.0" width="180.0" height="63.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="176.0" y="282.0" style="fill:#111111" data-box="8" textLength="51.1" lengthAdjust="spacingAndGlyphs">Curves</text><text class="s" xml:space="preserve" x="176.0" y="306.0" style="fill:#455b6b" data-box="8" textLength="62.9" lengthAdjust="spacingAndGlyphs">the profile</text><path class="ar" d="M138.0,276.5 L158.0,276.5"/><rect data-box="9" x="370.0" y="258.0" width="180.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="382.0" y="282.0" style="fill:#111111" data-box="9" textLength="40.1" lengthAdjust="spacingAndGlyphs">Point</text><text class="s" xml:space="preserve" x="382.0" y="306.0" style="fill:#455b6b" data-box="9" textLength="55.7" lengthAdjust="spacingAndGlyphs">axis start</text><path class="ar" d="M344.0,276.5 L364.0,276.5"/><rect data-box="10" x="576.0" y="258.0" width="180.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="588.0" y="282.0" style="fill:#111111" data-box="10" textLength="40.1" lengthAdjust="spacingAndGlyphs">Point</text><text class="s" xml:space="preserve" x="588.0" y="306.0" style="fill:#455b6b" data-box="10" textLength="50.5" lengthAdjust="spacingAndGlyphs">axis end</text><path class="ar" d="M550.0,276.5 L570.0,276.5"/><rect data-box="11" x="782.0" y="258.0" width="180.0" height="63.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="794.0" y="282.0" style="fill:#111111" data-box="11" textLength="62.1" lengthAdjust="spacingAndGlyphs">Number</text><text class="s" xml:space="preserve" x="794.0" y="306.0" style="fill:#455b6b" data-box="11" textLength="34.0" lengthAdjust="spacingAndGlyphs">angle</text><path class="ar" d="M756.0,276.5 L776.0,276.5"/><rect data-box="12" x="988.0" y="258.0" width="150.0" height="63.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="1000.0" y="282.0" style="fill:#111111" data-box="12" textLength="88.5" lengthAdjust="spacingAndGlyphs">build(input)</text><text class="s" xml:space="preserve" x="1000.0" y="306.0" style="fill:#455b6b" data-box="12" textLength="103.3" lengthAdjust="spacingAndGlyphs">the new surfaces</text><path class="ar" d="M962.0,276.5 L982.0,276.5"/><rect data-box="13" x="28.0" y="361.0" width="1124.0" height="103.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="385.0" style="fill:#111111" data-box="13" textLength="341.1" lengthAdjust="spacingAndGlyphs">What the gathering tool does for every recipe</text><text class="s" xml:space="preserve" x="40.0" y="409.0" style="fill:#455b6b" data-box="13" textLength="581.3" lengthAdjust="spacingAndGlyphs">curves already selected answer the first step; Enter or Finish ends a step that takes any number</text><text class="s" xml:space="preserve" x="40.0" y="429.0" style="fill:#455b6b" data-box="13" textLength="582.6" lengthAdjust="spacingAndGlyphs">Enter takes a Number step's default; a Distance takes a click, a signed number or a typed vector</text><text class="s" xml:space="preserve" x="40.0" y="449.0" style="fill:#455b6b" data-box="13" textLength="621.6" lengthAdjust="spacingAndGlyphs">Open, Closed and Finish are chips under the command line: the recipe lists them, the tool shows them</text></svg>
