<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 588" role="img" aria-labelledby="t d"><title id="t">What the ID pass draws in each pick mode</title><desc id="d">The ID pass repeats the colour list, opaque and at one sample; each pick mode narrows it to the lanes that mode is about. A lane draws ids under the toggle that hides it in the colour frame - what a lane hides it cannot pick - except authored text, which covers geometry in every mode.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One list, five answers</text><rect x="1019.0" y="102.0" width="82.0" height="270.0" rx="4" fill="#f9e08a" fill-opacity="0.22"/><text class="s" xml:space="preserve" x="300.0" y="120.0" text-anchor="middle">face</text><text class="s" xml:space="preserve" x="300.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="376.0" y="120.0" text-anchor="middle">component</text><text class="s" xml:space="preserve" x="376.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="452.0" y="120.0" text-anchor="middle">splat</text><text class="s" xml:space="preserve" x="452.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="528.0" y="120.0" text-anchor="middle">edge</text><text class="s" xml:space="preserve" x="528.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="604.0" y="120.0" text-anchor="middle">pipe</text><text class="s" xml:space="preserve" x="604.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="680.0" y="120.0" text-anchor="middle">ribbon</text><text class="s" xml:space="preserve" x="680.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="756.0" y="120.0" text-anchor="middle">sphere</text><text class="s" xml:space="preserve" x="756.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="832.0" y="120.0" text-anchor="middle">marker</text><text class="s" xml:space="preserve" x="832.0" y="138.0" text-anchor="middle">dots</text><text class="s" xml:space="preserve" x="908.0" y="120.0" text-anchor="middle">control</text><text class="s" xml:space="preserve" x="908.0" y="138.0" text-anchor="middle">dots</text><text class="s" xml:space="preserve" x="984.0" y="120.0" text-anchor="middle">arena</text><text class="s" xml:space="preserve" x="984.0" y="138.0" text-anchor="middle">text</text><text class="s" xml:space="preserve" x="1060.0" y="120.0" text-anchor="middle">authored</text><text class="s" xml:space="preserve" x="1060.0" y="138.0" text-anchor="middle">text</text><text class="s" xml:space="preserve" x="1136.0" y="120.0" text-anchor="middle">source</text><text class="s" xml:space="preserve" x="1136.0" y="138.0" text-anchor="middle">ids</text><text class="s" xml:space="preserve" x="28.0" y="175.0">Object</text><rect x="265.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="569.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="604.0" y="175.0" text-anchor="middle" style="fill:#111111">edges</text><rect x="645.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="680.0" y="175.0" text-anchor="middle" style="fill:#111111">lines</text><rect x="721.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="756.0" y="175.0" text-anchor="middle" style="fill:#111111">edges+</text><rect x="797.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="832.0" y="175.0" text-anchor="middle" style="fill:#111111">points</text><rect x="949.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="1025.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="219.0">Edge</text><rect x="265.0" y="196.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="196.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="493.0" y="196.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="528.0" y="219.0" text-anchor="middle" style="fill:#111111">edges</text><rect x="1025.0" y="196.0" width="70.0" height="36.0" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="263.0">Component</text><rect x="341.0" y="240.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="240.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="493.0" y="240.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="528.0" y="263.0" text-anchor="middle" style="fill:#111111">edges</text><rect x="1025.0" y="240.0" width="70.0" height="36.0" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="307.0">Controls { cloud: false }</text><rect x="265.0" y="284.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="284.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="873.0" y="284.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="1025.0" y="284.0" width="70.0" height="36.0" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="351.0">Controls { cloud: true }</text><rect x="265.0" y="328.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="328.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="1025.0" y="328.0" width="70.0" height="36.0" rx="4" fill="#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="395.0">source query · F10</text><rect x="265.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="300.0" y="395.0" text-anchor="middle" style="fill:#111111">first</text><rect x="417.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="452.0" y="395.0" text-anchor="middle" style="fill:#111111">first</text><rect x="1101.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="490.0" y="372.0" width="532.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.16"/><text class="s" xml:space="preserve" x="500.0" y="395.0">returns before the ink pass</text><text class="s" xml:space="preserve" x="28.0" y="430.0">A tag names the toggle that gates the cell: edges = show_mesh_edges · lines = show_lines · points = show_points · edges+ = both edges and markers.</text><text class="s" xml:space="preserve" x="28.0" y="452.0">first = drawn only on the first page of a source query, before the accumulated ids exist.</text><rect data-box="0" x="28.0" y="478.0" width="700.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="502.0" style="fill:#111111" data-box="0">The rule</text><text class="s" xml:space="preserve" x="40.0" y="526.0" style="fill:#455b6b" data-box="0">a lane draws its ids under the same toggle that hides it in the colour frame.</text><text class="s" xml:space="preserve" x="40.0" y="546.0" style="fill:#455b6b" data-box="0">What a lane hides it cannot pick, or a user selects what they cannot see.</text><rect data-box="1" x="756.0" y="478.0" width="396.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="768.0" y="502.0" style="fill:#111111" data-box="1">The exception</text><text class="s" xml:space="preserve" x="768.0" y="526.0" style="fill:#455b6b" data-box="1">authored text is pickable in every mode,</text><text class="s" xml:space="preserve" x="768.0" y="546.0" style="fill:#455b6b" data-box="1">exactly as its visible plane covers geometry</text></svg>
