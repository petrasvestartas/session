<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 588" role="img" aria-labelledby="t d"><title id="t">What the ID pass draws in each pick mode</title><desc id="d">The ID pass repeats the colour list, opaque and at one sample; each pick mode narrows it to the lanes that mode is about. A lane draws ids under the toggle that hides it in the colour frame - what a lane hides it cannot pick - except authored text, which covers geometry in every mode.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="213.2" lengthAdjust="spacingAndGlyphs">One list, five answers</text><rect x="1019.0" y="102.0" width="82.0" height="270.0" rx="4" fill="#f9e08a" fill-opacity="0.22"/><text class="s" xml:space="preserve" x="300.0" y="120.0" text-anchor="middle" textLength="25.3" lengthAdjust="spacingAndGlyphs">face</text><text class="s" xml:space="preserve" x="300.0" y="138.0" text-anchor="middle" textLength="17.6" lengthAdjust="spacingAndGlyphs">ids</text><text class="s" xml:space="preserve" x="376.0" y="120.0" text-anchor="middle" textLength="70.5" lengthAdjust="spacingAndGlyphs">component</text><text class="s" xml:space="preserve" x="376.0" y="138.0" text-anchor="middle" textLength="17.6" lengthAdjust="spacingAndGlyphs">ids</text><text class="s" xml:space="preserve" x="452.0" y="120.0" text-anchor="middle" textLength="29.9" lengthAdjust="spacingAndGlyphs">splat</text>