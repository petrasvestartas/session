"#f9e08a"/><text class="s" xml:space="preserve" x="28.0" y="395.0" textLength="111.4" lengthAdjust="spacingAndGlyphs">source query · F10</text><rect x="265.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="300.0" y="395.0" text-anchor="middle" style="fill:#111111" textLength="24.4" lengthAdjust="spacingAndGlyphs">first</text><rect x="417.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="452.0" y="395.0" text-anchor="middle" style="fill:#111111" textLength="24.4" lengthAdjust="spacingAndGlyphs">first</text><rect x="1101.0" y="372.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="490.0" y="372.0" width="532.0" height="36.0" rx="4" fill="#e4e4e7" fill-opacity="0.16"/><text class="s" xml:space="preserve" x="500.0" y="395.0" textLength="164.6" lengthAdjust="spacingAndGlyphs">returns before the ink pass</text><text class="s" xml:space="preserve" x="28.0" y="430.0" textLength="905.8" lengthAdjust="spacingAndGlyphs">A tag names the toggle that gates the cell: edges = show_mesh_edges · lines = show_lines · points = show_points · edges+ = both edges and markers.</text><text class="s" xml:space="preserve" x="28.0" y="452.0" textLength="527.7" lengthAdjust="spacingAndGlyphs">first = drawn only on the first page of a source query, before the accumulated ids exist.</text><rect data-box="0" x="28.0" y="478.0" width="700.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="502.0" style="fill:#111111" data-box="0" textLength="61.5" lengthAdjust="spacingAndGlyphs">The rule</text><text class="s" xml:space="preserve" x="40.0" y="526.0" style="fill:#455b6b" data-box="0" textLength="457.5" lengthAdjust="spacingAndGlyphs">a lane draws its ids under the same toggle that hides it in the colour frame.</text><text class="s" xml:space="preserve" x="40.0" y="546.0" style="fill:#455b6b" data-box="0" textLength="436.0" lengthAdjust="spacingAndGlyphs">What a lane hides it cannot pick, or a user selects what they cannot see.</text><rect data-box="1" x="756.0" y="478.0" width="396.0" height="83.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="768.0" y="502.0" style="fill:#111111" data-box="1" textLength="104.5" lengthAdjust="spacingAndGlyphs">The exception</text><text class="s" xml:space="preserve" x="768.0" y="526.0" style="fill:#455b6b" data-box="1" textLength="243.3" lengthAdjust="spacingAndGlyphs">authored text is pickable in every mode,</text><text class="s" xml:space="preserve" x="768.0" y="546.0" style="fill:#455b6b" data-box="1" textLength="261.6" lengthAdjust="spacingAndGlyphs">exactly as its visible plane covers geometry</text></svg>
