"138.0" text-anchor="middle" textLength="23.6" lengthAdjust="spacingAndGlyphs">text</text><text class="s" xml:space="preserve" x="1060.0" y="120.0" text-anchor="middle" textLength="56.4" lengthAdjust="spacingAndGlyphs">authored</text><text class="s" xml:space="preserve" x="1060.0" y="138.0" text-anchor="middle" textLength="23.6" lengthAdjust="spacingAndGlyphs">text</text><text class="s" xml:space="preserve" x="1136.0" y="120.0" text-anchor="middle" textLength="40.8" lengthAdjust="spacingAndGlyphs">source</text><text class="s" xml:space="preserve" x="1136.0" y="138.0" text-anchor="middle" textLength="17.6" lengthAdjust="spacingAndGlyphs">ids</text><text class="s" xml:space="preserve" x="28.0" y="175.0" textLength="40.1" lengthAdjust="spacingAndGlyphs">Object</text><rect x="265.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="417.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="569.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="604.0" y="175.0" text-anchor="middle" style="fill:#111111" textLength="36.9" lengthAdjust="spacingAndGlyphs">edges</text><rect x="645.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="680.0" y="175.0" text-anchor="middle" style="fill:#111111" textLength="28.3" lengthAdjust="spacingAndGlyphs">lines</text><rect x="721.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="756.0" y="175.0" text-anchor="middle" style="fill:#111111" textLength="44.3" lengthAdjust="spacingAndGlyphs">edges+</text><rect x="797.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="832.0" y="175.0" text-anchor="middle" style="fill:#111111" textLength="38.2" lengthAdjust="spacingAndGlyphs">points</text><rect x="949.0" y="152.0" width="70.0" height="36.0" rx="4" fill="#bdbfe8"/><rect x="1025.0" y="152.0" width="70.0" height="