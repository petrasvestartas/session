<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1159 515" role="img" aria-labelledby="t d"><title id="t">One WebGPU frame, CPU side and GPU side</title><desc id="d">Long-lived objects are created once: instance, surface, adapter, device and queue, then a pipeline and a bind group. Every frame the CPU records commands into an encoder inside a render pass and submits them; the GPU executes them against the surface texture, which is then presented.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="573.0" lengthAdjust="spacingAndGlyphs">Created once, recorded every frame, executed by the GPU</text><rect data-box="0" x="28.0" y="66.0" width="205.5" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0" textLength="65.1" lengthAdjust="spacingAndGlyphs">Instance</text><text class="m" xml:space="preserve" x="40.0" y="114.0" style="fill:#111111" data-box="0" textLength="180.6" lengthAdjust="spacingAndGlyphs">Backends::BROWSER_WEBGPU</text><rect data-box="1" x="277.5" y="66.0" width="190.4" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="289.5" y="90.0" style="fill:#111111" data-box="1" textLength="56.3" lengthAdjust="spacingAndGlyphs">Surface</text><text class="m" xml:space="preserve" x="289.5" y="114.0" style="fill:#111111" data-box="1" textLength="165.5" lengthAdjust="spacingAndGlyphs">create_surface(canvas)</text><rect data-box="2" x="511.9" y="66.0" width="160.1" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="523.9" y="90.0" style="fill:#111111" data-box="2" textLength="60.5" lengthAdjust="spacingAndGlyphs">Adapter</text><text class="m" xml:space="preserve" x="523.9" y="114.0" style="fill:#111111" data-box="2" textLength="135.4" lengthAdjust="spacingAndGlyphs">compatible_surface</text><rect data-box="3" x="716.0" y="66.0" width="147.9" height="63.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="728.0" y="90.0" style="fill:#111111" data-box="3" textLength="115.0" lengthAdjust="spacingAndGlyphs">Device + Queue</text><text class="m" xml:space="preserve" x="728.0" y="114.0" style="fill:#111111" data-box="3" textLength="105.3" lengthAdjust="spacingAndGlyphs">request_device</text><path class="ar" d="M233.5,97.5 L277.5,97.5"/><path class="ar" d="M467.9,97.5 L511.9,97.5"/><path class="ar" d="M672.0,97.5 L716.0,97.5"/><rect data-box="4" x="907.9" y="66.0" width="223.8" height="63.0" rx="4" fill="#ffffff" stroke="#f0bcdb" stroke-width="1.5"/><text class="l" xml:space="preserve" x="919.9" y="90.0" style="fill:#111111" data-box="4" textLength="152.2" lengthAdjust="spacingAndGlyphs">Pipeline · BindGroup</text><text class="s" xml:space="preserve" x="919.9" y="114.0" style="fill:#455b6b" data-box="4" textLength="191.1" lengthAdjust="spacingAndGlyphs">immutable, reused every frame</text><path class="ar" d="M863.9,96.0 L907.9,96.0"/><text class="l" xml:space="preserve" x="28.0" y="150.0" style="fill:#c9ccd6" textLength="35.7" lengthAdjust="spacingAndGlyphs">once</text><text class="l" xml:space="preserve" x="28.0" y="190.0" style="fill:#c9ccd6" textLength="90.1" lengthAdjust="spacingAndGlyphs">every frame</text><rect data-box="5" x="28.0" y="204.0" width="356.8" height="143.0" rx="4" fill="#ffffff" stroke="#bdbfe8" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="228.0" style="fill:#111111" data-box="5" textLength="154.0" lengthAdjust="spacingAndGlyphs">CPU · render_frame()</text><text class="m" xml:space="preserve" x="40.0" y="252.0" style="fill:#111111" data-box="5" textLength="233.2" lengthAdjust="spacingAndGlyphs">resize once → configure surface</text><text class="m" xml:space="preserve" x="40.0" y="272.0" style="fill:#111111" data-box="5" textLength="158.0" lengthAdjust="spacingAndGlyphs">get_current_texture()</text><text class="m" xml:space="preserve" x="40.0" y="292.0" style="fill:#111111" data-box="5" textLength="263.3" lengthAdjust="spacingAndGlyphs">encoder.begin_render_pass { clear }</text><text class="m" xml:space="preserve" x="40.0" y="312.0" style="fill:#111111" data-box="5" textLength="331.0" lengthAdjust="spacingAndGlyphs">  set_pipeline · set_bind_group · draw(0..3)</text><text class="m" xml:space="preserve" x="40.0" y="332.0" style="fill:#111111" data-box="5" textLength="240.7" lengthAdjust="spacingAndGlyphs">queue.submit([encoder.finish()])</text><rect data-box="6" x="454.8" y="204.0" width="316.1" height="143.0" rx="4" fill="#ffffff" stroke="#f0bcdb" stroke-width="1.5"/><text class="l" xml:space="preserve" x="466.8" y="228.0" style="fill:#111111" data-box="6" textLength="247.2" lengthAdjust="spacingAndGlyphs">GPU · executes the submitted list</text><text class="s" xml:space="preserve" x="466.8" y="252.0" style="fill:#455b6b" data-box="6" textLength="148.3" lengthAdjust="spacingAndGlyphs">clear the surface texture</text><text class="s" xml:space="preserve" x="466.8" y="272.0" style="fill:#455b6b" data-box="6" textLength="147.0" lengthAdjust="spacingAndGlyphs">run vs_main three times</text><text class="s" xml:space="preserve" x="466.8" y="292.0" style="fill:#455b6b" data-box="6" textLength="187.6" lengthAdjust="spacingAndGlyphs">rasterize, run fs_main per pixel</text><text class="s" xml:space="preserve" x="466.8" y="312.0" style="fill:#455b6b" data-box="6" textLength="162.1" lengthAdjust="spacingAndGlyphs">write the color attachment</text><path class="ar" d="M384.8,244.0 L454.8,244.0"/><text class="s" xml:space="preserve" x="419.8" y="237.0" text-anchor="middle" textLength="42.4" lengthAdjust="spacingAndGlyphs">submit</text><path class="ar" d="M612.8,347.0 L612.8,387.0"/><text class="s" xml:space="preserve" x="622.8" y="377.0" textLength="99.2" lengthAdjust="spacingAndGlyphs">output.present()</text><rect data-box="7" x="28.0" y="399.0" width="742.8" height="83.0" rx="4" fill="#ffffff" stroke="#b9b9bd" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="423.0" style="fill:#111111" data-box="7" textLength="223.8" lengthAdjust="spacingAndGlyphs">The pass borrows the encoder</text><text class="s" xml:space="preserve" x="40.0" y="447.0" style="fill:#455b6b" data-box="7" textLength="470.0" lengthAdjust="spacingAndGlyphs">the braces around begin_render_pass end the borrow before encoder.finish();</text><text class="s" xml:space="preserve" x="40.0" y="467.0" style="fill:#455b6b" data-box="7" textLength="456.2" lengthAdjust="spacingAndGlyphs">a pipeline is expensive to create and never changes, so it lives on the struct</text></svg>
