<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1095 460" role="img" aria-labelledby="t d"><title id="t">How a Rust record reaches a WGSL shader</title><desc id="d">A repr(C) Pod struct is cast to bytes by bytemuck and written into a wgpu buffer. A bind group layout describes the shape, a bind group attaches the buffer at a group and binding number, and the shader declares the same group and binding with a matching struct, and the draw picks one row of it by instance index.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="428.6" lengthAdjust="spacingAndGlyphs">Rust struct → buffer → bind group → WGSL</text><rect data-box="0" x="28.0" y="66.0" width="228.2" height="163.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0" textLength="128.2" lengthAdjust="spacingAndGlyphs">Rust · instance.rs</text><text class="m" xml:space="preserve" x="40.0" y="114.0" style="fill:#111111" data-box="0" textLength="188.2" lengthAdjust="spacingAndGlyphs">#[repr(C)] #[derive(Pod)]</text><text class="m" xml:space="preserve" x="40.0" y="134.0" style="fill:#111111" data-box="0" textLength="127.9" lengthAdjust="spacingAndGlyphs">struct Instance {</text><text class="m" xml:space="preserve" x="40.0" y="154.0" style="fill:#111111" data-box="0" textLength="180.6" lengthAdjust="spacingAndGlyphs">  model: [f32; 16], // 0</text><text class="m" xml:space="preserve" x="40.0" y="174.0" style="fill:#111111" data-box="0" textLength="188.2" lengthAdjust="spacingAndGlyphs">  color: [f32; 4],  // 64</text><text class="m" xml:space="preserve" x="40.0" y="194.0" style="fill:#111111" data-box="0" textLength="188.2" lengthAdjust="spacingAndGlyphs">  flags: u32, …     // 80</text><text class="m" xml:space="preserve" x="40.0" y="214.0" style="fill:#111111" data-box="0" textLength="203.2" lengthAdjust="spacingAndGlyphs">}                   // 96 B</text><rect data-box="1" x="345.1" y="66.0" width="189.4" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="357.1" y="90.0" style="fill:#111111" data-box="1" textLength="97.6" lengthAdjust="spacingAndGlyphs">wgpu::Buffer</text><text class="s" xml:space="preserve" x="357.1" y="114.0" style="fill:#455b6b" data-box="1" textLength="134.7" lengthAdjust="spacingAndGlyphs">STORAGE | COPY_DST</text><text class="s" xml:space="preserve" x="357.1" y="134.0" style="fill:#455b6b" data-box="1" textLength="70.1" lengthAdjust="spacingAndGlyphs">rows × 96 B</text><text class="m" xml:space="preserve" x="357.1" y="154.0" style="fill:#111111" data-box="1" textLength="135.9" lengthAdjust="spacingAndGlyphs">queue.write_buffer</text><text class="s" xml:space="preserve" x="357.1" y="174.0" style="fill:#455b6b" data-box="1" textLength="144.3" lengthAdjust="spacingAndGlyphs">rewrites one row's flags</text><rect data-box="2" x="616.5" y="66.0" width="223.8" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="628.5" y="90.0" style="fill:#111111" data-box="2" textLength="80.0" lengthAdjust="spacingAndGlyphs">BindGroup</text><text class="s" xml:space="preserve" x="628.5" y="114.0" style="fill:#455b6b" data-box="2" textLength="150.5" lengthAdjust="spacingAndGlyphs">layout: Layouts::instance</text><text class="m" xml:space="preserve" x="628.5" y="134.0" style="fill:#111111" data-box="2" textLength="135.5" lengthAdjust="spacingAndGlyphs">group 2, binding 0</text><text class="m" xml:space="preserve" x="628.5" y="154.0" style="fill:#111111" data-box="2" textLength="150.5" lengthAdjust="spacingAndGlyphs">set_bind_group(2, …)</text><text class="s" xml:space="preserve" x="628.5" y="174.0" style="fill:#455b6b" data-box="2" textLength="181.9" lengthAdjust="spacingAndGlyphs">rebuilt when the buffer grows</text><rect data-box="3" x="884.3" y="66.0" width="182.8" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="896.3" y="90.0" style="fill:#111111" data-box="3" textLength="42.0" lengthAdjust="spacingAndGlyphs">WGSL</text><text class="m" xml:space="preserve" x="896.3" y="114.0" style="fill:#111111" data-box="3" textLength="158.0" lengthAdjust="spacingAndGlyphs">@group(2) @binding(0)</text><text class="m" xml:space="preserve" x="896.3" y="134.0" style="fill:#111111" data-box="3" textLength="135.5" lengthAdjust="spacingAndGlyphs">var&lt;storage, read&gt;</text><text class="m" xml:space="preserve" x="896.3" y="154.0" style="fill:#111111" data-box="3" textLength="75.3" lengthAdjust="spacingAndGlyphs">instances:</text><text class="m" xml:space="preserve" x="896.3" y="174.0" style="fill:#111111" data-box="3" textLength="112.9" lengthAdjust="spacingAndGlyphs">array&lt;Instance&gt;</text><path class="ar" d="M256.2,147.5 L345.1,147.5"/><text class="s" xml:space="preserve" x="300.6" y="140.5" text-anchor="middle" textLength="56.7" lengthAdjust="spacingAndGlyphs">cast_slice</text><path class="ar" d="M534.4,127.5 L616.5,127.5"/><text class="s" xml:space="preserve" x="575.5" y="120.5" text-anchor="middle" textLength="50.9" lengthAdjust="spacingAndGlyphs">entries[]</text><path class="ar" d="M840.3,127.5 L884.3,127.5"/><path d="M142.1,233.0 C142.1,273.0 975.7,273.0 975.7,233.0" fill="none" stroke="#e8ac00" stroke-width="2"/><text class="s" xml:space="preserve" x="547.5" y="291.0" text-anchor="middle" style="fill:#8a6a10" textLength="444.6" lengthAdjust="spacingAndGlyphs">same field order, sizes and 16-byte alignment · checked by the layout test</text><rect data-box="4" x="28.0" y="309.0" width="327.2" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="333.0" style="fill:#111111" data-box="4" textLength="142.8" lengthAdjust="spacingAndGlyphs">One row per object</text><text class="s" xml:space="preserve" x="40.0" y="357.0" style="fill:#455b6b" data-box="4" textLength="265.3" lengthAdjust="spacingAndGlyphs">The draw picks the row; the shader reads it.</text><text class="m" xml:space="preserve" x="40.0" y="377.0" style="fill:#111111" data-box="4" textLength="180.6" lengthAdjust="spacingAndGlyphs">draw(0..3, row..row + 1)</text><text class="m" xml:space="preserve" x="40.0" y="397.0" style="fill:#111111" data-box="4" textLength="188.2" lengthAdjust="spacingAndGlyphs">let row = instance_index;</text><text class="m" xml:space="preserve" x="40.0" y="417.0" style="fill:#111111" data-box="4" textLength="278.5" lengthAdjust="spacingAndGlyphs">p = mvp * instances[row].model * pos;</text><rect data-box="5" x="379.2" y="309.0" width="364.3" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="391.2" y="333.0" style="fill:#111111" data-box="5" textLength="220.4" lengthAdjust="spacingAndGlyphs">Group scheme for every draw</text><text class="m" xml:space="preserve" x="391.2" y="357.0" style="fill:#111111" data-box="5" textLength="105.4" lengthAdjust="spacingAndGlyphs">0  mvp uniform</text><text class="m" xml:space="preserve" x="391.2" y="377.0" style="fill:#111111" data-box="5" textLength="158.0" lengthAdjust="spacingAndGlyphs">1  line / pen uniform</text><text class="m" xml:space="preserve" x="391.2" y="397.0" style="fill:#111111" data-box="5" textLength="338.7" lengthAdjust="spacingAndGlyphs">2  instances + translations (+ depth for ink)</text><text class="m" xml:space="preserve" x="391.2" y="417.0" style="fill:#111111" data-box="5" textLength="165.6" lengthAdjust="spacingAndGlyphs">3  the lane's own rows</text></svg>
