<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" role="img" aria-labelledby="t d"><title id="t">Finite triangle versus infinite plane</title><desc id="d">In screen space a finite triangle's depth plane continues beyond its edges. The old test transferred that plane's depth to the stroke axis even where the axis lies outside the triangle, so visible seams were hidden. The finite check asks whether the triangle contains the axis point; only a finite, nearer hit can hide the ink.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="409.5" lengthAdjust="spacingAndGlyphs">A nearby plane is not an infinite occluder</text><polygon points="120,440 460,160 460,440" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="1.6"/><polygon points="460,160 700,440 460,440" fill="none" stroke="#bdbfe8" stroke-width="1.4" stroke-dasharray="7 6"/><rect x="500" y="130" width="60" height="340" fill="#f9e08a" fill-opacity="0.85" stroke="#e8ac00" stroke-width="1.4"/><line x1="530" y1="130" x2="530" y2="470" stroke="#f4f4f6" stroke-width="2"/><text class="s" xml:space="preserve" x="530.0" y="120.0" text-anchor="middle" textLength="129.8" lengthAdjust="spacingAndGlyphs">stroke footprint · axis</text><circle cx="470" cy="300" r="5" fill="#bdbfe8"/><circle cx="530" cy="300" r="5" fill="#8fd36a"/><line x1="475" y1="300" x2="525" y2="300" stroke="#8fd36a" stroke-width="1.6"/><line x1="470" y1="300" x2="330" y2="200" stroke="#bdbfe8" stroke-width="1"/><text class="s" xml:space="preserve" x="60.0" y="178.0" textLength="239.6" lengthAdjust="spacingAndGlyphs">fringe sample: inside the finite triangle,</text><text class="s" xml:space="preserve" x="60.0" y="196.0" textLength="160.3" lengthAdjust="spacingAndGlyphs">which really is nearer here</text><line x1="535" y1="300" x2="600" y2="300" stroke="#8fd36a" stroke-width="1"/><text class="s" xml:space="preserve" x="606.0" y="296.0" style="fill:#8fd36a" textLength="201.4" lengthAdjust="spacingAndGlyphs">axis sample: outside the triangle;</text><text class="s" xml:space="preserve" x="606.0" y="314.0" style="fill:#8fd36a" textLength="204.7" lengthAdjust="spacingAndGlyphs">only the extended plane is nearer</text><text class="s" xml:space="preserve" x="28.0" y="480.0" textLength="352.1" lengthAdjust="spacingAndGlyphs">solid = finite triangle · dashed = the same plane, extended</text><rect data-box="0" x="860.0" y="130.0" width="272.0" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="872.0" y="154.0" style="fill:#111111" data-box="0" textLength="96.6" lengthAdjust="spacingAndGlyphs">Old rejection</text><text class="s" xml:space="preserve" x="872.0" y="178.0" style="fill:#455b6b" data-box="0" textLength="215.1" lengthAdjust="spacingAndGlyphs">transfer the plane depth to the axis</text><text class="s" xml:space="preserve" x="872.0" y="198.0" style="fill:#455b6b" data-box="0" textLength="207.7" lengthAdjust="spacingAndGlyphs">the plane continues past the edge</text><text class="s" xml:space="preserve" x="872.0" y="218.0" style="fill:#455b6b" data-box="0" textLength="171.5" lengthAdjust="spacingAndGlyphs">visible ink is wrongly hidden</text><rect data-box="1" x="860.0" y="257.0" width="272.0" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="872.0" y="281.0" style="fill:#111111" data-box="1" textLength="158.3" lengthAdjust="spacingAndGlyphs">Finite visibility check</text><text class="s" xml:space="preserve" x="872.0" y="305.0" style="fill:#455b6b" data-box="1" textLength="211.2" lengthAdjust="spacingAndGlyphs">does this triangle contain the axis?</text><text class="s" xml:space="preserve" x="872.0" y="325.0" style="fill:#455b6b" data-box="1" textLength="203.0" lengthAdjust="spacingAndGlyphs">no → it cannot occlude that point</text><text class="s" xml:space="preserve" x="872.0" y="345.0" style="fill:#455b6b" data-box="1" textLength="231.8" lengthAdjust="spacingAndGlyphs">then test the other triangles in the tile</text><text class="s" xml:space="preserve" x="872.0" y="365.0" style="fill:#455b6b" data-box="1" textLength="219.8" lengthAdjust="spacingAndGlyphs">only a finite, nearer hit hides the ink</text></svg>
