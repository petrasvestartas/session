<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Finite triangle versus infinite plane</title><desc id="desc">In screen space a stroke sample lies on a neighboring triangle, but the stroke axis lies beyond the triangle boundary. Extending the plane would incorrectly hide the axis. A finite footprint test rejects that false occluder.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#526579"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#172d43;font-size:18px}.title{font-size:24px;font-weight:700}.small{font-size:16px}.label{font-weight:650}.arrow{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}.box{fill:#eef4f9;stroke:#afc3d6;stroke-width:1.5}.gpu{fill:#edf6f0;stroke:#93b99e;stroke-width:1.5}</style><rect width="100%" height="100%" rx="16" fill="#fbfcfe"/><text class="title" x="28" y="40">A nearby plane is not an infinite occluder</text><rect x="40" y="76" width="500" height="337" rx="12" fill="#f0f4f8"/><text class="small" x="58" y="105">Screen-space footprint (magnified)</text><path d="M82 363 L316 140 L316 363 Z" fill="#c8d9e7" stroke="#456986" stroke-width="2"/><path d="M316 140 L458 363 H316" fill="none" stroke="#859aac" stroke-width="2" stroke-dasharray="7 6"/><path d="M342 130 V383" stroke="#f0c726" stroke-width="72" opacity=".35"/><path d="M342 130 V383" stroke="#172d43" stroke-width="2"/><circle cx="309" cy="310" r="5" fill="#265f8a"/><circle cx="342" cy="310" r="5" fill="#18764b"/><path class="arrow" d="M306 305 L215 238"/><text class="small" x="75" y="225">covered fringe sample</text><path class="arrow" d="M350 305 L445 251"/><text class="small" x="365" y="231">stroke axis</text><text class="small" x="58" y="396">Solid blue = finite triangle · dashed = plane extension</text><rect class="box" x="579" y="86" width="393" height="130" rx="10"/><text class="label" x="597" y="116">Old rejection</text><text class="small" x="597" y="143">Triangle depth is transferred to the axis.</text><text class="small" x="597" y="167">The plane continues beyond its boundary.</text><text class="small" x="597" y="191">Visible ink is wrongly hidden.</text><rect class="gpu" x="579" y="251" width="393" height="158" rx="10"/><text class="label" x="597" y="281">Finite visibility check</text><text class="small" x="597" y="308">Does this triangle contain the axis?</text><text class="small" x="597" y="332">No: it cannot occlude that point.</text><text class="small" x="597" y="356">Check the other triangles in the tile.</text><text class="small" x="597" y="380">Only a finite, nearer hit can hide the ink.</text><text class="small" x="40" y="454">Shared mesh/edge samples fix geometry mismatch; this test fixes the remaining visibility error.</text></svg>