<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 400" role="img" aria-labelledby="t d"><title id="t">Instance, surface, adapter, device</title><desc id="d">The instance picks the backend, the surface is the canvas you present to, the adapter is one physical GPU chosen to be compatible with that surface, and the device is the handle every later resource comes from.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="360.9" lengthAdjust="spacingAndGlyphs">The four objects before any drawing</text><text class="l" xml:space="preserve" x="28.0" y="68.0" style="fill:#b9b9bd" textLength="298.1" lengthAdjust="spacingAndGlyphs">each one is made from the one before it</text><rect data-box="0" x="60.0" y="130.0" width="162.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="72.0" y="154.0" style="fill:#111111" data-box="0" textLength="65.3" lengthAdjust="spacingAndGlyphs">Instance</text><text class="s" xml:space="preserve" x="72.0" y="178.0" style="fill:#455b6b" data-box="0" textLength="90.9" lengthAdjust="spacingAndGlyphs">which backend</text><text class="s" xml:space="preserve" x="72.0" y="198.0" style="fill:#455b6b" data-box="0" textLength="121.3" lengthAdjust="spacingAndGlyphs">BROWSER_WEBGPU</text><rect data-box="1" x="282.0" y="130.0" width="141.1" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="294.0" y="154.0" style="fill:#111111" data-box="1" textLength="56.5" lengthAdjust="spacingAndGlyphs">Surface</text><text class="s" xml:space="preserve" x="294.0" y="178.0" style="fill:#455b6b" data-box="1" textLength="65.0" lengthAdjust="spacingAndGlyphs">the canvas</text><text class="s" xml:space="preserve" x="294.0" y="198.0" style="fill:#455b6b" data-box="1" textLength="99.8" lengthAdjust="spacingAndGlyphs">you present to it</text><rect data-box="2" x="483.1" y="130.0" width="148.0" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="495.1" y="154.0" style="fill:#111111" data-box="2" textLength="61.3" lengthAdjust="spacingAndGlyphs">Adapter</text><text class="s" xml:space="preserve" x="495.1" y="178.0" style="fill:#455b6b" data-box="2" textLength="105.8" lengthAdjust="spacingAndGlyphs">one physical GPU</text><text class="s" xml:space="preserve" x="495.1" y="198.0" style="fill:#455b6b" data-box="2" textLength="119.1" lengthAdjust="spacingAndGlyphs">compatible_surface</text><rect data-box="3" x="691.1" y="130.0" width="182.5" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="703.1" y="154.0" style="fill:#111111" data-box="3" textLength="115.2" lengthAdjust="spacingAndGlyphs">Device + Queue</text><text class="s" xml:space="preserve" x="703.1" y="178.0" style="fill:#455b6b" data-box="3" textLength="133.0" lengthAdjust="spacingAndGlyphs">makes every resource</text><text class="s" xml:space="preserve" x="703.1" y="198.0" style="fill:#455b6b" data-box="3" textLength="160.4" lengthAdjust="spacingAndGlyphs">and takes every command</text><path class="ar" d="M222.0,171.5 L274.0,171.5"/><text class="s" xml:space="preserve" x="248.0" y="164.5" text-anchor="middle" textLength="41.6" lengthAdjust="spacingAndGlyphs">canvas</text><path class="ar" d="M423.1,171.5 L475.1,171.5"/><text class="s" xml:space="preserve" x="449.1" y="164.5" text-anchor="middle" textLength="46.7" lengthAdjust="spacingAndGlyphs">request</text><path class="ar" d="M631.1,171.5 L683.1,171.5"/><text class="s" xml:space="preserve" x="657.1" y="164.5" text-anchor="middle" textLength="46.7" lengthAdjust="spacingAndGlyphs">request</text><text class="s" xml:space="preserve" x="60.0" y="320.0" textLength="575.4" lengthAdjust="spacingAndGlyphs">The adapter is requested WITH the surface: a GPU that cannot present to this canvas is no use,</text><text class="s" xml:space="preserve" x="60.0" y="344.0" style="fill:#e8ac00" textLength="434.7" lengthAdjust="spacingAndGlyphs">and asking for it later is how a device ends up unable to show anything.</text></svg>
