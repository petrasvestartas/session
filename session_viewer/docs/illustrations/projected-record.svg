<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 580" role="img" aria-labelledby="t d"><title id="t">A triangle stored as the test that will be run on it</title><desc id="d">The 96-byte projected record holds four inward half-planes, a depth gradient and a bounds box, so asking whether a screen point is covered costs four dot products, a bounds test and one multiply-add.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">A triangle, stored as the test that will be run on it</text><polygon points="250,200 500,268 312,420" fill="#bdbfe8" opacity="0.55"/><rect x="232" y="182" width="286" height="256" fill="none" stroke="#9a9aa4" stroke-width="1.2" stroke-dasharray="4 4"/><text class="m" xml:space="preserve" x="232.0" y="170.0" style="fill:#c9ccd6">bounds = (lo.xy, hi.zw)</text><circle cx="250" cy="200" r="4.2" fill="#f4f4f6"/><circle cx="500" cy="268" r="4.2" fill="#f4f4f6"/><circle cx="312" cy="420" r="4.2" fill="#f4f4f6"/><path class="ar" d="M375.0,234.0 L362.2,271.9"/><text class="m" xml:space="preserve" x="383.3" y="214.4">edge0.xy</text><path class="ar" d="M406.0,344.0 L376.6,316.9"/><text class="m" xml:space="preserve" x="425.1" y="366.6">edge1.xy</text><path class="ar" d="M281.0,310.0 L320.3,302.5"/><text class="m" xml:space="preserve" x="255.5" y="319.9" text-anchor="end">edge2.xy</text><path d="M220,246 L320,188" stroke="#e07a26" stroke-width="1.8" stroke-dasharray="7 5"/><text class="s" xml:space="preserve" x="324.0" y="186.0" style="fill:#e07a26">edge3: the near-plane cut</text><circle cx="500" cy="268" r="11" fill="none" stroke="#e8ac00" stroke-width="2.2"/><text class="s" xml:space="preserve" x="490.0" y="310.0" text-anchor="middle" style="fill:#e8ac00">gradient.z = the nearest corner</text><path class="ar" d="M324.0,306.0 L394.0,326.0"/><text class="s" xml:space="preserve" x="400.0" y="332.0">gradient.xy · depth per pixel</text><path d="M250,200 L190,134" stroke="#9a9aa4" stroke-width="1.1"/><text class="m" xml:space="preserve" x="28.0" y="124.0">reference = (edge0.w, edge1.w, edge2.w)</text><text class="s" xml:space="preserve" x="28.0" y="142.0" style="fill:#c9ccd6">the x, y and depth of points[0]</text><rect data-box="0" x="620.0" y="110.0" width="417.2" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="632.0" y="134.0" style="fill:#111111" data-box="0">projected_triangle_at(t, at)</text><text class="m" xml:space="preserve" x="632.0" y="158.0" style="fill:#111111" data-box="0">count &lt; 3                       → (0, 0)</text><text class="m" xml:space="preserve" x="632.0" y="178.0" style="fill:#111111" data-box="0">at outside bounds ± 1/256        → (0, 0)</text><text class="m" xml:space="preserve" x="632.0" y="198.0" style="fill:#111111" data-box="0">any(dot(edge_i.xy, at) + edge_i.z &lt; −1/256) → (0, 0)</text><text class="m" xml:space="preserve" x="632.0" y="218.0" style="fill:#111111" data-box="0">else (edge2.w + dot(gradient.xy, at − reference), 1)</text><text class="s" xml:space="preserve" x="620.0" y="257.0" style="fill:#c9ccd6">1/256 px is the rasterizer's vertex snap — the same slack the tile binning uses,</text><text class="s" xml:space="preserve" x="620.0" y="277.0" style="fill:#c9ccd6">on the bounds and on every edge.</text><rect data-box="1" x="620.0" y="297.0" width="389.2" height="123.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="632.0" y="321.0" style="fill:#111111" data-box="1">edge3.w is the corner count</text><text class="s" xml:space="preserve" x="632.0" y="345.0" style="fill:#455b6b" data-box="1">3, or 4 after a near-plane clip</text><text class="s" xml:space="preserve" x="632.0" y="365.0" style="fill:#455b6b" data-box="1">below 3 the record is empty and answers (0, 0)</text><text class="s" xml:space="preserve" x="632.0" y="385.0" style="fill:#455b6b" data-box="1">sign(area) flips all four planes, so inward is inward</text><text class="s" xml:space="preserve" x="632.0" y="405.0" style="fill:#455b6b" data-box="1">whichever way the triangle wound</text><rect x="28" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="40.0" y="500.0" style="fill:#111111">0</text><text class="m" xml:space="preserve" x="40.0" y="518.0" style="fill:#111111">edge0</text><rect x="186" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="198.0" y="500.0" style="fill:#111111">16</text><text class="m" xml:space="preserve" x="198.0" y="518.0" style="fill:#111111">edge1</text><rect x="344" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="356.0" y="500.0" style="fill:#111111">32</text><text class="m" xml:space="preserve" x="356.0" y="518.0" style="fill:#111111">edge2</text><rect x="502" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="514.0" y="500.0" style="fill:#111111">48</text><text class="m" xml:space="preserve" x="514.0" y="518.0" style="fill:#111111">edge3</text><rect x="660" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="672.0" y="500.0" style="fill:#111111">64</text><text class="m" xml:space="preserve" x="672.0" y="518.0" style="fill:#111111">gradient</text><rect x="818" y="480" width="150" height="46" rx="6" fill="#fa9ebc"/><text class="m" xml:space="preserve" x="830.0" y="500.0" style="fill:#111111">80</text><text class="m" xml:space="preserve" x="830.0" y="518.0" style="fill:#111111">bounds</text><text class="s" xml:space="preserve" x="28.0" y="554.0" style="fill:#c9ccd6">96 B, asserted field by field against the Rust mirror · projected once per camera and geometry revision, read by every ink fragment</text></svg>
