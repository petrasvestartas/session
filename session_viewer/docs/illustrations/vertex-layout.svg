<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Rust memory layout versus WGSL alignment</title><desc id="d">A repr(C) Rust struct and its WGSL mirror must agree on offsets. Scalars are 4 bytes; vec3 is aligned to 16 bytes in WGSL, so a Rust struct that packs three floats without padding shifts every following field. The viewer uses vec4 or explicit padding and asserts size and offsets at compile time.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="323.9" lengthAdjust="spacingAndGlyphs">96 bytes, the same on both sides</text><text class="l" xml:space="preserve" x="28.0" y="76.0" textLength="265.8" lengthAdjust="spacingAndGlyphs">Instance (instance.rs ↔ scene.wgsl)</text><rect data-box="c8828" x="28.0" y="88" width="420.0" height="32" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="36.0" y="109.0" style="fill:#111111" data-box="c8828" textLength="353.7" lengthAdjust="spacingAndGlyphs">model: [f32;16] · mat4x4&lt;f32&gt; · 64 B · offset 0</text><rect data-box="c88448" x="448.0" y="88" width="159.7" height="32" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="456.0" y="109.0" style="fill:#111111" data-box="c88448" textLength="143.0" lengthAdjust="spacingAndGlyphs">color: [f32;4] · 64</text><rect data-box="c88608" x="607.7" y="88" width="76.5" height="32" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="615.7" y="109.0" style="fill:#111111" data-box="c88608" textLength="60.2" lengthAdjust="spacingAndGlyphs">flags 80</text><rect data-box="c88684" x="684.2" y="88" width="96.0" height="32" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="692.2" y="109.0" style="fill:#111111" data-box="c88684" textLength="60.2" lengthAdjust="spacingAndGlyphs">_pad0 84</text><rect data-box="c88780" x="780.2" y="88" width="91.6" height="32" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="m" xml:space="preserve" x="788.2" y="109.0" style="fill:#111111" data-box="c88780" textLength="75.3" lengthAdjust="spacingAndGlyphs">spacing 88</text><rect data-box="c88872" x="871.8" y="88" width="70.0" height="32" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="m" xml:space="preserve" x="879.8" y="109.0" style="fill:#111111" data-box="c88872" textLength="52.7" lengthAdjust="spacingAndGlyphs">_pad 92</text><text class="s" xml:space="preserve" x="28.0" y="146.0" textLength="690.2" lengthAdjust="spacingAndGlyphs">const _: () = assert!(size_of::&lt;Instance&gt;() == 96);  the layout test parses the WGSL struct and compares every offset.</text><text class="l" xml:space="preserve" x="28.0" y="186.0" textLength="303.7" lengthAdjust="spacingAndGlyphs">The trap: vec3 is 16-byte aligned in WGSL</text><rect data-box="c19828" x="28.0" y="198" width="170.0" height="32" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="m" xml:space="preserve" x="36.0" y="219.0" style="fill:#111111" data-box="c19828" textLength="143.0" lengthAdjust="spacingAndGlyphs">Rust [f32;3] · 12 B</text><rect data-box="c198198" x="198.0" y="198" width="120.0" height="32" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="m" xml:space="preserve" x="206.0" y="219.0" style="fill:#111111" data-box="c198198" textLength="97.8" lengthAdjust="spacingAndGlyphs">next: u32 @12</text><text class="s" xml:space="preserve" x="332.0" y="219.0" textLength="222.2" lengthAdjust="spacingAndGlyphs">Rust packs the next field at byte 12…</text><rect data-box="c24028" x="28.0" y="240" width="174.8" height="32" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="36.0" y="261.0" style="fill:#111111" data-box="c24028" textLength="158.0" lengthAdjust="spacingAndGlyphs">WGSL vec3&lt;f32&gt; · 12 B</text><rect data-box="c240203" x="202.8" y="240" width="50.0" height="32" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="m" xml:space="preserve" x="210.8" y="261.0" style="fill:#111111" data-box="c240203" textLength="22.6" lengthAdjust="spacingAndGlyphs">pad</text><rect data-box="c240253" x="252.8" y="240" width="120.0" height="32" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="m" xml:space="preserve" x="260.8" y="261.0" style="fill:#111111" data-box="c240253" textLength="97.8" lengthAdjust="spacingAndGlyphs">next: u32 @16</text><text class="s" xml:space="preserve" x="386.8" y="261.0" textLength="339.6" lengthAdjust="spacingAndGlyphs">…WGSL reads it at 16. Use vec4, or add explicit padding.</text></svg>
