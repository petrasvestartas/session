" stroke-width="1.6" stroke-dasharray="7 5"/><polygon points="190.0,196.0 416.0,244.0 268.0,392.0" fill="none" stroke="#f4f4f6" stroke-width="2"/><text class="l" xml:space="preserve" x="60.0" y="86.0">one projected triangle, and the tiles its quad covers</text><text class="s" xml:space="preserve" x="60.0" y="466.0" style="fill:#8fd36a">13 tiles the polygon touches, kept</text><text class="s" xml:space="preserve" x="60.0" y="488.0" style="fill:#fa9ebc">17 inside the bounds it cannot reach, discarded by covered_tile</text><text class="l" xml:space="preserve" x="660.0" y="86.0" style="fill:#bdbfe8">one flat pool, not a quota per tile</text><rect x="660.0" y="180.0" width="39.4" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="701.4" y="180.0" width="25.6" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="729.0" y="180.0" width="113.0" height="46" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="844.0" y="180.0" width="30.2" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="876.2" y="180.0" width="34.8" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="913.0" y="180.0" width="30.2" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><rect x="945.2" y="180.0" width="71.6" height="46" fill="#bdbfe8" fill-opacity="0.26" stroke="#bdbfe8" stroke-width="1"/><rect x="1018.8" y="180.0" width="99.2" height="46" fill="#b9b9bd" fill-opacity="0.26" stroke="#b9b9bd" stroke-width="1"/><text class="s" xml:space="preserve" x="660.0" y="166.0">references: (primitive, nearest possible depth)</text><line x1="729.0" y1="238.0" x2="844.0" y2="238.0" stroke="#bdbfe8" stroke-width="2"/><text class="s" xml:space="preserve" x="729.0" y="260.0" style="fill:#bdbfe8">a dense tile borrows</text><text class="s" xml:space="preserve" x="729.0" y="282.0" style="fill:#bdbfe8">space a sparse one never used</text><text class="s" xml:space="preserve" x="660.0" y="340.0">fs_count counts per tile, a prefix sum turns the counts</text><text class="s" xml:space="preserve" x="660.0" y="362.0">into offsets, and fs_fill writes into the range it was given</text><text class="s" xml:space="preserve" x="660.0" y="466.0" style="fill:#e8ac00">An ink fragment scans one tile's range,</text><text class="s" xml:space="preserve" x="660.0" y="488.0" style="fill:#e8ac00">never the whole scene.</text></svg>
