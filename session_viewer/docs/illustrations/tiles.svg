<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 510" role="img" aria-labelledby="t d"><title id="t">A screen index, one triangle at a time</title><desc id="d">The screen is a grid of tiles. Each triangle is projected once and a quad over its tile bounds is rasterized; covered_tile discards the tiles the polygon cannot actually touch, and the survivors are counted, prefix-summed and written into one flat pool. An ink fragment reads only its own tile's range, not every triangle in the scene.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Only the tiles a triangle can touch</text><rect x="80.0" y="150.0" width="54.0" height="54.0" fill="none" stroke="#b9b9bd" stroke-width="0.7"/><rect x="80.0" y="206.0" width="54.0" height="54.0" fill="none" stroke="#b9b9bd" stroke-width="0.7"/><rect x="80.0" y="262.0" width="54.0" height="54.0" fill="none" stroke="#b9b9bd" stroke-width="0.7"/><rect x="80.0" y="318.0" width="54.0" height="54.0" fill="none" stroke="#b9b9bd" stroke-width="0.7"/><rect x="80.0" y="374.0" width="54.0" height="54.0" fill="none" stroke="#b9b9bd" stroke-width="0.7"/><rect x="136.0" y="150.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="136.0" y="206.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="136.0" y="262.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="136.0" y="318.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="136.0" y="374.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="192.0" y="150.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="192.0" y="206.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="192.0" y="262.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="192.0" y="318.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="192.0" y="374.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="248.0" y="150.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="248.0" y="206.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="248.0" y="262.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="248.0" y="318.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="248.0" y="374.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="304.0" y="150.0" width="54.0" height="54.0" fill="none" stroke="#fa9ebc" stroke-width="1" stroke-dasharray="4 4"/><rect x="304.0" y="206.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="304.0" y="262.0" width="54.0" height="54.0" fill="#8fd36a" fill-opacity="0.30" stroke="#8fd36a" stroke-width="1"/><rect x="304.0" y="318.0" width="54.0" height="54.0" fill="#8fd36a" 