<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" role="img" aria-labelledby="t d"><title id="t">Two sides and a narrow wire</title><desc id="d">The CPU side you may read and change at any time; the GPU side you send bytes and commands to and cannot read back casually. Between them is a narrow wire, and almost every mistake is on it.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="268.9" lengthAdjust="spacingAndGlyphs">Where does this thing live?</text><rect data-box="0" x="60.0" y="110.0" width="216.9" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="72.0" y="134.0" style="fill:#111111" data-box="0" textLength="76.0" lengthAdjust="spacingAndGlyphs">CPU · Rust</text><text class="s" xml:space="preserve" x="72.0" y="158.0" style="fill:#455b6b" data-box="0" textLength="173.7" lengthAdjust="spacingAndGlyphs">scene, documents, ids, input</text><text class="s" xml:space="preserve" x="72.0" y="178.0" style="fill:#455b6b" data-box="0" textLength="159.0" lengthAdjust="spacingAndGlyphs">read and change any time</text><rect data-box="1" x="760.0" y="110.0" width="237.6" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="772.0" y="134.0" style="fill:#111111" data-box="1" textLength="31.6" lengthAdjust="spacingAndGlyphs">GPU</text><text class="s" xml:space="preserve" x="772.0" y="158.0" style="fill:#455b6b" data-box="1" textLength="162.4" lengthAdjust="spacingAndGlyphs">buffers, textures, pipelines</text><text class="s" xml:space="preserve" x="772.0" y="178.0" style="fill:#455b6b" data-box="1" textLength="188.1" lengthAdjust="spacingAndGlyphs">write only; no casual read back</text><rect x="316.9" y="150" width="403.1" height="96" rx="4" fill="#111111" stroke="#e07a26" stroke-width="1.5"/><text class="l" xml:space="preserve" x="338.9" y="182.0" style="fill:#111111" textLength="62.1" lengthAdjust="spacingAndGlyphs">the wire</text><text class="m" xml:space="preserve" x="338.9" y="206.0" style="fill:#111111" textLength="248.0" lengthAdjust="spacingAndGlyphs">write_buffer · create_buffer_init</text><text class="m" xml:space="preserve" x="338.9" y="228.0" style="fill:#111111" textLength="278.1" lengthAdjust="spacingAndGlyphs">vertex layout · bind group · @binding</text><path class="ar" d="M276.9,198.0 L308.9,198.0"/><path class="ar" d="M720.0,198.0 L752.0,198.0"/><text class="s" xml:space="preserve" x="60.0" y="330.0" textLength="554.4" lengthAdjust="spacingAndGlyphs">Ask this of every value in the course: which side is it on, and who owns it? A bug you cannot</text><text class="s" xml:space="preserve" x="60.0" y="354.0" style="fill:#e8ac00" textLength="545.1" lengthAdjust="spacingAndGlyphs">place on this picture is usually a wire bug - three declarations that must agree and do not.</text></svg>
