<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" role="img" aria-labelledby="t d"><title id="t">Two ways to cover a disc</title><desc id="d">A vertex marker is a sphere: the template corner is pushed out in clip space by the pixel radius plus half the feather, so four vertices always contain the antialiased disc. A free dot needs no template at all, because one equilateral triangle whose incircle is the disc covers it with three vertices.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="221.6" lengthAdjust="spacingAndGlyphs">Four vertices, or three</text><text class="l" xml:space="preserve" x="60.0" y="86.0" textLength="311.6" lengthAdjust="spacingAndGlyphs">sphere marker: a quad from the template</text><rect x="160.0" y="168.0" width="180.0" height="180.0" fill="#111111" fill-opacity="0.08" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="250.0" cy="258.0" r="90.0" fill="none" stroke="#8fd36a" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="250.0" cy="258.0" r="76.0" fill="#fa9ebc" fill-opacity="0.45" stroke="#fa9ebc" stroke-width="1.6"/><circle cx="160.0" cy="168.0" r="4.5" fill="#f4f4f6"/><circle cx="160.0" cy="348.0" r="4.5" fill="#f4f4f6"/><circle cx="340.0" cy="168.0" r="4.5" fill="#f4f4f6"/><circle cx="340.0" cy="348.0" r="4.5" fill="#f4f4f6"/><text class="s" xml:space="preserve" x="60.0" y="372.0" textLength="253.3" lengthAdjust="spacingAndGlyphs">four template corners, offset in clip space</text><text class="s" xml:space="preserve" x="60.0" y="394.0" style="fill:#8fd36a" textLength="379.7" lengthAdjust="spacingAndGlyphs">pixel radius plus half the feather, so the quad contains the disc</text><text class="l" xml:space="preserve" x="660.0" y="86.0" textLength="245.0" lengthAdjust="spacingAndGlyphs">free dot: one equilateral triangle</text><polygon points="880.0,106.0 1011.6,334.0 748.4,334.0" fill="#111111" fill-opacity="0.08" stroke="#f4f4f6" stroke-width="1.4"/><circle cx="880.0" cy="258.0" r="76.0" fill="#fa9ebc" fill-opacity="0.45" stroke="#fa9ebc" stroke-width="1.6"/><circle cx="880.0" cy="106.0" r="4.5" fill="#f4f4f6"/><circle cx="1011.6" cy="334.0" r="4.5" fill="#f4f4f6"/><circle cx="748.4" cy="334.0" r="4.5" fill="#f4f4f6"/><line x1="880.0" y1="258.0" x2="880.0" y2="334.0" stroke="#e8ac00" stroke-width="1.4"/><circle cx="880.0" cy="258.0" r="3" fill="#e8ac00"/><text class="s" xml:space="preserve" x="660.0" y="372.0" textLength="293.0" lengthAdjust="spacingAndGlyphs">three vertices, no template and no vertex buffer</text><text class="s" xml:space="preserve" x="660.0" y="394.0" style="fill:#fa9ebc" textLength="341.6" lengthAdjust="spacingAndGlyphs">the incircle is the visible disc; the corners are never seen</text></svg>
