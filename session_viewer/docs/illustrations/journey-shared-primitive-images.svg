<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" role="img" aria-labelledby="title desc">
<title id="title">Shared mesh reads and integer primitive addresses</title><desc id="desc">A non-indexed draw reads each occurrence through an index storage buffer. The vertex shader emits a one-based triangle address, which the fragment writes as two unsigned sixteen-bit channels next to color or original owner IDs. Matching depth and primitive images supply visibility in a canvas frame or a bounded pick crop.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="840" height="310" fill="#fff"/>
<g fill="#f1f5f9" stroke="#64748b"><rect x="20" y="30" width="230" height="90" rx="8"/><rect x="305" y="30" width="235" height="90" rx="8"/><rect x="595" y="30" width="225" height="90" rx="8"/><rect x="305" y="205" width="235" height="80" rx="8"/><rect x="595" y="205" width="225" height="80" rx="8"/></g>
<g font-family="sans-serif" font-size="16" fill="#0f172a" text-anchor="middle"><text x="135" y="58">Shared storage buffers</text><text x="135" y="83">indices → position / RGB</text><text x="135" y="105">and source normals</text><text x="422" y="58">Vertex shader</text><text x="422" y="83">occurrence → source vertex</text><text x="422" y="105">base + occurrence / 3 + 1</text><text x="707" y="58">Fragment shader</text><text x="707" y="83">Color or owner + RG16Uint</text><text x="707" y="105">address low / high halves</text><text x="707" y="234">Depth + primitive images</text><text x="707" y="259">same size and pixel origin</text><text x="422" y="234">Ink visibility</text><text x="422" y="259">fit + exact triangle tests</text><text x="135" y="229">Canvas frame</text><text x="135" y="257">or bounded first-pick crop</text></g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M250 75H299"/><path d="M540 75H589"/><path d="M707 120V199"/><path d="M595 245H546"/></g>
<text x="422" y="162" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#334155">Address 0 means no triangle; integer targets use no blending.</text>
</svg>
