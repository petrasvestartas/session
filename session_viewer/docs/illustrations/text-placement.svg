<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1121 470" role="img" aria-labelledby="t d"><title id="t">Five placements, one shaped line</title><desc id="d">One shaped line placed five ways: Screen at a fixed CSS position; Anchor at a world point with a screen offset; Nameplate on a rounded plate; WorldPlane in a fixed plane, so it foreshortens; WorldBillboard turning to face the camera. Rasterization follows device scale: a 14 CSS px label keeps its size on a DPR 2 screen and gets twice the pixels.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Placement decides where; raster size decides how many pixels</text><rect data-box="0" x="28.0" y="66.0" width="148.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0">Screen</text><text class="s" xml:space="preserve" x="40.0" y="114.0" style="fill:#455b6b" data-box="0">fixed CSS position</text><text class="s" xml:space="preserve" x="40.0" y="134.0" style="fill:#455b6b" data-box="0">left · top</text><rect data-box="1" x="192.0" y="66.0" width="210.0" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="204.0" y="90.0" style="fill:#111111" data-box="1">Anchor</text><text class="s" xml:space="preserve" x="204.0" y="114.0" style="fill:#455b6b" data-box="1">world point + screen offset</text><text class="s" xml:space="preserve" x="204.0" y="134.0" style="fill:#455b6b" data-box="1">follows the object</text><rect data-box="2" x="418.1" y="66.0" width="216.9" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="430.1" y="90.0" style="fill:#111111" data-box="2">Nameplate</text><text class="s" xml:space="preserve" x="430.1" y="114.0" style="fill:#455b6b" data-box="2">centered on a world anchor</text><text class="s" xml:space="preserve" x="430.1" y="134.0" style="fill:#455b6b" data-box="2">rounded plate, overlay depth</text><rect data-box="3" x="651.0" y="66.0" width="230.7" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="663.0" y="90.0" style="fill:#111111" data-box="3">WorldPlane</text><text class="s" xml:space="preserve" x="663.0" y="114.0" style="fill:#455b6b" data-box="3">in a fixed plane, world height</text><text class="s" xml:space="preserve" x="663.0" y="134.0" style="fill:#455b6b" data-box="3">foreshortens with the view</text><rect data-box="4" x="897.7" y="66.0" width="196.2" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="909.7" y="90.0" style="fill:#111111" data-box="4">WorldBillboard</text><text class="s" xml:space="preserve" x="909.7" y="114.0" style="fill:#455b6b" data-box="4">world point, world height</text><text class="s" xml:space="preserve" x="909.7" y="134.0" style="fill:#455b6b" data-box="4">turns to face the camera</text><rect x="56.010000000000005" y="210" width="92" height="30" rx="4" fill="#f4f4f6"/><text x="102.01" y="230" text-anchor="middle" style="fill:#111111;font-size:13px;font-family:system-ui,sans-serif">Beam 04</text><rect x="251.03500000000003" y="210" width="92" height="30" rx="4" fill="#f4f4f6"/><text x="297.035" y="230" text-anchor="middle" style="fill:#111111;font-size:13px;font-family:system-ui,sans-serif">Beam 04</text><circle cx="297.035" cy="270" r="4" fill="#8fd36a"/><line x1="297.035" y1="240" x2="297.035" y2="266" stroke="#8fd36a" stroke-width="1.4"/><text class="s" xml:space="preserve" x="297.0" y="292.0" text-anchor="middle" style="fill:#8fd36a">world anchor</text><rect x="480.51" y="210" width="92" height="30" rx="15" fill="#f4f4f6"/><text x="526.51" y="230" text-anchor="middle" style="fill:#111111;font-size:13px;font-family:system-ui,sans-serif">Beam 04</text><circle cx="526.51" cy="270" r="4" fill="#8fd36a"/><line x1="526.51" y1="240" x2="526.51" y2="266" stroke="#8fd36a" stroke-width="1.4"/><text class="s" xml:space="preserve" x="526.5" y="292.0" text-anchor="middle" style="fill:#8fd36a">world anchor</text><polygon points="716.32,224 806.32,204 806.32,234 716.32,254" fill="#f4f4f6"/><text x="761.32" y="233" text-anchor="middle" style="fill:#111111;font-size:12px;font-family:system-ui,sans-serif" transform="rotate(-12.5 761.32 229)">Beam 04</text><circle cx="766.32" cy="270" r="4" fill="#8fd36a"/><line x1="766.32" y1="240" x2="766.32" y2="266" stroke="#8fd36a" stroke-width="1.4"/><text class="s" xml:space="preserve" x="766.3" y="292.0" text-anchor="middle" style="fill:#8fd36a">world anchor</text><rect x="949.7950000000001" y="210" width="92" height="30" rx="4" fill="#f4f4f6"/><text x="995.7950000000001" y="230" text-anchor="middle" style="fill:#111111;font-size:13px;font-family:system-ui,sans-serif">Beam 04</text><circle cx="995.7950000000001" cy="270" r="4" fill="#8fd36a"/><line x1="995.7950000000001" y1="240" x2="995.7950000000001" y2="266" stroke="#8fd36a" stroke-width="1.4"/><text class="s" xml:space="preserve" x="995.8" y="292.0" text-anchor="middle" style="fill:#8fd36a">world anchor</text><text class="l" xml:space="preserve" x="28.0" y="330.0">Same label, two device scales</text><rect x="28" y="344" width="140" height="34" rx="17" fill="#f4f4f6"/><text x="98" y="366" text-anchor="middle" style="fill:#111111;font-size:14px;font-family:system-ui,sans-serif">Beam 04</text><text class="s" xml:space="preserve" x="28.0" y="400.0">DPR 1: 14 CSS px = 14 physical px</text><rect x="300" y="344" width="140" height="34" rx="17" fill="#f4f4f6"/><text x="370" y="366" text-anchor="middle" style="fill:#111111;font-size:14px;font-family:system-ui,sans-serif">Beam 04</text><text class="s" xml:space="preserve" x="300.0" y="400.0">DPR 2: 14 CSS px = 28 physical px, rasterized once at that size</text><text class="s" xml:space="preserve" x="28.0" y="430.0">The shaped runs are identical; TextFrame::scale applies the device scale exactly once, in TextLane::prepare.</text></svg>
