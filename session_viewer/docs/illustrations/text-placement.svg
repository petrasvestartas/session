<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1121 470" role="img" aria-labelledby="t d"><title id="t">Five placements, one shaped line</title><desc id="d">The same shaped runs are placed five ways: Screen at a fixed CSS position; Anchor at a world point with a screen offset; Nameplate centered on a world anchor with a rounded plate; WorldPlane inside a fixed plane with world-space height, so it foreshortens; WorldBillboard at a world point turning to face the camera. Rasterization happens per device scale, so a 14 CSS px label keeps its size on a DPR 2 screen and gets twice the pixels.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#111111"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#111111;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#455b6b}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#111111}.ar{fill:none;stroke:#111111;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#eef0f2"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="620.2" lengthAdjust="spacingAndGlyphs">Placement decides where; raster size decides how many pixels</text><rect data-box="0" x="28.0" y="66.0" width="148.0" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="90.0" data-box="0" textLength="50.1" lengthAdjust="spacingAndGlyphs">Screen</text><text class="s" xml:space="preserve" x="40.0" y="114.0" data-box="0" textLength="108.3" lengthAdjust="spacingAndGlyphs">fixed CSS position</text><text class="s" xml:space="preserve" x="40.0" y="134.0" data-box="0" textLength="50.6" lengthAdjust="spacingAndGlyphs">left · top</text><rect data-box="1" x="192.0" y="66.0" width="210.0" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="204.0" y="90.0" data-box="1" textLength="53.8" lengthAdjust="spacingAndGlyphs">Anchor</text><text class="s" xml:space="preserve" x="204.0" y="114.0" data-box="1" textLength="162.9" lengthAdjust="spacingAndGlyphs">world point + screen offset</text><text class="s" xml:space="preserve" x="204.0" y="134.0" data-box="1" textLength="107.3" lengthAdjust="spacingAndGlyphs">follows the object</text><rect data-box="2" x="418.1" y="66.0" width="216.9" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="430.1" y="90.0" data-box="2" textLength="83.3" lengthAdjust="spacingAndGlyphs">Nameplate</text><text class="s" xml:space="preserve" x="430.1" y="114.0" data-box="2" textLength="168.3" lengthAdjust="spacingAndGlyphs">centered on a world anchor</text><text class="s" xml:space="preserve" x="430.1" y="134.0" data-box="2" textLength="176.8" lengthAdjust="spacingAndGlyphs">rounded plate, overlay depth</text><rect data-box="3" x="651.0" y="66.0" width="230.7" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="663.0" y="90.0" data-box="3" textLength="86.1" lengthAdjust="spacingAndGlyphs">WorldPlane</text><text class="s" xml:space="preserve" x="663.0" y="114.0" data-box="3" textLength="177.0" lengthAdjust="spacingAndGlyphs">in a fixed plane, world height</text><text class="s" xml:space="preserve" x="663.0" y="134.0" data-box="3" textLength="162.2" lengthAdjust="spacingAndGlyphs">foreshortens with the view</text><rect data-box="4" x="897.7" y="66.0" width="196.2" height="83.0" rx="8" fill="#bdbfe8" stroke="#1a1eb2" stroke-width="1.5"/><text class="l" xml:space="preserve" x="909.7" y="90.0" data-box="4" textLength="112.0" lengthAdjust="spacingAndGlyphs">WorldBillboard</text><text class="s" xml:space="preserve" x="909.7" y="114.0" data-box="4" textLength="154.5" lengthAdjust="spacingAndGlyphs">world point, world height</text><text class="s" xml:space="preserve" x="909.7" y="134.0" data-box="4" textLength="149.2" lengthAdjust="spacingAndGlyphs">turns to face the camera</text><rect x="56.010000000000005" y="210" width="92" height="30" rx="4" fill="#111111"/><text x="102.01" y="230" text-anchor="middle" style="fill:#fff;font-size:13px;font-family:system-ui,sans-serif" textLength="53.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><rect x="251.03500000000003" y="210" width="92" height="30" rx="4" fill="#111111"/><text x="297.035" y="230" text-anchor="middle" style="fill:#fff;font-size:13px;font-family:system-ui,sans-serif" textLength="53.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><circle cx="297.035" cy="270" r="4" fill="#3f9c20"/><line x1="297.035" y1="240" x2="297.035" y2="266" stroke="#3f9c20" stroke-width="1.4"/><text class="s" xml:space="preserve" x="297.0" y="292.0" text-anchor="middle" style="fill:#3f9c20" textLength="81.0" lengthAdjust="spacingAndGlyphs">world anchor</text><rect x="480.51" y="210" width="92" height="30" rx="15" fill="#111111"/><text x="526.51" y="230" text-anchor="middle" style="fill:#fff;font-size:13px;font-family:system-ui,sans-serif" textLength="53.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><circle cx="526.51" cy="270" r="4" fill="#3f9c20"/><line x1="526.51" y1="240" x2="526.51" y2="266" stroke="#3f9c20" stroke-width="1.4"/><text class="s" xml:space="preserve" x="526.5" y="292.0" text-anchor="middle" style="fill:#3f9c20" textLength="81.0" lengthAdjust="spacingAndGlyphs">world anchor</text><polygon points="716.32,224 806.32,204 806.32,234 716.32,254" fill="#111111"/><text x="762.32" y="234" text-anchor="middle" style="fill:#fff;font-size:12px" transform="skewY(-12) translate(0,0)" textLength="49.3" lengthAdjust="spacingAndGlyphs">Beam 04</text><circle cx="766.32" cy="270" r="4" fill="#3f9c20"/><line x1="766.32" y1="240" x2="766.32" y2="266" stroke="#3f9c20" stroke-width="1.4"/><text class="s" xml:space="preserve" x="766.3" y="292.0" text-anchor="middle" style="fill:#3f9c20" textLength="81.0" lengthAdjust="spacingAndGlyphs">world anchor</text><rect x="949.7950000000001" y="210" width="92" height="30" rx="4" fill="#111111"/><text x="995.7950000000001" y="230" text-anchor="middle" style="fill:#fff;font-size:13px;font-family:system-ui,sans-serif" textLength="53.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><circle cx="995.7950000000001" cy="270" r="4" fill="#3f9c20"/><line x1="995.7950000000001" y1="240" x2="995.7950000000001" y2="266" stroke="#3f9c20" stroke-width="1.4"/><text class="s" xml:space="preserve" x="995.8" y="292.0" text-anchor="middle" style="fill:#3f9c20" textLength="81.0" lengthAdjust="spacingAndGlyphs">world anchor</text><text class="l" xml:space="preserve" x="28.0" y="330.0" textLength="218.7" lengthAdjust="spacingAndGlyphs">Same label, two device scales</text><rect x="28" y="344" width="140" height="34" rx="17" fill="#111111"/><text x="98" y="366" text-anchor="middle" style="fill:#fff;font-size:14px;font-family:system-ui,sans-serif" textLength="57.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><text class="s" xml:space="preserve" x="28.0" y="400.0" textLength="201.3" lengthAdjust="spacingAndGlyphs">DPR 1: 14 CSS px = 14 physical px</text><rect x="300" y="344" width="140" height="34" rx="17" fill="#111111"/><text x="370" y="366" text-anchor="middle" style="fill:#fff;font-size:14px;font-family:system-ui,sans-serif" textLength="57.5" lengthAdjust="spacingAndGlyphs">Beam 04</text><text class="s" xml:space="preserve" x="300.0" y="400.0" textLength="371.6" lengthAdjust="spacingAndGlyphs">DPR 2: 14 CSS px = 28 physical px, rasterized once at that size</text><text class="s" xml:space="preserve" x="28.0" y="430.0" textLength="646.7" lengthAdjust="spacingAndGlyphs">The shaped runs are identical; TextFrame::scale applies the device scale exactly once, in TextLane::prepare.</text></svg>
