<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 592" role="img" aria-labelledby="t d"><title id="t">The pool measures itself, one frame late</title><desc id="d">The scan records how many words its lists really needed. That number is copied out after the submit and read next frame, so a pool that was too small grows one frame late. The cost is one frame of conservative ink - overflowed tiles keep rejecting the plane - never a wrong pixel.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="531.6" lengthAdjust="spacingAndGlyphs">A pool too small costs one frame, never a wrong pixel</text><text class="l" xml:space="preserve" x="212.0" y="84.0" textLength="61.1" lengthAdjust="spacingAndGlyphs">frame N</text><text class="l" xml:space="preserve" x="528.0" y="84.0" textLength="86.0" lengthAdjust="spacingAndGlyphs">frame N + 1</text><text class="l" xml:space="preserve" x="844.0" y="84.0" textLength="86.4" lengthAdjust="spacingAndGlyphs">frame N + 2</text><text class="l" xml:space="preserve" x="28.0" y="128.0" textLength="31.6" lengthAdjust="spacingAndGlyphs">GPU</text><rect data-box="0" x="212.0" y="102.0" width="300.0" height="96.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="224.0" y="126.0" style="fill:#111111" data-box="0" textLength="256.2" lengthAdjust="spacingAndGlyphs">project · clear · count · scan ×3 · fill</text><text class="s" xml:space="preserve" x="224.0" y="150.0" style="fill:#455b6b" data-box="0" textLength="230.7" lengthAdjust="spacingAndGlyphs">tile 812: the cursor runs past its count</text><text class="s" xml:space="preserve" x="224.0" y="170.0" style="fill:#455b6b" data-box="0" textLength="247.1" lengthAdjust="spacingAndGlyphs">the overflow word is set, nothing written</text><rect data-box="1" x="528.0" y="102.0" width="300.0" height="96.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="540.0" y="126.0" style="fill:#111111" data-box="1" textLength="136.0" lengthAdjust="spacingAndGlyphs">all of it runs again</text><text class="s" xml:space="preserve" x="540.0" y="150.0" style="fill:#455b6b" data-box="1" textLength="206.0" lengthAdjust="spacingAndGlyphs">the key was cleared, and this time</text><text class="s" xml:space="preserve" x="540.0" y="170.0" style="fill:#455b6b" data-box="1" textLength="173.5" lengthAdjust="spacingAndGlyphs">every list fits in the new pool</text><rect data-box="2" x="844.0" y="102.0" width="300.0" height="96.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="856.0" y="126.0" style="fill:#111111" data-box="2" textLength="138.9" lengthAdjust="spacingAndGlyphs">nothing runs at all</text><text class="s" xml:space="preserve" x="856.0" y="150.0" style="fill:#455b6b" data-box="2" textLength="242.3" lengthAdjust="spacingAndGlyphs">ProjectionKey unchanged: same matrix,</text><text class="s" xml:space="preserve" x="856.0" y="170.0" style="fill:#455b6b" data-box="2" textLength="146.8" lengthAdjust="spacingAndGlyphs">same geometry revision</text><text class="l" xml:space="preserve" x="28.0" y="250.0" textLength="121.8" lengthAdjust="spacingAndGlyphs">an ink fragment</text><rect data-box="3" x="212.0" y="224.0" width="300.0" height="96.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="224.0" y="248.0" style="fill:#111111" data-box="3" textLength="202.8" lengthAdjust="spacingAndGlyphs">conservative for one frame</text><text class="s" xml:space="preserve" x="224.0" y="272.0" style="fill:#455b6b" data-box="3" textLength="269.1" lengthAdjust="spacingAndGlyphs">an overflowed tile keeps rejecting the plane,</text><text class="s" xml:space="preserve" x="224.0" y="292.0" style="fill:#455b6b" data-box="3" textLength="224.8" lengthAdjust="spacingAndGlyphs">so ink that should show stays hidden</text><rect data-box="4" x="528.0" y="224.0" width="300.0" height="96.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="540.0" y="248.0" style="fill:#111111" data-box="4" textLength="205.3" lengthAdjust="spacingAndGlyphs">walk the axis pixel's tile list</text><text class="s" xml:space="preserve" x="540.0" y="272.0" style="fill:#455b6b" data-box="4" textLength="132.8" lengthAdjust="spacingAndGlyphs">and run the finite test</text><rect data-box="5" x="844.0" y="224.0" width="300.0" height="96.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="856.0" y="248.0" style="fill:#111111" data-box="5" textLength="205.3" lengthAdjust="spacingAndGlyphs">walk the axis pixel's tile list</text><text class="s" xml:space="preserve" x="856.0" y="272.0" style="fill:#455b6b" data-box="5" textLength="132.8" lengthAdjust="spacingAndGlyphs">and run the finite test</text><text class="l" xml:space="preserve" x="28.0" y="366.0" textLength="30.3" lengthAdjust="spacingAndGlyphs">CPU</text><rect data-box="6" x="212.0" y="340.0" width="300.0" height="96.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="224.0" y="364.0" style="fill:#111111" data-box="6" textLength="151.2" lengthAdjust="spacingAndGlyphs">copy the first record</text><text class="s" xml:space="preserve" x="224.0" y="388.0" style="fill:#455b6b" data-box="6" textLength="154.4" lengthAdjust="spacingAndGlyphs">16 B out of the tile buffer,</text><text class="s" xml:space="preserve" x="224.0" y="408.0" style="fill:#455b6b" data-box="6" textLength="213.0" lengthAdjust="spacingAndGlyphs">then map_report() after the submit</text><rect data-box="7" x="528.0" y="340.0" width="300.0" height="96.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="540.0" y="364.0" style="fill:#111111" data-box="7" textLength="169.4" lengthAdjust="spacingAndGlyphs">prepare() reads it back</text><text class="s" xml:space="preserve" x="540.0" y="388.0" style="fill:#455b6b" data-box="7" textLength="258.9" lengthAdjust="spacingAndGlyphs">the report reached capacity, so it is a floor:</text><text class="s" xml:space="preserve" x="540.0" y="408.0" style="fill:#455b6b" data-box="7" textLength="203.8" lengthAdjust="spacingAndGlyphs">double, and ask again next frame</text><rect data-box="8" x="844.0" y="340.0" width="300.0" height="96.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="856.0" y="364.0" style="fill:#111111" data-box="8" textLength="101.8" lengthAdjust="spacingAndGlyphs">nothing to do</text><rect data-box="9" x="28.0" y="456.0" width="740.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="480.0" style="fill:#111111" data-box="9" textLength="256.3" lengthAdjust="spacingAndGlyphs">One flat array, not a quota per tile</text><text class="m" xml:space="preserve" x="40.0" y="504.0" style="fill:#111111" data-box="9" textLength="481.6" lengthAdjust="spacingAndGlyphs">tiles × 2 + triangles × 8 references to start, never below 32768</text><text class="s" xml:space="preserve" x="40.0" y="524.0" style="fill:#455b6b" data-box="9" textLength="537.3" lengthAdjust="spacingAndGlyphs">words and never above 32 a tile: a dense tile borrows the space a sparse one never used</text><rect data-box="10" x="788.0" y="456.0" width="364.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="800.0" y="480.0" style="fill:#111111" data-box="10" textLength="194.5" lengthAdjust="spacingAndGlyphs">Sums saturate at capacity</text><text class="s" xml:space="preserve" x="800.0" y="504.0" style="fill:#455b6b" data-box="10" textLength="223.7" lengthAdjust="spacingAndGlyphs">so an oversubscribed pool can never</text><text class="s" xml:space="preserve" x="800.0" y="524.0" style="fill:#455b6b" data-box="10" textLength="165.7" lengthAdjust="spacingAndGlyphs">wrap into a plausible offset</text><text class="s" xml:space="preserve" x="28.0" y="578.0" style="fill:#e8ac00" textLength="433.7" lengthAdjust="spacingAndGlyphs">The scan reports what it needed; the number comes back a frame later.</text></svg>
