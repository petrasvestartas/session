<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1145 625" role="img" aria-labelledby="t d"><title id="t">One edge, two faces, one chain</title><desc id="d">A cylinder's rim is meshed twice, by the grid on the side face and by the constrained triangulator on the cap, but both were constrained to the same boundary polygon. The ink is read from whichever face can supply the chain; the other lends only a normal. An edge no face can supply is still drawn, as a resampled ribbon with no source id.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One edge, two faces, one chain</text><path d="M104,120 L104,300 A 96 28 0 0 0 296,300 L296,120 Z" fill="#bdbfe8" opacity="0.45"/><ellipse cx="200" cy="120" rx="96" ry="28" fill="#bdbfe8" opacity="0.25" stroke="#9a9aa4" stroke-width="1.2"/><path d="M104,300 A 96 28 0 0 0 296,300" fill="#fa9ebc" opacity="0.45"/><text class="s" xml:space="preserve" x="200.0" y="200.0" text-anchor="middle" style="fill:#111111">face 0 · side · grid-meshed</text><text class="s" xml:space="preserve" x="200.0" y="344.0" text-anchor="middle" style="fill:#fa9ebc">face 1 · cap · constrained triangulation</text><path d="M104,300 A 96 28 0 0 0 296,300" fill="none" stroke="#f4f4f6" stroke-width="3.4"/><circle cx="104.0" cy="300.0" r="4" fill="#8fd36a"/><circle cx="116.9" cy="314.0" r="4" fill="#8fd36a"/><circle cx="152.0" cy="324.2" r="4" fill="#8fd36a"/><circle cx="200.0" cy="328.0" r="4" fill="#8fd36a"/><circle cx="248.0" cy="324.2" r="4" fill="#8fd36a"/><circle cx="283.1" cy="314.0" r="4" fill="#8fd36a"/><circle cx="296.0" cy="300.0" r="4" fill="#8fd36a"/><text class="s" xml:space="preserve" x="200.0" y="368.0" text-anchor="middle" style="fill:#8fd36a">edge 0 · the rim</text><path class="ar" d="M306.0,310.0 L430.0,250.0"/><text class="s" xml:space="preserve" x="376.0" y="284.0">zoom</text><polygon points="460,250 522,250 491.0,192" fill="#bdbfe8" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="460,250 522,250 491.0,308" fill="#fa9ebc" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="522,250 584,250 553.0,192" fill="#bdbfe8" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="522,250 584,250 553.0,308" fill="#fa9ebc" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="584,250 646,250 615.0,192" fill="#bdbfe8" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="584,250 646,250 615.0,308" fill="#fa9ebc" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="646,250 708,250 677.0,192" fill="#bdbfe8" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><polygon points="646,250 708,250 677.0,308" fill="#fa9ebc" opacity="0.6" stroke="#9a9aa4" stroke-width="0.8"/><path d="M460,250 L708,250" stroke="#f4f4f6" stroke-width="3"/><circle cx="460" cy="250" r="4.6" fill="#8fd36a"/><circle cx="522" cy="250" r="4.6" fill="#8fd36a"/><circle cx="584" cy="250" r="4.6" fill="#8fd36a"/><circle cx="646" cy="250" r="4.6" fill="#8fd36a"/><circle cx="708" cy="250" r="4.6" fill="#8fd36a"/><text class="m" xml:space="preserve" x="460.0" y="328.0" text-anchor="middle">keys[0]</text><text class="m" xml:space="preserve" x="708.0" y="328.0" text-anchor="middle">keys[4]</text><text class="s" xml:space="preserve" x="460.0" y="172.0" style="fill:#bdbfe8">side face triangles</text><text class="s" xml:space="preserve" x="460.0" y="350.0" style="fill:#fa9ebc">cap face triangles</text><text class="s" xml:space="preserve" x="460.0" y="374.0" style="fill:#c9ccd6">both meshes were constrained to the same polygon,</text><text class="s" xml:space="preserve" x="460.0" y="392.0" style="fill:#c9ccd6">so these nodes belong to both</text><rect data-box="0" x="800.0" y="96.0" width="288.7" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="812.0" y="120.0" style="fill:#111111" data-box="0">owner · chain.face</text><text class="m" xml:space="preserve" x="812.0" y="144.0" style="fill:#111111" data-box="0">keys → the pipes' endpoints</text><text class="m" xml:space="preserve" x="812.0" y="164.0" style="fill:#111111" data-box="0">chain.edge → every pipe's source id</text><text class="s" xml:space="preserve" x="812.0" y="184.0" style="fill:#455b6b" data-box="0">the first use that can answer,</text><text class="s" xml:space="preserve" x="812.0" y="204.0" style="fill:#455b6b" data-box="0">not the first face</text><rect data-box="1" x="800.0" y="239.0" width="306.5" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="812.0" y="263.0" style="fill:#111111" data-box="1">other · chain.other</text><text class="s" xml:space="preserve" x="812.0" y="287.0" style="fill:#455b6b" data-box="1">lends one facet normal to the facing word</text><text class="s" xml:space="preserve" x="812.0" y="307.0" style="fill:#455b6b" data-box="1">None on a seam: both uses are one face</text><path class="ar" d="M728.0,220.0 L792.0,157.5"/><path class="ar" d="M728.0,280.0 L792.0,280.5"/><rect data-box="2" x="28.0" y="470.0" width="437.4" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="494.0" style="fill:#111111" data-box="2">chain → pipes</text><text class="s" xml:space="preserve" x="40.0" y="518.0" style="fill:#455b6b" data-box="2">one pipe per key pair</text><text class="m" xml:space="preserve" x="40.0" y="538.0" style="fill:#111111" data-box="2">pipe_ids.push(chain.edge)</text><text class="s" xml:space="preserve" x="40.0" y="558.0" style="fill:#455b6b" data-box="2">facing from the two facets, turned outward by the face signs</text><text class="s" xml:space="preserve" x="40.0" y="578.0" style="fill:#455b6b" data-box="2">a pair that collapses in f32 is skipped: it cannot be picked</text><rect data-box="3" x="505.4" y="470.0" width="292.7" height="123.0" rx="4" fill="#ffffff" stroke="#ffffff" stroke-width="0"/><text class="l" xml:space="preserve" x="517.4" y="494.0" style="fill:#111111" data-box="3">no chain → ribbon</text><text class="s" xml:space="preserve" x="517.4" y="518.0" style="fill:#455b6b" data-box="3">the 3D curve resampled by turning angle</text><text class="s" xml:space="preserve" x="517.4" y="538.0" style="fill:#455b6b" data-box="3">no pipe_ids entry, FACING_UNKNOWN</text><text class="m" xml:space="preserve" x="517.4" y="558.0" style="fill:#111111" data-box="3">log::warn! — a display fallback,</text><text class="s" xml:space="preserve" x="517.4" y="578.0" style="fill:#455b6b" data-box="3">not a CAD boundary</text><rect x="505.40000000000003" y="470" width="292.7" height="123.0" rx="4" fill="none" stroke="#e07a26" stroke-width="1.8" stroke-dasharray="7 5"/><text class="l" xml:space="preserve" x="485.4" y="536.5" text-anchor="middle">or</text><rect data-box="4" x="838.1" y="470.0" width="278.9" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="850.1" y="494.0" style="fill:#111111" data-box="4">what the refusal buys</text><text class="s" xml:space="preserve" x="850.1" y="518.0" style="fill:#455b6b" data-box="4">a pick resolves through edge_sources;</text><text class="m" xml:space="preserve" x="850.1" y="538.0" style="fill:#111111" data-box="4">u32::MAX means the viewer answers</text><text class="s" xml:space="preserve" x="850.1" y="558.0" style="fill:#455b6b" data-box="4">'no edge here' rather than naming</text><text class="s" xml:space="preserve" x="850.1" y="578.0" style="fill:#455b6b" data-box="4">something that is not in the model</text></svg>
