<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 470" role="img" aria-labelledby="t d"><title id="t">Reversed depth and the ink visibility test</title><desc id="d">Left: reversed depth maps near to one and far to zero; the depth target clears to zero and opaque faces pass when Greater. Right: a thick stroke covers samples beside its axis; comparing against the surface depth at the offset sample hides a line lying on the surface, so the ink shader transfers the surface depth to the axis through the stored gradient first.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="14" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="155.4" lengthAdjust="spacingAndGlyphs">Reversed depth</text><line x1="60" y1="330" x2="60" y2="80" stroke="#f4f4f6" stroke-width="1.6" marker-end="url(#a)"/><text class="s" xml:space="preserve" x="70.0" y="92.0" textLength="72.0" lengthAdjust="spacingAndGlyphs">depth value</text><line x1="44" y1="120" x2="330" y2="120" stroke="#b9b9bd" stroke-width="1"/><text class="m" xml:space="preserve" x="338.0" y="124.0" textLength="120.3" lengthAdjust="spacingAndGlyphs">1.0 · near plane</text><line x1="44" y1="300" x2="330" y2="300" stroke="#b9b9bd" stroke-width="1"/><text class="m" xml:space="preserve" x="338.0" y="304.0" textLength="173.0" lengthAdjust="spacingAndGlyphs">0.0 · far · clear value</text><rect x="120" y="180" width="160" height="12" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="1.5"/><text class="s" xml:space="preserve" x="120.0" y="208.0" textLength="191.4" lengthAdjust="spacingAndGlyphs">an opaque face writes its depth</text><rect x="180" y="150" width="60" height="12" fill="#f9e08a" stroke="#e8ac00" stroke-width="1.5"/><text class="s" xml:space="preserve" x="248.0" y="160.0" textLength="200.9" lengthAdjust="spacingAndGlyphs">nearer fragment: Greater → kept</text><rect x="120" y="230" width="90" height="12" fill="#e4e4e7" stroke="#b9b9bd" stroke-width="1.5"/><text class="s" xml:space="preserve" x="218.0" y="240.0" textLength="259.5" lengthAdjust="spacingAndGlyphs">farther fragment: not Greater → discarded</text><rect data-box="0" x="28.0" y="350.0" width="458.1" height="123.0" rx="8" fill="#ffffff" stroke="#b9b9bd" stroke-width="1.5"/><text class="l" xml:space="preserve" x="40.0" y="374.0" style="fill:#111111" data-box="0" textLength="248.6" lengthAdjust="spacingAndGlyphs">The contract, as the code spells it</text><text class="m" xml:space="preserve" x="40.0" y="398.0" style="fill:#111111" data-box="0" textLength="413.6" lengthAdjust="spacingAndGlyphs">projection: Xform::perspective(fovy, aspect, far, near)</text><text class="m" xml:space="preserve" x="40.0" y="418.0" style="fill:#111111" data-box="0" textLength="376.0" lengthAdjust="spacingAndGlyphs">clear: LoadOp::Clear(0.0)     format: Depth32Float</text><text class="m" xml:space="preserve" x="40.0" y="438.0" style="fill:#111111" data-box="0" textLength="383.5" lengthAdjust="spacingAndGlyphs">compare: CompareFunction::Greater   (physical.wgsl)</text><text class="s" xml:space="preserve" x="40.0" y="458.0" style="fill:#455b6b" data-box="0" textLength="384.7" lengthAdjust="spacingAndGlyphs">More float precision lands where the geometry is: near the eye.</text><text class="h" xml:space="preserve" x="540.0" y="40.0" textLength="247.2" lengthAdjust="spacingAndGlyphs">A thick line is not its axis</text><polygon points="560,130 1040,80 1040,310 560,330" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="1.5"/><text class="s" xml:space="preserve" x="580.0" y="160.0" style="fill:#111111" textLength="293.6" lengthAdjust="spacingAndGlyphs">surface: depth changes across x (gradient ∂d/∂x)</text><rect x="580" y="234" width="460" height="32" fill="#f0bcdb" stroke="#f0bcdb" stroke-width="1.5"/><line x1="580" y1="250" x2="1040" y2="250" stroke="#f0bcdb" stroke-width="2"/><text class="s" xml:space="preserve" x="580.0" y="290.0" style="fill:#111111" textLength="286.5" lengthAdjust="spacingAndGlyphs">stroke footprint covers samples beside the axis</text><circle cx="790" cy="261" r="4" fill="#e07a26"/><text class="s" xml:space="preserve" x="580.0" y="306.0" style="fill:#b45a10" textLength="384.2" lengthAdjust="spacingAndGlyphs">sample here: the surface is nearer → the line is wrongly hidden</text><line x1="790" y1="261" x2="790" y2="250" stroke="#8fd36a" stroke-width="2"/><circle cx="790" cy="250" r="4" fill="#8fd36a"/><text class="s" xml:space="preserve" x="580.0" y="222.0" style="fill:#2d7a14" textLength="426.4" lengthAdjust="spacingAndGlyphs">transfer the surface depth to the axis with the gradient, then compare</text><rect data-box="1" x="520.0" y="350.0" width="547.6" height="123.0" rx="8" fill="#ffffff" stroke="#b9b9bd" stroke-width="1.5"/><text class="l" xml:space="preserve" x="532.0" y="374.0" style="fill:#111111" data-box="1" textLength="231.0" lengthAdjust="spacingAndGlyphs">The test, as the shader spells it</text><text class="m" xml:space="preserve" x="532.0" y="398.0" style="fill:#111111" data-box="1" textLength="436.1" lengthAdjust="spacingAndGlyphs">physical pass writes  depth + (∂d/∂x, ∂d/∂y, primitive id)</text><text class="m" xml:space="preserve" x="532.0" y="418.0" style="fill:#111111" data-box="1" textLength="488.8" lengthAdjust="spacingAndGlyphs">d_axis = d_sample + g · (axis − sample)       ink_visibility.wgsl</text><text class="m" xml:space="preserve" x="532.0" y="438.0" style="fill:#111111" data-box="1" textLength="308.3" lengthAdjust="spacingAndGlyphs">visible ⇔ line depth ≥ d_axis − tolerance</text><text class="s" xml:space="preserve" x="532.0" y="458.0" style="fill:#455b6b" data-box="1" textLength="446.2" lengthAdjust="spacingAndGlyphs">Lesson 18 adds the finite-triangle test for planes that end before the axis.</text></svg>
