<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">A point pass of its own, folded back into the scene</title><desc id="d">Points are not drawn in the face pass. They are rasterized as discs into a private pair of targets at one sample, where the disc radius comes from the spacing the LOD walk chose; a fullscreen resolve then runs inside the face pass, shades from neighbouring depths and writes frag_depth under the scene's Greater test. That is what lets a cloud occlude a wall and be occluded by it without ever entering the face pipeline.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="397.9" lengthAdjust="spacingAndGlyphs">Two passes, one depth buffer in the end</text><text class="l" xml:space="preserve" x="60.0" y="86.0" style="fill:#bdbfe8" textLength="169.0" lengthAdjust="spacingAndGlyphs">a point becomes a disc</text><circle cx="110" cy="210" r="4" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="60.0" y="250.0" textLength="75.9" lengthAdjust="spacingAndGlyphs">one position</text><path class="ar" d="M140.0,210.0 L196.0,210.0"/><circle cx="250" cy="210" r="34" fill="#bdbfe8" fill-opacity="0.34" stroke="#bdbfe8" stroke-width="1.6"/><line x1="250" y1="210" x2="284" y2="210" stroke="#e8ac00" stroke-width="2"/><text class="s" xml:space="preserve" x="210.0" y="274.0" style="fill:#e8ac00" textLength="144.8" lengthAdjust="spacingAndGlyphs">radius from the spacing</text><text class="s" xml:space="preserve" x="210.0" y="296.0" style="fill:#e8ac00" textLength="119.8" lengthAdjust="spacingAndGlyphs">the LOD walk chose</text><text class="l" xml:space="preserve" x="430.0" y="86.0" style="fill:#f0bcdb" textLength="206.8" lengthAdjust="spacingAndGlyphs">its own targets, one sample</text><rect x="430.0" y="150" width="126" height="96" fill="#f0bcdb" fill-opacity="0.18" stroke="#f0bcdb" stroke-width="1.3"/><text class="s" xml:space="preserve" x="442.0" y="204.0" style="fill:#f0bcdb" textLength="36.0" lengthAdjust="spacingAndGlyphs">depth</text><rect x="580.0" y="150" width="126" height="96" fill="#f0bcdb" fill-opacity="0.18" stroke="#f0bcdb" stroke-width="1.3"/><text class="s" xml:space="preserve" x="592.0" y="204.0" style="fill:#f0bcdb" textLength="38.7" lengthAdjust="spacingAndGlyphs">colour</text><text class="s" xml:space="preserve" x="430.0" y="274.0" textLength="195.9" lengthAdjust="spacingAndGlyphs">not the face pass's attachments,</text><text class="s" xml:space="preserve" x="430.0" y="296.0" style="fill:#f0bcdb" textLength="148.3" lengthAdjust="spacingAndGlyphs">and never multisampled</text><text class="l" xml:space="preserve" x="790.0" y="86.0" style="fill:#8fd36a" textLength="214.1" lengthAdjust="spacingAndGlyphs">resolved inside the face pass</text><rect x="790" y="150" width="300" height="96" fill="#8fd36a" fill-opacity="0.16" stroke="#8fd36a" stroke-width="1.3"/><text class="s" xml:space="preserve" x="804.0" y="186.0" style="fill:#8fd36a" textLength="148.7" lengthAdjust="spacingAndGlyphs">splat_resolve · fullscreen</text><text class="s" xml:space="preserve" x="804.0" y="220.0" textLength="188.7" lengthAdjust="spacingAndGlyphs">EDL from neighbouring depths</text><text class="s" xml:space="preserve" x="790.0" y="274.0" textLength="297.4" lengthAdjust="spacingAndGlyphs">writes frag_depth under the scene's Greater test,</text><text class="s" xml:space="preserve" x="790.0" y="296.0" style="fill:#8fd36a" textLength="289.3" lengthAdjust="spacingAndGlyphs">so a cloud occludes a wall and a wall occludes it</text><path class="ar" d="M330.0,198.0 L420.0,198.0"/><path class="ar" d="M720.0,198.0 L780.0,198.0"/><text class="s" xml:space="preserve" x="28.0" y="404.0" textLength="776.8" lengthAdjust="spacingAndGlyphs">The private pair exists because a point is a disc, not a triangle: it needs no multisampling and it must not pay for the face pass's.</text><text class="s" xml:space="preserve" x="28.0" y="426.0" style="fill:#e8ac00" textLength="577.7" lengthAdjust="spacingAndGlyphs">Folding it back as frag_depth is what keeps one depth buffer authoritative for the whole frame.</text><text class="s" xml:space="preserve" x="28.0" y="456.0" textLength="647.5" lengthAdjust="spacingAndGlyphs">The targets are created on the first frame that has points, so a scene without a cloud never allocates them.</text></svg>
