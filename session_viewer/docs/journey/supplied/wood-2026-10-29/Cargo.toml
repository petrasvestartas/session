[package]
name = "wood"
version = "0.1.0"
edition = "2021"
description = "Wood's element classes over the session kernel Element: typed payloads and plain solids."

[dependencies]
# The kernel beside wood, as the superproject lays them out (wood/ and session/session_rust/); a CI that
# builds this crate clones the two side by side. No mini-tests: the viewer's wasm takes this too.
session_rust = { path = "../../../../../session_rust", default-features = false }
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2"

# The kernel's rand 0.8 -> getrandom 0.2 refuses wasm32-unknown-unknown without `js`; the viewer sets
# the same, so the crate checks on its own for the browser too.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
