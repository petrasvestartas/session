    - "19 · Sheets: batched drawings with lazy metadata": docs/19-sheets.md
    - "20 · The document: undo, redo and save": docs/20-history.md
    - "21 · Editing: the gumball, the command line and the layers panel": docs/21-editing.md
    - "22 · Refresh diagnostics and resource checks": docs/22-runtime-helpers.md
    - "23 · Create, trim, extend and explode": docs/23-geometry-commands.md
    - "24 · Make control dragging respect object placement": docs/24-placed-controls.md
    - "25 · Draw a solid, readable gumball": docs/25-gumball.md
