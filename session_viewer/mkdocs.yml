site_name: Build the Session Viewer
site_description: A code-first course that reconstructs the Rust, WebAssembly, WebGPU and WGSL viewer step by step.
docs_dir: target/docs/source
# The lesson crates are read by the snippets extension, not copied into the site.
exclude_docs: |
  docs/lessons/
site_dir: target/docs/site
dev_addr: 127.0.0.1:8772
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
plugins:
  - search
validation:
  nav:
    omitted_files: ignore
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/docs
        - !relative $config_dir/..
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      guess_lang: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - docs/stylesheets/theme.css
  - docs/stylesheets/course.css
extra_javascript:
  - docs/js/viewer.js
watch:
  - docs
  - ARCHITECTURE.md
nav:
  - Before you start:
    - Start here: docs/README.md
    - How to use this course: docs/how-to-learn.md
    - The map: docs/map.md
    - Words before code: docs/words.md
  - Course:
    - "00 · Empty project to a WASM message": docs/00-environment.md
    - "01 · First WebGPU frame": docs/01-first-frame.md
    - "02 · Camera": docs/02-camera.md
    - "03 · Object rows and identity": docs/03-identity.md
    - "04a · Meshes on the GPU": docs/04a-meshes.md
    - "04b · Strokes": docs/04b-strokes.md
    - "04c · Markers": docs/04c-markers.md
    - "04d · Point clouds": docs/04d-clouds.md
    - "05 · Depth and visible ink": docs/05-visibility.md
    - "06 · CAD face rules": docs/06-cad-contract.md
    - "07 · Shared boundaries": docs/07-boundaries.md
    - "08 · Trims, holes and periodic seams": docs/08-trimming.md
    - "09 · Normals and shading": docs/09-normals.md
    - "10 · Text shaping": docs/10-text-layout.md
    - "11 · Text rendering": docs/11-text-rendering.md
    - "12 · maintained viewer shell and picking": docs/12-picking.md
    - "13 · Source controls": docs/13-controls.md
