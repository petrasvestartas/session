site_name: Build the Session Viewer
site_description: A code-first course that reconstructs the Rust, WebAssembly, WebGPU and WGSL viewer step by step.
docs_dir: target/docs/source
# The lesson crates are read by the snippets extension, not copied into the site; the other
# entries are build tools and sources that no page links to.
exclude_docs: |
  docs/lessons/
  docs/hooks/
  docs/overrides/
  docs/diagrams/
  docs/**/__pycache__/
  docs/*.py
  docs/*.sh
  docs/*.cjs
  docs/illustrations/*.py
  docs/stylesheets/*.py
  docs/stylesheets/*.json
site_dir: target/docs/site
dev_addr: 127.0.0.1:8772
theme:
  name: material
  custom_dir: docs/overrides
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.lazy
plugins:
  - search
# lean_html trims the rendered pages, service_worker writes sw.js; docs/performance-patterns.md, "Course site weight".
hooks:
  - docs/hooks/lean_html.py
  - docs/hooks/service_worker.py
validation:
  nav:
    omitted_files: ignore
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/docs
        - !relative $config_dir/..
      check_paths: false # stage C: pages still name pre-cut step anchors; true again once every page is rewritten
  - pymdownx.highlight:
      pygments_lang_class: true
      guess_lang: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - docs/stylesheets/theme.css
  - docs/stylesheets/course.css
extra_javascript:
  - docs/js/viewer.js
watch:
  - docs
  - ARCHITECTURE.md
nav:
  - Before you start:
    - Start here: docs/README.md
    - How to use this course: docs/how-to-learn.md
    - The map: docs/map.md
    - Words before code: docs/words.md
  - Course:
    - "00 · Empty project to a WASM message": docs/00-environment.md
    - "01 · First WebGPU frame": docs/01-first-frame.md
    - "02 · Camera": docs/02-camera.md
    - "03 · Object rows and identity": docs/03-identity.md
    - "04a · Meshes on the GPU": docs/04a-meshes.md
    - "04b · Strokes and arrows": docs/04b-strokes.md
    - "04c · Markers": docs/04c-markers.md
    - "04d · Point clouds": docs/04d-clouds.md
    - "05 · Depth and visible ink": docs/05-visibility.md
