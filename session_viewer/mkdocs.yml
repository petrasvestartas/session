site_name: Build the Session Viewer
site_description: A code-first course that reconstructs the Rust, WebAssembly, WebGPU and WGSL viewer step by step.
docs_dir: target/docs/source
site_dir: target/docs/site
dev_addr: 127.0.0.1:8772
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
plugins:
  - search
hooks:
  - docs/course_pages.py
validation:
  nav:
    omitted_files: ignore
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      guess_lang: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_css:
  - docs/stylesheets/course.css
watch:
  - docs
  - ARCHITECTURE.md
nav:
  - Start here: docs/README.md
  - Course:
    - 00 · Empty project to WASM: docs/00-environment.md
    - 01 · First WebGPU frame: docs/01-first-frame.md
    - 02 · Camera: docs/02-camera.md
    - 03 · Object rows and identity: docs/03-identity.md
    - 04a · Meshes on the GPU: docs/04a-meshes.md
    - 04b · Strokes: docs/04b-strokes.md
    - 04c · Markers: docs/04c-markers.md
    - 04d · Point clouds: docs/04d-clouds.md
    - 05 · Depth and visible ink: docs/05-visibility.md
    - 06 · CAD face contract: docs/06-cad-contract.md
    - 07 · Shared boundaries: docs/07-boundaries.md
    - 08 · Trims and seams: docs/08-trimming.md
    - 09 · Normals and shading: docs/09-normals.md
    - 10 · Text shaping: docs/10-text-layout.md
    - 11 · Text rendering: docs/11-text-rendering.md
    - 12 · Production shell and picking: docs/12-picking.md
    - 13 · Source controls: docs/13-controls.md
    - 14 · Loading scenes: docs/14-loading.md
    - 15 · Publication and streamed reads: docs/15-publication.md
    - 16 · Resource accounting: docs/16-accounting.md
    - 17 · Faces, text objects and silhouettes: docs/17-source-presentation.md
    - 18 · Finite-triangle visibility: docs/18-finite-visibility.md
    - 19 · Sheets: docs/19-sheets.md
    - 20 · The document: docs/20-history.md
  - Architecture reference: ARCHITECTURE.md
  - CAD design record: docs/cad-design.md
