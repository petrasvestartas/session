site_name: Session Viewer — Build the Browser CAD Viewer
site_description: A complete Rust, WebAssembly, WebGPU and WGSL reconstruction course.
docs_dir: target/docs/source
site_dir: target/docs/site
dev_addr: 127.0.0.1:8772
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: blue grey
    accent: indigo
  features:
    - navigation.footer
    - navigation.top
    - search.highlight
    - content.code.copy
plugins:
  - search
hooks:
  - docs/lesson_pages.py
validation:
  nav:
    omitted_files: ignore
markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      guess_lang: false
  - pymdownx.superfences
extra_css:
  - docs/stylesheets/course.css
watch:
  - docs
  - ARCHITECTURE.md
  - tests/README.md
