<!DOCTYPE html>
<html lang="en">
<head>

<link rel="modulepreload" href="./session_viewer-2c189df92971477f.js" crossorigin="anonymous"><link rel="preload" href="./session_viewer-2c189df92971477f_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
<body>
  
<script type="module">
import init, * as bindings from './session_viewer-2c189df92971477f.js';
const wasm = await init({ module_or_path: './session_viewer-2c189df92971477f_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

  <!-- Message telling that Webgpu is not available. -->

    if (!navigator.gpu) {
      document.body.insertAdjacentHTML("beforeend",
        '<div id="no-webgpu">WebGPU required — use a recent Chrome, Edge, Firefox, or Safari 18+.</div>');
    }
  </script>
