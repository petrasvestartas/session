[package]
name = "session_viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]  # rlib so examples/selftest.rs can link the crate

[dependencies]
session_rust = { path = "../session_rust" }
anyhow = "1.0"
# The scene manifest (assets/scenes/*.json) - pure Rust, wasm-safe, and already a session_rust dep.
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = { version = "29.0"}
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document", 
    "Window", 
    "Element", 
    "HtmlCanvasElement", 
    "EventTarget", 
    "Event", 
    "CanvasRenderingContext2d", 
    "ImageData", 
    "Location",
    "Performance",
    # Fetch-API features:
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    ] }
getrandom = { version = "0.2", features = ["js"] }

js-sys = "0.3"
prost = "0.14"
bytemuck = { version = "1", features = ["derive"] }
egui         = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui-wgpu    = { version = "0.34", default-features = false }
egui-winit   = { version = "0.34", default-features = false }
egui_extras  = { version = "0.34", default-features = false, features = ["svg"] }

[profile.dev.package."*"]
opt-level = 3

# parse speed in debug builds
[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[example]]
name = "selftest"
path = "examples/selftest.rs"

# Native-only: the headless verification harness (examples/selftest.rs). MUST stay at the end -
# a target table placed mid-file silently swallows every [dependencies] entry after it, which is
# how prost and bytemuck vanished from the wasm build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[[example]]
name = "bench_load"
path = "examples/bench_load.rs"

[[example]]
name = "mk_facing_probe"
path = "examples/mk_facing_probe.rs"


[[example]]
name = "check_determinism"
path = "examples/check_determinism.rs"
