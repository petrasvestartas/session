[package]
name = "session_viewer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

# Fresh, minimal viewer — grown one documented chapter at a time.
# Chapter 1: a window that clears the screen. (Old code: ../session_viewer_archive)
[dependencies]
anyhow = "1.0"
winit = { version = "0.30", features = ["android-native-activity"] }
wgpu = { version = "29.0", features = ["webgl"] }
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "EventTarget", "Event"] }
getrandom = { version = "0.2", features = ["js"] }
# session_rust = { path = "../session_rust" }   # added in chapter 4 (first real mesh)

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
