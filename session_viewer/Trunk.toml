[build]
# Benchmarks and tutorial checkpoints use this same optimized browser build.
release = true
no_sri = true
public_url = "./"

# Build the documentation site (the Vue app in ../session_tests) before the bundle so dist/docs
# serves it next to the viewer; a no-op while its sources are unchanged.
[[hooks]]
stage = "pre_build"
command = "bash"
command_arguments = ["../session_tests/scripts/build-viewer-docs.sh"]

[watch]
# This replaces Trunk's default watch set, so the shared path dependency is explicit.
watch = [
    "src",
    "Cargo.toml",
    "index.html",
    "assets/view_local.yaml", # register:scenes
    "assets/text", # register:text
    "assets/text-quality.html", # register:text_quality
    "../session_rust/src",
    "docs",
    "../session_tests/src",
    "../session_tests/plugins",
]
enable_cooldown = true

[serve]
# The mutable development index must always name the current hashed WASM bundle.
headers = { "Cache-Control" = "no-store" }
addresses = ["127.0.0.1"]
port = 8770
