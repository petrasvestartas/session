# Where each sheet sits.
# 'at' is a translation in world units (mm); 'xform' takes 16 numbers instead if you need rotation or scale.
# Omit both and the loader falls back to an auto-grid.
# Positions are laid out by hand from each sheet's own page size (see the widths below) - edit a number, reload, no rebuild.
#
# Every sheet here is display_only: the kernel document is released once its ink has been walked
# into the GPU tables. These are drawings - nothing clicks them, edits them or saves them - and
# holding all ten cost 1.2 GB of kernel objects on top of the tables the GPU already owned:
# 2056 MB resident against 899 MB, same frame to the byte. Drop the flag on any sheet you want to
# pick or edit; NEVER put it on a model file.
name = "architectural sheets"

