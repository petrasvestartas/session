# EXPERIMENT scene for the splat lane.
# Clouds PACKED BY BOUNDING BOX, using the 2-98 percentile box (a scan's min/max box is mostly empty air - sparse far returns): bbox-min-x on a running cursor with 25 m gaps (the sparse outskirts overlap the core boxes - the gap keeps the dense cores visibly apart), bbox-y centred, floor (p2 z) grounded at 0.
# Measured with examples/pb_bbox.rs.
# Drawings group at y=-30000.
# [ ] scales all clouds live.
name = "cloud mix \u2014 bunny + 4 sheets + boxes + three scans, per-cloud point size"

