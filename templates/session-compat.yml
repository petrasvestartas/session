# Template: copy to .github/workflows/session-compat.yml in each dependent repo.
# Triggered when session-py publishes a new version to PyPI.
# On failure, opens a GitHub issue in the session repo with a link to the failed run.

name: session-py compatibility check

on:
  repository_dispatch:
    types: [session-py-updated]

jobs:
  compat-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install latest session-py
        run: pip install session-py

      - name: Run tests
        run: python -m pytest tests/

      - name: Report failure to session repo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SESSION_ISSUE_TOKEN }}
        run: |
          gh api repos/petrasvestartas/session/issues \
            -f title="${{ github.repository }} broken by session-py ${{ github.event.client_payload.version }}" \
            -f body="Tests failed after installing session-py ${{ github.event.client_payload.version }}. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
