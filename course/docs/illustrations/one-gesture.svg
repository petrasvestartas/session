<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" role="img" aria-labelledby="t d"><title id="t">A drag is three moments, and only the last one writes the document</title><desc id="d">Grabbing remembers the object's own transform and the placement it was drawn with. Every move frame writes a preview into the row's GPU placement and touches no document. Letting go writes the document once, with the transform measured from the grab, so one gesture is one undo step.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0" textLength="275.9" lengthAdjust="spacingAndGlyphs">One gesture, one undo step</text><text class="l" xml:space="preserve" x="28.0" y="76.0" textLength="34.6" lengthAdjust="spacingAndGlyphs">grab</text><text class="l" xml:space="preserve" x="420.0" y="76.0" textLength="143.5" lengthAdjust="spacingAndGlyphs">move · every frame</text><text class="l" xml:space="preserve" x="812.0" y="76.0" textLength="42.6" lengthAdjust="spacingAndGlyphs">let go</text><rect data-box="0" x="28.0" y="96.0" width="360.0" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="120.0" style="fill:#111111" data-box="0" textLength="155.0" lengthAdjust="spacingAndGlyphs">what is remembered</text><text class="m" xml:space="preserve" x="40.0" y="144.0" style="fill:#111111" data-box="0" textLength="278.5" lengthAdjust="spacingAndGlyphs">base_local the object's own transform</text><text class="m" xml:space="preserve" x="40.0" y="164.0" style="fill:#111111" data-box="0" textLength="316.1" lengthAdjust="spacingAndGlyphs">base_place the placement it was drawn with</text><text class="m" xml:space="preserve" x="40.0" y="184.0" style="fill:#111111" data-box="0" textLength="270.9" lengthAdjust="spacingAndGlyphs">Drag where on the handle the ray hit</text><rect data-box="1" x="420.0" y="96.0" width="360.0" height="103.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="432.0" y="120.0" style="fill:#111111" data-box="1" textLength="114.1" lengthAdjust="spacingAndGlyphs">what is written</text><text class="m" xml:space="preserve" x="432.0" y="144.0" style="fill:#111111" data-box="1" textLength="233.3" lengthAdjust="spacingAndGlyphs">delta = gizmo.update(drag, ray)</text><text class="m" xml:space="preserve" x="432.0" y="164.0" style="fill:#111111" data-box="1" textLength="195.7" lengthAdjust="spacingAndGlyphs">place = delta × base_place</text><text class="m" xml:space="preserve" x="432.0" y="184.0" style="fill:#111111" data-box="1" textLength="248.4" lengthAdjust="spacingAndGlyphs">objects.set_placement(row, place)</text><rect data-box="2" x="812.0" y="96.0" width="360.0" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="824.0" y="120.0" style="fill:#111111" data-box="2" textLength="124.8" lengthAdjust="spacingAndGlyphs">what is recorded</text><text class="m" xml:space="preserve" x="824.0" y="144.0" style="fill:#111111" data-box="2" textLength="195.7" lengthAdjust="spacingAndGlyphs">local = delta × base_local</text><text class="m" xml:space="preserve" x="824.0" y="164.0" style="fill:#111111" data-box="2" textLength="158.0" lengthAdjust="spacingAndGlyphs">session.begin("move")</text><text class="m" xml:space="preserve" x="824.0" y="184.0" style="fill:#111111" data-box="2" textLength="225.8" lengthAdjust="spacingAndGlyphs">session.set_xform(guid, local)</text><text class="m" xml:space="preserve" x="824.0" y="204.0" style="fill:#111111" data-box="2" textLength="120.4" lengthAdjust="spacingAndGlyphs">session.commit()</text><path class="ar" d="M394.0,136.0 L414.0,136.0"/><path class="ar" d="M786.0,136.0 L806.0,136.0"/><path d="M750,209 a 26 26 0 1 1 -40 0" stroke="#fa9ebc" stroke-width="2" fill="none" marker-end="url(#a)"/><text class="s" xml:space="preserve" x="730.0" y="273.0" text-anchor="middle" style="fill:#fa9ebc" textLength="122.7" lengthAdjust="spacingAndGlyphs">sixty times a second</text><rect x="420" y="325" width="246.5" height="28" rx="6" fill="#fa9ebc"/><text class="s" xml:space="preserve" x="433.0" y="344.0" style="fill:#111111" textLength="191.5" lengthAdjust="spacingAndGlyphs">96 B instance + 16 B translation</text><rect x="812" y="325" width="122.5" height="28" rx="6" fill="#bdbfe8"/><text class="s" xml:space="preserve" x="825.0" y="344.0" style="fill:#111111" textLength="88.0" lengthAdjust="spacingAndGlyphs">one history op</text><text class="s" xml:space="preserve" x="28.0" y="344.0" style="fill:#c9ccd6" textLength="70.4" lengthAdjust="spacingAndGlyphs">nothing yet</text><rect data-box="3" x="28.0" y="381.0" width="1144.0" height="123.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="405.0" style="fill:#111111" data-box="3" textLength="371.4" lengthAdjust="spacingAndGlyphs">Why the middle one does not write the document</text><text class="s" xml:space="preserve" x="40.0" y="429.0" style="fill:#455b6b" data-box="3" textLength="528.8" lengthAdjust="spacingAndGlyphs">a drag across the screen is sixty frames, so sixty ops, and Ctrl+Z would undo one frame</text><text class="s" xml:space="preserve" x="40.0" y="449.0" style="fill:#455b6b" data-box="3" textLength="332.3" lengthAdjust="spacingAndGlyphs">the preview costs two small writes and no history at all</text><text class="s" xml:space="preserve" x="40.0" y="469.0" style="fill:#455b6b" data-box="3" textLength="571.1" lengthAdjust="spacingAndGlyphs">and because both the preview and the commit are measured from the GRAB rather than from</text><text class="s" xml:space="preserve" x="40.0" y="489.0" style="fill:#455b6b" data-box="3" textLength="366.2" lengthAdjust="spacingAndGlyphs">the frame before, a dropped frame changes neither of them</text></svg>
