<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" role="img" aria-labelledby="t d"><title id="t">A removal is a record, not a gap</title><desc id="d">Edits are grouped into transactions, and a removal's record is the tombstone undo restores from, so nothing is destroyed at the moment it disappears. The cursor moves back and forward through committed transactions; a save purges the whole buffer, as Rhino does, and history never crosses pb or JSON, so an opened file always starts clean.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">The buffer behind undo</text><rect x="120.0" y="216.0" width="200.0" height="60" rx="4" fill="#bdbfe8" fill-opacity="0.3" stroke="#bdbfe8" stroke-width="1.4"/><text class="s" xml:space="preserve" x="132.0" y="252.0" style="fill:#bdbfe8">add 3 walls</text><text class="s" xml:space="preserve" x="132.0" y="202.0">transaction 1</text><rect x="354.0" y="216.0" width="200.0" height="60" rx="4" fill="#bdbfe8" fill-opacity="0.3" stroke="#bdbfe8" stroke-width="1.4"/><text class="s" xml:space="preserve" x="366.0" y="252.0" style="fill:#bdbfe8">move beam</text><text class="s" xml:space="preserve" x="366.0" y="202.0">transaction 2</text><line x1="320.0" y1="246.0" x2="354.0" y2="246.0" stroke="#b9b9bd" stroke-width="1.6"/><rect x="588.0" y="216.0" width="200.0" height="60" rx="4" fill="#fa9ebc" fill-opacity="0.3" stroke="#fa9ebc" stroke-width="1.4"/><text class="s" xml:space="preserve" x="600.0" y="252.0" style="fill:#fa9ebc">remove column</text><text class="s" xml:space="preserve" x="600.0" y="202.0">transaction 3</text><line x1="554.0" y1="246.0" x2="588.0" y2="246.0" stroke="#b9b9bd" stroke-width="1.6"/><rect x="822.0" y="216.0" width="200.0" height="60" rx="4" fill="#b9b9bd" fill-opacity="0.1" stroke="#b9b9bd" stroke-width="1.4"/><text class="s" xml:space="preserve" x="834.0" y="252.0" style="fill:#b9b9bd">add rail</text><text class="s" xml:space="preserve" x="834.0" y="202.0">transaction 4</text><line x1="788.0" y1="246.0" x2="822.0" y2="246.0" stroke="#b9b9bd" stroke-width="1.6"/><rect x="600.0" y="294.0" width="178" height="34" rx="4" fill="#fa9ebc" fill-opacity="0.22" stroke="#fa9ebc" stroke-width="1.2" stroke-dasharray="5 4"/><text class="s" xml:space="preserve" x="610.0" y="316.0" style="fill:#fa9ebc">tombstone: the column</text><line x1="805.0" y1="162.0" x2="805.0" y2="286.0" stroke="#e8ac00" stroke-width="2.4"/><text class="s" xml:space="preserve" x="781.0" y="152.0" style="fill:#e8ac00">cursor</text><path class="ar" d="M785.0,182.0 L645.0,182.0"/><text class="s" xml:space="preserve" x="715.0" y="175.0" text-anchor="middle">undo</text><path class="ar" d="M825.0,182.0 L965.0,182.0"/><text class="s" xml:space="preserve" x="895.0" y="175.0" text-anchor="middle">redo</text><text class="s" xml:space="preserve" x="110.0" y="384.0" style="fill:#fa9ebc">a removal keeps its record, so undo restores from it rather than rebuilding</text><text class="s" xml:space="preserve" x="110.0" y="406.0">redo past the cursor is discarded the moment a new transaction commits</text><text class="s" xml:space="preserve" x="110.0" y="428.0" style="fill:#8fd36a">pb_dump and file_json_dump purge the whole buffer: history is memory only,</text><text class="s" xml:space="preserve" x="110.0" y="450.0" style="fill:#8fd36a">so a file that is opened again always starts clean</text></svg>
