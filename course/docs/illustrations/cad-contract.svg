<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1046 431" role="img" aria-labelledby="t d"><title id="t">A CAD face from source to GPU rows</title><desc id="d">A BRep face is a surface with trim loops and edge identities in f64. The kernel meshes each face into positions with u,v, per-face normals and boundary provenance tags. The viewer converts once to object-relative f32 and produces arena rows for triangles, pipe rows for boundary strokes carrying source edge ids, and glyph rows for vertices.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">One face, three representations</text><rect data-box="0" x="28.0" y="66.0" width="236.4" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0">Source · BRep face (f64)</text><text class="s" xml:space="preserve" x="40.0" y="114.0" style="fill:#455b6b" data-box="0">surface + trim loops</text><text class="s" xml:space="preserve" x="40.0" y="134.0" style="fill:#455b6b" data-box="0">oriented edge uses</text><text class="s" xml:space="preserve" x="40.0" y="154.0" style="fill:#455b6b" data-box="0">original edge ids</text><rect data-box="1" x="374.0" y="66.0" width="250.9" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="386.0" y="90.0" style="fill:#111111" data-box="1">Kernel · Mesh per face</text><text class="m" xml:space="preserve" x="386.0" y="114.0" style="fill:#111111" data-box="1">positions · u,v · normals</text><text class="m" xml:space="preserve" x="386.0" y="134.0" style="fill:#111111" data-box="1">boundary/{loop}/{sample}</text><text class="m" xml:space="preserve" x="386.0" y="154.0" style="fill:#111111" data-box="1">boundary_interval/{loop}/{seg}</text><text class="s" xml:space="preserve" x="386.0" y="174.0" style="fill:#455b6b" data-box="1">one normal set per face</text><rect data-box="2" x="755.1" y="66.0" width="262.9" height="123.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="767.1" y="90.0" style="fill:#111111" data-box="2">Viewer · rows for the lanes</text><text class="m" xml:space="preserve" x="767.1" y="114.0" style="fill:#111111" data-box="2">ArenaRows  verts · idx</text><text class="m" xml:space="preserve" x="767.1" y="134.0" style="fill:#111111" data-box="2">SegRows    pipes + edge ids</text><text class="m" xml:space="preserve" x="767.1" y="154.0" style="fill:#111111" data-box="2">GlyphRows  vertex spheres</text><text class="s" xml:space="preserve" x="767.1" y="174.0" style="fill:#455b6b" data-box="2">f32, object-relative</text><path class="ar" d="M264.4,117.5 L374.0,117.5"/><text class="s" xml:space="preserve" x="319.2" y="110.5" text-anchor="middle">face_meshes_q</text><path class="ar" d="M624.8,127.5 L755.1,127.5"/><text class="s" xml:space="preserve" x="690.0" y="120.5" text-anchor="middle">walk/brep · mesh</text><rect data-box="3" x="28.0" y="219.0" width="990.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="243.0" style="fill:#111111" data-box="3">The same conversion for triangles and boundary endpoints</text><text class="s" xml:space="preserve" x="40.0" y="267.0" style="fill:#455b6b" data-box="3">a boundary stroke reuses the face mesh's own nodes, converted by the same f64 → f32 step;</text><text class="s" xml:space="preserve" x="40.0" y="287.0" style="fill:#455b6b" data-box="3">converting the two independently reintroduces the gap the shared samples removed</text><rect data-box="4" x="28.0" y="315.0" width="990.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="339.0" style="fill:#111111" data-box="4">Identity survives every arrow</text><text class="s" xml:space="preserve" x="40.0" y="363.0" style="fill:#455b6b" data-box="4">parent row → source face index → original edge id: picking maps a triangle or pipe back to CAD,</text><text class="s" xml:space="preserve" x="40.0" y="383.0" style="fill:#455b6b" data-box="4">never to a tessellation artefact</text></svg>
