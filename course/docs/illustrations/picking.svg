<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1035 461" role="img" aria-labelledby="t d"><title id="t">From a pointer position to a selected source object</title><desc id="d">A pointer release in CSS pixels becomes a physical pixel window around the cursor. The ID pass renders integer IDs and depth into that scissored window, the window is copied and read asynchronously, the nearest eligible ID is mapped through Scene to a source identity, and State sets the selected flag. Answers from an older generation are dropped.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#e4e4e7"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#f4f4f6;font-size:13px}.h{font-size:20px;font-weight:700}.l{font-size:15px;font-weight:650}.s{font-size:13px;fill:#c9ccd6}.m{font-family:"DejaVu Sans Mono","Liberation Mono",monospace;font-size:12.5px;fill:#f4f4f6}.ar{fill:none;stroke:#e4e4e7;stroke-width:1.6;marker-end:url(#a)}.dash{fill:none;stroke:#e07a26;stroke-width:1.8;stroke-dasharray:7 5}</style><rect width="100%" height="100%" rx="4" fill="#111111"/><text class="h" xml:space="preserve" x="28.0" y="40.0">Picking: integer IDs, a small window, one generation</text><rect data-box="0" x="28.0" y="66.0" width="175.6" height="83.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="90.0" style="fill:#111111" data-box="0">Input · input.rs</text><text class="s" xml:space="preserve" x="40.0" y="114.0" style="fill:#455b6b" data-box="0">pointer up, no drag</text><text class="s" xml:space="preserve" x="40.0" y="134.0" style="fill:#455b6b" data-box="0">CSS px + modifiers</text><rect data-box="1" x="247.6" y="66.0" width="236.4" height="103.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="259.6" y="90.0" style="fill:#111111" data-box="1">State::request_selection</text><text class="s" xml:space="preserve" x="259.6" y="114.0" style="fill:#455b6b" data-box="1">PickMode: Object · Edge ·</text><text class="s" xml:space="preserve" x="259.6" y="134.0" style="fill:#455b6b" data-box="1">Component · Controls</text><text class="s" xml:space="preserve" x="259.6" y="154.0" style="fill:#455b6b" data-box="1">records generation n</text><rect data-box="2" x="528.0" y="66.0" width="237.6" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="540.0" y="90.0" style="fill:#111111" data-box="2">id_pass · render.rs</text><text class="s" xml:space="preserve" x="540.0" y="114.0" style="fill:#455b6b" data-box="2">same lists, opaque, 1×</text><text class="s" xml:space="preserve" x="540.0" y="134.0" style="fill:#455b6b" data-box="2">scissor = window(cursor)</text><rect data-box="3" x="809.6" y="66.0" width="197.9" height="83.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="821.6" y="90.0" style="fill:#111111" data-box="3">ID targets</text><text class="m" xml:space="preserve" x="821.6" y="114.0" style="fill:#111111" data-box="3">Rg32Uint  (row, sub)</text><text class="m" xml:space="preserve" x="821.6" y="134.0" style="fill:#111111" data-box="3">Depth32Float + metadata</text><path class="ar" d="M203.6,107.5 L247.6,107.5"/><path class="ar" d="M484.0,117.5 L528.0,117.5"/><path class="ar" d="M765.6,107.5 L809.6,107.5"/><rect data-box="4" x="28.0" y="209.0" width="175.6" height="123.0" rx="4" fill="#f9e08a" stroke="#f9e08a" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="233.0" style="fill:#111111" data-box="4">SelectionMode</text><text class="s" xml:space="preserve" x="40.0" y="257.0" style="fill:#455b6b" data-box="4">FLAG_SELECTED uploaded</text><text class="s" xml:space="preserve" x="40.0" y="277.0" style="fill:#455b6b" data-box="4">frame requested</text><text class="s" xml:space="preserve" x="40.0" y="297.0" style="fill:#455b6b" data-box="4">yellow strokes, black</text><text class="s" xml:space="preserve" x="40.0" y="317.0" style="fill:#455b6b" data-box="4">silhouette, name plate</text><rect data-box="5" x="247.6" y="209.0" width="236.4" height="123.0" rx="4" fill="#bdbfe8" stroke="#bdbfe8" stroke-width="0"/><text class="l" xml:space="preserve" x="259.6" y="233.0" style="fill:#111111" data-box="5">Scene · scene.rs</text><text class="m" xml:space="preserve" x="259.6" y="257.0" style="fill:#111111" data-box="5">resolve(pick, gpu)</text><text class="m" xml:space="preserve" x="259.6" y="277.0" style="fill:#111111" data-box="5">edge_at(pick)</text><text class="m" xml:space="preserve" x="259.6" y="297.0" style="fill:#111111" data-box="5">point_at(row, local)</text><text class="s" xml:space="preserve" x="259.6" y="317.0" style="fill:#455b6b" data-box="5">row → GUID, edge, point, sheet</text><rect data-box="6" x="528.0" y="209.0" width="237.6" height="103.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="540.0" y="233.0" style="fill:#111111" data-box="6">copy_window → map_async</text><text class="s" xml:space="preserve" x="540.0" y="257.0" style="fill:#455b6b" data-box="6">a bounded copy, never the frame</text><text class="s" xml:space="preserve" x="540.0" y="277.0" style="fill:#455b6b" data-box="6">nearest eligible ID wins;</text><text class="s" xml:space="preserve" x="540.0" y="297.0" style="fill:#455b6b" data-box="6">edges beat faces in Component</text><rect data-box="7" x="809.6" y="209.0" width="197.9" height="125.0" rx="4" fill="#fa9ebc" stroke="#fa9ebc" stroke-width="0"/><text class="l" xml:space="preserve" x="821.6" y="233.0" style="fill:#111111" data-box="7">window · pick.rs</text><text class="s" xml:space="preserve" x="821.6" y="257.0" style="fill:#455b6b" data-box="7">radius in CSS px × DPR</text><line x1="823.57" y1="265" x2="823.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="843.57" y1="265" x2="843.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="863.57" y1="265" x2="863.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="883.57" y1="265" x2="883.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="903.57" y1="265" x2="903.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="923.57" y1="265" x2="923.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><line x1="823.57" y1="265" x2="923.57" y2="265" stroke="#fa9ebc" stroke-width="0.8"/><line x1="823.57" y1="285" x2="923.57" y2="285" stroke="#fa9ebc" stroke-width="0.8"/><line x1="823.57" y1="305" x2="923.57" y2="305" stroke="#fa9ebc" stroke-width="0.8"/><line x1="823.57" y1="325" x2="923.57" y2="325" stroke="#fa9ebc" stroke-width="0.8"/><rect x="863.57" y="285" width="20" height="20" fill="#e8ac00"/><circle cx="873.57" cy="295" r="3" fill="#f4f4f6"/><path class="ar" d="M908.5,149.0 L908.5,209.0"/><path class="ar" d="M247.6,237.0 L203.6,237.0"/><path class="ar" d="M528.0,237.0 L484.0,237.0"/><path class="ar" d="M809.6,237.0 L765.6,237.0"/><rect data-box="8" x="28.0" y="358.0" width="651.0" height="83.0" rx="4" fill="#e4e4e7" stroke="#e4e4e7" stroke-width="0"/><text class="l" xml:space="preserve" x="40.0" y="382.0" style="fill:#111111" data-box="8">Stale answers are dropped</text><text class="s" xml:space="preserve" x="40.0" y="406.0" style="fill:#455b6b" data-box="8">A camera move, hide/show, scene replacement or mode change bumps the generation; a readback</text><text class="s" xml:space="preserve" x="40.0" y="426.0" style="fill:#455b6b" data-box="8">that completes for an older generation is ignored, and a drag never selects on release.</text></svg>
