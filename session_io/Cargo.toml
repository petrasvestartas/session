[package]
name = "session_io"
version = "0.1.0"
edition = "2021"

# PDF -> Session (.pb). This crate exists ONLY for formats whose dependencies the kernel must not
# take on: mupdf-sys compiles MuPDF's C sources, and session_rust must stay pure Rust so it keeps
# building for wasm32 (the viewer). Nothing here is ever linked into the kernel.
#
# Ordinary file formats do NOT belong here. obj/ply/xyz are parsed natively in each kernel
# (session_py / session_rust / session_cpp) and kept at parity by minitest - measured: routing bulk
# mesh data through .pb costs 3-4x the parse itself and inflates 12.9 MB of OBJ to 83 MB of pb.
[dependencies]
session_rust = { path = "../session_rust" }
# default-features = false drops system-fonts (font-kit -> fontconfig, a system dev package we do
# not need: a PDF embeds the fonts it uses) plus epub/html/svg/tesseract readers we never open.
# base14-fonts keeps the standard PDF fonts, which a sheet may reference without embedding.
rayon = "1.10"
# Earcut is what fonts and maps use: ear-clipping with hole bridging, and it does not care that a
# glyph contour touches itself. The kernel CDT fits an average plane and inserts Delaunay
# constraints - correct for trimmed surfaces, but it mis-triangulated 28% of glyph fills here.
earcutr = "0.5"
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }

[[bin]]
name = "pdf_import"
path = "src/main.rs"

[profile.release]
opt-level = 3
