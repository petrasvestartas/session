[package]
name = "session_view"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"] # cdylib for dynamic browser linking, rlib for static linking

[dependencies]
session_rust = { path = "../session_rust" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml_ng = "0.10"
toml = "=0.8.23"
serde_json = { version = "1.0", features = ["float_roundtrip"] }
winit = "0.30"
wgpu = "29.0"
glyphon = "0.11.0" # The maintained text rendering library for wgpu.
log = "0.4"
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
    "HtmlCanvasElement",
    "EventTarget",
    "Event",
    "Location",
    "Performance",
    "EventSource",
    "MessageEvent",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "AbortController",
    "AbortSignal",
    ] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
prost = "0.14"
bytemuck = { version = "1", features = ["derive"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Native-only: for examples/selftest.rs
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }