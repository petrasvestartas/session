[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session_compas"
version = "0.9.0"
description = "COMPAS converters for session_py geometry and a publisher to the live viewer"
authors = [{name = "Petras Vestartas", email = "petrasvestartas@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["session_py", "compas>=2.2.0"]

[project.urls]
Homepage = "https://github.com/petrasvestartas/session_compas"
Repository = "https://github.com/petrasvestartas/session_compas"

[tool.hatch.build]
src-layout = true

[tool.hatch.build.targets.wheel]
