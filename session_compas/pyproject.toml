[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "session_compas"
version = "0.9.0"
description = "COMPAS converters and viewer for session_py geometry"
authors = [{name = "Petras Vestartas", email = "petrasvestartas@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["session_py", "compas>=2.2.0", "compas_viewer>=2.0.0"]

[project.urls]
Homepage = "https://github.com/petrasvestartas/session_compas"
Repository = "https://github.com/petrasvestartas/session_compas"

[tool.hatch.build]
src-layout = true

[tool.hatch.build.targets.wheel]
